[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ppc"
version = "0.1.0"
description = "The companion tool for Paul's Python Course: fetch Take It Home projects, run their tests, hand them in."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
ppc = "ppc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
