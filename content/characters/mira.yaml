id: mira
name: Mira
role: postmistress
sprite: mira
look: Neat cardigan, reading glasses on a chain, a pencil sharpened to a point.
voice: Organised, precise, fond of labels and numbered things.
pools:
  waiting:
    - "Everything has a place. Mostly it is in the place."
    - "I'll be sorting. Call me when it's sorted too."
  # Where you'd got to, when you come back after a break (REDESIGN.md 6.5).
  recap:
    - "You'd reached {step}. I've kept your place."
    - "{step}. I left a note on it so neither of us forgets."
