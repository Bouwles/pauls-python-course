id: yahya
name: Yahya
role: "Classmate. Data science; the Drills rival. Runs the Archive on floor 4."
colour: "#3B6FD8"
floor: 5
look: "Tight dark curls piled on top with a few falling on his forehead, shorter sides, clean-shaven. A black jacket over a grey T-shirt. Cool, deadpan look; a rare, earned smile."
voice: "Competitive, quick, a good sport. Loves an elegant answer and a clean dataset, and hates slow code."
pools:
  # Reactive lines. lib/cast.ts says which events are Yahya's.
  nested-loop:
    - "A loop inside a loop. That's n squared. Fine for twelve rows, slow for a million."
    - "Nested loops. Neat. Just watch how big n gets."
  one-left:
    - "One check left. Read that one carefully."
    - "One to go. That's usually the edge case."
    - "Nearly. The last check is the one people skip."
  drill-start:
    - "Mine runs in 0.02 seconds. Yours?"
    - "My time's on the board. Go."
    - "Ready when you are. I've been ready for a while."
  drill-beaten:
    - "Faster than mine. Fair. Rematch tomorrow."
    - "That's my time beaten. Good. Now I've got something to chase."
    - "You beat me. Don't get used to it."
  pass-first-try:
    - "First try. Clean."
    - "Passed first time. Now do it in fewer lines."
    - "First go. That's a good time."
    - "First try. One data point. Do it again and it's a trend."
  # When the learner fixes Yahya's version, or fixes it in fewer lines.
  fixed-by-learner:
    - "Oh. That's annoying. In a good way."
    - "Huh. Fast and wrong is still wrong. Thanks."
    - "So that was it. I was optimising the wrong thing."
    - "Fixed. I optimised it before I'd checked the output. Lesson logged."
  shorter-than-mine:
    - "Yours is shorter and it works. Respect."
    - "Fewer lines than mine. I'm taking notes."
  # Yahya is the client for the Calculator and the Expense Tracker.
  waiting:
    - "No rush. Well. A bit of rush."
    - "I'm timing you. Kidding. Mostly."
    - "I'll be cleaning a dataset. Mine will take longer. Probably."
  recap:
    - "Where you left my {job}: {step}"
    - "My {job}. Last place you were: {step}"
