id: pip
name: Pip
role: apprentice
sprite: pip
look: Scruffy grey pigeon, too-bright neck sheen, pencil behind one ear, satchel of crumpled printouts.
voice: Quick, confident, cheerful, often wrong in specific believable ways. Never stupid.
pools:
  fixed-by-learner:
    - "Oh. That's annoying. In a good way."
    - "Right. I'd have got there. Eventually."
    - "Huh. So that's what it was."
  drill-start:
    - "Bet I'm faster."
    - "Ready when you are. I've been ready for ages."
  drill-beaten:
    - "Fine. Rematch tomorrow."
    - "I was warming up."
  # Reactive lines (REDESIGN.md 6.5).
  error-indent:
    - "Indentation. Python's fussy about spaces. I'm not, which is why mine break."
    - "Ha. The spaces got you. They get me daily."
  nested-loop:
    - "A loop in a loop. Mine would just copy the line ten times."
    - "Loops inside loops. Show-off."
  long-no-loop:
    - "That's a lot of lines. I do mine like that too. Moss says there's a better way."
    - "Twenty-odd lines and not one loop. My kind of program."
  pass-first-try:
    - "That was luck. Do it again."
    - "First try. Fine. I'd have got it first try too."
    - "Lucky. Definitely lucky."
  shorter-than-pip:
    - "Mine had more features."
    - "Yours is shorter. Mine was more thorough."
  one-left:
    - "One check left. So close I can smell it."
    - "Nearly. One more and you beat my record."
