id: pip
name: Pip
role: apprentice
sprite: pip
look: Scruffy grey pigeon, too-bright neck sheen, pencil behind one ear, satchel of crumpled printouts.
voice: Quick, confident, cheerful, often wrong in specific believable ways. Never stupid.
pools:
  fixed-by-learner:
    - "Oh. That's annoying. In a good way."
    - "Right. I'd have got there. Eventually."
    - "Huh. So that's what it was."
  drill-start:
    - "Bet I'm faster."
    - "Ready when you are. I've been ready for ages."
  drill-beaten:
    - "Fine. Rematch tomorrow."
    - "I was warming up."
