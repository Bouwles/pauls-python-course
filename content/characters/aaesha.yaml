id: aaesha
name: Aaesha
role: "Classmate. Cognitive systems: how minds and machines perceive, remember and decide. Runs the Engine Room on floor 6 and co-runs the Arcade."
colour: "#FF7A6B"
floor: 7
look: "Very long, straight, dark hair framing her face, rosy cheeks, a warm smile. Small gold earrings and a fine gold necklace. A dark-brown T-shirt."
voice: "Precise, organised, quietly funny. Curious about how people and machines think. Asks how you will know it worked before you run it."
pools:
  # Reactive lines. lib/cast.ts says which events are Aaesha's.
  # When the learner fixes Aaesha's version, or fixes it in fewer lines.
  fixed-by-learner:
    - "That's it. Everything else was right. Thank you."
    - "Fixed. I'm writing that one down, so I don't do it twice."
    - "Thank you. I'd checked everything except that."
    - "Fixed. I read what I meant, not what I typed. Brains do that."
  shorter-than-mine:
    - "Shorter than mine, and it still passes. I'm keeping yours."
    - "Fewer lines, same results. I'll take that."
    - "Shorter, and easier to hold in your head at once. That matters."
  # Aaesha is the client for the Password Checker and the Times Table Trainer.
  waiting:
    - "Before you run it, how will you know it worked?"
    - "Take your time. I'd rather it was right."
    - "When you check it, read the expected output first."
    - "People decide faster when they're rushed, and worse. Take your time."
  recap:
    - "Where you left my {job}: {step}"
    - "Back to my {job}. The last step you were on: {step}"
