id: aaesha
name: Aaesha
role: "Classmate. Cognitive systems: how minds and machines perceive, remember and decide. Runs the Engine Room on floor 6 and co-runs the Arcade."
colour: "#FF7A6B"
floor: 7
look: "Very long, straight, dark hair framing her face, rosy cheeks, a warm smile. Small gold earrings and a fine gold necklace. A dark-brown T-shirt."
voice: "Precise, organised, quietly funny. Curious about how people and machines think. Asks how you will know it worked before you run it."
pools:
  # Reactive lines. lib/cast.ts says which events are Aaesha's.
  # When the learner fixes Aaesha's version, or fixes it in fewer lines.
  fixed-by-learner:
    - "Oh, that's it, everything else was fine and that was the one bit I'd got wrong. Thank you."
    - "That's fixed, thank you. I'm writing that one down so I don't make it again."
    - "Thank you, honestly, I'd checked absolutely everything apart from that."
    - "Thanks for that. I kept reading what I meant to type instead of what I actually typed, which brains love doing."
  shorter-than-mine:
    - "Yours is shorter than mine and it still passes everything. I think I'm keeping yours."
    - "You've got the same results out of fewer lines than me, which I'm very happy to take."
    - "It's shorter, and I can hold the whole thing in my head at once, which matters more than people think."
  # Aaesha is the client for the Password Checker and the Times Table Trainer.
  waiting:
    - "Before you run it, how are you going to know it's worked?"
    - "Take as long as you need, I'd much rather it was right than quick."
    - "When you check it, have a look at what it's meant to print before you look at what it did."
    - "People make quicker decisions when they're rushed, and worse ones too, so honestly, take your time."
  recap:
    - "You'd got as far as {step} on my {job}."
    - "Back to my {job}, and the last step you were on was {step}."
