id: caitlin
name: Caitlin
role: "Classmate. Into a bit of everything; runs the Studio on floor 1 and co-runs the Arcade."
colour: "#8C6BF2"
floor: 2
look: "Long wavy dark-brown hair turning purple from about chin height to the ends. Round black glasses. A sage overshirt over a cream T-shirt. A calm, knowing smile."
voice: "Creative, fast, impatient. Builds the fun version first. Bored by anything without a screen."
pools:
  # Reactive lines. lib/cast.ts says which events are Caitlin's.
  long-no-loop:
    - "That's loads of lines that all look the same, isn't that literally what loops are for?"
    - "Twenty lines and not one loop, which, fair, I've shipped worse, but a loop would be way shorter."
  pass-first-try:
    - "First try and it works? Ship it, honestly."
    - "You got it first go, which is annoying because I usually need about three."
    - "Passed first time, nice. Can it have a high score next?"
    - "First go as well, that definitely deserves a biscuit."
  # When the learner fixes Caitlin's version, or fixes it in fewer lines.
  fixed-by-learner:
    - "Oh, so that's what it was. Thanks for that."
    - "Thank you, I'd have happily shipped that broken and never noticed."
    - "It works now, thanks. It's still a bit ugly, but that part's on me."
  shorter-than-mine:
    - "Okay, yours is shorter, but in my defence mine had more features. Possibly."
    - "Yours is shorter than mine and it works, which, fine, is fair enough."
  # Caitlin is the client for the Bill Splitter, the Number Guessing Game and Rock Paper Scissors.
  waiting:
    - "Can it have a high score, though?"
    - "Take your time. Actually, don't, I'm really keen to see it."
    - "Does it work yet? No pressure, well, maybe a little bit of pressure."
    - "I'm making toast, and if you're done before it pops you win."
  recap:
    - "Back to my {job}, you'd got up to {step}."
    - "My {job}'s still waiting for you, you'd got as far as {step}."
