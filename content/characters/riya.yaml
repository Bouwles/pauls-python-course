id: riya
name: Riya
role: "Classmate. An artist: colour, pattern, generative art and design. Runs the Makerspace on floor 2."
colour: "#4CC36F"
floor: 3
look: "Long, straight, glossy jet-black hair falling behind her shoulders, bold dark eyebrows, a playful smirk. A cream varsity jacket with navy trim over a dark top."
voice: "Practical about her art. Always asks who it is for and what it should feel like. Good at explaining things simply."
pools:
  # Reactive lines. lib/cast.ts says which events are Riya's.
  # When the learner fixes Riya's version, or fixes it in fewer lines.
  fixed-by-learner:
    - "Oh, I only ever tested the easy case. Thank you."
    - "Thanks for fixing it, people are actually going to use this, so it matters."
    - "So that's what it was. Next time I'll try the awkward inputs first."
    - "Thanks, it was like a sketch that only looked right from one angle."
  shorter-than-mine:
    - "Yours is shorter and does exactly the same thing, I'm using yours from now on."
    - "That's fewer lines than mine, and it's easier to explain to someone too."
    - "Same picture with fewer strokes, I really like that."
  # Riya is the client for the To-Do List and the Contact Book.
  waiting:
    - "Who's actually going to use this? Me, quite soon, so no pressure."
    - "No rush, I'd rather it worked on the awkward cases as well."
    - "Take your time, and make it something I could explain to someone else."
    - "No hurry at all, I'll be over here sketching until you shout."
  recap:
    - "Back to my {job}, and you'd got up to {step}."
    - "You left my {job} at {step}, if you want to carry on."
