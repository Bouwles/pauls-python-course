id: paul
name: Paul
role: "The professor. Runs the course from the Workshop on the ground floor, and the Model Room on floor 5. Codes for fun; AI and machine learning are his thing."
colour: "#FFB627"
floor: 1
look: "A black cap worn backwards with a little wavy dark-brown hair showing at the back and sides, strong dark eyebrows, light stubble, an easy half-smile. A navy-and-cream varsity jacket over a white T-shirt."
voice: "Calm, sharp, dryly funny. High standards, delivered kindly. Build it, break it, make it readable. Obsessed with good variable names, and with what a model has actually learned."
pools:
  # Reactive lines. lib/cast.ts says which events are Paul's.
  first-fstring:
    - "That's an f-string, and the value lands exactly where you put it."
    - "f-strings, nice. You'll be writing about one a day from now on."
    - "There's the f before the quote, which means everything in the braces gets worked out first."
  converts-input:
    - "That's the right order, you got the number out of the text before doing any maths with it."
    - "You turned the input into a number before using it, and that's the step most people forget."
    - "Converting it before the arithmetic saves you a TypeError further down the line."
  first-function:
    - "That's your first `def`, and now it's got a name you can call it whenever you like."
    - "A function, nice. If you name it for what it does, it'll last you ages."
    - "First function, and it's small and named for its job, which is how I'd keep them."
  good-name:
    - "With a name like `{name}` I know what it holds without reading the rest."
    - "Calling it `{name}` was a good shout, you'll be glad you did when you come back to it."
    - "`{name}` says exactly what it is, and honestly that's half of readable code."
  letter-name:
    - "What does `{name}` actually hold? Give it a name that tells you."
    - "`{name}` doesn't tell the next person anything, so name it after what it holds."
    - "Single letters are fine for a loop counter, but `{name}` deserves a proper word."
  long-function:
    - "`{name}` is doing a few different jobs, and some of them could do with their own names."
    - "`{name}` is getting a bit long. Try splitting it wherever you'd normally write a comment."
    - "If you can't see all of `{name}` on screen at once, it probably wants splitting up."
  long-line:
    - "That line's running off the edge of the screen, I'd break it up a bit."
    - "That's a long one. If you have to scroll sideways to read a line, it's too long."
    - "Split that line in two and whoever reads it next will thank you for it."
  check-passed:
    - "That works, now just tidy it up so the next person can actually read it."
    - "Yep, it does what the spec asked for, nice work."
    - "That's passed. Give it one more read before you move on, though."
    - "It works, but would you be happy handing it over as it is?"
  pass-no-hints:
    - "No hints at all, that was your own work from start to finish."
    - "You got there without asking for help, and that's the kind that sticks."
    - "You read the check after that miss and fixed it yourself, no hints needed."
  predict-right:
    - "Spot on. Go on and run it, and watch it happen."
    - "That's exactly what it does, but run it anyway, it's worth seeing it happen."
    - "Yep, that's right, you read it exactly the way Python would."
  predict-wrong:
    - "That's fine, you know what you expected now, so run it and see where it differs."
    - "Honestly, the wrong guesses are the useful ones. Go on, run it."
    - "That's how a model learns too, it guesses, sees how wrong it was and updates. Run it."
    - "Not quite, but the gap between your guess and what it prints is where you learn something."
  returning:
    - "Good to have you back. The clock's still stuck at 3:14, if you were wondering."
    - "Oh, there you are. Your desk's exactly how you left it."
    - "Welcome back, just pick up wherever you were, there's no rush."
  solution-seen:
    - "Read it properly, and think about why each line's there as well as what it says."
    - "Now close it and have a go at writing it yourself, that's when it actually sticks."
    - "That's fine, you'll see this one again in Morning Rounds anyway."
  rounds-start:
    - "Ten quick ones before we get onto anything new."
    - "It's Morning Rounds, so a few things you've already built, done from memory."
    - "A few old ones first, because they go in deeper the second time round."
  rounds-done:
    - "That's you done, and those'll come round again, a bit further apart next time."
    - "Rounds are finished, on to the new stuff now."
    - "That's the lot, your desk's waiting for you."
  # Paul is the client for the Course Sign and the Grade Calculator.
  waiting:
    - "No hurry, get it working first and then worry about making it neat."
    - "I'll be at my desk if you need me, and it's fine to build it ugly first."
    - "Take your time, my model's still training anyway."
  recap:
    - "On the {job}, you'd got as far as {step}."
    - "The {job}'s just as you left it, you were up to {step}."
