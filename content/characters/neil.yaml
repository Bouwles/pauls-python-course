id: neil
name: Neil
role: "The teaching assistant: hints, errors and debugging. Mad about racing cars and aerospace; runs the Puzzle Room on floor 3."
colour: "#1FB5A8"
floor: 4
look: "Short black hair swept up at the front, thick dark eyebrows, clean-shaven, a wide friendly grin. Black rectangular glasses. A white collared shirt."
voice: "Energetic and approachable. Explains it a second way when the first did not land. Loves a bug hunt, a fast lap and a launch window."
pools:
  # Reactive lines. lib/cast.ts says which events are Neil's.
  check-failed:
    - "Okay, what did you expect it to print, and what did it actually print?"
    - "Close one. Have a look at the first check that failed and see what it was expecting."
    - "Not quite yet. Put the expected line next to yours and go through them a character at a time."
    - "One of them's off. Start with the first one, because the others usually sort themselves out after."
  third-fail:
    - "That's three goes now. Try reading the failing check out loud, word by word."
    - "Three misses, okay. Try explaining it to the duck, and I'm being serious."
    - "Three tries in, and every programmer's been here, Paul included. There's a hint if you want one."
  third-hint:
    - "That's the shape of it, and the blanks are yours to fill in."
    - "That's most of it there, just fill in the gaps and give it a run."
    - "The shape's all there. Read through it line by line before you start typing."
  pass-after-many:
    - "You got there, and to be fair, it's the stubborn ones you learn the most from."
    - "That took a few goes, which is pretty much how it goes for everyone."
    - "There it is. Try to remember what fixed it, because you'll definitely bump into that bug again."
    - "A few slow laps and then the quick one, that's how it always goes on track too."
  run-error:
    - "Start reading it from the bottom, because the last line's where it actually went wrong."
    - "Python's left you a note there. Read the last line first and then check the line number."
    - "Look at the line it points to and the one just above it, and check brackets and quotes first."
  error-name:
    - "Python's never heard of that name. Check the spelling, and check you made it before you used it."
    - "Ah, a NameError. Every programmer has written this exact bug at some point, Paul included."
    - "That name doesn't exist yet. Did you make it further down, or spell it a bit differently?"
  error-text-number:
    - "That's text and a number in the same sum, and Python needs the text turned into a number first."
    - "`input()` always hands you back text, even when someone types 3."
    - "That's `'3'` and `3`, and I know they look the same, but Python really doesn't think so."
  error-zero:
    - "Something got divided by zero there. Find out what that number is at the moment it breaks."
    - "That's dividing by nothing. Which variable was zero, and should it ever be zero at all?"
  error-index:
    - "It reached for an item that isn't there, and remember Python counts from zero."
    - "That's one past the end, because the last item lives at `len` minus one."
    - "An IndexError, okay. How long is the list at that exact moment? Print it and have a look."
  error-int-text:
    - "`int()` got handed something that isn't a whole number. What did someone actually type?"
    - "`int()` only reads digits, and it gives up on `2.5` or `two`. Did you want `float()` instead?"
  error-indent:
    - "It's the indentation, four spaces per level, and Paul's very firm about that one."
    - "The spaces don't line up, and Python reads them as structure, which means they really have to."
    - "An IndentationError. I used to argue about tabs with Paul, and Python always takes his side."
  stopped-loop:
    - "That was going round forever, which means something in there never changes."
    - "I've stopped it, because a loop needs a way out. What's meant to make the test False?"
    - "Okay, that's a loop with no exit. Which line was supposed to change what it's testing?"
    - "Lap after lap and no chequered flag in sight, so what's meant to end it?"
  ran-nothing:
    - "It ran fine, it just didn't say anything. Was there meant to be a print in there?"
    - "Quiet one, nothing got printed. Is the print sitting inside something that never runs?"
  loop-never-runs:
    - "That loop doesn't go round even once. Have a look at the range."
    - "The loop's there, it just never starts. What's its test on the very first pass?"
  idle:
    - "Stuck? Try explaining it to the duck, it honestly helps to say it out loud."
    - "Take your time, and there's a nudge there if you want one."
    - "What's the smallest thing you could try? Do that and give it a run."
    - "Every launch has a hold at some point. Talk it through with the duck and then go again."
  after-explain:
    - "Saying it out loud does half the work, I reckon. Which line surprised you?"
    - "Nice, now go to the line that surprised you and print what's in it."
    - "Most bugs give themselves away once you say out loud what should happen. Did this one?"
    - "The duck's heard worse, trust me. Now go and test the bit you weren't sure about."
  # Neil is the client for Reading Tracebacks, the Unit Converter and Python at Home.
  waiting:
    - "No rush at all, just shout if you get stuck, or tell the duck."
    - "I'll be over at my desk, and the duck's free if you need it."
    - "I'm only reading about launch windows, so honestly, interrupt me whenever you like."
  recap:
    - "Back on my {job}, you'd got as far as {step}."
    - "My {job}'s still on the desk where you left it, you were up to {step}."
