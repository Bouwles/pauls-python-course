id: break-continue
title: break and continue
summary: |
  `break` leaves a loop at once: the rest of the pass is skipped and no more passes happen. `continue` skips only the rest of this pass, and the loop carries on with the next one. Both affect only the loop they are in. The program goes on after it.
example: |
  for n in range(1, 6):
      if n == 2:
          continue
      if n == 4:
          break
      print(n)
  print("Done")
misconceptions: [break-finishes-pass, break-ends-program, break-continue-swapped, continue-means-carry-on]
related: [for-loops, while-loops]
drill: true
cards:
  - type: predict
    prompt: What does this print?
    code: |
      for n in range(1, 6):
          if n == 3:
              continue
          print(n)
    answer: "1\n2\n4\n5"
  - type: predict
    prompt: What does this print?
    code: |
      count = 0
      while True:
          count = count + 1
          if count == 4:
              break
      print(count)
    answer: "4"
  - type: choice
    prompt: What does this print?
    code: |
      for n in range(1, 4):
          if n == 2:
              continue
          print("Fish", n)
      print("Done")
    options:
      - text: |-
          Fish 1
          Fish 3
          Done
        correct: true
        feedback: "`continue` skips the rest of pass 2. Passes 1 and 3 print as normal."
      - text: |-
          Fish 1
          Fish 2
          Fish 3
          Done
        misconception: continue-means-carry-on
        feedback: "In Python, `continue` doesn't mean carry on with this pass. It means skip to the next one."
      - text: |-
          Fish 1
          Done
        misconception: break-continue-swapped
        feedback: "Leaving the loop altogether is `break`. `continue` only skips the rest of one pass."
  - type: fix
    prompt: "This should stop as soon as it reaches 3, printing `Trying 1`, `Trying 2`, `Got it`. Fix it."
    code: |
      for guess in range(1, 6):
          if guess == 3:
              print("Got it")
          print("Trying", guess)
    tests: |
      TESTS = [output("Stops at 3", expect="Trying 1\nTrying 2\nGot it")]
    solution: |
      for guess in range(1, 6):
          if guess == 3:
              print("Got it")
              break
          print("Trying", guess)
  - type: fill
    prompt: "Fill the gap so the even-numbered fish are skipped."
    code: |
      for fish in range(1, 6):
          if fish % 2 == 0:
              ___
          print("Keep", fish)
    blanks: [["continue"]]
    tests: |
      TESTS = [output("Odd fish", expect="Keep 1\nKeep 3\nKeep 5")]
  - type: write
    prompt: "Ask `Word? ` up to five times, printing each word back. If the word is `stop`, stop asking straight away, without printing it."
    tests: |
      TESTS = [
          output("Stop after two", inputs=["cod", "crab", "stop"], expect="cod\ncrab"),
          output("Five words", inputs=["a", "b", "c", "d", "e"], expect="a\nb\nc\nd\ne"),
          output("Stop first", inputs=["stop"], expect=""),
      ]
    solution: |
      for turn in range(5):
          word = input("Word? ")
          if word == "stop":
              break
          print(word)
