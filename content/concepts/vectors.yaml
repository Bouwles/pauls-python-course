id: vectors
title: Vectors and the dot product
summary: |
  A vector is a list of numbers treated as one thing: an arrow, like the wind as `(east, north)`, or one night's readings in a fixed order. In NumPy it is a one-dimensional array, so `a + b` puts one arrow after the other, and `2 * a` doubles its length without turning it. Its length is the square root of the sum of its squares, Pythagoras in any number of dimensions: `np.linalg.norm(a)`. The dot product, `np.dot(a, b)`, multiplies in pairs and adds, giving one number: positive when the arrows point roughly the same way, 0 at right angles, negative when they point apart. A weighted sum, like a neuron's, is the dot product of the weights with the readings.
example: |
  import numpy as np

  wind = np.array([3.0, 4.0])      # 3 knots east, 4 north
  gust = np.array([-4.0, 3.0])
  print(np.linalg.norm(wind))
  print(wind + gust)
  print(np.dot(wind, gust))
misconceptions: [dot-gives-vector, length-is-sum, vector-adds-lengths, zero-dot-means-zero-vector]
related: [numpy-arrays, vectorisation, matrices, perceptron]
drill: true
cards:
  - type: choice
    prompt: What does this print?
    code: |
      import numpy as np

      arrow = np.array([2.0, 3.0, 6.0])
      print(np.linalg.norm(arrow))
    options:
      - text: "7.0"
        correct: true
        feedback: "The square root of 4 + 9 + 36, which is 49. Pythagoras, with one more direction."
      - text: "11.0"
        misconception: length-is-sum
        feedback: "Adding the entries gives 11, but they point in directions at right angles to each other. The length is the square root of the sum of their squares: the square root of 49."
  - type: choice
    prompt: What does this print?
    code: |
      import numpy as np

      weights = np.array([2, 1, 0])
      readings = np.array([1, 3, 5])
      print(np.dot(weights, readings))
    options:
      - text: "5"
        correct: true
        feedback: "The pairs multiplied are 2, 3 and 0, and the dot product adds them: one number."
      - text: "[2 3 0]"
        misconception: dot-gives-vector
        feedback: "That's `weights * readings`, the pairs multiplied. The dot product goes on to add them up: 2 + 3 + 0 is 5."
  - type: predict
    prompt: What does this print?
    code: |
      import numpy as np

      morning = np.array([1, -1])
      evening = np.array([0, 3])
      print(2 * morning + evening)
    answer: "[2 1]"
  - type: choice
    prompt: "Yahya runs 6 km east, then 8 km north. What does this print?"
    code: |
      import numpy as np

      east = np.array([6.0, 0.0])
      north = np.array([0.0, 8.0])
      print(np.linalg.norm(east + north))
    options:
      - text: "10.0"
        correct: true
        feedback: "`east + north` is the arrow (6, 8), from the start to where Yahya ends up. Its length is the square root of 36 + 64."
      - text: "14.0"
        misconception: vector-adds-lengths
        feedback: "Yahya ran 14 km, but he isn't 14 km from the start. The sum is the arrow (6, 8), and its length is 10. Lengths add only when the arrows point the same way."
  - type: choice
    prompt: What does this print?
    code: |
      import numpy as np

      morning = np.array([4.0, 2.0])
      evening = np.array([-1.0, 2.0])
      print(np.dot(morning, evening), np.linalg.norm(evening) > 0)
    options:
      - text: "0.0 True"
        correct: true
        feedback: "-4 + 4 is 0, and neither wind is calm. A dot product of 0 means the two arrows are at right angles."
      - text: "0.0 False"
        misconception: zero-dot-means-zero-vector
        feedback: "A dot product of 0 doesn't need a zero arrow. (-1, 2) has a length of about 2.24; it sits at right angles to (4, 2), so the pairs cancel: -4 + 4."
  - type: fill
    prompt: "Fill the gap so `total` is the weighted sum of the night's readings."
    code: |
      import numpy as np

      weights = np.array([0.5, -1.0, 2.0])
      night = np.array([4.0, 1.0, 0.5])
      total = np.___(weights, night)
      print(total)
    blanks: [["dot", "inner", "vdot"]]
    tests: |
      TESTS = [output("2 - 1 + 1", expect="2.0")]
  - type: fix
    prompt: "`length` should give 5.0 for the arrow (3, 4). Fix it."
    code: |
      import numpy as np


      def length(arrow):
          return np.sqrt(np.sum(arrow))


      print(length(np.array([3.0, 4.0])))
    tests: |
      import numpy as np


      def lengths(ctx):
          m = ctx.module()
          for arrow, want in [([3.0, 4.0], 5.0), ([-6.0, 8.0], 10.0), ([2.0, 3.0, 6.0], 7.0)]:
              got = m.length(np.array(arrow))
              if got is None or abs(got - want) > 1e-9:
                  raise CheckFailed(f"The length of {arrow}", expected=want, actual=repr(got))


      TESTS = [custom("Three arrows, one pointing west", lengths)]
    solution: |
      import numpy as np


      def length(arrow):
          return np.sqrt(np.sum(arrow ** 2))


      print(length(np.array([3.0, 4.0])))
  - type: write
    prompt: "Write `cosine(a, b)`: the dot product divided by both lengths. It is 1 for arrows pointing the same way, 0 at right angles and -1 for opposite ones."
    starter: |
      import numpy as np


      def cosine(a, b):
          pass
    tests: |
      import numpy as np


      def directions(ctx):
          m = ctx.module()
          cases = [
              ([1.0, 0.0], [5.0, 0.0], 1.0),
              ([1.0, 0.0], [0.0, 2.0], 0.0),
              ([1.0, 2.0], [-2.0, -4.0], -1.0),
              ([1.0, 0.0], [1.0, 1.0], 0.7071067811865475),
          ]
          for a, b, want in cases:
              got = m.cosine(np.array(a), np.array(b))
              if got is None or abs(got - want) > 1e-9:
                  raise CheckFailed(f"cosine({a}, {b})", expected=round(want, 4), actual=repr(got))


      TESTS = [custom("Same way, right angles, opposite, and half way", directions)]
    solution: |
      import numpy as np


      def cosine(a, b):
          return np.dot(a, b) / (np.linalg.norm(a) * np.linalg.norm(b))
  - type: fix
    prompt: "`to_arrow(bearing, speed)` should give the vane's arrow, `(east, north)`: a 10-knot wind from 090 is `(10, 0)`. It points the wrong way for everything but north. Fix it."
    code: |
      import numpy as np


      def to_arrow(bearing, speed):
          return np.array([speed * np.sin(bearing), speed * np.cos(bearing)])


      print(to_arrow(90, 10).round(1))
    tests: |
      import numpy as np


      def compass(ctx):
          m = ctx.module()
          for bearing, want in [(0, [0.0, 10.0]), (90, [10.0, 0.0]), (180, [0.0, -10.0]), (225, [-7.0710678, -7.0710678])]:
              got = m.to_arrow(bearing, 10)
              if got is None or not np.allclose(got, want, atol=1e-6):
                  raise CheckFailed(f"A 10-knot wind from {bearing:03d}", expected=want, actual=repr(got))


      TESTS = [custom("North, east, south and south-west", compass)]
    solution: |
      import numpy as np


      def to_arrow(bearing, speed):
          angle = np.radians(bearing)
          return np.array([speed * np.sin(angle), speed * np.cos(angle)])


      print(to_arrow(90, 10).round(1))
