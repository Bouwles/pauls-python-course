id: deque
title: collections.deque
summary: |
  `deque` (say "deck") from `collections` is a list built for both ends. `append` and `pop` work at the right; `appendleft` and `popleft` work at the left; all four are O(1). Taking from an empty one raises `IndexError`. Give it `maxlen` and it keeps only that many: when it's full, adding at one end drops an item off the other. Turn it into a list with `list(...)` when you need to show it or hand out a copy.
example: |
  from collections import deque

  gate = deque(["flatbed", "tipper"])
  gate.append("council van")
  print(gate.popleft())
  gate.appendleft("crane lorry")
  print(list(gate))
misconceptions: [appendleft-joins-back, maxlen-refuses-extra, popleft-empty-gives-none]
related: [queues, stacks, imports]
cards:
  - type: predict
    prompt: What does this print?
    code: |
      from collections import deque

      yard = deque([2, 3])
      yard.appendleft(1)
      yard.append(4)
      yard.pop()
      print(list(yard))
    answer: "[1, 2, 3]"
  - type: choice
    prompt: What does this print?
    code: |
      from collections import deque

      latest = deque(maxlen=3)
      for reading in [12, 15, 11, 19]:
          latest.append(reading)
      print(list(latest))
    options:
      - text: "[15, 11, 19]"
        correct: true
        feedback: "With `maxlen=3`, adding a fourth reading drops the oldest off the other end. It always holds the latest three."
      - text: "[12, 15, 11]"
        misconception: maxlen-refuses-extra
        feedback: "A full deque doesn't refuse new items. It makes room by dropping one from the far end."
  - type: choice
    prompt: What happens?
    code: |
      from collections import deque

      gate = deque(["van"])
      gate.popleft()
      print(gate.popleft())
    verify: error
    options:
      - text: An IndexError
        correct: true
        error: IndexError
        feedback: "The queue is empty after the first `popleft`. Taking from an empty deque raises IndexError: check with `if gate:` first."
      - text: It prints None
        misconception: popleft-empty-gives-none
        feedback: "`popleft` has nothing to hand back, so it raises IndexError rather than giving `None`."
  - type: choice
    prompt: What does this print?
    code: |
      from collections import deque

      gate = deque(["tipper", "van"])
      gate.appendleft("ambulance")
      print(gate[0])
    options:
      - text: ambulance
        correct: true
        feedback: "`appendleft` puts it at the left, which is position 0, the front of the queue."
      - text: tipper
        misconception: appendleft-joins-back
        feedback: "`appendleft` adds at the left end, so the ambulance goes in front of the tipper."
  - type: fill
    prompt: "Fill the gap to bring in the deque."
    code: |
      from collections import ___

      gate = deque(["flatbed", "tipper"])
      print(gate.popleft())
    blanks: [["deque"]]
    tests: |
      TESTS = [output("The flatbed", expect="flatbed")]
  - type: write
    prompt: "Write `last_lorries(lorries, count)`, which returns a list of the last `count` lorries through the gate, oldest first. Use `deque(maxlen=count)`."
    starter: |
      def last_lorries(lorries, count):
          pass
    tests: |
      TESTS = [
          function("The last three", call="last_lorries", args=(["a", "b", "c", "d", "e"], 3), expect=["c", "d", "e"]),
          function("Fewer than asked", call="last_lorries", args=(["a"], 3), expect=["a"]),
          function("None through", call="last_lorries", args=([], 2), expect=[]),
          structure("Uses a deque", calls=["deque"], message="Keep them in a deque with maxlen."),
      ]
    solution: |
      from collections import deque


      def last_lorries(lorries, count):
          latest = deque(maxlen=count)
          for lorry in lorries:
              latest.append(lorry)
          return list(latest)
