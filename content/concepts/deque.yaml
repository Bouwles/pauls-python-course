id: deque
title: collections.deque
summary: |
  `deque` (say "deck") from `collections` is a list built for both ends. `append` and `pop` work at the right; `appendleft` and `popleft` work at the left; all four are O(1). Taking from an empty one raises `IndexError`. Give it `maxlen` and it keeps only that many: when it's full, adding at one end drops an item off the other. Turn it into a list with `list(...)` when you need to show it or hand out a copy.
example: |
  from collections import deque

  counter = deque(["latte", "tea"])
  counter.append("hot chocolate")
  print(counter.popleft())
  counter.appendleft("espresso")
  print(list(counter))
misconceptions: [appendleft-joins-back, maxlen-refuses-extra, popleft-empty-gives-none]
related: [queues, stacks, imports]
cards:
  - type: predict
    prompt: What does this print?
    code: |
      from collections import deque

      yard = deque([2, 3])
      yard.appendleft(1)
      yard.append(4)
      yard.pop()
      print(list(yard))
    answer: "[1, 2, 3]"
  - type: choice
    prompt: What does this print?
    code: |
      from collections import deque

      latest = deque(maxlen=3)
      for reading in [12, 15, 11, 19]:
          latest.append(reading)
      print(list(latest))
    options:
      - text: "[15, 11, 19]"
        correct: true
        feedback: "With `maxlen=3`, adding a fourth reading drops the oldest off the other end. It always holds the latest three."
      - text: "[12, 15, 11]"
        misconception: maxlen-refuses-extra
        feedback: "A full deque doesn't refuse new items. It makes room by dropping one from the far end."
  - type: choice
    prompt: What happens?
    code: |
      from collections import deque

      counter = deque(["mocha"])
      counter.popleft()
      print(counter.popleft())
    verify: error
    options:
      - text: An IndexError
        correct: true
        error: IndexError
        feedback: "The queue is empty after the first `popleft`. Taking from an empty deque raises IndexError: check with `if counter:` first."
      - text: It prints None
        misconception: popleft-empty-gives-none
        feedback: "`popleft` has nothing to hand back, so it raises IndexError rather than giving `None`."
  - type: choice
    prompt: What does this print?
    code: |
      from collections import deque

      counter = deque(["tea", "mocha"])
      counter.appendleft("rush order")
      print(counter[0])
    options:
      - text: rush order
        correct: true
        feedback: "`appendleft` puts it at the left, which is position 0, the front of the queue."
      - text: tea
        misconception: appendleft-joins-back
        feedback: "`appendleft` adds at the left end, so the rush order goes in front of the tea."
  - type: fill
    prompt: "Fill the gap to bring in the deque."
    code: |
      from collections import ___

      counter = deque(["latte", "tea"])
      print(counter.popleft())
    blanks: [["deque"]]
    tests: |
      TESTS = [output("The latte", expect="latte")]
  - type: write
    prompt: "Write `latest_orders(orders, count)`, which returns a list of the last `count` orders at the counter, oldest first. Use `deque(maxlen=count)`."
    starter: |
      def latest_orders(orders, count):
          pass
    tests: |
      TESTS = [
          function("The last three", call="latest_orders", args=(["a", "b", "c", "d", "e"], 3), expect=["c", "d", "e"]),
          function("Fewer than asked", call="latest_orders", args=(["a"], 3), expect=["a"]),
          function("None through", call="latest_orders", args=([], 2), expect=[]),
          structure("Uses a deque", calls=["deque"], message="Keep them in a deque with maxlen."),
      ]
    solution: |
      from collections import deque


      def latest_orders(orders, count):
          latest = deque(maxlen=count)
          for order in orders:
              latest.append(order)
          return list(latest)
