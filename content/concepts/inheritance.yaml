id: inheritance
title: Inheritance
summary: |
  `class ElectricBike(Bike):` makes a subclass: an electric bike is a kind of bike. It inherits every method from its parent and overrides only the ones it writes itself. Inside an inherited method, `self` is still the subclass object, so its overrides win. `isinstance(volt, Bike)` is True.
example: |
  class Bike:
      def describe(self):
          return f"{self.wheels()} wheels"

      def wheels(self):
          return 2

  class Tricycle(Bike):
      def wheels(self):
          return 3

  print(Bike().describe(), Tricycle().describe())
misconceptions: [parent-methods-call-parent-versions, child-class-starts-empty, override-changes-parent, parent-counts-as-child]
related: [super, composition, classes]
cards:
  - type: predict
    prompt: What does this print?
    code: |
      class Vehicle:
          def horn(self):
              return "beep"

          def leave(self):
              return f"{self.horn()}, pulling away"

      class Bus(Vehicle):
          def horn(self):
              return "HOOONK"

      print(Vehicle().leave())
      print(Bus().leave())
    answer: |-
      beep, pulling away
      HOOONK, pulling away
  - type: choice
    prompt: What does this print?
    code: |
      class Bike:
          def wheels(self):
              return 2

      class Tricycle(Bike):
          def wheels(self):
              return 3

      trike = Tricycle()
      print(Bike().wheels())
    options:
      - text: "2"
        correct: true
      - text: "3"
        misconception: override-changes-parent
        feedback: "Overriding happens in the subclass only. A plain `Bike` still has two wheels."
  - type: fix
    prompt: "A tandem should be a kind of `Bike`. Fix the class line."
    code: |
      class Bike:
          def __init__(self, number):
              self.number = number

          def describe(self):
              return f"Bike {self.number}"

      class Tandem:
          def seats(self):
              return 2

      tandem = Tandem(5)
      print(tandem.describe(), tandem.seats())
    tests: |
      TESTS = [output("Tandem 5", expect="Bike 5 2")]
    solution: |
      class Bike:
          def __init__(self, number):
              self.number = number

          def describe(self):
              return f"Bike {self.number}"

      class Tandem(Bike):
          def seats(self):
              return 2

      tandem = Tandem(5)
      print(tandem.describe(), tandem.seats())
  - type: fill
    prompt: "Fill the gap so a desk lamp is a kind of lamp."
    code: |
      class Lamp:
          def light(self):
              return "lit"

      class DeskLamp(___):
          pass

      print(DeskLamp().light())
    blanks: [["Lamp"]]
    tests: |
      TESTS = [output("The desk lamp lights", expect="lit")]
  - type: write
    prompt: "Write `Bicycle`, a kind of `Vehicle` whose `horn()` returns `\"ding\"`."
    starter: |
      class Vehicle:
          def horn(self):
              return "beep"

          def leave(self):
              return f"{self.horn()}, pulling away"
    tests: |
      def bicycle(ctx):
          m = ctx.module()
          bike = m.Bicycle()
          if not isinstance(bike, m.Vehicle):
              raise CheckFailed("A Bicycle should be a kind of Vehicle.")
          if bike.leave() != "ding, pulling away":
              raise CheckFailed("A bicycle leaves with a ding.", expected="ding, pulling away", actual=bike.leave())


      TESTS = [custom("The bicycle leaves", bicycle)]
    solution: |
      class Vehicle:
          def horn(self):
              return "beep"

          def leave(self):
              return f"{self.horn()}, pulling away"


      class Bicycle(Vehicle):
          def horn(self):
              return "ding"
  - type: choice
    prompt: What does this print?
    code: |
      class Bike:
          pass

      class ElectricBike(Bike):
          pass

      volt = ElectricBike()
      print(isinstance(volt, Bike), isinstance(Bike(), ElectricBike))
    options:
      - text: True False
        correct: true
      - text: True True
        misconception: parent-counts-as-child
        feedback: "Every electric bike is a bike, but not every bike is electric. The subclass is the narrower one."
