id: enums
title: Enums
summary: |
  An Enum is a fixed set of named choices: `class Stamp(Enum):` with `FIRST = 135` inside. Each member has a `.name` and a `.value`, but a member is not its value: compare members with members, `stamp == Stamp.FIRST`. `Stamp(85)` finds the member with that value, and looping over the class gives every member.
example: |
  from enum import Enum

  class Stamp(Enum):
      FIRST = 135
      SECOND = 85

  print(Stamp.FIRST, Stamp.FIRST.value, Stamp(85))
misconceptions: [enum-member-is-its-value, enum-equals-value, enum-call-makes-member]
related: [dataclasses]
cards:
  - type: predict
    prompt: What does this print?
    code: |
      from enum import Enum

      class Level(Enum):
          HIGH = "high"
          LOW = "low"

      for level in Level:
          print(level.name, level.value)
    answer: |-
      HIGH high
      LOW low
  - type: choice
    prompt: What does this print?
    code: |
      from enum import Enum

      class Stamp(Enum):
          FIRST = 135
          SECOND = 85

      print(Stamp(85))
    options:
      - text: Stamp.SECOND
        correct: true
      - text: "85"
        misconception: enum-member-is-its-value
        feedback: "`Stamp(85)` looks up the member whose value is 85 and gives you the member, `Stamp.SECOND`."
      - text: An error, because there is no Stamp called 85
        misconception: enum-call-makes-member
        feedback: "Calling the Enum with a value finds the existing member with that value. It never makes a new one."
  - type: fix
    prompt: "Tonight is rainy, but nobody's told to take a coat. Fix the comparison."
    code: |
      from enum import Enum

      class Weather(Enum):
          CLEAR = "clear"
          RAIN = "rain"

      tonight = Weather.RAIN
      if tonight == "RAIN":
          print("Take a coat")
      else:
          print("No coat needed")
    tests: |
      TESTS = [output("Rain means a coat", expect="Take a coat")]
    solution: |
      from enum import Enum

      class Weather(Enum):
          CLEAR = "clear"
          RAIN = "rain"

      tonight = Weather.RAIN
      if tonight == Weather.RAIN:
          print("Take a coat")
      else:
          print("No coat needed")
  - type: fill
    prompt: "Fill the gap to get the price of a second-class stamp."
    code: |
      from enum import Enum

      class Stamp(Enum):
          FIRST = 135
          SECOND = 85

      print(Stamp.SECOND.___ * 2)
    blanks: [["value"]]
    tests: |
      TESTS = [output("Two second-class stamps", expect="170")]
  - type: write
    prompt: "Write an Enum `Level` with two members, `HIGH` and `LOW`, valued `\"high\"` and `\"low\"`."
    starter: |
      from enum import Enum
    tests: |
      def levels(ctx):
          m = ctx.module()
          import enum
          if not (isinstance(m.Level, type) and issubclass(m.Level, enum.Enum)):
              raise CheckFailed("Level should be an Enum: class Level(Enum).")
          got = {member.name: member.value for member in m.Level}
          if got != {"HIGH": "high", "LOW": "low"}:
              raise CheckFailed("Level's members", expected={"HIGH": "high", "LOW": "low"}, actual=got)


      TESTS = [custom("High and low", levels)]
    solution: |
      from enum import Enum


      class Level(Enum):
          HIGH = "high"
          LOW = "low"
  - type: predict
    prompt: What does this print?
    code: |
      from enum import Enum

      class Stamp(Enum):
          FIRST = 135
          SECOND = 85

      print(len(Stamp), Stamp.FIRST.name)
    answer: "2 FIRST"
