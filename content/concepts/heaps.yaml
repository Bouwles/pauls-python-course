id: heaps
title: Heaps
summary: |
  A heap is a list kept in an order that's only just good enough: no item is smaller than its parent, so the smallest is always at position 0. The children of position `i` are at `2 * i + 1` and `2 * i + 2`, and its parent is at `(i - 1) // 2`. Adding an item puts it at the end and lets it climb past bigger parents; taking the smallest moves the last item to the top and lets it sink past smaller children. Both are O(log n). Python's `heapq` does all this to an ordinary list.
example: |
  import heapq

  pile = []
  for kg in [7, 3, 9, 1]:
      heapq.heappush(pile, kg)
  print(pile[0], pile)
  print(heapq.heappop(pile), pile)
misconceptions: [heap-list-is-sorted, heappush-just-appends, heappop-takes-last, heap-children-at-2i, heap-push-is-linear, heap-sink-either-child]
related: [priority-queues, big-o, lists, indexing, simple-sorts]
drill: true
cards:
  - type: predict
    prompt: What does this print?
    code: |
      import heapq

      pile = []
      for kg in [6, 2, 9, 4]:
          heapq.heappush(pile, kg)
      print(heapq.heappop(pile), heapq.heappop(pile))
    answer: "2 4"
  - type: choice
    prompt: "Three of these lists are heaps, smallest on top. Which one isn't?"
    verify: none
    options:
      - text: "[2, 5, 3, 4, 6]"
        correct: true
        feedback: "The 4 at position 3 has its parent at position 1, and that's the 5. A child smaller than its parent breaks the rule."
      - text: "[1, 2, 3, 4, 5]"
        misconception: heap-list-is-sorted
        feedback: "A sorted list is a heap: every parent is no bigger than what comes after it. Heaps don't have to be sorted, but they're allowed to be."
      - text: "[1, 4, 2, 7, 5, 3]"
        misconception: heap-list-is-sorted
        feedback: "Check each item against its parent at (i - 1) // 2: 4 and 2 under the 1, 7 and 5 under the 4, 3 under the 2. Every parent is smaller. Out of order, but a heap."
      - text: "[3]"
        feedback: "One item has no parent to be smaller than. It's a heap."
  - type: choice
    prompt: "In a heap kept in a list, which positions hold the children of position 3?"
    verify: none
    options:
      - text: "7 and 8"
        correct: true
        feedback: "2 * 3 + 1 and 2 * 3 + 2. Position 0's children are 1 and 2; position 1's are 3 and 4; and so on down."
      - text: "6 and 7"
        misconception: heap-children-at-2i
        feedback: "That's the rule for a list that counts from 1. Python counts from 0, so it's 2i + 1 and 2i + 2."
      - text: "4 and 5"
        feedback: "Those are the next two along, not the two below. Each level of a heap is twice as wide as the one above it."
  - type: fill
    prompt: "Fill the gap so `parent` is the position of the item above position 5."
    code: |
      position = 5
      parent = (position - 1) ___ 2
      print(parent)
    blanks: [["//"]]
    tests: |
      TESTS = [output("Position 2 is above position 5", expect="2")]
  - type: fix
    prompt: "`take_lightest` should hand back the lightest weight and leave the rest a heap. It only ever looks at the left child. Fix it."
    code: |
      def take_lightest(heap):
          lightest = heap[0]
          last = heap.pop()
          if heap:
              heap[0] = last
              position = 0
              while True:
                  child = 2 * position + 1
                  if child < len(heap) and heap[child] < heap[position]:
                      heap[position], heap[child] = heap[child], heap[position]
                      position = child
                  else:
                      break
          return lightest


      pile = [1, 3, 2, 4, 5, 6]
      print([take_lightest(pile) for _ in range(6)])
    tests: |
      def two_lightest(ctx):
          module = ctx.module()
          pile = [1, 5, 2, 6, 7, 3]
          got = [module.take_lightest(pile), module.take_lightest(pile)]
          if got != [1, 2]:
              raise CheckFailed("From [1, 5, 2, 6, 7, 3], the two lightest are 1, then 2.", expected=[1, 2], actual=got)


      TESTS = [
          output("Lightest first", expect="[1, 2, 3, 4, 5, 6]",
                 hint="When the item sinks, it should swap with the smaller of its two children, not always the left one."),
          custom("The smaller child on the right", two_lightest),
      ]
    solution: |
      def take_lightest(heap):
          lightest = heap[0]
          last = heap.pop()
          if heap:
              heap[0] = last
              position = 0
              while True:
                  smaller = position
                  for child in (2 * position + 1, 2 * position + 2):
                      if child < len(heap) and heap[child] < heap[smaller]:
                          smaller = child
                  if smaller == position:
                      break
                  heap[position], heap[smaller] = heap[smaller], heap[position]
                  position = smaller
          return lightest


      pile = [1, 3, 2, 4, 5, 6]
      print([take_lightest(pile) for _ in range(6)])
  - type: write
    prompt: "Write `is_heap(items)`: `True` if no item in the list is smaller than its parent, `False` otherwise."
    starter: |
      def is_heap(items):
          pass
    tests: |
      TESTS = [
          function("A heap", call="is_heap", args=([1, 4, 2, 7, 5, 3],), expect=True),
          function("A sorted list is a heap", call="is_heap", args=([1, 2, 3, 4],), expect=True),
          function("A 4 below a 5", call="is_heap", args=([2, 5, 3, 4, 6],), expect=False),
          function("Smaller on the right", call="is_heap", args=([3, 4, 1],), expect=False),
          function("Empty", call="is_heap", args=([],), expect=True),
          function("One item", call="is_heap", args=([9],), expect=True),
      ]
    solution: |
      def is_heap(items):
          for position in range(1, len(items)):
              if items[position] < items[(position - 1) // 2]:
                  return False
          return True
  - type: choice
    prompt: "A heap holds a million parts. At most, about how many swaps does one `heappush` make?"
    verify: none
    options:
      - text: "About 20"
        correct: true
        feedback: "The new part climbs one level per swap, and a million parts make a heap about 20 levels deep."
      - text: "About a million"
        misconception: heap-push-is-linear
        feedback: "It never looks at every part. It only compares with its parent, then its parent's parent, up one level at a time."
      - text: "None: it just goes on the end"
        misconception: heappush-just-appends
        feedback: "It goes on the end first, then climbs past any bigger parents, so the smallest is always at the front."
