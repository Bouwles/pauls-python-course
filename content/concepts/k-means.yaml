      centres = np.array([[0.0, 0.0], [10.0, 10.0]])
      distances = np.linalg.norm(stars[:, np.newaxis, :] - centres[np.newaxis, :, :], axis=2)
      labels = distances.___(axis=1)
      print(labels)
    blanks: [["argmin"]]
    tests: |
