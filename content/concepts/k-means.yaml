  - type: fix
    prompt: "The third centre has no stars, and its mean comes out as nan. Fix the update so a centre with no stars stays where it was."
    code: |
      import numpy as np

      stars = np.array([[0.0, 0.0], [2.0, 0.0], [10.0, 10.0], [12.0, 14.0]])
      labels = np.array([0, 0, 1, 1])
      centres = np.array([[1.0, 1.0], [9.0, 9.0], [50.0, 50.0]])
      centres = np.array([stars[labels == j].mean(axis=0) for j in range(3)])
      print(centres.tolist())
    tests: |
      TESTS = [output("The empty centre stays put", expect="[[1.0, 0.0], [11.0, 12.0], [50.0, 50.0]]")]
    solution: |
      import numpy as np

      stars = np.array([[0.0, 0.0], [2.0, 0.0], [10.0, 10.0], [12.0, 14.0]])
      labels = np.array([0, 0, 1, 1])
      centres = np.array([[1.0, 1.0], [9.0, 9.0], [50.0, 50.0]])
      centres = np.array([stars[labels == j].mean(axis=0) if np.any(labels == j) else centres[j]
                          for j in range(3)])
      print(centres.tolist())
  - type: write
    prompt: "Write `inertia(points, labels, centres)`: the sum of the squared distances from each point to its own centre, as one number."
    starter: |
      import numpy as np


      def inertia(points, labels, centres):
          pass
    tests: |
      def small(ctx):
          import numpy as np
          got = ctx.module().inertia(np.array([[0.0, 0.0], [2.0, 0.0], [10.0, 10.0]]), np.array([0, 0, 1]),
                                     np.array([[1.0, 0.0], [10.0, 13.0]]))
          if got is None or abs(float(got) - 11.0) > 1e-9:
              raise CheckFailed("Squared distances 1, 1 and 9 add up to 11.", expected=11.0, actual=got)


      TESTS = [custom("Three stars, two centres", small)]
    solution: |
      import numpy as np


      def inertia(points, labels, centres):
          return np.sum((points - centres[labels]) ** 2)
