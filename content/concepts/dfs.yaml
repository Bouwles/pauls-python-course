id: dfs
title: Depth-first search
summary: |
  Depth-first search follows each road as far as it goes before trying the next, and only goes back when there's nowhere new to go. The simplest way to write it is a function that notes a place, then calls itself for each neighbour not yet reached; the calls waiting underneath remember where to come back to. A stack does the same job without recursion. DFS reaches everything it can, but the first route it finds to a place is often not the shortest. Use it for "can I get there at all", for trying every route, and for puzzles.
example: |
  ROADS = {"scrapyard": ["workshop", "records-office"], "workshop": ["scrapyard", "bakery"],
           "bakery": ["workshop"], "records-office": ["scrapyard"]}
  reached = []


  def explore(place):
      reached.append(place)
      for neighbour in ROADS.get(place, []):
          if neighbour not in reached:
              explore(neighbour)


  explore("scrapyard")
  print(reached)
misconceptions: [dfs-goes-by-distance, dfs-stops-at-dead-end, dfs-loops-forever, dfs-finds-shortest]
related: [graphs, bfs, backtracking]
drill: true
cards:
  - type: predict
    prompt: What does this print?
    code: |
      ROADS = {
          "ferry": ["harbour-office", "post-office"],
          "harbour-office": ["ferry", "pub", "lighthouse"],
          "post-office": ["ferry", "pub"],
          "pub": ["harbour-office", "post-office", "greengrocer"],
          "lighthouse": ["harbour-office"],
          "greengrocer": ["pub"],
      }
      order = []


      def explore(place):
          order.append(place)
          for neighbour in ROADS[place]:
              if neighbour not in order:
                  explore(neighbour)


      explore("ferry")
      print(order)
    answer: "['ferry', 'harbour-office', 'pub', 'post-office', 'greengrocer', 'lighthouse']"
  - type: choice
    prompt: "Nell wants the route to the ferry with the fewest roads. Which search should she use?"
    verify: none
    options:
      - text: "Breadth-first"
        correct: true
        feedback: "BFS reaches places nearest first, so the first route it finds has the fewest roads."
      - text: "Depth-first"
        misconception: dfs-finds-shortest
        feedback: "DFS charges down the first road it sees. It will find a route if there is one, but it may be the long way round."
      - text: "Either: they find the same route"
        misconception: dfs-goes-by-distance
        feedback: "They reach the same places, in a different order. Only breadth-first goes nearest first."
  - type: predict
    prompt: "A stack instead of recursion. What does this print?"
    code: |
      ROADS = {
          "ferry": ["harbour-office", "post-office"],
          "harbour-office": ["ferry", "pub", "lighthouse"],
          "post-office": ["ferry", "pub"],
          "pub": ["harbour-office", "post-office", "greengrocer"],
          "lighthouse": ["harbour-office"],
          "greengrocer": ["pub"],
      }
      stack = ["ferry"]
      reached = set()
      order = []
      while stack:
          place = stack.pop()
          if place in reached:
              continue
          reached.add(place)
          order.append(place)
          for neighbour in ROADS[place]:
              if neighbour not in reached:
                  stack.append(neighbour)
      print(" ".join(order))
    answer: "ferry post-office pub greengrocer harbour-office lighthouse"
  - type: fill
    prompt: "Fill the gap so `explore` never goes back to a place it has already reached."
    code: |
      ROADS = {"pub": ["bakery", "ferry"], "bakery": ["pub", "ferry"], "ferry": ["pub", "bakery"]}
      reached = []


      def explore(place):
          reached.append(place)
          for neighbour in ROADS[place]:
              if neighbour not in ___:
                  explore(neighbour)


      explore("pub")
      print(reached)
    blanks: [["reached"]]
    tests: |
      TESTS = [output("Each place once", expect="['pub', 'bakery', 'ferry']")]
  - type: fix
    prompt: "The shed has no list of its own, and this crashes on it. Fix it so a place with no list is a dead end."
    code: |
      ROADS = {"workshop": ["shed", "yard"], "yard": ["gate"], "gate": ["workshop"]}
      reached = []


      def explore(place):
          reached.append(place)
          for neighbour in ROADS[place]:
              if neighbour not in reached:
                  explore(neighbour)


      explore("workshop")
      print(reached)
    tests: |
      TESTS = [output("Into the shed and back out", expect="['workshop', 'shed', 'yard', 'gate']",
                      hint="ROADS.get(place, []) gives an empty list for a place with no list of its own.")]
    solution: |
      ROADS = {"workshop": ["shed", "yard"], "yard": ["gate"], "gate": ["workshop"]}
      reached = []


      def explore(place):
          reached.append(place)
          for neighbour in ROADS.get(place, []):
              if neighbour not in reached:
                  explore(neighbour)


      explore("workshop")
      print(reached)
  - type: write
    prompt: "Write `can_reach(roads, start, goal)`: `True` if there's any way from `start` to `goal`, `False` if not. Depth first is fine."
    starter: |
      def can_reach(roads, start, goal):
          pass
    tests: |
      ONE_WAY = {"quay": ["fish-market"], "fish-market": ["chapel"], "chapel": []}
      TESTS = [
          function("Down the one-way street", call="can_reach", args=(ONE_WAY, "quay", "chapel"), expect=True),
          function("Against it", call="can_reach", args=(ONE_WAY, "chapel", "quay"), expect=False),
          function("Already there", call="can_reach", args=(ONE_WAY, "chapel", "chapel"), expect=True),
          function("Round in a circle", call="can_reach", args=({"a": ["b"], "b": ["a"], "c": []}, "a", "c"), expect=False),
      ]
    solution: |
      def can_reach(roads, start, goal):
          reached = {start}
          stack = [start]
          while stack:
              place = stack.pop()
              if place == goal:
                  return True
              for neighbour in roads.get(place, []):
                  if neighbour not in reached:
                      reached.add(neighbour)
                      stack.append(neighbour)
          return False
