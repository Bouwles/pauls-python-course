id: counter
title: Counting with Counter
summary: |
  `Counter` from `collections` counts things for you. Hand it a list and it gives back a kind of dictionary: each different item, with how many times it turned up. Something it never saw counts as 0, not an error. `.most_common(3)` gives the three commonest as `(item, count)` pairs, commonest first, and things with the same count stay in the order they were first seen. Hand it a string and it counts the letters, so split the text into words first.
example: |
  from collections import Counter

  orders = ["tea", "coffee", "tea", "hot chocolate", "tea", "coffee"]
  counts = Counter(orders)
  print(counts["tea"], counts["juice"])
  print(counts.most_common(2))
misconceptions: [counter-missing-raises, counter-missing-is-none, most-common-alphabetical, counter-counts-words]
related: [dictionaries, dict-get, tuples, standard-library]
drill: true
cards:
  - type: predict
    prompt: What does this print?
    code: |
      from collections import Counter

      counts = Counter(["kale", "plums", "kale", "leeks", "kale"])
      print(counts["kale"], counts["figs"])
    answer: "3 0"
  - type: choice
    prompt: What does this print?
    code: |
      from collections import Counter

      print(Counter("leek")["e"])
    options:
      - text: "2"
        correct: true
        feedback: "Right. A string is a sequence of letters, so `Counter` counts the letters: two e's in leek."
      - text: "0"
        misconception: counter-counts-words
        feedback: "Given a string, `Counter` counts its characters, not its words. `leek` has two e's in it."
  - type: choice
    prompt: What does this print?
    code: |
      from collections import Counter

      votes = Counter(["Riya", "Caitlin", "Aaesha", "Caitlin", "Riya", "Caitlin"])
      print(votes.most_common(2))
    options:
      - text: "[('Caitlin', 3), ('Riya', 2)]"
        correct: true
        feedback: "Right. Commonest first, as `(item, count)` pairs."
      - text: "[('Aaesha', 1), ('Riya', 2)]"
        misconception: most-common-alphabetical
        feedback: "`most_common` sorts by the count, biggest first. The names' spelling doesn't come into it."
  - type: fix
    prompt: "Counting the snacks by hand crashes on the first one. Fix it so it prints the counts. `Counter` is one way; `.get` is another."
    code: |
      snacks = ["crisps", "apple", "crisps"]
      counts = {}
      for snack in snacks:
          counts[snack] = counts[snack] + 1
      print(counts)
    tests: |
      TESTS = [output("Two crisps, one apple", expect="{'crisps': 2, 'apple': 1}", match="contains")]
    solution: |
      snacks = ["crisps", "apple", "crisps"]
      counts = {}
      for snack in snacks:
          counts[snack] = counts.get(snack, 0) + 1
      print(counts)
  - type: fill
    prompt: "Print the commonest word and how many times it came up."
    code: |
      from collections import Counter

      words = "the clock the tower the stairs".split()
      word, times = Counter(words).___(1)[0]
      print(word, times)
    blanks: [["most_common"]]
    tests: |
      TESTS = [output("The commonest", expect="the 3")]
  - type: write
    prompt: "Write `commonest(items)`: the item that turns up most often, or `None` if the list is empty. If two tie, the one seen first."
    starter: |
      from collections import Counter


      def commonest(items):
          pass
    tests: |
      TESTS = [
          function("Caitlin wins", call="commonest", args=(["Riya", "Caitlin", "Caitlin"],), expect="Caitlin"),
          function("A tie goes to the first seen", call="commonest", args=(["leeks", "kale", "kale", "leeks"],), expect="leeks"),
          function("Nothing to count", call="commonest", args=([],), expect=None),
      ]
    solution: |
      from collections import Counter


      def commonest(items):
          if not items:
              return None
          return Counter(items).most_common(1)[0][0]
