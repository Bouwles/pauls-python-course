id: name-error
title: NameError
summary: |
  A NameError means Python met a name it hasn't been told about. Usually it's a typo, a variable used before it was given a value, or text that's missing its quotes. Python often suggests the name you meant.
example: |
  message = "Morning"
  print(mesage)
misconceptions: [name-without-quotes-is-text]
related: [reading-tracebacks, variables]
cards:
  - type: choice
    prompt: What happens?
    code: |
      print(Paul)
    verify: error
    options:
      - text: It prints Paul
        misconception: name-without-quotes-is-text
        feedback: "Without quotes, Paul is a name, and nothing called Paul exists."
      - text: A NameError
        correct: true
        error: NameError
  - type: fix
    prompt: Fix it.
    code: |
      score = 4
      print(Score)
    tests: |
      TESTS = [output("Prints 4", expect="4")]
    solution: |
      score = 4
      print(score)
  - type: fix
    prompt: Fix it.
    code: |
      print(greeting)
      greeting = "Morning"
    tests: |
      TESTS = [output("Morning", expect="Morning")]
    solution: |
      greeting = "Morning"
      print(greeting)
  - type: fix
    prompt: "This should print the word `Aaesha`. Fix it."
    code: |
      print(Aaesha)
    tests: |
      TESTS = [output("Aaesha", expect="Aaesha")]
    solution: |
      print("Aaesha")
  - type: choice
    prompt: What kind of error does this cause?
    code: |
      room = "the Studio"
      print(room_name)
    verify: error
    options:
      - text: NameError
        correct: true
        error: NameError
      - text: TypeError
        feedback: "Nothing has the wrong type. The name doesn't exist at all."
      - text: SyntaxError
        feedback: "Python can read every line. It fails when it looks the name up."
