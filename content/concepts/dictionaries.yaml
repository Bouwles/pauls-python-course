id: dictionaries
title: Dictionaries
summary: |
  A dictionary pairs keys with values: `{"Bea": "Quay Row"}`. Look a value up by its key with `book["Bea"]`; add or change one with `book["Tom"] = "Point Road"`. Each key appears once, so giving an existing key a value replaces the old one. `in` checks the keys, not the values, and `len()` counts the keys.
example: |
  book = {"Bea": "Quay Row", "Tom": "Point Road"}
  book["Mira"] = "Post Office"
  book["Bea"] = "Mill Lane"
  print(book["Bea"], len(book))
  print("Tom" in book, "Point Road" in book)
misconceptions: [dict-existing-key-ignored, dict-key-holds-many, dict-index-by-position, in-checks-values]
related: [dict-get, dict-items, nested-data]
drill: true
cards:
  - type: predict
    prompt: What does this print?
    code: |
      berths = {"Kittiwake": 4, "Sea Holly": 7}
      print(berths["Sea Holly"])
    answer: "7"
  - type: predict
    prompt: What does this print?
    code: |
      stock = {"flour": 2}
      stock["flour"] = stock["flour"] + 3
      stock["yeast"] = 1
      print(stock)
    answer: "{'flour': 5, 'yeast': 1}"
  - type: choice
    prompt: What does this print?
    code: |
      book = {"Bea": "Quay Row"}
      print("Quay Row" in book)
    options:
      - text: "True"
        misconception: in-checks-values
        feedback: "`in` looks at the keys. `\"Quay Row\"` is a value, so it isn't found."
      - text: "False"
        correct: true
  - type: choice
    prompt: What happens?
    code: |
      book = {"Bea": "Quay Row", "Tom": "Point Road"}
      print(book[0])
    verify: error
    options:
      - text: It prints Quay Row
        misconception: dict-index-by-position
        feedback: "A dictionary is looked up by key, not by position. There's no key `0`."
      - text: A KeyError
        correct: true
        error: KeyError
  - type: fix
    prompt: "Gwen should be in the book, at `The Drowned Anchor`. Fix line 2."
    code: |
      book = {"Bea": "Quay Row"}
      book["The Drowned Anchor"] = "Gwen"
      print(book["Gwen"])
    tests: |
      TESTS = [output("Gwen's address", expect="The Drowned Anchor")]
    solution: |
      book = {"Bea": "Quay Row"}
      book["Gwen"] = "The Drowned Anchor"
      print(book["Gwen"])
  - type: fill
    prompt: "Fill the gap so it prints `{'Kittiwake': 4, 'Mary Rose': 9}`."
    code: |
      berths = {"Kittiwake": 4}
      berths[___] = 9
      print(berths)
    blanks: [["\"Mary Rose\"", "'Mary Rose'"]]
    tests: |
      TESTS = [output("Two boats", expect="{'Kittiwake': 4, 'Mary Rose': 9}")]
  - type: write
    prompt: "Make a dictionary called `prices` where `\"bread\"` is 2.4 and `\"bun\"` is 0.85. Then print the price of a bun by looking it up."
    tests: |
      TESTS = [
          variable("prices", variable="prices", expect={"bread": 2.4, "bun": 0.85}),
          output("A bun", expect="0.85"),
      ]
    solution: |
      prices = {"bread": 2.4, "bun": 0.85}
      print(prices["bun"])
