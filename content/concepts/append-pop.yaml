id: append-pop
title: append and pop
summary: |
  `parcels.append(x)` adds `x` to the end of the list. `parcels.pop()` takes the last item off and gives it back; `parcels.pop(0)` takes the first, and the rest move along. `append` changes the list itself and gives back `None`, so never write `parcels = parcels.append(x)`.
example: |
  parcels = ["Bea", "Tom"]
  parcels.append("Gwen")
  taken = parcels.pop(0)
  print(taken, parcels)
misconceptions: [append-returns-list, pop-takes-first, append-adds-to-front]
related: [lists, indexing]
drill: true
cards:
  - type: predict
    prompt: What does this print?
    code: |
      parcels = ["Bea", "Tom"]
      parcels.append("Gwen")
      print(parcels)
    answer: "['Bea', 'Tom', 'Gwen']"
  - type: predict
    prompt: What does this print?
    code: |
      parcels = ["Bea", "Tom", "Gwen"]
      taken = parcels.pop()
      print(taken, len(parcels))
    answer: "Gwen 2"
  - type: choice
    prompt: What does this print?
    code: |
      parcels = ["Bea", "Tom"]
      parcels = parcels.append("Gwen")
      print(parcels)
    options:
      - text: None
        correct: true
        feedback: "`append` changes the list and gives back `None`. That `None` is what `parcels` now holds."
      - text: "['Bea', 'Tom', 'Gwen']"
        misconception: append-returns-list
        feedback: "`append` gives back `None`, not the list. Just write `parcels.append(\"Gwen\")` on its own."
      - text: "['Gwen', 'Bea', 'Tom']"
        misconception: append-adds-to-front
        feedback: "`append` adds to the end, and here it also gives back `None`."
  - type: choice
    prompt: What does this print?
    code: |
      parcels = ["Bea", "Tom", "Agnes"]
      print(parcels.pop())
    options:
      - text: Agnes
        correct: true
      - text: Bea
        misconception: pop-takes-first
        feedback: "With nothing in the brackets, `pop` takes the last item. `pop(0)` takes the first."
  - type: fix
    prompt: "This should print 2. Fix it."
    code: |
      parcels = ["Bea"]
      parcels = parcels.append("Tom")
      print(len(parcels))
    tests: |
      TESTS = [output("Two parcels", expect="2")]
    solution: |
      parcels = ["Bea"]
      parcels.append("Tom")
      print(len(parcels))
  - type: fill
    prompt: "Fill the gap so Gwen's parcel goes on the end."
    code: |
      parcels = ["Bea", "Tom"]
      parcels.___("Gwen")
      print(parcels)
    blanks: [["append"]]
    tests: |
      TESTS = [output("Three parcels", expect="['Bea', 'Tom', 'Gwen']")]
  - type: write
    prompt: "Start `row` as an empty list. Append `Bea`, `Tom` and `Agnes`, then pop the last one off and print the list."
    tests: |
      TESTS = [
          output("Two left", expect="['Bea', 'Tom']"),
          structure("Uses append and pop", calls=["append", "pop"], message="Build the row with append, then use pop."),
      ]
    solution: |
      row = []
      row.append("Bea")
      row.append("Tom")
      row.append("Agnes")
      row.pop()
      print(row)
