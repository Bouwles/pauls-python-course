id: bfs
title: Breadth-first search
summary: |
  Breadth-first search explores a graph nearest first. Keep a queue: take the place at the front, and put each neighbour that hasn't been reached yet on the back, marking it as reached as you queue it. Everything one step away comes out before anything two steps away, so the first time BFS reaches a place, it has found the fewest steps there. Note where each place was reached from, and you can walk the route back from the goal. Each place is queued once, so it's O(places + roads).
example: |
  from collections import deque

  ROADS = {"clocktower": ["cafe", "market"], "cafe": ["clocktower", "station"],
           "market": ["clocktower"], "station": ["cafe"]}
  roads_away = {"clocktower": 0}
  queue = deque(["clocktower"])
  while queue:
      place = queue.popleft()
      for neighbour in ROADS.get(place, []):
          if neighbour not in roads_away:
              roads_away[neighbour] = roads_away[place] + 1
              queue.append(neighbour)
  print(roads_away)
misconceptions: [bfs-goes-deep, bfs-queues-twice, bfs-first-route-any, bfs-mark-when-taken]
related: [graphs, dfs, big-o, dijkstra]
drill: true
cards:
  - type: predict
    prompt: "What does this print? (`end=\" \"` keeps it on one line.)"
    code: |
      from collections import deque

      ROADS = {
          "park": ["bridge", "station"],
          "bridge": ["park", "cinema", "boathouse"],
          "station": ["park", "cinema"],
          "cinema": ["bridge", "station", "pool"],
          "boathouse": ["bridge"],
          "pool": ["cinema"],
      }
      seen = {"park"}
      queue = deque(["park"])
      while queue:
          place = queue.popleft()
          print(place, end=" ")
          for neighbour in ROADS[place]:
              if neighbour not in seen:
                  seen.add(neighbour)
                  queue.append(neighbour)
    answer: "park bridge station cinema boathouse pool"
  - type: choice
    prompt: "A breadth-first search first reaches the park by a route of four roads. Could there be a route of three?"
    verify: none
    options:
      - text: "No"
        correct: true
        feedback: "Everything three roads away came off the queue before anything four roads away. If the park were three away, it would have been reached then."
      - text: "Yes: BFS takes the first route it finds, not the best"
        misconception: bfs-first-route-any
        feedback: "For BFS the first route it finds is the best, in roads. The queue hands out places in order of how far they are."
