    solution: |
      from collections import deque

      ROADS = {
          "clocktower": ["cafe", "market"],
          "cafe": ["clocktower", "library"],
          "market": ["clocktower", "library"],
          "library": ["cafe", "market"],
      }
      seen = {"clocktower"}
      queue = deque(["clocktower"])
      while queue:
          place = queue.popleft()
          print(place)
          for neighbour in ROADS[place]:
              if neighbour not in seen:
                  seen.add(neighbour)
                  queue.append(neighbour)
  - type: write
    prompt: "Write `roads_away(roads, start)`: a dictionary of every place you can reach from `start`, and how many roads away it is. `start` is 0."
    starter: |
      from collections import deque


      def roads_away(roads, start):
          pass
    tests: |
      TESTS = [
          function("From the boathouse", call="roads_away",
                   args=({"boathouse": ["park"], "park": ["boathouse", "cinema"], "cinema": ["park"]}, "boathouse"),
                   expect={"boathouse": 0, "park": 1, "cinema": 2}),
          function("A square", call="roads_away",
                   args=({"a": ["b", "c"], "b": ["a", "d"], "c": ["a", "d"], "d": ["b", "c"]}, "a"),
                   expect={"a": 0, "b": 1, "c": 1, "d": 2}),
          function("Nowhere to go", call="roads_away", args=({"shed": []}, "shed"), expect={"shed": 0}),
      ]
    solution: |
      from collections import deque


      def roads_away(roads, start):
          distances = {start: 0}
          queue = deque([start])
          while queue:
              place = queue.popleft()
              for neighbour in roads.get(place, []):
                  if neighbour not in distances:
                      distances[neighbour] = distances[place] + 1
                      queue.append(neighbour)
          return distances
