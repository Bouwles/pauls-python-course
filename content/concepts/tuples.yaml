id: tuples
title: Tuples
summary: |
  A tuple is a fixed group of values in round brackets: `(112, 98, 84)`. You read it like a list, with `[0]` and `len()`, but you can't change it once it's made. Use one when the parts belong together and shouldn't drift apart: a width, a depth and a height. To change one, build a new tuple.
example: |
  box = (112, 98, 84)
  print(box[0], len(box))
  box = (113, box[1], box[2])
  print(box)
misconceptions: [tuples-can-change, tuple-change-ignored, one-item-tuple-no-comma]
related: [unpacking, multiple-returns]
cards:
  - type: predict
    prompt: What does this print?
    code: |
      size = (96, 88, 74)
      print(size[1] + size[2])
    answer: "162"
  - type: choice
    prompt: What happens?
    code: |
      size = (96, 88, 74)
      size.append(80)
      print(size)
    verify: error
    options:
      - text: An AttributeError
        correct: true
        error: AttributeError
        feedback: "Tuples have no `append`. Nothing can be added to one after it's made."
      - text: "It prints (96, 88, 74, 80)"
        misconception: tuples-can-change
        feedback: "That's a list. A tuple stays exactly as it was made."
  - type: predict
    prompt: What does this print?
    code: |
      height = (84)
      print(type(height))
    answer: "<class 'int'>"
  - type: fix
    prompt: "The box is now 113 wide. A tuple can't be changed, so make a new one. Fix line 2."
    code: |
      box = (112, 98, 84)
      box[0] = 113
      print(box)
    tests: |
      TESTS = [output("The box's new size", expect="(113, 98, 84)")]
    solution: |
      box = (112, 98, 84)
      box = (113, box[1], box[2])
      print(box)
  - type: fill
    prompt: "Make `one_size` a tuple holding just the number 99."
    code: |
      one_size = (99___)
      print(len(one_size))
    blanks: [[","]]
    tests: |
      TESTS = [output("A tuple of one", expect="1")]
  - type: write
    prompt: "Write one line that makes `shelf` a tuple of its width 99, depth 86 and height 78, in that order."
    tests: |
      TESTS = [variable("The shelf's size", variable="shelf", expect=(99, 86, 78))]
    solution: |
      shelf = (99, 86, 78)
