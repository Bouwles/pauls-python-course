  - type: fix
    prompt: "Tonight's prediction should change with tonight's readings, but it's the same every time. Fix it so tonight is scaled with the training evenings' means and spreads."
    code: |
      import numpy as np
      from sklearn.linear_model import LogisticRegression
      from sklearn.preprocessing import StandardScaler

      X = np.array([[1.0, 60.0], [2.0, 65.0], [7.0, 90.0], [8.0, 95.0]])
      usable = np.array([1, 1, 0, 0])
      scaler = StandardScaler()
      model = LogisticRegression().fit(scaler.fit_transform(X), usable)

      for tonight in ([[1.5, 62.0]], [[7.5, 93.0]]):
          print(model.predict(StandardScaler().fit_transform(tonight)))
    tests: |
      TESTS = [output("A clear night, then a cloudy one", expect="[1]\n[0]")]
    solution: |
      import numpy as np
      from sklearn.linear_model import LogisticRegression
      from sklearn.pipeline import make_pipeline
      from sklearn.preprocessing import StandardScaler

      X = np.array([[1.0, 60.0], [2.0, 65.0], [7.0, 90.0], [8.0, 95.0]])
      usable = np.array([1, 1, 0, 0])
      model = make_pipeline(StandardScaler(), LogisticRegression()).fit(X, usable)

      for tonight in ([[1.5, 62.0]], [[7.5, 93.0]]):
          print(model.predict(tonight))
  - type: write
    prompt: "Make `model`: a pipeline that scales, then fits `LogisticRegression()`. Fit it on `X` and `y`, and print its predictions for `new`."
    starter: |
      import numpy as np
      from sklearn.linear_model import LogisticRegression
      from sklearn.pipeline import make_pipeline
      from sklearn.preprocessing import StandardScaler

      # passengers and rain (mm): did Bea sell out by noon?
      X = np.array([[400, 0.0], [350, 1.0], [120, 9.0], [90, 12.0]])
      y = np.array([1, 1, 0, 0])
      new = np.array([[380, 0.5], [100, 10.0]])
    tests: |
      def is_pipeline(ctx):
          from sklearn.pipeline import Pipeline
          from sklearn.preprocessing import StandardScaler
          model = getattr(ctx.module(), "model", None)
          if not isinstance(model, Pipeline) or not isinstance(model.steps[0][1], StandardScaler):
              raise CheckFailed("model should be a pipeline that starts with a StandardScaler.", actual=repr(model))


      TESTS = [output("A busy dry Saturday, then a wet quiet one", expect="[1 0]"), custom("It's a pipeline", is_pipeline)]
    solution: |
      import numpy as np
      from sklearn.linear_model import LogisticRegression
      from sklearn.pipeline import make_pipeline
      from sklearn.preprocessing import StandardScaler

      # passengers and rain (mm): did Bea sell out by noon?
      X = np.array([[400, 0.0], [350, 1.0], [120, 9.0], [90, 12.0]])
      y = np.array([1, 1, 0, 0])
      new = np.array([[380, 0.5], [100, 10.0]])
      model = make_pipeline(StandardScaler(), LogisticRegression())
      model.fit(X, y)
      print(model.predict(new))
