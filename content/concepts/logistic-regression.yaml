id: logistic-regression
title: Logistic regression
summary: |
  Logistic regression answers a yes-or-no question with a chance. It works out a straight-line score, `z = X @ w + b`, then squashes it with the sigmoid, `1 / (1 + np.exp(-z))`, into a probability between 0 and 1: a score of 0 gives exactly 0.5, positive scores lean to yes and negative ones to no. It learns `w` and `b` by gradient descent on log loss, `-np.mean(y * np.log(p) + (1 - y) * np.log(1 - p))`, which charges little for a hesitant miss and without limit for a confident one, and whose gradient is simply `X.T @ (p - y) / len(y)`. The model only ever gives a chance; to make a decision, compare it with a threshold, usually 0.5.
example: |
  import numpy as np


  def sigmoid(z):
      return 1 / (1 + np.exp(-z))


  cloud = np.array([[0.1], [0.5], [0.9]])     # cloud cover, 0 to 1
  w, b = np.array([6.0]), -3.0
  chance = sigmoid(cloud @ w + b)
  print(np.round(chance, 2))
  print((chance >= 0.5).astype(int))
misconceptions: [logistic-outputs-class, sigmoid-of-zero-is-zero, confident-wrong-cheap, line-stays-in-range, miss-uses-score, threshold-on-score]
related: [linear-regression, gradient-descent, cross-entropy, activation-functions, probability]
cards:
  - type: predict
    prompt: What does this print?
    code: |
      import numpy as np


      def sigmoid(z):
          return 1 / (1 + np.exp(-z))


      X = np.array([[2.0, 1.0],
                    [0.0, 1.0]])
      w = np.array([1.5, -2.0])
      b = 0.5
      print(np.round(sigmoid(X @ w + b), 2))
    answer: "[0.82 0.18]"
  - type: choice
    prompt: "Tonight's readings give a score of exactly 0. What does this print?"
    code: |
      import numpy as np

      night = np.array([0.5, 0.25])
      w = np.array([2.0, -4.0])
      b = 0.0
      z = night @ w + b
      print(1 / (1 + np.exp(-z)))
    options:
      - text: "0.5"
        correct: true
        feedback: "`np.exp(0)` is 1, so the sigmoid gives 1 / 2. A score of 0 sits exactly on the line between yes and no."
      - text: "0.0"
        misconception: sigmoid-of-zero-is-zero
        feedback: "A score of 0 isn't a chance of 0. `np.exp(0)` is 1, so the sigmoid is 1 / (1 + 1). Chances near 0 need large negative scores."
  - type: choice
    prompt: "It rained. One forecast had said 0.6, the other 0.01. What does this print?"
    code: |
      import numpy as np

      y = 1
      for p in [0.6, 0.01]:
          loss = -(y * np.log(p) + (1 - y) * np.log(1 - p))
          print(round(loss, 2))
    options:
      - text: |-
          0.51
          4.61
        correct: true
        feedback: "Log loss is minus the log of the chance given to what happened. The forecast that was nearly sure of a dry night costs nine times as much."
      - text: |-
          0.4
          0.99
        misconception: confident-wrong-cheap
        feedback: "Those are the misses, `1 - p`. Log loss is `-log(p)` for what happened, which grows without limit as p falls to 0: a forecast that was sure and wrong costs far more than one that hedged."
  - type: choice
    prompt: "For tonight, Yahya's model gives 0.62. What has it told him?"
    verify: none
    options:
      - text: "A 62% chance of rain; whether to take an umbrella depends on his threshold"
        correct: true
        feedback: "The model only gives a chance. Comparing it with a threshold, 0.5 or a more cautious one, turns it into a decision."
      - text: "Nothing yet: logistic regression should answer 0 or 1"
        misconception: logistic-outputs-class
        feedback: "Despite the name, logistic regression gives a probability, not a class. The 0 or 1 comes from comparing that probability with a threshold, and choosing the threshold is Yahya's job."
  - type: fill
    prompt: "Fill the gap so `dw` is the gradient of the log loss."
    code: |
