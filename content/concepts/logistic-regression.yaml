          pass
    tests: |
      import numpy as np


      def decisions(ctx):
          m = ctx.module()
          X = np.array([[0.1], [0.5], [0.9]])
          w = np.array([6.0])
          for threshold, want in [(0.5, [0, 1, 1]), (0.9, [0, 0, 1])]:
              got = m.decide(X, w, -3.0, threshold)
              if got is None or np.shape(got) != (3,) or not np.array_equal(np.asarray(got), want):
                  raise CheckFailed(f"Three nights at a threshold of {threshold}", expected=want, actual=repr(got))


      TESTS = [
          custom("Two thresholds, one night on the line", decisions),
          structure("No loop", forbids=["For", "While", "ListComp"]),
      ]
    solution: |
      import numpy as np


      def sigmoid(z):
          return 1 / (1 + np.exp(-z))


      def decide(X, w, b, threshold=0.5):
          return (sigmoid(X @ w + b) >= threshold).astype(int)
  - type: choice
    prompt: "Yahya decides with the score instead of the chance. The score is 0.3. What does this print?"
    code: |
      import numpy as np

      score = 0.3
      chance = 1 / (1 + np.exp(-score))
      print("rain" if score >= 0.5 else "dry", "rain" if chance >= 0.5 else "dry")
    options:
      - text: "dry rain"
        correct: true
        feedback: "The chance is 0.57, so the model leans to rain. A threshold of 0.5 belongs to the chance; on the score, the same decision line sits at 0."
      - text: "rain rain"
        misconception: threshold-on-score
        feedback: "The score isn't a chance. A score of 0.3 squashes to a chance of 0.57; Yahya's test of `score >= 0.5` asks for a chance of at least 0.62, so he calls dry nights that lean to rain."
  - type: fix
    prompt: "Caitlin's walk fits a straight line to the 0s and 1s instead of learning chances. Fix the miss."
    code: |
      import numpy as np


      def sigmoid(z):
          return 1 / (1 + np.exp(-z))


      def step(X, y, w, b, rate):
          miss = X @ w + b - y
          return w - rate * X.T @ miss / len(y), b - rate * np.mean(miss)


      X = np.array([[1.0], [-1.0], [2.0]])
      y = np.array([1.0, 0.0, 1.0])
      print(step(X, y, np.array([0.5]), 0.0, 1.0))
    tests: |
      import numpy as np


      def one_step(ctx):
          m = ctx.module()
          X = np.array([[1.0, 0.0], [0.0, 2.0], [1.0, 1.0]])
          y = np.array([1.0, 0.0, 0.0])
          w, b = np.array([0.5, -0.5]), 0.2
          p = 1 / (1 + np.exp(-(X @ w + b)))
          want_w, want_b = w - 0.1 * X.T @ (p - y) / 3, b - 0.1 * np.mean(p - y)
          got_w, got_b = m.step(X, y, w, b, 0.1)
          if not (np.allclose(got_w, want_w) and abs(got_b - want_b) < 1e-9):
              raise CheckFailed("One step downhill on the log loss", expected=(np.round(want_w, 4).tolist(), round(float(want_b), 4)),
                                actual=(np.round(got_w, 4).tolist(), round(float(got_b), 4)))


      TESTS = [custom("One step on the log loss", one_step)]
    solution: |
      import numpy as np


      def sigmoid(z):
          return 1 / (1 + np.exp(-z))


      def step(X, y, w, b, rate):
          miss = sigmoid(X @ w + b) - y
          return w - rate * X.T @ miss / len(y), b - rate * np.mean(miss)


      X = np.array([[1.0], [-1.0], [2.0]])
      y = np.array([1.0, 0.0, 1.0])
      print(step(X, y, np.array([0.5]), 0.0, 1.0))
