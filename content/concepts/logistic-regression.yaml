  - type: fix
    prompt: "Caitlin's log loss is wrong for the nights it didn't rain. Fix it."
    code: |
      import numpy as np


      def log_loss(y, p):
          return -np.mean(y * np.log(p) + (1 - y) * np.log(p))


      print(round(log_loss(np.array([1, 0]), np.array([0.8, 0.1])), 3))
    tests: |
      import numpy as np


      def losses(ctx):
          m = ctx.module()
          cases = [([1, 0], [0.8, 0.1]), ([0, 0, 1], [0.5, 0.9, 0.9])]
          for y, p in cases:
              y, p = np.array(y), np.array(p)
              want = -np.mean(y * np.log(p) + (1 - y) * np.log(1 - p))
              got = m.log_loss(y, p)
              if got is None or abs(got - want) > 1e-9:
                  raise CheckFailed(f"The log loss for y = {y.tolist()}, p = {p.tolist()}", expected=round(float(want), 4), actual=got)


      TESTS = [custom("Wet and dry nights", losses)]
    solution: |
      import numpy as np


      def log_loss(y, p):
          return -np.mean(y * np.log(p) + (1 - y) * np.log(1 - p))


      print(round(log_loss(np.array([1, 0]), np.array([0.8, 0.1])), 3))
