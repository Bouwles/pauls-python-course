id: naming
title: Honest names
summary: |
  A variable name can use letters, digits and underscores, but can't start with a digit or contain spaces. Python style is lower-case words joined by underscores, like `coffee_price`. Name a variable for what it holds, so the code reads like a description of the job.
example: |
  coffee_price = 240
  coffees_ordered = 3
  print(coffee_price * coffees_ordered)
misconceptions: [names-can-have-spaces]
related: [variables]
cards:
  - type: choice
    prompt: Which of these is an allowed variable name?
    verify: none
    options:
      - text: coffee price
        misconception: names-can-have-spaces
        feedback: "No spaces. Python would read two names."
      - text: 2nd_coffee
        misconception: names-can-have-spaces
        feedback: "Names can't start with a digit."
      - text: second_coffee
        correct: true
      - text: cup-count
        misconception: names-can-have-spaces
        feedback: "Python reads the hyphen as a minus sign: cup minus count."
  - type: choice
    prompt: Which name would Paul accept for the number of parcels waiting?
    verify: none
    options:
      - text: p
        feedback: "Short, but it says nothing about what it holds."
      - text: parcels_waiting
        correct: true
      - text: thing
        feedback: "Everything is a thing. Name it for what it holds."
  - type: fix
    prompt: This crashes. Rename the variable so it works.
    code: |
      2nd_delivery = 4
      print(2nd_delivery)
    tests: |
      TESTS = [output("Prints 4", expect="4")]
    solution: |
      second_delivery = 4
      print(second_delivery)
  - type: fix
    prompt: Rename the variables so they say what they hold.
    code: |
      a = 85
      b = 6
      print(a * b)
    tests: |
      import ast as _ast
      def honest(tree, source):
          short = sorted({n.id for n in _ast.walk(tree) if isinstance(n, _ast.Name) and isinstance(n.ctx, _ast.Store) and len(n.id) == 1})
          if short:
              return "Rename " + ", ".join(short) + "."
      TESTS = [output("Still 510", expect="510"), structure("Honest names", check=honest)]
    solution: |
      cookie_price = 85
      cookies = 6
      print(cookie_price * cookies)
  - type: write
    prompt: "Store the building's name, `The Clocktower`, in a well-named variable, then print the variable."
    tests: |
      import ast as _ast
      def named(tree, source):
          stores = [n for n in _ast.walk(tree) if isinstance(n, _ast.Assign)]
          if not any(isinstance(t, _ast.Name) and len(t.id) >= 4 for a in stores for t in a.targets):
              return "Give the variable a name that says what it holds."
          prints = [n for n in _ast.walk(tree) if isinstance(n, _ast.Call) and getattr(n.func, "id", "") == "print"]
          if not any(any(isinstance(a, _ast.Name) for a in p.args) for p in prints):
              return "Print the variable, not the text."
      TESTS = [output("The Clocktower", expect="The Clocktower"), structure("Uses a variable", check=named)]
    solution: |
      building_name = "The Clocktower"
      print(building_name)
