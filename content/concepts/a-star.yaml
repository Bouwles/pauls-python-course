id: a-star
title: A* search
summary: |
  A* is Dijkstra's algorithm with a sense of direction. Each waiting tile goes on the heap with the minutes spent reaching it, `g`, plus an estimate of the minutes still to go, `h`, so the search takes the tile with the smallest `g + h` and leans towards the goal. On a grid where no step costs less than 1, the Manhattan distance, rows apart plus columns apart, never overestimates, and an estimate that never overestimates means the first time A* settles the goal, it has the quickest route. Put `h` second in the tuple so ties go to the tile nearer the goal.
example: |
  import heapq


  def manhattan(tile, goal):
      return abs(tile[0] - goal[0]) + abs(tile[1] - goal[1])


  goal = (0, 4)
  waiting = []
  for tile, minutes_so_far in [((2, 0), 1), ((1, 3), 6), ((0, 1), 3)]:
      estimate = manhattan(tile, goal)
      heapq.heappush(waiting, (minutes_so_far + estimate, estimate, tile))
  print(heapq.heappop(waiting))
misconceptions: [a-star-greedy-to-goal, a-star-cheapest-so-far, a-star-overestimate-ok, manhattan-is-straight-line, a-star-slower-route]
related: [dijkstra, heaps, priority-queues, bfs]
drill: true
