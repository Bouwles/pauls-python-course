    prompt: "In what order does A* take these tiles?"
    code: |
      import heapq


      def manhattan(tile, goal):
          return abs(tile[0] - goal[0]) + abs(tile[1] - goal[1])


      goal = (3, 3)
      waiting = []
      for tile, minutes_so_far in [((0, 3), 4), ((3, 0), 2), ((2, 2), 5)]:
          estimate = manhattan(tile, goal)
          heapq.heappush(waiting, (minutes_so_far + estimate, estimate, tile))
      print([heapq.heappop(waiting)[2] for _ in range(3)])
    answer: "[(3, 0), (2, 2), (0, 3)]"
  - type: choice
    prompt: "Pip's A* estimates the minutes left as three times the Manhattan distance. It looks at far fewer tiles. What's the catch?"
    verify: none
    options:
      - text: "It can overestimate, so the route it settles on may not be the quickest"
        correct: true
        feedback: "Three times the distance can be more than the real trip. Then a slow route that looks close to the goal can be settled before a quicker one is ever looked at."
      - text: "None: a bigger estimate just finds the same route faster"
        misconception: a-star-overestimate-ok
        feedback: "The promise that the first route to the goal is the quickest only holds if the estimate is never more than the real cost."
  - type: choice
    prompt: "A* and Dijkstra both search Nell's yard from the gate to the crane. How do their routes compare?"
    verify: none
    options:
      - text: "Both take the same number of minutes; A* looks at fewer tiles"
        correct: true
        feedback: "With an estimate that never overestimates, A* finds a quickest route too. It just doesn't waste time behind the gate."
      - text: "A*'s can be slower, because it looks at fewer tiles"
        misconception: a-star-slower-route
        feedback: "The tiles it skips are ones that could never be on a quicker route, because even the estimate says they're too far."
      - text: "A*'s is always the straightest line to the crane"
        misconception: manhattan-is-straight-line
        feedback: "The estimate only orders the search. The route still goes round heaps and through whatever mud is worth it."
