  - type: fix
    prompt: "This search orders tiles by the estimate alone, and it walks straight through the mud. Fix it so it finds the quickest route: 5 minutes, round by the bottom row."
    code: |
      import heapq

      TILES = [
          [1, 3, 3, 1],
          [1, 1, 1, 1],
      ]


      def manhattan(tile, goal):
          return abs(tile[0] - goal[0]) + abs(tile[1] - goal[1])


      def quickest(tiles, start, goal):
          best = {start: 0}
          settled = set()
          waiting = [(manhattan(start, goal), start)]
          while waiting:
              _, tile = heapq.heappop(waiting)
              if tile in settled:
                  continue
              settled.add(tile)
              if tile == goal:
                  return best[goal]
              row, col = tile
              for next_tile in ((row - 1, col), (row + 1, col), (row, col - 1), (row, col + 1)):
                  next_row, next_col = next_tile
                  if 0 <= next_row < len(tiles) and 0 <= next_col < len(tiles[0]):
                      minutes = best[tile] + tiles[next_row][next_col]
                      if next_tile not in best or minutes < best[next_tile]:
                          best[next_tile] = minutes
                          heapq.heappush(waiting, (manhattan(next_tile, goal), next_tile))
          return None


      print(quickest(TILES, (0, 0), (0, 3)))
    tests: |
      TESTS = [output("Round the mud", expect="5", hint="Push each tile with its minutes so far plus the estimate, not the estimate alone.")]
    solution: |
      import heapq

      TILES = [
          [1, 3, 3, 1],
          [1, 1, 1, 1],
      ]


      def manhattan(tile, goal):
          return abs(tile[0] - goal[0]) + abs(tile[1] - goal[1])


      def quickest(tiles, start, goal):
          best = {start: 0}
          settled = set()
          waiting = [(manhattan(start, goal), start)]
          while waiting:
              _, tile = heapq.heappop(waiting)
              if tile in settled:
                  continue
              settled.add(tile)
              if tile == goal:
                  return best[goal]
              row, col = tile
              for next_tile in ((row - 1, col), (row + 1, col), (row, col - 1), (row, col + 1)):
                  next_row, next_col = next_tile
                  if 0 <= next_row < len(tiles) and 0 <= next_col < len(tiles[0]):
                      minutes = best[tile] + tiles[next_row][next_col]
                      if next_tile not in best or minutes < best[next_tile]:
                          best[next_tile] = minutes
                          heapq.heappush(waiting, (minutes + manhattan(next_tile, goal), next_tile))
          return None


      print(quickest(TILES, (0, 0), (0, 3)))
