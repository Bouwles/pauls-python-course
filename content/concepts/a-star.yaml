    tests: |
      N = None
      TILES = [[1, 1, N], [3, 1, 1]]
      TESTS = [
          function("A corner", call="neighbours", args=(TILES, (0, 0)), expect=[(1, 0), (0, 1)]),
          function("Next to scrap", call="neighbours", args=(TILES, (0, 1)), expect=[(1, 1), (0, 0)]),
          function("The middle of the bottom row", call="neighbours", args=(TILES, (1, 1)), expect=[(0, 1), (1, 0), (1, 2)]),
      ]
    solution: |
      def neighbours(tiles, tile):
          row, col = tile
          found = []
          for next_row, next_col in ((row - 1, col), (row + 1, col), (row, col - 1), (row, col + 1)):
              if 0 <= next_row < len(tiles) and 0 <= next_col < len(tiles[next_row]) and tiles[next_row][next_col] is not None:
                  found.append((next_row, next_col))
          return found
