id: zip
title: zip()
summary: |
  `zip(a, b)` walks two lists side by side and hands over one pair at a time: the first of each, then the second of each. It stops when the shorter list runs out, without a word, so check the lists really are the same length.
example: |
  names = ["Riya", "Yahya", "Aaesha"]
  scores = [112, 96, 101]
  for name, score in zip(names, scores):
      print(name, score)
misconceptions: [zip-errors-on-uneven, zip-joins-lists, zip-keeps-lists-whole]
related: [enumerate, unpacking]
cards:
  - type: predict
    prompt: What does this print?
    code: |
      days = ["Mon", "Tue", "Wed"]
      coffees = [40, 52]
      for day, count in zip(days, coffees):
          print(day, count)
    answer: "Mon 40\nTue 52"
  - type: choice
    prompt: What does this print?
    code: |
      print(list(zip(["Riya", "Yahya"], [96, 101])))
    options:
      - text: "[('Riya', 96), ('Yahya', 101)]"
        correct: true
        feedback: "One tuple per position: the first of each, then the second of each."
      - text: "['Riya', 'Yahya', 96, 101]"
        misconception: zip-joins-lists
        feedback: "That's `+` on two lists. zip pairs items up; it doesn't put one list after the other."
      - text: "[('Riya', 'Yahya'), (96, 101)]"
        misconception: zip-keeps-lists-whole
        feedback: "zip doesn't keep each list together. It takes one item from each list at a time."
  - type: fix
    prompt: "This should print each person with their locker, like `Riya 4`. Fix it."
    code: |
      names = ["Riya", "Neil"]
      lockers = [4, 7]
      for name, locker in names, lockers:
          print(name, locker)
    tests: |
      TESTS = [output("Names and lockers", expect="Riya 4\nNeil 7")]
    solution: |
      names = ["Riya", "Neil"]
      lockers = [4, 7]
      for name, locker in zip(names, lockers):
          print(name, locker)
  - type: fill
    prompt: "Fill the gap so each name is printed with its score."
    code: |
      names = ["Neil", "Caitlin"]
      scores = [72, 86]
      for name, score in ___(names, scores):
          print(f"{name}: {score}")
    blanks: [["zip"]]
    tests: |
      TESTS = [output("Two scores", expect="Neil: 72\nCaitlin: 86")]
  - type: write
    prompt: "`items` and `prices` are in step. Use `zip` to print a line for each, like `apples 45p`."
    starter: |
      items = ["apples", "pears", "plums"]
      prices = [45, 60, 25]
    tests: |
      TESTS = [
          output("Three price lines", expect="apples 45p\npears 60p\nplums 25p"),
          structure("Uses zip", calls=["zip"]),
      ]
    solution: |
      items = ["apples", "pears", "plums"]
      prices = [45, 60, 25]
      for item, price in zip(items, prices):
          print(f"{item} {price}p")
