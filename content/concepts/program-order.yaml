id: program-order
title: Programs run top to bottom
summary: |
  A program is a list of instructions. Python runs them one at a time, from the first line to the last. A line can only use what earlier lines have already done.
example: |
  print("Kettle on")
  print("Tea brewed")
  print("Tea poured")
misconceptions: [lines-run-in-any-order, later-line-changes-earlier-output]
related: [print]
cards:
  - type: predict
    prompt: What does this print?
    code: |
      print("one")
      print("two")
      print("three")
    answer: "one\ntwo\nthree"
  - type: choice
    prompt: What does this print?
    code: |
      print("Ring the bell")
      print("Mind the step")
    options:
      - text: "Ring the bell\nMind the step"
        correct: true
        feedback: "Top to bottom, one line at a time, and each print() starts a new line."
      - text: "Mind the step\nRing the bell"
        misconception: lines-run-in-any-order
        feedback: "Python never picks its own order. The first line runs first."
      - text: "Ring the bell Mind the step"
        misconception: print-same-line
        feedback: "Each print() finishes its line, so the second starts on a new one."
  - type: predict
    prompt: What does this print?
    code: |
      print("Last")
      print("First")
    answer: "Last\nFirst"
  - type: fix
    prompt: The greeting should come before the question. Fix the order.
    code: |
      print("What would you like?")
      print("Morning.")
    tests: |
      TESTS = [output("Greeting first", expect="Morning.\nWhat would you like?")]
    solution: |
      print("Morning.")
      print("What would you like?")
  - type: write
    prompt: "Write a program that prints `Ready`, then `Steady`, then `Go`, each on its own line."
    tests: |
      TESTS = [output("Three lines", expect="Ready\nSteady\nGo")]
    solution: |
      print("Ready")
      print("Steady")
      print("Go")
