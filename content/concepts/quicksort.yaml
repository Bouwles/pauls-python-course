  - type: write
    prompt: "Write `split(pile, pivot)`, which returns three lists: the weights lighter than `pivot`, the same, and heavier, each in the order they appear in `pile`."
    starter: |
      def split(pile, pivot):
          pass
    tests: |
      TESTS = [
          function("Round 6", call="split", args=([6, 2, 9, 6, 1, 8], 6), expect=([2, 1], [6, 6], [9, 8])),
          function("Nothing lighter", call="split", args=([3, 4, 3], 3), expect=([], [3, 3], [4])),
          function("An empty pile", call="split", args=([], 5), expect=([], [], [])),
      ]
    solution: |
      def split(pile, pivot):
          lighter = [weight for weight in pile if weight < pivot]
          same = [weight for weight in pile if weight == pivot]
          heavier = [weight for weight in pile if weight > pivot]
          return lighter, same, heavier
