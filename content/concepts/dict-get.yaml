id: dict-get
title: .get() for keys that might not be there
summary: |
  `book[name]` crashes with a KeyError if `name` isn't a key. `book.get(name)` hands back `None` instead, and `book.get(name, "unknown")` hands back `"unknown"`. `.get()` only reads; it never adds the key. Use it when a missing key is normal, not a mistake.
example: |
  book = {"Riya": "Park Road"}
  print(book.get("Yahya"))
  print(book.get("Yahya", "No address"))
  counts = {}
  counts["tea"] = counts.get("tea", 0) + 1
  print(counts)
misconceptions: [missing-key-gives-none, get-adds-key]
related: [dictionaries, none]
drill: true
cards:
  - type: predict
    prompt: What does this print?
    code: |
      book = {"Riya": "Park Road"}
      print(book.get("Yahya"))
    answer: "None"
  - type: predict
    prompt: What does this print?
    code: |
      book = {"Riya": "Park Road"}
      print(book.get("Yahya", "No address"))
      print(book.get("Riya", "No address"))
    answer: |-
      No address
      Park Road
  - type: choice
    prompt: What happens?
    code: |
      book = {"Riya": "Park Road"}
      print(book["Yahya"])
    verify: error
    options:
      - text: It prints None
        misconception: missing-key-gives-none
        feedback: "Square brackets don't forgive a missing key. That's a KeyError. `.get()` is the one that gives `None`."
      - text: A KeyError
        correct: true
        error: KeyError
  - type: choice
    prompt: What does this print?
    code: |
      counts = {}
      counts.get("tea", 0)
      print(counts)
    options:
      - text: "{'tea': 0}"
        misconception: get-adds-key
        feedback: "`.get()` only looks. It hands back 0 without storing anything."
      - text: "{}"
        correct: true
  - type: fix
    prompt: "Typing a name that isn't in the book should print `Unknown`, not crash. Fix line 3."
    code: |
      book = {"Riya": "Park Road", "Yahya": "Hill Street"}
      name = input("Name? ")
      print(book[name])
    tests: |
      TESTS = [
          output("Not in the book", inputs=["Caitlin"], expect="Unknown"),
          output("In the book", inputs=["Yahya"], expect="Hill Street"),
      ]
    solution: |
      book = {"Riya": "Park Road", "Yahya": "Hill Street"}
      name = input("Name? ")
      print(book.get(name, "Unknown"))
  - type: fill
    prompt: "Fill the gap so this counts the orders: `{'tea': 2, 'cake': 1}`."
    code: |
      counts = {}
      for order in ["tea", "cake", "tea"]:
          counts[order] = counts.get(order, ___) + 1
      print(counts)
    blanks: [["0"]]
    tests: |
      TESTS = [output("Counted", expect="{'tea': 2, 'cake': 1}")]
  - type: write
    prompt: "Ask `Item? ` and print how many of it the Makerspace has in `stock`, or `0` if it isn't listed. Use `.get()`."
    starter: |
      stock = {"batteries": 3, "cables": 2}
    tests: |
      TESTS = [
          output("Glue isn't listed", inputs=["glue"], expect="0"),
          output("Batteries are", inputs=["batteries"], expect="3"),
          output("Cables are", inputs=["cables"], expect="2"),
      ]
    solution: |
      stock = {"batteries": 3, "cables": 2}
      item = input("Item? ")
      print(stock.get(item, 0))
