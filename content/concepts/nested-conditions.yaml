id: nested-conditions
title: An if inside an if
summary: |
  An `if` can sit inside another `if`, indented one level further. The inner test is only asked when the outer one was `True`. The indent decides which `else` belongs to which `if`: an `else` pairs with the `if` it lines up with.
example: |
  weather = "dry"
  hour = 20
  if weather == "dry":
      if hour >= 19:
          print("Night run")
      else:
          print("Day run")
  else:
      print("Wait for the rain to stop")
misconceptions: [nested-if-runs-without-outer, else-pairs-with-nearest-if]
related: [if-elif-else, boolean-operators]
cards:
  - type: predict
    prompt: What does this print?
    code: |
      weather = "wet"
      hour = 20
      if weather == "dry":
          if hour >= 19:
              print("Night run")
          else:
              print("Day run")
      print("Checked")
    answer: "Checked"
  - type: choice
    prompt: What does this print?
    code: |
      age = 10
      hour = 22
      if age >= 16:
          if hour >= 19:
              print("4.00")
      else:
          print("1.50")
    options:
      - text: "1.50"
        correct: true
        feedback: "The `else` lines up with `if age >= 16`, so it belongs to that one. A ten-year-old gets 1.50."
      - text: "4.00"
        misconception: nested-if-runs-without-outer
        feedback: "The hour is only checked once the outer test has passed. 10 is not 16 or over, so Python never gets that far."
      - text: Nothing is printed
        misconception: else-pairs-with-nearest-if
        feedback: "An `else` belongs to the `if` it lines up with, not the nearest one. This one lines up with the age test."
  - type: fix
    prompt: "When it's dry at midday this should print `Day run`. Fix the indentation."
    code: |
      weather = "dry"
      hour = 12
      if weather == "dry":
          if hour >= 19:
              print("Night run")
      else:
          print("Day run")
    tests: |
      TESTS = [
          output("Midday", expect="Day run"),
          output("Evening", set_vars={"hour": 20}, expect="Night run"),
      ]
    solution: |
      weather = "dry"
      hour = 12
      if weather == "dry":
          if hour >= 19:
              print("Night run")
          else:
              print("Day run")
  - type: fill
    prompt: "Fill the gap so adults pay 4.00 at night and 3.00 by day, and children always pay 1.50."
    code: |
      age = 30
      hour = 20
      if age >= 16:
          ___ hour >= 19:
              print("4.00")
          else:
              print("3.00")
      else:
          print("1.50")
    blanks: [["if"]]
    tests: |
      TESTS = [
          output("Adult at night", expect="4.00"),
          output("Adult by day", set_vars={"hour": 12}, expect="3.00"),
          output("Child at night", set_vars={"age": 10}, expect="1.50"),
      ]
  - type: write
    prompt: "When it's dry, print `Running`, and then `Lights on` as well if `hour` is 19 or later. When it's wet, print only `Treadmill`."
    starter: |
      weather = "dry"
      hour = 20
    tests: |
      TESTS = [
          output("Dry, evening", expect="Running\nLights on"),
          output("Dry, midday", set_vars={"hour": 12}, expect="Running"),
          output("Wet, evening", set_vars={"weather": "wet"}, expect="Treadmill"),
      ]
    solution: |
      weather = "dry"
      hour = 20
      if weather == "dry":
          print("Running")
          if hour >= 19:
              print("Lights on")
      else:
          print("Treadmill")
