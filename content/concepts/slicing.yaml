id: slicing
title: Slices take part of a list
summary: |
  `items[start:stop]` makes a new list from position `start` up to, but not including, `stop`. Leave out `start` to begin at the front, or `stop` to run to the end, so `items[:3]` is the first three and `items[-2:]` the last two. A slice that runs past the end doesn't crash; it gives you what is there. The original list is not changed.
example: |
  shopping = ["flour", "yeast", "butter", "sugar"]
  print(shopping[1:3])
  print(shopping[:2])
  print(shopping[-1:])
  print(shopping[2:10])
misconceptions: [slice-includes-stop, slice-past-end-errors, slice-changes-list, slice-counts-from-one]
related: [list-methods, string-slicing]
drill: true
cards:
  - type: predict
    prompt: What does this print?
    code: |
      tides = [4, 6, 9, 7, 3]
      print(tides[1:3])
    answer: "[6, 9]"
  - type: predict
    prompt: What does this print?
    code: |
      boats = ["Kittiwake", "Mary Rose", "Sea Holly"]
      print(boats[-2:])
    answer: "['Mary Rose', 'Sea Holly']"
  - type: choice
    prompt: What does this print?
    code: |
      crew = ["Ferro", "Tom", "Agnes"]
      print(crew[1:10])
    options:
      - text: An IndexError
        misconception: slice-past-end-errors
        feedback: "Asking for one item past the end crashes. A slice past the end just stops at the end."
      - text: "['Tom', 'Agnes']"
        correct: true
      - text: "['Ferro', 'Tom', 'Agnes']"
        misconception: slice-counts-from-one
        feedback: "Positions count from 0, so position 1 is Tom. Ferro, at position 0, isn't included."
  - type: choice
    prompt: What does this print?
    code: |
      orders = ["bread", "buns", "cake", "tart"]
      first = orders[:2]
      print(orders)
    options:
      - text: "['bread', 'buns', 'cake', 'tart']"
        correct: true
      - text: "['cake', 'tart']"
        misconception: slice-changes-list
        feedback: "A slice copies part of the list into a new one. The original keeps everything."
      - text: "['bread', 'buns']"
        misconception: slice-changes-list
        feedback: "That's what `first` holds. `orders` itself isn't cut down."
  - type: fix
    prompt: "This should print the first three names. It prints two. Fix the slice."
    code: |
      names = ["Bea", "Mira", "Gwen", "Agnes", "Tom"]
      print(names[0:2])
    tests: |
      TESTS = [output("First three", expect="['Bea', 'Mira', 'Gwen']")]
    solution: |
      names = ["Bea", "Mira", "Gwen", "Agnes", "Tom"]
      print(names[0:3])
  - type: fill
    prompt: "Fill the gap so it prints the last three readings."
    code: |
      readings = [12, 15, 11, 9, 14, 10]
      print(readings[___])
    blanks: [["-3:"]]
    tests: |
      TESTS = [output("The last three", expect="[9, 14, 10]")]
  - type: write
    prompt: "Make `top_two` hold the first two items of `scores`, using a slice."
    starter: |
      scores = [9, 7, 7, 5, 2]
    tests: |
      TESTS = [
          variable("top_two", variable="top_two", expect=[9, 7]),
          structure("Uses a slice", requires=["Slice"], message="Cut it with a slice: scores[...:...]."),
      ]
    solution: |
      scores = [9, 7, 7, 5, 2]
      top_two = scores[:2]
