id: string-slicing
title: Slicing strings
summary: |
  A string is a row of characters, each with a position counted from 0: `name[0]` is the first character, `name[-1]` the last. A slice takes part of it: `name[:3]` is the first three, `name[-4:]` the last four, and the slice stops just before its second number. Slicing text gives text. Any single position past the end is an IndexError; a slice past the end just stops at the end.
example: |
  password = "Harbour1987"
  print(password[0], password[-1])
  print(password[:7])
  print(password[-4:])
misconceptions: [string-index-from-one, slice-includes-stop, slice-counts-from-one]
related: [slicing, string-methods]
drill: true
cards:
  - type: predict
    prompt: What does this print?
    code: |
      boat = "Kittiwake"
      print(boat[:4])
    answer: "Kitt"
  - type: predict
    prompt: What does this print?
    code: |
      name = "Agnes Rook"
      print(name[-4:])
    answer: "Rook"
  - type: choice
    prompt: What does this print?
    code: |
      print("harbour"[1:3])
    options:
      - text: arb
        misconception: slice-includes-stop
        feedback: "The slice stops before position 3. Positions 1 and 2 only."
      - text: ha
        misconception: slice-counts-from-one
        feedback: "Positions start at 0, so position 1 is the `a`."
      - text: ar
        correct: true
  - type: choice
    prompt: What happens?
    code: |
      code = "SM42"
      print(code[4])
    verify: error
    options:
      - text: "It prints 2"
        misconception: string-index-from-one
        feedback: "Positions start at 0. The `2` is at position 3; there is nothing at position 4."
      - text: An IndexError
        correct: true
        error: IndexError
  - type: fix
    prompt: "This should print the initials, `A.R.`, for any first and last name. Fix it."
    code: |
      first = "Agnes"
      last = "Rook"
      print(first[1] + "." + last[1] + ".")
    tests: |
      TESTS = [
          output("Agnes Rook", expect="A.R."),
          output("Mira Penrose", set_vars={"first": "Mira", "last": "Penrose"}, expect="M.P."),
      ]
    solution: |
      first = "Agnes"
      last = "Rook"
      print(first[0] + "." + last[0] + ".")
  - type: fill
    prompt: "Fill the gap so it prints the first 10 characters, then `...`."
    code: |
      title = "Annual general meeting"
      print(title[___] + "...")
    blanks: [[":10", "0:10"]]
    tests: |
      TESTS = [output("Cut to ten", expect="Annual gen...")]
  - type: write
    prompt: "`code` holds a mooring code like `NQ-14`. Print its last two characters."
    starter: |
      code = "NQ-14"
    tests: |
      TESTS = [
          output("NQ-14", expect="14"),
          output("SH-07", set_vars={"code": "SH-07"}, expect="07",
                 hint="Slice from the end of whatever code holds."),
      ]
    solution: |
      code = "NQ-14"
      print(code[-2:])
