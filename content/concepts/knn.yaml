      past = np.array([[0.0, 1.0], [2.0, 2.0], [0.5, 0.5], [3.0, 1.0], [0.0, 0.2]])
      tonight = np.array([0.0, 0.0])
      distances = np.sqrt(((past - tonight) ** 2).sum(axis=___))
      nearest = np.___(distances)[:3]
      print(nearest)
    blanks: [["1"], ["argsort"]]
    tests: |
      TESTS = [output("Nearest first", expect="[4 2 0]")]
  - type: fix
    prompt: "This should forecast from the 3 nearest nights, but it gives back the 3 furthest. Fix it."
    code: |
      from collections import Counter

      import numpy as np

      past = np.array([[0.1], [0.2], [0.3], [2.0], [2.1], [2.2]])
      sky = np.array(["fog", "fog", "fog", "clear", "clear", "clear"])
      tonight = np.array([0.15])
      nearest = np.argsort(np.abs(past - tonight).sum(axis=1))[-3:]
      print(Counter(sky[nearest]).most_common(1)[0][0])
    tests: |
      TESTS = [output("Three foggy neighbours", expect="fog")]
    solution: |
      from collections import Counter

      import numpy as np

      past = np.array([[0.1], [0.2], [0.3], [2.0], [2.1], [2.2]])
      sky = np.array(["fog", "fog", "fog", "clear", "clear", "clear"])
      tonight = np.array([0.15])
      nearest = np.argsort(np.abs(past - tonight).sum(axis=1))[:3]
      print(Counter(sky[nearest]).most_common(1)[0][0])
  - type: write
    prompt: "Write `knn_mean(X, values, point, k)`: the mean of `values` for the k rows of `X` nearest to `point`, by straight-line distance."
    starter: |
      import numpy as np


      def knn_mean(X, values, point, k):
          return 0.0
    tests: |
      import numpy as np


      def means(ctx):
          m = ctx.module()
          X = np.array([[0.0, 0.0], [1.0, 0.0], [5.0, 5.0], [0.0, 2.0], [6.0, 5.0]])
          values = np.array([10.0, 20.0, 90.0, 30.0, 70.0])
          for point, k, want in [([0.1, 0.1], 2, 15.0), ([0.1, 0.1], 3, 20.0), ([5.5, 5.0], 2, 80.0)]:
              got = m.knn_mean(X, values, np.array(point), k)
              if got is None or abs(float(got) - want) > 1e-9:
                  raise CheckFailed(f"point {point}, k = {k}", expected=want, actual=got)


      TESTS = [custom("Three questions", means)]
    solution: |
      import numpy as np


      def knn_mean(X, values, point, k):
          distances = np.sqrt(((X - point) ** 2).sum(axis=1))
          return values[np.argsort(distances)[:k]].mean()
