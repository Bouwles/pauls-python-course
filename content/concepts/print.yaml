id: print
title: print() shows things
summary: |
  `print()` writes whatever is inside the brackets to the output, then starts a new line. Text goes in quotes. Several values separated by commas print in a row with a space between each. `print()` with nothing inside prints an empty line.
example: |
  print("The Clocktower")
  print("Trains", 2, "an hour")
  print()
  print("End")
misconceptions: [print-shows-code, print-same-line]
related: [strings, program-order]
drill: true
cards:
  - type: predict
    prompt: What does this print?
    code: |
      print("Trains", 2, "an hour")
    answer: "Trains 2 an hour"
  - type: predict
    prompt: "What does this print? Include any empty lines."
    code: |
      print("A")
      print()
      print("B")
    answer: "A\n\nB"
  - type: choice
    prompt: What does this print?
    code: |
      print("Hello")
      print("there")
    options:
      - text: "Hello\nthere"
        correct: true
      - text: Hello there
        misconception: print-same-line
        feedback: "Each print() finishes its own line."
      - text: "print(\"Hello\")\nprint(\"there\")"
        misconception: print-shows-code
        feedback: "print() shows the value inside the quotes, not the code."
  - type: fill
    prompt: Fill the gap so the program shows the text.
    code: |
      ___("Rain on the roof")
    blanks: [["print"]]
    tests: |
      TESTS = [output("Shows the text", expect="Rain on the roof")]
  - type: write
    prompt: "Print `Laps: 3` with one `print()` given two values: the text `Laps:` and the number 3."
    tests: |
      def two_values(tree, source):
          import ast
          calls = [n for n in ast.walk(tree) if isinstance(n, ast.Call) and getattr(n.func, "id", "") == "print"]
          if not any(len(c.args) == 2 for c in calls):
              return "Give print() two values, separated by a comma."
      TESTS = [output("Laps: 3", expect="Laps: 3"), structure("Two values", check=two_values)]
    solution: |
      print("Laps:", 3)
