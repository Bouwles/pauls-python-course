id: classes
title: Classes and objects
summary: |
  A class is a pattern for making objects: `class Bike:` describes what every bike keeps and can do, and `Bike(7, 4)` makes one. Each object made from a class keeps its own attributes. Name a class for one thing, in CapitalisedWords: `Bike`, not `bikes`.
example: |
  class Bike:
      def __init__(self, number, rate):
          self.number = number
          self.rate = rate

  red = Bike(7, 4)
  blue = Bike(12, 6)
  print(red.number, blue.number)
misconceptions: [attributes-shared-between-objects, class-is-the-thing]
related: [init, attributes, methods, self]
cards:
  - type: predict
    prompt: What does this print?
    code: |
      class Player:
          def __init__(self, name):
              self.name = name
              self.score = 0

      caitlin = Player("Caitlin")
      yahya = Player("Yahya")
      caitlin.score = caitlin.score + 3
      print(caitlin.score, yahya.score)
    answer: "3 0"
  - type: choice
    prompt: What does this print?
    code: |
      class Lamp:
          def __init__(self):
              self.on = False

      lamps = [Lamp(), Lamp(), Lamp()]
      lamps[0].on = True
      print([lamp.on for lamp in lamps])
    options:
      - text: "[True, False, False]"
        correct: true
      - text: "[True, True, True]"
        misconception: attributes-shared-between-objects
        feedback: "Each `Lamp()` makes a separate lamp with its own `on`. Switching one leaves the others dark."
  - type: fix
    prompt: "This should make a 2 kg parcel and print its weight. Fix the line that makes the parcel."
    code: |
      class Parcel:
          def __init__(self, weight):
              self.weight = weight

      box = Parcel
      print(box.weight)
    tests: |
      TESTS = [output("A 2 kg parcel", expect="2")]
    solution: |
      class Parcel:
          def __init__(self, weight):
              self.weight = weight

      box = Parcel(2)
      print(box.weight)
  - type: fill
    prompt: "Fill the gap so this defines a pattern for racing helmets."
    code: |
      ___ Helmet:
          def __init__(self, owner):
              self.owner = owner

      print(Helmet("Neil").owner)
    blanks: [["class"]]
    tests: |
      TESTS = [output("Neil's helmet", expect="Neil")]
  - type: write
    prompt: "Write a class `Crate` whose `__init__` takes `fruit` and keeps it, and starts `count` at 0."
    starter: |
      # class Crate
    tests: |
      def crates(ctx):
          m = ctx.module()
          a = m.Crate("apples")
          b = m.Crate("pears")
          a.count = 5
          if (a.fruit, a.count, b.fruit, b.count) != ("apples", 5, "pears", 0):
              raise CheckFailed("Each crate should keep its own fruit and count.",
                                expected=("apples", 5, "pears", 0), actual=(a.fruit, a.count, b.fruit, b.count))


      TESTS = [custom("Two crates", crates)]
    solution: |
      class Crate:
          def __init__(self, fruit):
              self.fruit = fruit
              self.count = 0
