id: lists
title: Lists
summary: |
  A list keeps several values in order, between square brackets: `guests = ["Riya", "Yahya", "Aaesha"]`. `[]` is an empty list. `len(guests)` says how many items it holds, which is one more than the last index. Printing a list shows the brackets, and quotes round any text.
example: |
  guests = ["Riya", "Yahya", "Aaesha"]
  print(len(guests))
  print(guests)
misconceptions: [len-is-last-index]
related: [indexing, append-pop, looping-lists]
drill: true
cards:
  - type: predict
    prompt: What does this print?
    code: |
      guests = ["Riya", "Yahya", "Aaesha"]
      print(len(guests))
    answer: "3"
  - type: predict
    prompt: What does this print?
    code: |
      tasks = []
      print(len(tasks), tasks)
    answer: "0 []"
  - type: choice
    prompt: What happens?
    code: |
      guests = ["Riya", "Yahya", "Aaesha", "Caitlin"]
      print(guests[len(guests)])
    verify: error
    options:
      - text: An IndexError
        correct: true
        error: IndexError
        feedback: "`len(guests)` is 4, but the indexes only go up to 3."
      - text: It prints Caitlin
        misconception: len-is-last-index
        feedback: "`len` counts the items: 4. The last index is one less, 3, because counting starts at 0."
  - type: fix
    prompt: "There are three guests, so this should print 3. Fix the list."
    code: |
      guests = ["Riya", "Yahya" "Aaesha"]
      print(len(guests))
    tests: |
      TESTS = [output("Three guests", expect="3")]
    solution: |
      guests = ["Riya", "Yahya", "Aaesha"]
      print(len(guests))
  - type: fill
    prompt: "Fill the gap so `tasks` starts as an empty list."
    code: |
      tasks = ___
      print(len(tasks))
    blanks: [["[]", "list()"]]
    tests: |
      TESTS = [output("Empty", expect="0")]
  - type: write
    prompt: "Make a list called `shopping` holding `milk`, `bread` and `eggs`, in that order. Print how many items it has."
    tests: |
      TESTS = [
          output("Three", expect="3"),
          variable("The list", variable="shopping", expect=["milk", "bread", "eggs"]),
      ]
    solution: |
      shopping = ["milk", "bread", "eggs"]
      print(len(shopping))
