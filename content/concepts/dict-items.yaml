id: dict-items
title: Looping over a dictionary
summary: |
  A `for` loop over a dictionary gives you its keys, in the order they went in. `.items()` gives key and value together: `for name, count in wins.items():`. `.values()` gives just the values. Don't add or remove keys while you're looping over the same dictionary.
example: |
  wins = {"Caitlin": 2, "Yahya": 1}
  for name in wins:
      print(name)
  for name, count in wins.items():
      print(f"{name}: {count}")
misconceptions: [dict-loop-gives-values, dict-loop-gives-pairs, dict-loop-sorted]
related: [dictionaries, nested-data]
drill: true
cards:
  - type: predict
    prompt: What does this print?
    code: |
      wins = {"Caitlin": 2, "Yahya": 1}
      for name, count in wins.items():
          print(name, count)
    answer: |-
      Caitlin 2
      Yahya 1
  - type: predict
    prompt: What does this print?
    code: |
      runs = {"Mon": 6, "Tue": 7}
      total = 0
      for km in runs.values():
          total = total + km
      print(total)
    answer: "13"
  - type: choice
    prompt: What does this print?
    code: |
      wins = {"Yahya": 1, "Caitlin": 2}
      for name in wins:
          print(name)
    options:
      - text: |-
          1
          2
        misconception: dict-loop-gives-values
        feedback: "A plain loop over a dictionary gives the keys."
      - text: |-
          Caitlin
          Yahya
        misconception: dict-loop-sorted
        feedback: "A dictionary keeps the order the keys went in. It doesn't sort them."
      - text: |-
          Yahya
          Caitlin
        correct: true
  - type: choice
    prompt: What does this print?
    code: |
      lockers = {"Riya": 4, "Neil": 7}
      for name, locker in lockers.items():
          if locker > 5:
              print(name)
    options:
      - text: "7"
        misconception: dict-loop-gives-values
        feedback: "The loop prints `name`, which is the key: the person, not their locker."
      - text: Neil
        correct: true
  - type: fix
    prompt: "This should print `Caitlin: 2` and `Yahya: 1`. Fix the loop."
    code: |
      wins = {"Caitlin": 2, "Yahya": 1}
      for name, count in wins:
          print(f"{name}: {count}")
    tests: |
      TESTS = [output("Both", expect="Caitlin: 2\nYahya: 1")]
    solution: |
      wins = {"Caitlin": 2, "Yahya": 1}
      for name, count in wins.items():
          print(f"{name}: {count}")
  - type: fill
    prompt: "Fill the gap so it prints each person with their locker."
    code: |
      lockers = {"Riya": 4, "Neil": 7}
      for name, locker in lockers.___():
          print(name, locker)
    blanks: [["items"]]
    tests: |
      TESTS = [output("Both lockers", expect="Riya 4\nNeil 7")]
  - type: write
    prompt: "Print every item in `stock` as `cables: 12`, one per line, using a loop."
    starter: |
      stock = {"cables": 12, "fuses": 3, "LEDs": 5}
    tests: |
      TESTS = [
          output("Three items", expect="cables: 12\nfuses: 3\nLEDs: 5"),
          structure("Uses a loop", requires=["For"]),
      ]
    solution: |
      stock = {"cables": 12, "fuses": 3, "LEDs": 5}
      for item, count in stock.items():
          print(f"{item}: {count}")
