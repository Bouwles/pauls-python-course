id: in-operator
title: in
summary: |
  `a in b` asks whether the text `a` appears anywhere inside `b`: `"time" in "overtime"` is `True`. It answers `True` or `False`, never where. Capitals count, so `"Time" in "overtime"` is `False`; to ignore case, compare lower-case copies. `not in` asks the opposite question. On a list, `in` asks about whole items: `"Ann" in ["Ann Lee"]` is `False`.
example: |
  password = "Clocktower1987"
  print("tower" in password)
  print("clocktower" in password)
  print("clocktower" in password.lower())
  print(" " not in password)
misconceptions: [in-gives-position, string-compare-ignores-case, in-checks-part-of-item]
related: [string-methods, boolean-operators, lists]
cards:
  - type: predict
    prompt: What does this print?
    code: |
      print("time" in "overtime")
    answer: "True"
  - type: predict
    prompt: What does this print?
    code: |
      print("Time" in "overtime")
      print("Time".lower() in "overtime")
    answer: "False\nTrue"
  - type: choice
    prompt: What does this print?
    code: |
      password = "Clocktower1987"
      print("clocktower" in password)
    options:
      - text: "False"
        correct: true
        feedback: "`in` looks for exactly those letters. The password has a capital C, and `C` isn't `c`."
      - text: "True"
        misconception: string-compare-ignores-case
        feedback: "To Python, `C` and `c` are different characters, so `\"clocktower\"` isn't in `\"Clocktower1987\"`."
      - text: "0"
        misconception: in-gives-position
        feedback: "`in` only answers yes or no. It never says where the text starts."
  - type: choice
    prompt: What does this print?
    code: |
      print("1987" in "Desk1987")
    options:
      - text: "True"
        correct: true
      - text: "4"
        misconception: in-gives-position
        feedback: "`in` answers `True` or `False`. The 1987 does start at position 4, but `in` doesn't say so."
  - type: fix
    prompt: "This should print `No spaces, please.` when the password has a space in it. It never does. Fix the test."
    code: |
      password = "Blue Moon 42"
      if password in " ":
          print("No spaces, please.")
      else:
          print("Fine.")
    tests: |
      TESTS = [
          output("A space in the middle", expect="No spaces, please."),
          output("No spaces", set_vars={"password": "BlueMoon-42"}, expect="Fine."),
      ]
    solution: |
      password = "Blue Moon 42"
      if " " in password:
          print("No spaces, please.")
      else:
          print("Fine.")
  - type: fill
    prompt: "Fill the gap so this spots an email address."
    code: |
      contact = "neil@example.com"
      if "@" ___ contact:
          print("Email")
    blanks: [["in"]]
    tests: |
      TESTS = [output("Email", expect="Email")]
  - type: write
    prompt: "Print `Contains your name` if `username` appears anywhere in `password`, ignoring capitals. Otherwise print `Fine`."
    starter: |
      username = "aaesha"
      password = "MyNameIsAaesha-99"
    tests: |
      TESTS = [
          output("Aaesha in capitals", expect="Contains your name"),
          output("No name", set_vars={"password": "Tea-Table-7"}, expect="Fine"),
          output("Name in the middle", set_vars={"username": "name"}, expect="Contains your name",
                 hint="Compare lower-case copies, and work from the variables."),
      ]
    solution: |
      username = "aaesha"
      password = "MyNameIsAaesha-99"
      if username.lower() in password.lower():
          print("Contains your name")
      else:
          print("Fine")
