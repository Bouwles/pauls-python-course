id: correlation-causation
title: Correlation, and what it doesn't say
summary: |
  The correlation r measures how closely two things rise and fall together along a straight line, from 1 through 0 to -1. Take each mean off, multiply the pairs and add them up, then divide by the square root of the two sums of squares; `np.corrcoef(x, y)[0, 1]` does the same. r is symmetric, has no units, and isn't a slope. It only sees straight lines, so a hump can give 0 when one thing decides the other completely. And a correlation never shows a cause on its own: two things can both follow a third, like the year or the season, which is how the price of coffee correlates with the warming.
example: |
  import numpy as np

  years = np.arange(1925, 2025)
  moss_age = years - 1890
  rng = np.random.default_rng(0)
  warmth = 11 + 0.01 * (years - 1925) + rng.normal(0, 0.4, size=100)
  print(round(np.corrcoef(years, warmth)[0, 1], 2), round(np.corrcoef(moss_age, warmth)[0, 1], 2))
misconceptions: [correlation-measures-any-link, correlation-means-cause, correlation-is-slope, correlation-order-matters]
related: [descriptive-statistics, permutation-tests, matplotlib]
cards:
  - type: predict
    prompt: "What does this print?"
    code: |
      import numpy as np

      x = np.array([1, 2, 3, 4, 5])
      y = np.array([2, 1, 4, 3, 5])
      print(round(np.corrcoef(x, y)[0, 1], 2), round(np.corrcoef(y, x)[0, 1], 2))
    answer: "0.8 0.8"
  - type: choice
    prompt: "Ice creams sold at a beach kiosk, and lifeguard call-outs, month by month. This prints `True`. What does it tell you?"
    verify: none
    code: |
      import numpy as np

      ice_creams = np.array([40, 55, 90, 160, 300, 520, 610, 590, 330, 140, 60, 45])
      call_outs = np.array([1, 1, 2, 3, 5, 8, 9, 9, 5, 2, 1, 1])
      print(np.corrcoef(ice_creams, call_outs)[0, 1] > 0.9)
    options:
      - text: "They rise and fall together, because summer brings both the visitors who buy ice creams and the ones who need rescuing"
        correct: true
        feedback: "Both follow the summer. Banning ice cream wouldn't save anyone: the season is the third thing behind both."
      - text: "Ice cream causes lifeguard call-outs"
        misconception: correlation-means-cause
        feedback: "The correlation is real, but nothing here shows one causes the other. Both rise in summer, when the beach fills with visitors."
  - type: choice
    prompt: "The same readings, with the temperatures in Fahrenheit instead. What does this print?"
    code: |
      import numpy as np

      sun = np.array([150, 210, 180, 240, 330])
      celsius = np.array([15.2, 16.4, 15.9, 17.3, 18.2])
      fahrenheit = celsius * 9 / 5 + 32
      print(round(np.corrcoef(sun, celsius)[0, 1], 3) == round(np.corrcoef(sun, fahrenheit)[0, 1], 3))
    options:
      - text: "True"
        correct: true
        feedback: "Stretching or shifting either set of numbers doesn't change r. It has no units: it measures how well the points fit a line, not how steep the line is."
      - text: "False"
        misconception: correlation-is-slope
        feedback: "In Fahrenheit the line is steeper, but r isn't a slope. It says how closely the points follow a straight line, and that hasn't changed."
  - type: choice
    prompt: "Months from midsummer, and the hours of daylight. What does this print?"
    code: |
      import numpy as np

      months = np.arange(-6, 7)
      daylight = 16.5 - 0.25 * months ** 2
      print(round(abs(np.corrcoef(months, daylight)[0, 1]), 2))
    options:
      - text: "0.0"
        correct: true
        feedback: "Daylight depends entirely on the month, but it rises and then falls. There's no straight-line pattern, so r is 0."
      - text: "1.0"
        misconception: correlation-measures-any-link
        feedback: "Correlation only measures straight-line patterns. The months before and after midsummer cancel out exactly."
  - type: fill
    prompt: "Fill the gap so `r` is the correlation between rain and sunshine."
    code: |
      import numpy as np

      rain = np.array([120, 40, 85, 30, 150])
      sun = np.array([60, 210, 130, 230, 45])
      r = np.___(rain, sun)[0, 1]
      print(r < -0.9)
    blanks: [["corrcoef"]]
    tests: |
      TESTS = [output("Wetter months are duller", expect="True")]
  - type: fix
    prompt: "Caitlin's correlation forgot to take the means off first. Fix it so a perfect line gives `1.0`."
    code: |
      import numpy as np


      def correlation(x, y):
          together = np.sum(x * y)
          return together / np.sqrt(np.sum(x ** 2) * np.sum(y ** 2))


      print(round(correlation(np.array([1.0, 2.0, 3.0]), np.array([10.0, 12.0, 14.0])), 6))
    tests: |
      TESTS = [output("A perfect line", expect="1.0")]
    solution: |
      import numpy as np


      def correlation(x, y):
          x = x - x.mean()
          y = y - y.mean()
          together = np.sum(x * y)
          return together / np.sqrt(np.sum(x ** 2) * np.sum(y ** 2))


      print(round(correlation(np.array([1.0, 2.0, 3.0]), np.array([10.0, 12.0, 14.0])), 6))
  - type: write
    prompt: "Write `strongest(table, column)`: the name of the other column in `table` whose correlation with `column` is furthest from 0. `table.corr()` gives every pair."
    starter: |
      import pandas as pd


      def strongest(table, column):
          pass
    tests: |
      def check(ctx):
          import pandas as pd

          table = pd.DataFrame({
              "temp": [15.2, 16.4, 15.9, 17.3, 18.2],
              "sun": [150, 210, 180, 240, 330],
              "rain": [80, 50, 70, 40, 10],
              "wind": [12, 30, 9, 22, 15],
          })
          got = ctx.module().strongest(table, "sun")
          if got != "rain":
              raise CheckFailed("Sunshine goes most closely with rain, the other way.", expected="rain", actual=got)


      TESTS = [custom("Sunshine's strongest partner", check)]
    solution: |
      import pandas as pd


      def strongest(table, column):
          others = table.corr()[column].drop(column)
          return others.abs().idxmax()
