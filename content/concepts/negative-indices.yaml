id: negative-indices
title: Counting from the end
summary: |
  Negative indexes count back from the end of a list. `parcels[-1]` is always the last item and `parcels[-2]` the one before it, however long the list is. There is no -0: index 0 is still the first item.
example: |
  parcels = ["Bea", "Tom", "Agnes", "Gwen"]
  print(parcels[-1])
  print(parcels[-2])
misconceptions: [negative-index-error, negative-index-starts-at-zero]
related: [indexing, lists]
drill: true
cards:
  - type: predict
    prompt: What does this print?
    code: |
      parcels = ["Bea", "Tom", "Agnes"]
      print(parcels[-1])
    answer: "Agnes"
  - type: predict
    prompt: What does this print?
    code: |
      boats = ["Kestrel", "Plover", "Mary Rose", "Tern"]
      print(boats[-3])
    answer: "Plover"
  - type: choice
    prompt: What does this print?
    code: |
      parcels = ["Bea", "Tom", "Agnes", "Gwen"]
      print(parcels[-2])
    options:
      - text: Agnes
        correct: true
        feedback: "-1 is Gwen, the last. -2 is the one before her."
      - text: Tom
        misconception: negative-index-starts-at-zero
        feedback: "The last item is -1, not -0. So -2 is second from the end: Agnes."
      - text: An error
        misconception: negative-index-error
        feedback: "Negative indexes are allowed. They count back from the end."
  - type: fix
    prompt: "This should print the last parcel. Fix it with a negative index."
    code: |
      parcels = ["Bea", "Tom", "Agnes"]
      print(parcels[len(parcels)])
    tests: |
      import ast as _ast

      def negative(tree, source):
          for node in _ast.walk(tree):
              if isinstance(node, _ast.Subscript) and isinstance(node.slice, _ast.UnaryOp) and isinstance(node.slice.op, _ast.USub):
                  return None
          return "Use a negative index, like parcels[-1]."

      TESTS = [
          output("Last parcel", expect="Agnes"),
          structure("Negative index", check=negative),
      ]
    solution: |
      parcels = ["Bea", "Tom", "Agnes"]
      print(parcels[-1])
  - type: fill
    prompt: "Fill the gap so this prints the second parcel from the end."
    code: |
      parcels = ["Bea", "Tom", "Agnes", "Gwen", "Moss"]
      print(parcels[___])
    blanks: [["-2"]]
    tests: |
      TESTS = [output("Gwen", expect="Gwen")]
  - type: write
    prompt: "Print the newest parcel, the last in the list, and then the one before it. Use negative indexes."
    starter: |
      parcels = ["Bea", "Tom", "Agnes", "Gwen", "Moss"]
    tests: |
      import ast as _ast

      def negative(tree, source):
          for node in _ast.walk(tree):
              if isinstance(node, _ast.Subscript) and isinstance(node.slice, _ast.UnaryOp) and isinstance(node.slice.op, _ast.USub):
                  return None
          return "Use negative indexes, like parcels[-1]."

      TESTS = [
          output("Newest two", expect="Moss\nGwen"),
          structure("Negative indexes", check=negative),
      ]
    solution: |
      parcels = ["Bea", "Tom", "Agnes", "Gwen", "Moss"]
      print(parcels[-1])
      print(parcels[-2])
