    tests: |
      import numpy as np


      def halfway(ctx):
          m = ctx.module()
          for values, want in [([3.0, 1.0, 2.0], [1.5, 2.5]), ([5.0, 5.0, 1.0, 9.0], [3.0, 7.0]), ([4.0, 4.0], [])]:
              got = np.asarray(m.thresholds(np.array(values)), dtype=float)
              if got.shape != (len(want),) or not np.allclose(got, want):
                  raise CheckFailed(f"values {values}", expected=want, actual=got.tolist())


      TESTS = [custom("Three sets of readings", halfway)]
    solution: |
      import numpy as np


      def thresholds(values):
          distinct = np.unique(values)
          return (distinct[:-1] + distinct[1:]) / 2
