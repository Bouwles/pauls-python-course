id: decision-trees
title: Decision trees
summary: |
  A decision tree forecasts with a chain of yes-or-no questions, each of the form "is this reading at most this threshold?", ending in a leaf that gives the answer. To grow one, measure how mixed a pile is, with Gini impurity (1 minus the sum of each label's share squared: 0 for a pure pile, 0.5 for half and half) or entropy. Try every reading, with thresholds halfway between neighbouring values, and keep the question whose two sides have the lowest Gini, each weighted by its size. Then grow each side the same way, by recursion, until a pile is pure, no question helps, or the tree reaches its maximum depth. With no limit, a tree learns its training data by heart, down to single odd nights; choose the depth on validation data.
example: |
  import numpy as np


  def gini(y):
      shares = np.bincount(y) / len(y)
      return 1 - np.sum(shares ** 2)


  spread = np.array([0.5, 1.2, 2.0, 3.1, 4.4, 5.0])
  dew = np.array([1, 1, 1, 0, 0, 1])
  yes = spread <= 2.55
  score = (yes.sum() * gini(dew[yes]) + (~yes).sum() * gini(dew[~yes])) / len(dew)
  print(round(gini(dew), 3), "before;", round(score, 3), "after asking spread <= 2.55?")
misconceptions: [gini-is-share, gini-is-minority-share, unweighted-split-score, deeper-tree-always-better, recursion-tracks-depth-itself, split-must-change-decision]
related: [overfitting, train-test-split, classification-metrics, nested-data]
cards:
  - type: predict
    prompt: What does this print?
    code: |
