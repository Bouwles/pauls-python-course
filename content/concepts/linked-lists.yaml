  - type: write
    prompt: "Write `count(head, part)`: how many crates on the round starting at `head` hold `part`. `head` may be `None`."
    starter: |
      class Crate:
          def __init__(self, part):
              self.part = part
              self.next = None


      def count(head, part):
          pass
    tests: |
      def counts(parts, part, expected):
          def check(ctx):
              module = ctx.module()
              head = None
              for name in reversed(parts):
                  crate = module.Crate(name)
                  crate.next = head
                  head = crate
              got = module.count(head, part)
              if got != expected:
                  raise CheckFailed(f"{parts} holds {part} {expected} times.", expected=expected, actual=got)
          return check


      TESTS = [
          custom("Two bells", counts(["bell", "anchor", "bell"], "bell", 2)),
          custom("No kettles", counts(["bell", "anchor"], "kettle", 0)),
          custom("An empty round", counts([], "bell", 0)),
      ]
    solution: |
      class Crate:
          def __init__(self, part):
              self.part = part
              self.next = None


      def count(head, part):
          found = 0
          crate = head
          while crate is not None:
              if crate.part == part:
                  found = found + 1
              crate = crate.next
          return found
