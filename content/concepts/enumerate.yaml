id: enumerate
title: enumerate()
summary: |
  `enumerate(items)` hands over `(number, item)` pairs as a loop goes round, so you never keep a counter by hand. It counts from 0 unless you say `start=1`, which is what people expect on a list they'll read. The number always comes first, whatever you call the variables.
example: |
  clients = ["Ferro", "Bea", "Tom"]
  for number, name in enumerate(clients, start=1):
      print(number, name)
misconceptions: [enumerate-starts-at-one, enumerate-order-swapped]
related: [zip, unpacking]
cards:
  - type: predict
    prompt: What does this print?
    code: |
      for number, name in enumerate(["Ferro", "Bea"]):
          print(number, name)
    answer: "0 Ferro\n1 Bea"
  - type: choice
    prompt: What does this print?
    code: |
      for name, number in enumerate(["Ferro", "Bea"], start=1):
          print(name)
    options:
      - text: "1\n2"
        correct: true
        feedback: "enumerate always hands over the number first. This loop called it `name`, so `name` holds the number."
      - text: "Ferro\nBea"
        misconception: enumerate-order-swapped
        feedback: "The variable names don't decide anything. The first one gets the number, whatever it's called."
  - type: fix
    prompt: "Mira numbers parcels from 1. Fix the loop so the first line is `1. Parcel for Bea`."
    code: |
      parcels = ["Bea", "Agnes", "Gwen"]
      for number, name in enumerate(parcels):
          print(f"{number}. Parcel for {name}")
    tests: |
      TESTS = [output("Numbered from 1", expect="1. Parcel for Bea\n2. Parcel for Agnes\n3. Parcel for Gwen")]
    solution: |
      parcels = ["Bea", "Agnes", "Gwen"]
      for number, name in enumerate(parcels, start=1):
          print(f"{number}. Parcel for {name}")
  - type: fill
    prompt: "Fill the gap so each line is numbered."
    code: |
      for ___, line in enumerate(["High water 06:42", "Low water 12:55"], start=1):
          print(f"{number}: {line}")
    blanks: [["number"]]
    tests: |
      TESTS = [output("Two numbered lines", expect="1: High water 06:42\n2: Low water 12:55")]
  - type: write
    prompt: "Rewrite the loop with `enumerate`, so there's no counter to keep by hand. It should print the same thing."
    starter: |
      boats = ["Gull", "Kittiwake", "Puffin"]
      count = 1
      for boat in boats:
          print(count, boat)
          count = count + 1
    tests: |
      TESTS = [
          output("Same output", expect="1 Gull\n2 Kittiwake\n3 Puffin"),
          structure("Uses enumerate", calls=["enumerate"]),
      ]
    solution: |
      boats = ["Gull", "Kittiwake", "Puffin"]
      for count, boat in enumerate(boats, start=1):
          print(count, boat)
