      def counts(build, expected, message):
          def check(ctx):
              module = ctx.module()
              got = module.leaves(build(module.Card))
              if got != expected:
                  raise CheckFailed(message, expected=expected, actual=got)
          return check


      TESTS = [
          custom("The top three levels", counts(lambda C: C(500, C(250, C(101), C(342)), C(750, None, C(977))), 3,
                                                        "101, 342 and 977 are the leaves.")),
          custom("One card", counts(lambda C: C(5), 1, "A single card is a leaf.")),
          custom("No tree", counts(lambda C: None, 0, "An empty tree has no leaves.")),
      ]
    solution: |
      class Card:
          def __init__(self, number, left=None, right=None):
              self.number = number
              self.left = left
              self.right = right


      def leaves(card):
          if card is None:
              return 0
          if card.left is None and card.right is None:
              return 1
          return leaves(card.left) + leaves(card.right)
