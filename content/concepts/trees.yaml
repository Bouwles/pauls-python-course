id: trees
title: Trees
summary: |
  A tree is a card with cards below it, each of which has cards below it, down to leaves with nothing below. The top card is the root. The height is how many levels there are from the root down to the deepest leaf: 0 for an empty tree, 1 for a single card. Every side of a tree is a smaller tree, so tree code is usually recursive: an empty side gives the base case, and a card's answer is built from the answers for its sides.
example: |
  class Card:
      def __init__(self, number, left=None, right=None):
          self.number = number
          self.left = left
          self.right = right


  def height(card):
      if card is None:
          return 0
      return 1 + max(height(card.left), height(card.right))


  root = Card(500, Card(250, Card(101), Card(342)), Card(750))
  print(height(root))
misconceptions: [height-counts-cards, empty-tree-height-one, leaves-are-at-the-top]
related: [binary-search-trees, traversals, recursion, base-cases]
