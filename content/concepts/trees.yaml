    answer: "4"
  - type: choice
    prompt: "A tree has seven cards: the root, two cards below it, and two below each of those. What is its height?"
    verify: none
    options:
      - text: "3"
        correct: true
        feedback: "Three levels: the root, its two, and their four. Height counts levels, not cards."
      - text: "7"
        misconception: height-counts-cards
        feedback: "Seven is how many cards there are. Height is how many levels you pass through going from the root to the deepest leaf: three."
  - type: choice
    prompt: "In Aaesha's tree, 500 is at the top with 250 and 750 below it, 101 and 342 below 250, and 977 below 750. Which cards are leaves?"
    verify: none
    options:
      - text: "101, 342 and 977"
        correct: true
        feedback: "A leaf has nothing below it. The root is at the top; the leaves are at the ends of the branches."
      - text: "500, because it's at the top"
        misconception: leaves-are-at-the-top
        feedback: "500 is the root. Family trees and catalogue trees are drawn upside down: the leaves are the cards with nothing below them."
