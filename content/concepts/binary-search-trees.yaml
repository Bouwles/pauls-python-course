id: binary-search-trees
title: Binary search trees
summary: |
  A binary search tree keeps everything down a card's left side smaller than it and everything down its right side bigger. Finding a number walks down from the root, going left or right at each card, so it looks at one card per level. Adding is the same walk; the new card goes in the empty place where the walk ends. Filed in a jumbled order the tree stays bushy, about log n levels; filed in order it becomes a stick n levels high, and searching it is no better than a list.
example: |
  class Card:
      def __init__(self, number):
          self.number = number
          self.left = None
          self.right = None


  def add(card, number):
      if card is None:
          return Card(number)
      if number < card.number:
          card.left = add(card.left, number)
      else:
          card.right = add(card.right, number)
      return card


  root = None
  for number in [500, 250, 750, 342]:
      root = add(root, number)
  print(root.left.right.number)
misconceptions: [bst-always-balanced, bst-checks-both-sides, bst-new-card-at-root]
related: [trees, traversals, binary-search, recursion]
