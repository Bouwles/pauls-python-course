  - type: choice
    prompt: "Yahya files 1,023 cards in number order, smallest first. How many looks does finding the biggest take?"
    verify: none
    options:
      - text: "1,023: every card is on the right of the one before, so the tree is a stick"
        correct: true
        feedback: "Each new card is bigger than everything filed, so it goes right, right, right. Filed in a jumbled order, the same cards would make about ten levels."
      - text: "About 10, since a search tree halves the cards with every look"
        misconception: bst-always-balanced
        feedback: "It only halves them if the tree is bushy. The order cards are filed in decides the shape, and number order gives a stick."
  - type: choice
    prompt: "To find 342 in this tree (500 at the root, 250 to its left, 342 to the right of 250), which cards does find look at?"
    verify: none
    options:
      - text: "500, 250, then 342"
        correct: true
        feedback: "Smaller than 500 rules out the whole right side; bigger than 250 rules out 250's left. One card per level."
      - text: "Every card down both sides of 500, until 342 turns up"
        misconception: bst-checks-both-sides
        feedback: "Nothing bigger than 500 is ever on its left, and nothing smaller on its right. The number itself says which side to go down."
