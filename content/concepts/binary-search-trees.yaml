    tests: |
      def tree(C):
          return C(500, C(250, C(101), C(342)), C(750, None, C(977)))


      def answers(number, expected):
          def check(ctx):
              module = ctx.module()
              got = module.contains(tree(module.Card), number)
              if got is not expected:
                  raise CheckFailed(f"contains(tree, {number}) should be {expected}.", expected=expected, actual=got)
          return check


      TESTS = [
          custom("A card that's there", answers(342, True)),
          custom("The root", answers(500, True)),
          custom("A card that isn't", answers(600, False)),
          function("An empty tree", call="contains", args=(None, 5), expect=False),
      ]
    solution: |
      class Card:
          def __init__(self, number, left=None, right=None):
              self.number = number
              self.left = left
              self.right = right


      def contains(card, number):
          while card is not None:
              if number == card.number:
                  return True
              card = card.left if number < card.number else card.right
          return False
