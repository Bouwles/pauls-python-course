  - type: fill
    prompt: "Fill the gap so the walk goes left for a smaller number."
    code: |
      class Card:
          def __init__(self, number, left=None, right=None):
              self.number = number
              self.left = left
              self.right = right


      def looks_for(root, number):
          looks = 0
          card = root
          while card is not None:
              looks = looks + 1
              if number == card.number:
                  return looks
              card = card.left if number ___ card.number else card.right
          return looks


      root = Card(500, Card(250, Card(101), Card(342)), Card(750))
      print(looks_for(root, 342), looks_for(root, 999))
    blanks: [["<"]]
    tests: |
      TESTS = [output("Three looks, then two", expect="3 2")]
