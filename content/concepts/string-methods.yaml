id: string-methods
title: String methods
summary: |
  Strings come with methods, called with a dot and brackets. `.upper()` and `.lower()` hand back a copy in capitals or lower case. Methods whose names start with `is` answer a question: `.isdigit()` is `True` only if every character is a digit, `.isalpha()` only if every character is a letter, and `.isupper()` only if every letter is a capital. `.title()` capitalises each word, `.center(40)` pads to 40 characters, `.count("o")` counts, and `.startswith("Archive")` checks the beginning, capitals and all. None of them change the string: each hands back a new one, or an answer.
example: |
  password = "Archive1987"
  print(password.lower())
  print(password.isalpha(), password.isdigit())
  print(password.isupper())
  print(password[-4:].isdigit())
  print(password.startswith("Archive"))
misconceptions: [string-compare-ignores-case, center-adds-width, method-without-brackets]
related: [immutability, strip-replace, in-operator]
drill: true
cards:
  - type: predict
    prompt: "One capital, plenty of small letters. What does this print?"
    code: |
      print("Harbour1987".isupper())
      print("HARBOUR1987".isupper())
    answer: "False\nTrue"
  - type: predict
    prompt: What does this print?
    code: |
      print("grace jago".title())
    answer: "Grace Jago"
  - type: predict
    prompt: What does this print?
    code: |
      print("Sea Salt".count("s"))
    answer: "0"
  - type: choice
    prompt: What does this print?
    code: |
      print("lost oar".startswith("Lost"))
    options:
      - text: "True"
        misconception: string-compare-ignores-case
        feedback: "To Python, `L` and `l` are different characters. `\"lost oar\"` starts with a small l."
      - text: "False"
        correct: true
  - type: choice
    prompt: What does this print?
    code: |
      print("ab".center(6, "-"))
    options:
      - text: "------ab------"
        misconception: center-adds-width
        feedback: "The number is the width of the finished string, not how much to add. Six characters in all."
      - text: "--ab--"
        correct: true
  - type: fix
    prompt: "This should print `GALE WARNING`. It prints something odd. Fix it."
    code: |
      notice = "gale warning"
      print(notice.upper)
    tests: |
      TESTS = [output("In capitals", expect="GALE WARNING")]
    solution: |
      notice = "gale warning"
      print(notice.upper())
  - type: fill
    prompt: "Fill the gap so it prints `Grace Jago`."
    code: |
      name = "grace jago"
      print(name.___())
    blanks: [["title"]]
    tests: |
      TESTS = [output("Grace Jago", expect="Grace Jago")]
  - type: write
    prompt: "`team` holds a team's name. Print it in capitals."
    starter: |
      team = "debuggers"
    tests: |
      TESTS = [
          output("Debuggers", expect="DEBUGGERS"),
          output("Back Row", set_vars={"team": "back row"}, expect="BACK ROW",
                 hint="Use the variable, so any team's name works."),
      ]
    solution: |
      team = "debuggers"
      print(team.upper())
