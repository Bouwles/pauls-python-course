id: convolutions
title: Convolutions and pooling
summary: |
  A convolution slides a small grid of weights, the kernel, over a picture: at each place it fits, multiply by the patch underneath and add. The same kernel is used everywhere, so it finds its pattern wherever it is, and the feature map is smaller than the picture, by the kernel's size less one each way. An edge kernel's weights add up to 0, so it answers only to change. Max pooling keeps the biggest number in each block, so a map shrinks and small shifts matter less. A convolutional network learns its kernels like any other weights.
example: |
  import numpy as np

  image = np.array([[0, 0, 1, 1]] * 3)
  kernel = np.array([[-1, 1]])                 # right minus left
  out = np.array([[np.sum(image[i:i + 1, j:j + 2] * kernel) for j in range(3)] for i in range(3)])
  print(out)                                   # 1 where dark turns light
misconceptions: [conv-output-same-size, kernel-flipped, pool-averages, pool-keeps-leftovers, kernel-fires-on-flat, kernel-different-each-place]
related: [neural-networks, classification-networks, pytorch]
cards:
  - type: predict
    prompt: "A 3 by 3 kernel slid over an 8 by 8 digit. What shape is the feature map?"
    code: |
      image_shape = (8, 8)
      kernel_shape = (3, 3)
      print((image_shape[0] - kernel_shape[0] + 1, image_shape[1] - kernel_shape[1] + 1))
    answer: "(6, 6)"
  - type: choice
    prompt: "What does this print?"
    code: |
      import numpy as np

      patch = np.array([[0.7, 0.7, 0.7],
                        [0.7, 0.7, 0.7],
                        [0.7, 0.7, 0.7]])
      kernel = np.array([[-1, 0, 1],
                         [-2, 0, 2],
                         [-1, 0, 1]])
      print(round(float(np.sum(patch * kernel)), 6))
    options:
      - text: "0.0"
        correct: true
        feedback: "Right. The kernel's weights add up to 0, so on a patch of one shade, however bright, the pluses and minuses cancel. It answers to change, not to brightness."
      - text: "5.6"
        misconception: kernel-fires-on-flat
        feedback: "Bright isn't the same as an edge. Every plus has a matching minus, so an even patch comes to 0."
  - type: predict
    prompt: "Max pooling in blocks of two. What does this print?"
    code: |
      import numpy as np

      feature = np.array([[1, 5, 2, 0],
                          [3, 2, 8, 1]])
      print([int(feature[:, j:j + 2].max()) for j in range(0, 4, 2)])
    answer: "[5, 8]"
  - type: fill
    prompt: "Fill the gaps so the window is the patch under the kernel, for a kernel `kh` high and `kw` wide."
    code: |
      import numpy as np

      image = np.arange(12).reshape(3, 4)
      kernel = np.array([[1, -1]])
      kh, kw = kernel.shape
      out = np.zeros((3 - kh + 1, 4 - kw + 1))
      for i in range(out.shape[0]):
          for j in range(out.shape[1]):
              out[i, j] = np.sum(image[i:i + ___, j:j + ___] * kernel)
      print(out)
    blanks: [["kh"], ["kw"]]
    tests: |
      TESTS = [output("Left minus right, everywhere", expect="-1 -1 -1 -1 -1 -1 -1 -1 -1", match="numbers")]
  - type: write
    prompt: "Write `max_pool(feature, size)`: the biggest number in each `size` by `size` block, dropping any rows and columns that don't make a whole block."
    starter: |
      import numpy as np


      def max_pool(feature, size):
          pass
    tests: |
      import numpy as np


      def pooled(ctx):
          m = ctx.module()
          feature = np.arange(30, dtype=float).reshape(5, 6) * np.array([1, -1, 1, -1, 1, -1])
          got = m.max_pool(feature, 2)
          want = np.array([[6.0, 8.0, 10.0], [18.0, 20.0, 22.0]])
          if got is None or np.shape(got) != (2, 3) or not np.allclose(got, want):
              raise CheckFailed("A 5 by 6 map in blocks of 2.", expected=want.tolist(), actual=None if got is None else np.asarray(got).tolist())


      TESTS = [custom("Blocks of 2, the last row dropped", pooled)]
    solution: |
      import numpy as np


      def max_pool(feature, size):
          rows, cols = feature.shape[0] // size, feature.shape[1] // size
          out = np.zeros((rows, cols))
          for i in range(rows):
              for j in range(cols):
                  out[i, j] = feature[i * size:(i + 1) * size, j * size:(j + 1) * size].max()
          return out
  - type: choice
    prompt: "Why can a convolutional network get by with so few weights for a picture?"
    verify: none
    options:
      - text: "Each kernel's handful of weights is reused at every place in the picture"
        correct: true
        feedback: "Right. A 3 by 3 kernel is nine weights, however big the picture. And because it's the same everywhere, an edge is found wherever it turns up."
      - text: "It has a different small kernel for every place in the picture"
        misconception: kernel-different-each-place
        feedback: "That would be as many weights as a plain layer, or more. One kernel slides over the whole picture."
      - text: "Its feature maps are the same size as the picture, so nothing is lost"
        misconception: conv-output-same-size
        feedback: "The maps are smaller, and pooling shrinks them again. The saving comes from reusing the same kernel everywhere."
