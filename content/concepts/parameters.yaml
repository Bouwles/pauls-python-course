id: parameters
title: Parameters
summary: |
  Names in the brackets of a `def` are parameters. Each call fills them, in order, with the values you pass: `round_cost(4, 3.5)` makes `pints` 4 and `price` 3.5. The names outside don't have to match the names inside; only the order matters. Pass the wrong number of values and you get a TypeError.
example: |
  def round_cost(pints, price):
      return pints * price

  print(round_cost(4, 3.5))
  print(round_cost(2, 4.0))
misconceptions: [parameter-name-must-match, arguments-fill-by-name, missing-argument-is-zero]
related: [functions, return-values]
drill: true
cards:
  - type: predict
    prompt: What does this print?
    code: |
      def label(name, berth):
          print(f"{name}: berth {berth}")

      label("Kittiwake", 4)
    answer: "Kittiwake: berth 4"
  - type: predict
    prompt: What does this print?
    code: |
      def label(name, berth):
          print(f"{name}: berth {berth}")

      berth = "Kittiwake"
      name = 7
      label(berth, name)
    answer: "Kittiwake: berth 7"
  - type: choice
    prompt: What does this print?
    code: |
      def greet(name):
          print("Evening, " + name)

      landlady = "Gwen"
      greet(landlady)
    options:
      - text: "A NameError, because nothing is called name outside"
        misconception: parameter-name-must-match
        error: NameError
        feedback: "The value of `landlady` goes into the parameter `name`. The names don't have to match."
      - text: "Evening, Gwen"
        correct: true
  - type: choice
    prompt: What happens?
    code: |
      def cost(count, price):
          return count * price

      print(cost(3))
    verify: error
    options:
      - text: It prints 0
        misconception: missing-argument-is-zero
        feedback: "A parameter with nothing passed in doesn't start at 0. Python refuses to run the call."
      - text: A TypeError
        correct: true
        error: TypeError
  - type: fix
    prompt: "Three adults and one child should cost 14. Fix the call."
    code: |
      def fare(adults, children):
          return adults * 4 + children * 2

      print(fare(1, 3))
    tests: |
      TESTS = [output("Three adults, one child", expect="14")]
    solution: |
      def fare(adults, children):
          return adults * 4 + children * 2

      print(fare(3, 1))
  - type: fill
    prompt: "Fill the gap so this prints `10`."
    code: |
      def total(price, ___):
          return price * count

      print(total(2, 5))
    blanks: [["count"]]
    tests: |
      TESTS = [output("Ten", expect="10")]
  - type: write
    prompt: "Write `berth_label(boat, berth)` that returns text like `Kittiwake, berth 4`."
    tests: |
      TESTS = [
          function("Kittiwake at 4", call="berth_label", args=("Kittiwake", 4), expect="Kittiwake, berth 4"),
          function("Sea Holly at 11", call="berth_label", args=("Sea Holly", 11), expect="Sea Holly, berth 11"),
      ]
    solution: |
      def berth_label(boat, berth):
          return f"{boat}, berth {berth}"
