id: parameters
title: Parameters
summary: |
  Names in the brackets of a `def` are parameters. Each call fills them, in order, with the values you pass: `round_cost(4, 3.5)` makes `coffees` 4 and `price` 3.5. The names outside don't have to match the names inside; only the order matters. Pass the wrong number of values and you get a TypeError.
example: |
  def round_cost(coffees, price):
      return coffees * price

  print(round_cost(4, 3.5))
  print(round_cost(2, 4.0))
misconceptions: [parameter-name-must-match, arguments-fill-by-name, missing-argument-is-zero]
related: [functions, return-values]
drill: true
cards:
  - type: predict
    prompt: What does this print?
    code: |
      def label(name, desk):
          print(f"{name}: desk {desk}")

      label("Riya", 4)
    answer: "Riya: desk 4"
  - type: predict
    prompt: What does this print?
    code: |
      def label(name, desk):
          print(f"{name}: desk {desk}")

      desk = "Riya"
      name = 7
      label(desk, name)
    answer: "Riya: desk 7"
  - type: choice
    prompt: What does this print?
    code: |
      def greet(name):
          print("Evening, " + name)

      classmate = "Caitlin"
      greet(classmate)
    options:
      - text: "A NameError, because nothing is called name outside"
        misconception: parameter-name-must-match
        error: NameError
        feedback: "The value of `classmate` goes into the parameter `name`. The names don't have to match."
      - text: "Evening, Caitlin"
        correct: true
  - type: choice
    prompt: What happens?
    code: |
      def cost(count, price):
          return count * price

      print(cost(3))
    verify: error
    options:
      - text: It prints 0
        misconception: missing-argument-is-zero
        feedback: "A parameter with nothing passed in doesn't start at 0. Python refuses to run the call."
      - text: A TypeError
        correct: true
        error: TypeError
  - type: fix
    prompt: "Three adults and one child should cost 14. Fix the call."
    code: |
      def fare(adults, children):
          return adults * 4 + children * 2

      print(fare(1, 3))
    tests: |
      TESTS = [output("Three adults, one child", expect="14")]
    solution: |
      def fare(adults, children):
          return adults * 4 + children * 2

      print(fare(3, 1))
  - type: fill
    prompt: "Fill the gap so this prints `10`."
    code: |
      def total(price, ___):
          return price * count

      print(total(2, 5))
    blanks: [["count"]]
    tests: |
      TESTS = [output("Ten", expect="10")]
  - type: write
    prompt: "Write `desk_label(name, desk)` that returns text like `Riya, desk 4`."
    tests: |
      TESTS = [
          function("Riya at 4", call="desk_label", args=("Riya", 4), expect="Riya, desk 4"),
          function("Neil at 11", call="desk_label", args=("Neil", 11), expect="Neil, desk 11"),
      ]
    solution: |
      def desk_label(name, desk):
          return f"{name}, desk {desk}"
