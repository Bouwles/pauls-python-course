id: mdps
title: Markov decision processes
summary: |
  A Markov decision process describes a problem one step at a time. **States**: where the agent is. **Actions**: what it can do there. **Transitions**: for each state and action, every next state that can follow and its chance, and the chances add up to 1. **Rewards**: what each step is worth. Markov means the next state depends only on this state and this action, not on the history. A **policy** says what to do in every state, as a dictionary from state to action, because the agent can't know in advance where chance will put it.
example: |
  OUTCOMES = {
      ("start", "steady"): [(1.0, "lap one", -1)],
      ("start", "full speed"): [(0.9, "lap one", -1), (0.1, "crash", -20)],
  }
  POLICY = {"start": "steady", "lap one": "steady"}
  for chance, after, reward in OUTCOMES[("start", POLICY["start"])]:
      print(chance, after, reward)
misconceptions: [policy-is-a-route, transitions-deterministic, outcomes-equally-likely, bump-ends-race]
related: [returns-discounting, bandits]
cards:
  - type: predict
    prompt: "What, on average, is the first step of Neil's racing game worth if the car goes full speed?"
    code: |
      OUTCOMES = {("start", "full speed"): [(0.9, "lap one", -1), (0.1, "crash", -20)]}
      average = sum(chance * reward for chance, _, reward in OUTCOMES[("start", "full speed")])
      print(round(average, 1))
    answer: "-2.9"
  - type: choice
    prompt: "Which of these is a policy for the racing grid?"
    verify: none
    options:
      - text: "`{(2, 0): \"up\", (1, 0): \"up\", (0, 0): \"right\", ...}`, one action for every tile"
        correct: true
        feedback: "A policy maps every state to an action, so wherever a slip puts the crab, there's an answer."
      - text: "`[\"up\", \"up\", \"right\", \"right\", \"right\"]`"
        misconception: policy-is-a-route
        feedback: "That's a route. It works only if every move goes as planned. One sideways slip and the third \"right\" is being followed from the wrong tile."
      - text: "`{\"up\": 0.8, \"left\": 0.1, \"right\": 0.1}`"
        feedback: "Those are the chances of where the crab goes when told up: part of the transitions, which the track decides. A policy is what you decide."
  - type: predict
    prompt: What does this print?
    code: |
      TRACK = ["...F", ".#.P", "S..."]


      def move(tile, step):
          row, col = tile[0] + step[0], tile[1] + step[1]
          if 0 <= row < 3 and 0 <= col < 4 and TRACK[row][col] != "#":
              return (row, col)
          return tile


      print(move((2, 1), (-1, 0)), move((0, 0), (0, -1)), move((0, 2), (0, 1)))
    answer: "(2, 1) (0, 0) (0, 3)"
  - type: choice
    prompt: "The crab is next to the finish and is told to step onto it. It goes where it's told eight times in ten and slips sideways otherwise. What is the chance the race ends this step?"
    verify: none
    options:
      - text: "0.8"
        correct: true
        feedback: "Only going straight on reaches the finish. The two sideways slips, 0.1 each, leave it on the track."
      - text: "1.0"
        misconception: transitions-deterministic
        feedback: "Being told isn't the same as going. Two times in ten it scuttles sideways instead."
  - type: fix
    prompt: "`drive` should pick each outcome with its own chance, but the car crashes far too often. Fix it."
    code: |
      import numpy as np

      OUTCOMES = {("start", "full speed"): [(0.9, "lap one", -1), (0.1, "crash", -20)]}


      def drive(state, action, rng):
          """One step: the next state and its reward."""
          possible = OUTCOMES[(state, action)]
          pick = rng.integers(len(possible))
          _, after, reward = possible[pick]
          return after, reward


      print(drive("start", "full speed", np.random.default_rng(0)))
    tests: |
      import numpy as np


      def one_in_ten(ctx):
          m = ctx.module()
          rng = np.random.default_rng(1)
          crashed = sum(m.drive("start", "full speed", rng)[0] == "crash" for _ in range(3000)) / 3000
          if abs(crashed - 0.1) > 0.03:
              raise CheckFailed(f"Full speed from the start crashes one time in ten. Here it crashed {crashed:.0%} of the time.")


      TESTS = [custom("A crash one time in ten", one_in_ten)]
    solution: |
      import numpy as np

      OUTCOMES = {("start", "full speed"): [(0.9, "lap one", -1), (0.1, "crash", -20)]}


      def drive(state, action, rng):
          """One step: the next state and its reward."""
          possible = OUTCOMES[(state, action)]
          chances = [chance for chance, _, _ in possible]
          pick = rng.choice(len(possible), p=chances)
          _, after, reward = possible[pick]
          return after, reward


      print(drive("start", "full speed", np.random.default_rng(0)))
