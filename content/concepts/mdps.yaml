          function("Next to the finish", call="average_reward", args=([(0.8, (0, 3), 10, True), (0.1, (0, 2), -1, False), (0.1, (1, 2), -1, False)],), expect=7.8, tol=1e-9),
          function("Nothing can go wrong", call="average_reward", args=([(1.0, (1, 0), -1, False)],), expect=-1.0, tol=1e-9),
          function("Under the pool", call="average_reward", args=([(0.8, (1, 3), -10, True), (0.1, (2, 2), -1, False), (0.1, (2, 3), -1, False)],), expect=-8.2, tol=1e-9),
      ]
    solution: |
      def average_reward(possible):
          return sum(chance * reward for chance, after, reward, over in possible)
