  - type: fix
    prompt: "Yahya's search sometimes answers a kilo or so too light. Fix it."
    code: |
      def trips_needed(crates, limit):
          trips, load = 1, 0
          for weight in crates:
              if load + weight > limit:
                  trips, load = trips + 1, 0
              load += weight
          return trips


      def smallest_limit(crates, days):
          low, high = max(crates), sum(crates)
          while low < high:
              middle = (low + high) // 2
              if trips_needed(crates, middle) <= days:
                  high = middle - 1
              else:
                  low = middle + 1
          return low
    tests: |
      TESTS = [
          function("Five crates in two trips", call="smallest_limit", args=([4, 8, 3, 5, 6], 2), expect=14,
                   hint="When the middle works, it might be the answer. Keep it in the range."),
          function("Six crates in three trips", call="smallest_limit", args=([3, 2, 2, 4, 1, 4], 3), expect=6),
          function("Five crates in three trips", call="smallest_limit", args=([4, 8, 3, 5, 6], 3), expect=11),
          function("One crate", call="smallest_limit", args=([9], 1), expect=9),
      ]
    solution: |
      def trips_needed(crates, limit):
          trips, load = 1, 0
          for weight in crates:
              if load + weight > limit:
                  trips, load = trips + 1, 0
              load += weight
          return trips


      def smallest_limit(crates, days):
          low, high = max(crates), sum(crates)
          while low < high:
              middle = (low + high) // 2
              if trips_needed(crates, middle) <= days:
                  high = middle
              else:
                  low = middle + 1
          return low
  - type: choice
    prompt: "A warehouse has 50,000 crates of up to 10,000 kg each. Roughly how many load limits does binary search on the answer check?"
    verify: none
    options:
      - text: "About 30"
        correct: true
        feedback: "The limit lies somewhere between the heaviest crate and all of them together: at most 500 million. Halving 500 million down to one takes about 29 looks, each one a pass over the crates."
      - text: "About 25,000"
        misconception: binary-search-takes-half
        feedback: "It doesn't check half of anything. Each check halves the range of limits that's left."
      - text: "About 50,000, one for each crate"
        misconception: answer-search-needs-a-list
        feedback: "The search isn't over the crates. It's over the possible limits, and each check goes through all the crates once."
  - type: choice
    prompt: "Crates of 4, 8 and 3 kg, and as many trips as you like. Can a load limit of 7 kg get them all across?"
    verify: none
    options:
      - text: "No: the 8 kg crate can't go on any trip"
        correct: true
        feedback: "Crates are never split, so the limit is at least the heaviest crate. That's why the search starts with low = max(crates)."
      - text: "Yes, with enough trips"
        misconception: limit-below-heaviest
        feedback: "More trips help with the total, not with one crate. An 8 kg crate needs a limit of at least 8 kg, however many trips there are."
  - type: write
    prompt: "Write `first_yes(works, low, high)`: the smallest whole number from `low` to `high` for which `works(number)` is `True`. `works` is no, then yes, and `works(high)` is always `True`. Check as few numbers as you can."
    starter: |
      def first_yes(works, low, high):
          pass
    tests: |
      def counted(threshold):
          calls = [0]

          def works(number):
              calls[0] += 1
              return number >= threshold
          return works, calls


      def a_million(ctx):
          module = ctx.module()
          works, calls = counted(765_432)
          got = module.first_yes(works, 1, 1_000_000)
          if got != 765_432:
              raise CheckFailed("The first yes is 765,432.", expected=765_432, actual=got)
          if calls[0] > 25:
              raise CheckFailed(f"It checked {calls[0]:,} numbers. Halving a million takes about 20.", expected="25 or fewer", actual=calls[0])


      TESTS = [
          function("Squares of at least 50", call="first_yes", args=(lambda n: n * n >= 50, 1, 50), expect=8),
          function("Yes from the start", call="first_yes", args=(lambda n: True, 3, 9), expect=3),
          function("Only the last one", call="first_yes", args=(lambda n: n >= 9, 3, 9), expect=9),
          function("A range of one", call="first_yes", args=(lambda n: True, 4, 4), expect=4),
          custom("A million numbers, about twenty checks", a_million),
      ]
    solution: |
      def first_yes(works, low, high):
          while low < high:
              middle = (low + high) // 2
              if works(middle):
                  high = middle
              else:
                  low = middle + 1
          return low
