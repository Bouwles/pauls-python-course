id: binary-search-answer
title: Binary search on the answer
summary: |
  Sometimes there's no list to search, only a question whose answer is a number: the lightest load limit, the slowest speed, the fewest trips. If you can check one guess quickly, and the check switches from no to yes only once as the guesses grow, binary search the guesses themselves. Check the middle of what's possible, and throw away the half the answer can't be in. When the middle works, keep it, since it may be the answer: `high = middle`. A hundred million possible limits take about 27 checks.
example: |
  def trips_needed(crates, limit):
      trips, load = 1, 0
      for weight in crates:
          if load + weight > limit:
              trips, load = trips + 1, 0
          load += weight
      return trips


  def smallest_limit(crates, days):
      low, high = max(crates), sum(crates)
      while low < high:
          middle = (low + high) // 2
          if trips_needed(crates, middle) <= days:
              high = middle
          else:
              low = middle + 1
      return low


  print(smallest_limit([4, 8, 3, 5, 6], 3))
misconceptions: [answer-search-needs-a-list, answer-search-needs-sorted-input, answer-search-stops-at-first-yes, answer-search-drops-the-yes, limit-below-heaviest]
related: [binary-search, big-o, bisect]
drill: true
cards:
  - type: predict
    prompt: "What does this print?"
    code: |
      def trips_needed(crates, limit):
          trips, load = 1, 0
          for weight in crates:
              if load + weight > limit:
                  trips, load = trips + 1, 0
              load += weight
          return trips


      crates = [4, 8, 3, 5, 6]
      print([trips_needed(crates, limit) for limit in [8, 10, 11, 14, 26]])
    answer: "[4, 4, 3, 2, 1]"
  - type: choice
    prompt: "Binary search on the answer needs one thing to be true of the check. What?"
    verify: none
    options:
      - text: "Once the check says yes for a guess, it says yes for every bigger guess too"
        correct: true
        feedback: "That's what lets one look throw away half. A limit of 20 kg works, so 21 works; 19 might not. The answers run no, no, no, yes, yes, yes, and you're hunting the first yes."
      - text: "The crates have to be sorted first"
        misconception: answer-search-needs-sorted-input
        feedback: "Nothing is sorted. What's in order is the guesses, 8, 9, 10 and up, and the check's answers to them: all the noes, then all the yeses."
      - text: "The possible answers have to be stored in a list"
        misconception: answer-search-needs-a-list
        feedback: "There's no list of limits anywhere. low and high are just numbers, and the middle is worked out, not looked up."
  - type: choice
    prompt: "What does this print?"
    code: |
      def works(limit):
          return limit >= 11


      low, high = 8, 26
      while low < high:
          middle = (low + high) // 2
          if works(middle):
              high = middle
          else:
              low = middle + 1
      print(low)
    options:
      - text: "11"
        correct: true
        feedback: "The middles are 17, 12, 10 and 11. Each yes pulls high down to the middle, each no pushes low past it, until they meet at the first limit that works."
      - text: "17"
        misconception: answer-search-stops-at-first-yes
        feedback: "17 is the first middle that works, but a yes only says the answer is 17 or lighter. The search carries on below it."
      - text: "10"
        misconception: answer-search-drops-the-yes
        feedback: "10 is the last limit that fails. low = middle + 1 steps past every no, so low ends on a yes."
  - type: fill
