id: policy-evaluation
title: Policy evaluation
summary: |
  The value of a state under a policy is the return you can expect from there, following that policy. Each value depends on its neighbours: for every outcome of the policy's action, the reward plus `gamma` times the value of where it leads (nothing, if the episode is over), weighted by its chance. Policy evaluation starts every value at 0 and sweeps through the states, setting each from its neighbours, until the biggest change in a sweep is below a small threshold. News of a reward travels back about one step per sweep.
example: |
  values = [0.0, 0.0, 0.0, 0.0]      # tile 3 is the finish
  for sweep in range(50):
      for tile in range(3):
          reward = 10 if tile + 1 == 3 else -1
          future = 0.0 if tile + 1 == 3 else 0.9 * values[tile + 1]
          values[tile] = reward + future
  print([round(value, 1) for value in values])
misconceptions: [news-travels-instantly, value-is-next-reward, terminal-has-value]
related: [value-iteration, policy-iteration, returns-discounting]
cards:
  - type: predict
    prompt: "Sir Reginald is next to the finish and told to step onto it. Every value is still 0. What is the tile worth after one backup?"
    code: |
      possible = [(0.8, "finish", 10, True), (0.1, "here", -1, False), (0.1, "below", -1, False)]
      values = {"here": 0.0, "below": 0.0}
      gamma = 0.9
      worth = sum(chance * (reward + (0 if over else gamma * values[after]))
                  for chance, after, reward, over in possible)
      print(round(worth, 2))
    answer: "7.8"
  - type: choice
    prompt: "Fifty sweeps along the practice corridor. What does this print?"
    code: |
      values = [0.0, 0.0, 0.0, 0.0]      # tile 3 is the finish
      for sweep in range(50):
          for tile in range(3):
              reward = 10 if tile + 1 == 3 else -1
              future = 0.0 if tile + 1 == 3 else 0.9 * values[tile + 1]
              values[tile] = reward + future
      print([round(value, 1) for value in values])
    options:
      - text: "[6.2, 8.0, 10.0, 0.0]"
        correct: true
        feedback: "The finish's own value stays 0: the race is over there. Its 10 belongs to the step onto it, which is why tile 2 is worth 10."
      - text: "[6.2, 8.0, 10.0, 10.0]"
        misconception: terminal-has-value
        feedback: "Nothing can be earned after the finish, so its value is 0. The +10 is the reward for stepping onto it, and it's counted in tile 2's value."
  - type: fix
    prompt: "This stops sweeping too soon, and tile 0 hasn't heard about the finish. Fix it."
    code: |
      def evaluate_corridor(gamma=0.9, theta=1e-6):
          values = [0.0, 0.0, 0.0, 0.0]      # tile 3 is the finish
          while True:
              for tile in range(3):
                  biggest_change = 0
                  reward = 10 if tile == 2 else -1
                  future = 0.0 if tile == 2 else gamma * values[tile + 1]
                  new = reward + future
                  biggest_change = max(biggest_change, abs(new - values[tile]))
                  values[tile] = new
              if biggest_change < theta:
                  return values


      print([round(value, 1) for value in evaluate_corridor()])
    tests: |
      TESTS = [
          function("The corridor, gamma 0.9", call="evaluate_corridor", expect=[6.2, 8.0, 10.0, 0.0], tol=1e-4),
          function("The corridor, gamma 0.5", call="evaluate_corridor", kwargs={"gamma": 0.5}, expect=[1.0, 4.0, 10.0, 0.0], tol=1e-4),
      ]
    solution: |
      def evaluate_corridor(gamma=0.9, theta=1e-6):
          values = [0.0, 0.0, 0.0, 0.0]      # tile 3 is the finish
          while True:
              biggest_change = 0
              for tile in range(3):
                  reward = 10 if tile == 2 else -1
                  future = 0.0 if tile == 2 else gamma * values[tile + 1]
                  new = reward + future
                  biggest_change = max(biggest_change, abs(new - values[tile]))
                  values[tile] = new
              if biggest_change < theta:
                  return values


      print([round(value, 1) for value in evaluate_corridor()])
  - type: fill
    prompt: "Fill the gap: each outcome is worth its reward plus gamma times the value of the tile it leads to."
    code: |
      values = {(0, 2): 9.08, (1, 2): 5.09}
      possible = [(0.8, (0, 3), 10, True), (0.1, (0, 2), -1, False), (0.1, (1, 2), -1, False)]
      gamma = 0.9
      worth = sum(chance * (reward + (0 if over else gamma * values[___]))
                  for chance, after, reward, over in possible)
      print(round(worth, 2))
    blanks: [["after"]]
    tests: |
      TESTS = [output("Next to the finish, at the best values", expect="9.08")]
  - type: write
    prompt: "Write `backup(values, possible, gamma)`: the worth of an action, given a list of its `(chance, next tile, reward, over)` outcomes and a dictionary of values."
    starter: |
      def backup(values, possible, gamma):
          pass
    tests: |
      TESTS = [
          function("Every value still 0", call="backup",
                   args=({"a": 0.0, "b": 0.0}, [(0.8, "finish", 10, True), (0.1, "a", -1, False), (0.1, "b", -1, False)], 0.9),
                   expect=7.8, tol=1e-9),
          function("Looking past the next step", call="backup",
                   args=({"a": 5.0, "b": 2.0}, [(0.5, "a", -1, False), (0.5, "b", -1, False)], 0.9),
                   expect=2.15, tol=1e-9),
          function("Nothing after the end", call="backup",
                   args=({"pool": 99.0}, [(1.0, "pool", -10, True)], 0.9),
                   expect=-10.0, tol=1e-9),
      ]
    solution: |
      def backup(values, possible, gamma):
          total = 0
          for chance, after, reward, over in possible:
              future = 0 if over else gamma * values[after]
              total += chance * (reward + future)
          return total
  - type: predict
    prompt: "Two ways to sweep the corridor: in place, or each sweep from a copy of the last. What does this print?"
    code: |
      def sweep(old, new):
          for tile in range(3):
              new[tile] = (10 if tile == 2 else -1) + (0 if tile == 2 else 0.9 * old[tile + 1])


      in_place = [0.0] * 4
      from_copy = [0.0] * 4
      for _ in range(50):
          sweep(in_place, in_place)
          from_copy_old = from_copy.copy()
          sweep(from_copy_old, from_copy)
      print([round(v, 3) for v in in_place] == [round(v, 3) for v in from_copy])
    answer: "True"
