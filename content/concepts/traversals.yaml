    tests: |
      def gives(build, expected):
          def check(ctx):
              module = ctx.module()
              got = module.post_order(build(module.Card))
              if got != expected:
                  raise CheckFailed("Left side, right side, then the card.", expected=expected, actual=got)
          return check


      TESTS = [
          custom("The top cards", gives(lambda C: C(500, C(250, C(101), C(342)), C(750, None, C(977))),
                                                [101, 342, 250, 977, 750, 500])),
          custom("One card", gives(lambda C: C(7), [7])),
          custom("No tree", gives(lambda C: None, [])),
      ]
    solution: |
      class Card:
          def __init__(self, number, left=None, right=None):
              self.number = number
              self.left = left
              self.right = right


      def post_order(card):
          if card is None:
              return []
          return post_order(card.left) + post_order(card.right) + [card.number]
