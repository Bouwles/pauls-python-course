id: list-methods
title: List methods change the list
summary: |
  `.remove(x)` takes out the first `x`, and crashes with a ValueError if there isn't one. `.insert(i, x)` puts `x` at position `i` and moves the rest along. `.count(x)` says how many there are, and `.index(x)` where the first one is. The methods that change a list hand back `None`.
example: |
  shopping = ["flour", "eggs", "flour"]
  shopping.remove("flour")
  shopping.insert(0, "yeast")
  print(shopping)
  print(shopping.count("flour"), shopping.index("eggs"))
misconceptions: [remove-deletes-every-match, remove-takes-last-match, remove-takes-index, remove-missing-is-silent, insert-replaces]
related: [slicing, sorted-vs-sort]
drill: true
cards:
  - type: predict
    prompt: What does this print?
    code: |
      snacks = ["crisps", "apple", "crisps", "pear"]
      snacks.remove("crisps")
      print(snacks)
    answer: "['apple', 'crisps', 'pear']"
  - type: predict
    prompt: What does this print?
    code: |
      queue = ["Aaesha", "Yahya"]
      queue.insert(1, "Neil")
      print(queue)
    answer: "['Aaesha', 'Neil', 'Yahya']"
  - type: choice
    prompt: What happens?
    code: |
      shopping = ["flour", "eggs"]
      shopping.remove("salt")
      print(shopping)
    verify: error
    options:
      - text: "It prints ['flour', 'eggs']"
        misconception: remove-missing-is-silent
        feedback: "`.remove()` doesn't shrug and carry on. If the item isn't there, it stops the program."
      - text: A ValueError
        correct: true
        error: ValueError
      - text: "It prints ['eggs']"
        misconception: remove-takes-index
        feedback: "`.remove()` looks for the value you give it. It never takes the first item instead."
  - type: choice
    prompt: What does this print?
    code: |
      floors = ["Workshop", "Studio", "Makerspace"]
      floors.insert(1, "Stairs")
      print(floors)
    options:
      - text: "['Workshop', 'Stairs', 'Studio', 'Makerspace']"
        correct: true
      - text: "['Workshop', 'Stairs', 'Makerspace']"
        misconception: insert-replaces
        feedback: "`.insert()` adds; it doesn't overwrite. Everything from position 1 onwards moves along one."
  - type: fix
    prompt: "Paul's spare bulbs. The broken one should come out, wherever it is. Fix line 2."
    code: |
      bulbs = ["good", "good", "broken", "good"]
      bulbs.pop("broken")
      print(bulbs)
    tests: |
      TESTS = [output("Three good bulbs", expect="['good', 'good', 'good']")]
    solution: |
      bulbs = ["good", "good", "broken", "good"]
      bulbs.remove("broken")
      print(bulbs)
  - type: fill
    prompt: "Fill the gap so Paul goes to the front of the queue."
    code: |
      queue = ["Riya", "Neil"]
      queue.___(0, "Paul")
      print(queue)
    blanks: [["insert"]]
    tests: |
      TESTS = [output("Paul first", expect="['Paul', 'Riya', 'Neil']")]
  - type: write
    prompt: "`votes` is the class dinner vote. Print how many `\"pizza\"` votes are in it, using a list method."
    starter: |
      votes = ["pizza", "curry", "pizza", "sushi", "pizza"]
    tests: |
      TESTS = [
          output("Three for pizza", expect="3"),
          structure("Uses .count()", calls=["count"], message="Let the list count them: votes.count(...)."),
      ]
    solution: |
      votes = ["pizza", "curry", "pizza", "sushi", "pizza"]
      print(votes.count("pizza"))
