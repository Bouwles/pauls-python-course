id: queues
title: Queues
summary: |
  A queue is used from both ends: things join at the back and leave from the front, so the first in is the first out, like people at the coffee machine. A list can do it with `append` and `pop(0)`, but `pop(0)` shuffles everything behind it up a place, so serving each one is O(n). Use `collections.deque`, where joining and leaving at either end are O(1).
example: |
  from collections import deque

  counter = deque()
  for order in ["latte", "tea", "hot chocolate"]:
      counter.append(order)
  while counter:
      print("Serving", counter.popleft())
misconceptions: [queue-serves-newest, pop-front-is-free]
related: [deque, stacks, big-o]
cards:
  - type: predict
    prompt: What does this print?
    code: |
      from collections import deque

      counter = deque(["latte"])
      counter.append("tea")
      counter.append("flat white")
      print(counter.popleft())
      counter.append("mocha")
      print(counter.popleft(), len(counter))
    answer: |-
      latte
      tea 2
  - type: choice
    prompt: "Ten thousand orders wait in a plain list. Each is served with `queue.pop(0)`. How does the work grow with the length of the queue?"
    verify: none
    options:
      - text: "O(n²) in all: each pop(0) shuffles every order behind it up one place"
        correct: true
        feedback: "Every `pop(0)` moves the rest of the list along, which is O(n), and it happens once per order. A deque's `popleft` doesn't move anything."
      - text: "O(n) in all: each pop(0) is as quick as pop()"
        misconception: pop-front-is-free
        feedback: "`pop()` takes from the end and moves nothing. `pop(0)` takes from the front, and every item behind it has to move up a place."
  - type: choice
    prompt: What does this print?
    code: |
      from collections import deque

      counter = deque()
      counter.append("first to arrive")
      counter.append("second")
      counter.append("just ordered")
      print(counter.popleft())
    options:
      - text: first to arrive
        correct: true
        feedback: "Orders join on the right and leave from the left, so the one that's waited longest goes first."
      - text: just ordered
        misconception: queue-serves-newest
        feedback: "That's how a stack works. A queue serves from the front, where the earliest arrival is."
  - type: fix
    prompt: "The counter should serve orders in the order they arrived: `latte`, `tea`, `mocha`. It serves the newest first. Fix it."
    code: |
      from collections import deque

      counter = deque(["latte", "tea", "mocha"])
      while counter:
          print(counter.pop())
    tests: |
      TESTS = [output("In the order they came", expect="latte\ntea\nmocha",
                      hint="pop() takes from the right, the back of the queue. The front is on the left.")]
    solution: |
      from collections import deque

      counter = deque(["latte", "tea", "mocha"])
      while counter:
          print(counter.popleft())
  - type: fill
    prompt: "Fill the gap so the order at the front leaves the queue."
    code: |
      from collections import deque

      counter = deque(["tea", "mocha"])
      counter.append("latte")
      served = counter.___()
      print(served, list(counter))
    blanks: [["popleft"]]
    tests: |
      TESTS = [output("The tea first", expect="tea ['mocha', 'latte']")]
  - type: write
    prompt: "Write `serve_order(events)`. Each event is either an order's name, arriving, or `\"serve\"`, which serves whoever is at the front (if anyone). Return the names in the order they were served."
    starter: |
      def serve_order(events):
          pass
    tests: |
      TESTS = [
          function("A morning", call="serve_order", args=(["mocha", "tea", "serve", "juice", "serve", "serve"],), expect=["mocha", "tea", "juice"]),
          function("Serve before anyone comes", call="serve_order", args=(["serve", "mocha", "serve"],), expect=["mocha"]),
          function("Nobody served", call="serve_order", args=(["mocha", "tea"],), expect=[]),
          structure("Uses a deque", calls=["deque"], message="Keep the queue in a collections.deque."),
      ]
    solution: |
      from collections import deque


      def serve_order(events):
          counter = deque()
          served = []
          for event in events:
              if event == "serve":
                  if counter:
                      served.append(counter.popleft())
              else:
                  counter.append(event)
          return served
