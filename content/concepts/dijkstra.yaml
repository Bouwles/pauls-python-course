  - type: fix
    prompt: "This gives a place its minutes the first time it's reached and never changes them. The ferry should be 5 minutes from the pub, by the harbour office. Fix it."
    code: |
      import heapq

      ROADS = {"pub": {"ferry": 9, "harbour-office": 2}, "harbour-office": {"ferry": 3}, "ferry": {}}


      def quickest_times(roads, start):
          best = {start: 0}
          waiting = [(0, start)]
          while waiting:
              minutes, place = heapq.heappop(waiting)
              for neighbour, road in roads[place].items():
                  if neighbour not in best:
                      best[neighbour] = minutes + road
                      heapq.heappush(waiting, (best[neighbour], neighbour))
          return best


      print(quickest_times(ROADS, "pub"))
    tests: |
      TESTS = [
          output("By the harbour office", expect="{'pub': 0, 'ferry': 5, 'harbour-office': 2}",
                 hint="When a quicker way turns up, the minutes should go down and the place go back on the heap."),
          function("Round a triangle", call="quickest_times",
                   args=({"a": {"b": 10, "c": 1}, "c": {"b": 1}, "b": {}}, "a"), expect={"a": 0, "b": 2, "c": 1}),
      ]
    solution: |
      import heapq

      ROADS = {"pub": {"ferry": 9, "harbour-office": 2}, "harbour-office": {"ferry": 3}, "ferry": {}}


      def quickest_times(roads, start):
          best = {start: 0}
          settled = set()
          waiting = [(0, start)]
          while waiting:
              minutes, place = heapq.heappop(waiting)
              if place in settled:
                  continue
              settled.add(place)
              for neighbour, road in roads[place].items():
                  if neighbour not in best or minutes + road < best[neighbour]:
                      best[neighbour] = minutes + road
                      heapq.heappush(waiting, (best[neighbour], neighbour))
          return best


      print(quickest_times(ROADS, "pub"))
