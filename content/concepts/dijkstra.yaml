          pass
    tests: |
      TESTS = [
          function("The long way round", call="quickest_times",
                   args=({"gate": {"shed": 1, "boathouse": 10}, "shed": {"yard": 1}, "yard": {"boathouse": 1}}, "gate"),
                   expect={"gate": 0, "shed": 1, "boathouse": 3, "yard": 2}),
          function("Nowhere to go", call="quickest_times", args=({}, "lighthouse"), expect={"lighthouse": 0}),
          function("One way", call="quickest_times", args=({"quay": {"chapel": 4}, "chapel": {}}, "chapel"), expect={"chapel": 0}),
      ]
    solution: |
      import heapq


      def quickest_times(roads, start):
          best = {start: 0}
          settled = set()
          waiting = [(0, start)]
          while waiting:
              minutes, place = heapq.heappop(waiting)
              if place in settled:
                  continue
              settled.add(place)
              for neighbour, road in roads.get(place, {}).items():
                  if neighbour not in best or minutes + road < best[neighbour]:
                      best[neighbour] = minutes + road
                      heapq.heappush(waiting, (best[neighbour], neighbour))
          return best
