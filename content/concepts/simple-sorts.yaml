  - type: write
    prompt: "Write `insertion_sort(weights)`, which sorts the list it's given in place, lightest first. No `sorted()` or `.sort()`."
    starter: |
      def insertion_sort(weights):
          pass
    tests: |
      def sorts(weights):
          def check(ctx):
              pile = list(weights)
              ctx.module().insertion_sort(pile)
              if pile != sorted(weights):
                  raise CheckFailed("The pile should be in order, lightest first.", expected=sorted(weights), actual=pile)
          return check


      TESTS = [
          custom("Five weights", sorts([7, 3, 9, 3, 1])),
          custom("Back to front", sorts([5, 4, 3, 2, 1])),
          custom("Empty", sorts([])),
          structure("By hand", forbids_calls=["sorted", "sort"]),
      ]
    solution: |
      def insertion_sort(weights):
          for position in range(1, len(weights)):
              current = weights[position]
              slot = position
              while slot > 0 and weights[slot - 1] > current:
                  weights[slot] = weights[slot - 1]
                  slot = slot - 1
              weights[slot] = current
