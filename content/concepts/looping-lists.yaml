id: looping-lists
title: Looping over a list
summary: |
  `for guest in guests:` hands you each item in turn, from the start to the end. When you need the index as well, loop over `range(len(guests))` and use `guests[i]`. A loop over an empty list runs zero times. Changing the loop variable doesn't change the list.
example: |
  guests = ["Riya", "Yahya", "Aaesha"]
  for guest in guests:
      print("Place card for", guest)
  for i in range(len(guests)):
      print(i, guests[i])
misconceptions: [loop-gives-index, loop-var-changes-list]
related: [lists, for-loops, indexing]
drill: true
cards:
  - type: predict
    prompt: What does this print?
    code: |
      for name in ["Riya", "Yahya", "Aaesha"]:
          print("Place card for", name)
    answer: "Place card for Riya\nPlace card for Yahya\nPlace card for Aaesha"
  - type: choice
    prompt: What does this print?
    code: |
      guests = ["Riya", "Yahya"]
      for p in guests:
          print(p)
    options:
      - text: |-
          Riya
          Yahya
        correct: true
      - text: |-
          0
          1
        misconception: loop-gives-index
        feedback: "Looping over the list itself gives the items. For the indexes, loop over `range(len(guests))`."
  - type: choice
    prompt: What does this print?
    code: |
      prices = [2, 3, 4]
      for price in prices:
          price = price * 2
      print(prices)
    options:
      - text: "[2, 3, 4]"
        correct: true
        feedback: "`price` is a label on each item in turn. Moving the label to a new number leaves the list alone."
      - text: "[4, 6, 8]"
        misconception: loop-var-changes-list
        feedback: "Changing the loop variable doesn't reach back into the list. To change the list, assign to `prices[i]`."
  - type: fix
    prompt: "Each line should show the seat and the name in it: `Seat 0: Riya` and so on. Fix it."
    code: |
      guests = ["Riya", "Yahya", "Aaesha"]
      for i in range(len(guests)):
          print(f"Seat {i}: {i}")
    tests: |
      TESTS = [output("Three seats", expect="Seat 0: Riya\nSeat 1: Yahya\nSeat 2: Aaesha")]
    solution: |
      guests = ["Riya", "Yahya", "Aaesha"]
      for i in range(len(guests)):
          print(f"Seat {i}: {guests[i]}")
  - type: fill
    prompt: "Fill the gap so this adds up the weights."
    code: |
      total = 0
      for weight in [2, 5, 3]:
          total = total + ___
      print(total)
    blanks: [["weight"]]
    tests: |
      TESTS = [output("Ten", expect="10")]
  - type: write
    prompt: "Parcels over 2 kg go on the heavy shelf. Count how many of `weights` are over 2 and print the count."
    starter: |
      weights = [1.5, 3.2, 0.8, 2.5, 4.0, 2.0]
    tests: |
      TESTS = [
          output("Three heavy", expect="3"),
          structure("Uses a loop", requires=["For"], message="Go through the list with a loop and count."),
      ]
    solution: |
      weights = [1.5, 3.2, 0.8, 2.5, 4.0, 2.0]
      heavy = 0
      for weight in weights:
          if weight > 2:
              heavy = heavy + 1
      print(heavy)
