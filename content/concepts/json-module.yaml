id: json-module
title: JSON and the json module
summary: |
  JSON is text that looks like Python's dictionaries and lists, and nearly every web API speaks it. `json.dumps(value)` turns a value into JSON text and `json.loads(text)` turns it back; `json.dump(value, file)` and `json.load(file)` do the same with an open file. The round trip isn't perfect: tuples come back as lists, dictionary keys always come back as text, and `True` and `None` are written `true` and `null`.
example: |
  import json

  booking = {"room": "Studio", "desk": 2, "paid": True, "notes": None}
  text = json.dumps(booking)
  print(text)
  print(json.loads(text) == booking)
misconceptions: [json-keeps-tuples, json-keeps-int-keys, write-takes-any-object]
related: [http-basics, dictionaries, files, with-statement]
cards:
  - type: predict
    prompt: What does this print?
    code: |
      import json

      print(json.dumps({"room": "Studio", "paid": True, "notes": None}))
    answer: '{"room": "Studio", "paid": true, "notes": null}'
  - type: choice
    prompt: What does this print?
    code: |
      import json

      taken = {"desks": (2, 3)}
      print(json.loads(json.dumps(taken))["desks"])
    options:
      - text: "[2, 3]"
        correct: true
        feedback: "JSON has lists but no tuples, so a tuple goes in as a list and comes back as one."
      - text: "(2, 3)"
        misconception: json-keeps-tuples
        feedback: "JSON only knows lists. The tuple is written as `[2, 3]`, and that's what comes back."
  - type: choice
    prompt: What does this print?
    code: |
      import json

      names = {1: "Desk A", 2: "Desk B"}
      again = json.loads(json.dumps(names))
      print(again.get(1))
    options:
      - text: None
        correct: true
        feedback: "JSON keys are always text, so 1 went in and `\"1\"` came back. `again.get(\"1\")` would find Desk A."
      - text: Desk A
        misconception: json-keeps-int-keys
        feedback: "In JSON every key is text. After the round trip the key is `\"1\"`, and `get(1)` finds nothing."
  - type: fix
    prompt: "Caitlin's room bookings should be saved as JSON, then read back. Fix the saving so this prints `Studio`."
    code: |
      import json

      bookings = [{"room": "Studio", "desk": 2}]
      with open("bookings.json", "w") as data_file:
          data_file.write(bookings)

      with open("bookings.json") as data_file:
          print(json.load(data_file)[0]["room"])
    tests: |
      TESTS = [output("Saved and read back", expect="Studio")]
    solution: |
      import json

      bookings = [{"room": "Studio", "desk": 2}]
      with open("bookings.json", "w") as data_file:
          json.dump(bookings, data_file)

      with open("bookings.json") as data_file:
          print(json.load(data_file)[0]["room"])
  - type: fill
    prompt: "The text came from a request. Fill the gap to turn it into a dictionary."
    code: |
      import json

      text = '{"room": "Archive", "hours": 7.5}'
      booking = json.___(text)
      print(booking["hours"] * 2)
    blanks: [["loads"]]
    tests: |
      TESTS = [output("Twice the hours", expect="15.0")]
  - type: write
    prompt: "Write `save(bookings, path)`, which writes the list to a JSON file, and `load(path)`, which reads it back, or gives `[]` if the file isn't there yet."
    starter: |
      import json
      from pathlib import Path


      def save(bookings, path):
          pass


      def load(path):
          pass
    tests: |
      def round_trip(ctx):
          mod = ctx.module()
          bookings = [{"room": "Studio", "desk": 2}, {"room": "Archive", "desk": 1}]
          mod.save(bookings, "saved.json")
          back = mod.load("saved.json")
          if back != bookings:
              raise CheckFailed("load should give back exactly what save was given.", expected=str(bookings), actual=str(back))


      def first_run(ctx):
          mod = ctx.module()
          if mod.load("never-saved.json") != []:
              raise CheckFailed("With no file yet, load gives an empty list.", expected="[]", actual=repr(mod.load("never-saved.json")))


      TESTS = [custom("Saved, then loaded", round_trip), custom("The first run has no file", first_run)]
    solution: |
      import json
      from pathlib import Path


      def save(bookings, path):
          with open(path, "w") as data_file:
              json.dump(bookings, data_file)


      def load(path):
          if not Path(path).exists():
              return []
          with open(path) as data_file:
              return json.load(data_file)
