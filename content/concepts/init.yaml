id: init
title: __init__
summary: |
  `__init__` runs by itself every time an object is made. Its job is to give the new object its starting attributes, from the arguments and from sensible starting values like `0` or `None`. It returns nothing: `Bike(7, 4)` hands back the new object on its own.
example: |
  class Ticket:
      def __init__(self, route, price):
          self.route = route
          self.price = price
          self.used = False

  t = Ticket("Leeds", 3)
  print(t.route, t.price, t.used)
misconceptions: [attributes-fixed-by-init, init-called-by-hand]
related: [classes, attributes, self]
cards:
  - type: predict
    prompt: What does this print?
    code: |
      class Ticket:
          def __init__(self, route):
              print("printing a ticket")
              self.route = route

      t = Ticket("Leeds")
      print(t.route)
    answer: |-
      printing a ticket
      Leeds
  - type: choice
    prompt: What happens?
    code: |
      class Ticket:
          def __init__(self, route, price):
              self.route = route
              self.price = price

      t = Ticket("Leeds")
      print(t.price)
    verify: error
    options:
      - text: A TypeError
        correct: true
        error: TypeError
      - text: It prints None
        misconception: missing-argument-is-none
        feedback: "`price` has no default, so `Ticket(\"Leeds\")` is missing an argument. Python stops with a TypeError."
  - type: choice
    prompt: What does this print?
    code: |
      class Bell:
          def __init__(self):
              self.rings = 0

      bell = Bell()
      bell.rings = 3
      print(bell.rings)
    options:
      - text: "3"
        correct: true
      - text: "0"
        misconception: attributes-fixed-by-init
        feedback: "`__init__` only sets the starting value. `bell.rings = 3` changes it afterwards."
      - text: An error, because __init__ was never called
        misconception: init-called-by-hand
        feedback: "`Bell()` calls `__init__` for you. You never call it by name."
  - type: fix
    prompt: "`__init__` is misspelt, so Python never runs it. Fix it."
    code: |
      class Laptop:
          def _init_(self, owner):
              self.owner = owner

      laptop = Laptop("Riya")
      print(laptop.owner)
    tests: |
      TESTS = [output("Riya's laptop", expect="Riya")]
    solution: |
      class Laptop:
          def __init__(self, owner):
              self.owner = owner

      laptop = Laptop("Riya")
      print(laptop.owner)
  - type: fill
    prompt: "Fill the gap so every new room starts with its name and nobody in it."
    code: |
      class Room:
          def ___(self, name):
              self.name = name
              self.people = 0

      room = Room("Studio")
      print(room.name, room.people)
    blanks: [["__init__"]]
    tests: |
      TESTS = [output("The Studio, empty", expect="Studio 0")]
  - type: write
    prompt: "Write `Stamp`, so `Stamp(\"first\", 135)` makes a stamp with attributes `kind` and `pence`."
    starter: |
      class Stamp:
          pass
    tests: |
      def stamps(ctx):
          m = ctx.module()
          s = m.Stamp("first", 135)
          t = m.Stamp("second", 85)
          if (s.kind, s.pence, t.kind, t.pence) != ("first", 135, "second", 85):
              raise CheckFailed("Each stamp should keep its kind and pence.")


      TESTS = [custom("Two stamps", stamps)]
    solution: |
      class Stamp:
          def __init__(self, kind, pence):
              self.kind = kind
              self.pence = pence
