id: chain-rule
title: The chain rule
summary: |
  When one quantity depends on a second, and the second on a third, their rates multiply: if the focus knob turns 5 notches for every millimetre the brass tube shrinks, and the tube shrinks 0.02 millimetres for every degree the night cools, the knob turns 0.1 notches per degree. For a function inside a function, `dy/dx = dy/du * du/dx`: the outer function's slope, taken at the inner function's value, times the inner function's slope. So the slope of `(3 * x + 1) ** 2` is `2 * (3 * x + 1) * 3`, and leaving off that last `* 3` is the classic mistake. A longer chain works the same way, one multiplication per link. Backpropagation is this rule run backwards from the loss, link by link.
example: |
  x = 2.0
  u = 3 * x + 1          # inner: du/dx is 3
  y = u ** 2             # outer: dy/du is 2 * u

  dy_du = 2 * u
  du_dx = 3
  print(u, y, dy_du * du_dx)
misconceptions: [chain-forgets-inner, chain-rates-add, outer-slope-at-x]
related: [derivatives, numerical-gradients, backpropagation]
drill: true
cards:
  - type: predict
    prompt: "Measured, not worked out. What does this print?"
    code: |
      def f(x):
          return (2 * x - 1) ** 3


      tiny = 1e-6
      print(round((f(1 + tiny) - f(1 - tiny)) / (2 * tiny), 3))
    answer: "6.0"
  - type: choice
    prompt: "The slope of `(3 * x + 1) ** 2` at `x = 2`. What does this print?"
    code: |
      def f(x):
          return (3 * x + 1) ** 2


      tiny = 1e-6
      print(round((f(2 + tiny) - f(2 - tiny)) / (2 * tiny), 3))
    options:
      - text: "42.0"
        correct: true
        feedback: "The outer slope at the inner value is 2 * 7 = 14, and the inside moves 3 times as fast as x: 14 * 3."
      - text: "14.0"
        misconception: chain-forgets-inner
        feedback: "14 is the outer slope, `2 * (3 * x + 1)`, on its own. Every step in x moves the inside 3 steps, so the whole thing changes 3 times as fast: 42."
      - text: "12.0"
        misconception: outer-slope-at-x
        feedback: "That's `2 * x * 3`, the square's slope taken at x = 2. What is squared is `3 * x + 1`, which is 7 there, so the outer slope is 2 * 7 = 14, times the inner 3."
  - type: choice
    prompt: "Each degree colder, the tube shrinks 0.02 mm. Each mm it shrinks, the focus knob turns 5 notches. What does this print?"
    code: |
      def shrink(degrees):
          return 0.02 * degrees


      def notches(mm):
          return 5 * mm


      tiny = 1e-6
      rate = (notches(shrink(10 + tiny)) - notches(shrink(10 - tiny))) / (2 * tiny)
      print(round(rate, 3))
    options:
      - text: "0.1"
        correct: true
        feedback: "Rates along a chain multiply: 0.02 mm a degree, times 5 notches a mm, is 0.1 notches a degree."
      - text: "5.02"
        misconception: chain-rates-add
        feedback: "Millimetres per degree plus notches per millimetre isn't anything. One degree gives 0.02 mm, and each of those millimetres gives 5 notches, so the rates multiply: 0.1."
  - type: fill
    prompt: "Fill the gap so `slope` is the slope of `(5 * x + 2) ** 2`."
    code: |
      def slope(x):
          return 2 * (5 * x + 2) * ___


      print(slope(0), slope(1))
    blanks: [["5"]]
    tests: |
      TESTS = [output("Slopes at 0 and 1", expect="20 70")]
  - type: fix
    prompt: "Pip's slope of `(w * x - y) ** 2` with respect to `w` disagrees with the measured one. Fix `slope`."
    code: |
      def loss(w, x, y):
          return (w * x - y) ** 2


      def slope(w, x, y):
          return 2 * (w * x - y)


      step = 1e-5
      measured = (loss(1 + step, 3, 5) - loss(1 - step, 3, 5)) / (2 * step)
      print(round(measured, 3), slope(1, 3, 5))
    tests: |
      TESTS = [
          function("One reading", call="slope", args=(1, 3, 5), expect=-12, tol=1e-9),
          function("A reading below 0", call="slope", args=(2.0, -1.0, 4.0), expect=12.0, tol=1e-9),
          function("At the best w", call="slope", args=(2.5, 2.0, 5.0), expect=0.0, tol=1e-9),
      ]
    solution: |
      def loss(w, x, y):
          return (w * x - y) ** 2


      def slope(w, x, y):
          return 2 * (w * x - y) * x


      step = 1e-5
      measured = (loss(1 + step, 3, 5) - loss(1 - step, 3, 5)) / (2 * step)
      print(round(measured, 3), slope(1, 3, 5))
  - type: write
    prompt: "Write `chain_slope(slopes)`: given the slope of each link along a chain, return the slope of the whole chain."
    starter: |
      def chain_slope(slopes):
          pass
    tests: |
      TESTS = [
          function("Two links", call="chain_slope", args=([2, 3],), expect=6),
          function("Three links, one going down", call="chain_slope", args=([0.5, -4, 2],), expect=-4.0, tol=1e-9),
          function("One link", call="chain_slope", args=([7],), expect=7),
          function("A flat link stops everything", call="chain_slope", args=([3, 0, 5],), expect=0),
      ]
    solution: |
      def chain_slope(slopes):
          total = 1
          for slope in slopes:
              total = total * slope
          return total
  - type: write
    prompt: "Write `slope(x)` for `f(x) = (x ** 2 + 1) ** 3`."
    starter: |
      def slope(x):
          pass
    tests: |
      TESTS = [
          function("Flat at 0", call="slope", args=(0.0,), expect=0.0, tol=1e-9),
          function("At 1", call="slope", args=(1.0,), expect=24.0, tol=1e-9),
          function("At -2", call="slope", args=(-2.0,), expect=-300.0, tol=1e-9),
          function("At 0.5", call="slope", args=(0.5,), expect=4.6875, tol=1e-9),
      ]
    solution: |
      def slope(x):
          return 3 * (x ** 2 + 1) ** 2 * 2 * x
