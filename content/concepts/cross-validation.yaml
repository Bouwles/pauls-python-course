    tests: |
      def matches(ctx):
          import numpy as np
          from sklearn.model_selection import cross_val_score
          from sklearn.neighbors import KNeighborsClassifier
          rng = np.random.default_rng(3)
          X = rng.normal(size=(40, 2))
          y = (X[:, 0] + rng.normal(0, 0.8, 40) > 0).astype(int)
          model = KNeighborsClassifier(n_neighbors=3)
          for folds in (4, 5):
              want = cross_val_score(model, X, y, cv=folds).mean()
              got = ctx.module().mean_accuracy(model, X, y, folds)
              if got is None or abs(float(got) - want) > 1e-9:
                  raise CheckFailed(f"With {folds} folds the mean accuracy is off.", expected=round(want, 4), actual=got)


      TESTS = [custom("Matches cross_val_score", matches)]
    solution: |
      from sklearn.model_selection import cross_val_score


      def mean_accuracy(model, X, y, folds):
          return cross_val_score(model, X, y, cv=folds).mean()
