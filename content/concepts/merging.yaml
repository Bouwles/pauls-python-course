      import pandas as pd

      boats = pd.DataFrame({"boat": ["Kittiwake", "Dolly", "Gull"]})
      berths = pd.DataFrame({"boat": ["Dolly", "Kittiwake"], "berth": ["north", "south"]})
      both = boats.merge(berths, on="boat", how="left")
      print(both["berth"].fillna("at sea").tolist())
    answer: "['south', 'north', 'at sea']"
