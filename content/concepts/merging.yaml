  - type: fix
    prompt: "Pip's merge counts the Kittiwake's landings twice, because her berth card is in twice. Fix it so the total is `20`."
    code: |
      import pandas as pd

      landings = pd.DataFrame({"boat": ["Kittiwake", "Dolly", "Kittiwake"], "crates": [8, 5, 7]})
      berths = pd.DataFrame({"boat": ["Kittiwake", "Kittiwake", "Dolly"], "berth": [7, 7, 4]})
      both = landings.merge(berths, on="boat", how="left")
      print(both["crates"].sum())
    tests: |
      TESTS = [output("Every crate once", expect="20")]
    solution: |
      import pandas as pd

      landings = pd.DataFrame({"boat": ["Kittiwake", "Dolly", "Kittiwake"], "crates": [8, 5, 7]})
      berths = pd.DataFrame({"boat": ["Kittiwake", "Kittiwake", "Dolly"], "berth": [7, 7, 4]})
      both = landings.merge(berths.drop_duplicates("boat"), on="boat", how="left")
      print(both["crates"].sum())
  - type: write
    prompt: "Write `with_streets(parcels, addresses)`: the parcels with a `street` column from `addresses`, matched on `name`. Keep every parcel, in order; a name with no address gets the street `unknown`."
    starter: |
      import pandas as pd


      def with_streets(parcels, addresses):
          pass
    tests: |
      def check(ctx):
          import pandas as pd

          parcels = pd.DataFrame({"name": ["Bea", "Tom", "Ada", "Bea"], "weight": [2.0, 0.5, 1.2, 3.1]})
          addresses = pd.DataFrame({"name": ["Tom", "Bea"], "street": ["Lighthouse Lane", "High Street"]})
          result = ctx.module().with_streets(parcels, addresses)
          if len(result) != 4:
              raise CheckFailed("Every parcel, once each.", expected="4 rows", actual=f"{len(result)} rows")
          streets = result["street"].tolist()
          expected = ["High Street", "Lighthouse Lane", "unknown", "High Street"]
          if streets != expected:
              raise CheckFailed("The streets, in parcel order.", expected=str(expected), actual=str(streets))


      TESTS = [custom("Four parcels", check)]
    solution: |
      import pandas as pd


      def with_streets(parcels, addresses):
          both = parcels.merge(addresses, on="name", how="left")
          both["street"] = both["street"].fillna("unknown")
          return both
