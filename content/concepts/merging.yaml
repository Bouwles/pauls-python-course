id: merging
title: Merging tables
summary: |
  `people.merge(trades, on="occupation")` lines up two tables by the values in a shared column and gives back one table with the columns of both. The default keeps only rows that match in both tables; `how="left"` keeps every row of the left table, with `NaN` where the right had nothing, and `how="outer"` keeps everything from both. A key that appears twice in the right table repeats the left row once per match, so check a lookup table for repeats, or pass `validate="many_to_one"` and pandas will refuse to merge if there are any.
example: |
  import pandas as pd

  people = pd.DataFrame({"name": ["Walter", "Edith", "Ella"], "occupation": ["fisherman", "baker", "pharmacist"]})
  trades = pd.DataFrame({"occupation": ["baker", "fisherman"], "sector": ["trade", "sea"]})
  print(people.merge(trades, on="occupation"))
  both = people.merge(trades, on="occupation", how="left", validate="many_to_one")
  both["sector"] = both["sector"].fillna("unlisted")
  print(both)
misconceptions: [merge-keeps-all-rows, merge-keeps-both, merge-missing-key-errors, merge-duplicate-key-ignored, merge-refuses-duplicates]
related: [groupby, pandas-basics, missing-data]
drill: true
cards:
  - type: choice
    prompt: "What does this print?"
    code: |
      import pandas as pd

      boats = pd.DataFrame({"boat": ["Kittiwake", "Dolly", "Gull"], "skipper": ["Kerrow", "Nance", "Pascoe"]})
      berths = pd.DataFrame({"boat": ["Dolly", "Kittiwake"], "berth": [4, 7]})
      print(len(boats.merge(berths, on="boat")))
    options:
      - text: "2"
        correct: true
        feedback: "A plain merge keeps only the rows that match. The Gull has no berth, so she isn't in the result."
      - text: "3"
        misconception: merge-keeps-all-rows
        feedback: "The default is an inner merge: rows without a match are dropped. `how=\"left\"` would keep the Gull, with `NaN` for a berth."
  - type: choice
    prompt: "The berths list has the Dolly in twice. What does this print?"
    code: |
      import pandas as pd

      boats = pd.DataFrame({"boat": ["Kittiwake", "Dolly", "Gull"], "skipper": ["Kerrow", "Nance", "Pascoe"]})
      berths = pd.DataFrame({"boat": ["Dolly", "Dolly", "Kittiwake"], "berth": [4, 4, 7]})
      print(len(boats.merge(berths, on="boat", how="left")))
    options:
      - text: "4"
        correct: true
        feedback: "The Dolly matches two rows, so she comes out twice. The Kittiwake matches one and the Gull, kept by `how=\"left\"`, matches none."
      - text: "3"
        misconception: merge-duplicate-key-ignored
        feedback: "merge makes one row for every match. Two rows for the Dolly in `berths` means two Dollys in the result."
  - type: predict
    prompt: "What does this print?"
