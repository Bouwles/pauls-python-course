  - type: fix
    prompt: "Yahya's merge counts Caitlin's points twice, because her locker card is in twice. Fix it so the total is `20`."
    code: |
      import pandas as pd

      scores = pd.DataFrame({"player": ["Caitlin", "Yahya", "Caitlin"], "points": [8, 5, 7]})
      lockers = pd.DataFrame({"player": ["Caitlin", "Caitlin", "Yahya"], "locker": [7, 7, 4]})
      both = scores.merge(lockers, on="player", how="left")
      print(both["points"].sum())
    tests: |
      TESTS = [output("Every point once", expect="20")]
    solution: |
      import pandas as pd

      scores = pd.DataFrame({"player": ["Caitlin", "Yahya", "Caitlin"], "points": [8, 5, 7]})
      lockers = pd.DataFrame({"player": ["Caitlin", "Caitlin", "Yahya"], "locker": [7, 7, 4]})
      both = scores.merge(lockers.drop_duplicates("player"), on="player", how="left")
      print(both["points"].sum())
  - type: write
    prompt: "Write `with_streets(parcels, addresses)`: the parcels with a `street` column from `addresses`, matched on `name`. Keep every parcel, in order; a name with no address gets the street `unknown`."
    starter: |
      import pandas as pd


      def with_streets(parcels, addresses):
          pass
    tests: |
      def check(ctx):
          import pandas as pd

          parcels = pd.DataFrame({"name": ["Riya", "Yahya", "Neil", "Riya"], "weight": [2.0, 0.5, 1.2, 3.1]})
          addresses = pd.DataFrame({"name": ["Yahya", "Riya"], "street": ["Station Road", "High Street"]})
          result = ctx.module().with_streets(parcels, addresses)
          if len(result) != 4:
              raise CheckFailed("Every parcel, once each.", expected="4 rows", actual=f"{len(result)} rows")
          streets = result["street"].tolist()
          expected = ["High Street", "Station Road", "unknown", "High Street"]
          if streets != expected:
              raise CheckFailed("The streets, in parcel order.", expected=str(expected), actual=str(streets))


      TESTS = [custom("Four parcels", check)]
    solution: |
      import pandas as pd


      def with_streets(parcels, addresses):
          both = parcels.merge(addresses, on="name", how="left")
          both["street"] = both["street"].fillna("unknown")
          return both
