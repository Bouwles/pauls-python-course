  - type: fix
    prompt: "Pip's chart crashes before it is labelled. Fix it."
    code: |
      import matplotlib
      matplotlib.use("Agg")
      import matplotlib.pyplot as plt

      fig, ax = plt.subplots()
      ax.plot([1, 2, 3, 4], [41.2, 43.8, 44.1, 42.7])
      ax.xlabel("week")
      ax.ylabel("temperature (degrees)")
      print(ax.get_xlabel(), "/", ax.get_ylabel())
    tests: |
      TESTS = [output("Both axes labelled", expect="week / temperature (degrees)")]
    solution: |
      import matplotlib
      matplotlib.use("Agg")
      import matplotlib.pyplot as plt

      fig, ax = plt.subplots()
      ax.plot([1, 2, 3, 4], [41.2, 43.8, 44.1, 42.7])
      ax.set_xlabel("week")
      ax.set_ylabel("temperature (degrees)")
      print(ax.get_xlabel(), "/", ax.get_ylabel())
  - type: write
    prompt: "Write `rain_chart(months, rain)`: a line of `rain` against `months`, with the y axis labelled `rain (mm)` and starting at 0. Return `fig, ax`."
    starter: |
      import matplotlib
      matplotlib.use("Agg")
      import matplotlib.pyplot as plt


      def rain_chart(months, rain):
          fig, ax = plt.subplots()
          return fig, ax
    tests: |
      def chart(ctx):
          fig, ax = ctx.module().rain_chart(["Jan", "Feb", "Mar"], [116, 84, 71])
          if len(ax.lines) != 1:
              raise CheckFailed("One line on the axes.", expected=1, actual=len(ax.lines))
          heights = [float(v) for v in ax.lines[0].get_ydata()]
          if heights != [116.0, 84.0, 71.0]:
              raise CheckFailed("The line's heights are the rain.", expected=[116.0, 84.0, 71.0], actual=heights)
          if ax.get_ylabel() != "rain (mm)":
              raise CheckFailed("The y axis label.", expected="rain (mm)", actual=ax.get_ylabel())
          if float(ax.get_ylim()[0]) != 0.0:
              raise CheckFailed("The y axis starts at 0.", expected=0.0, actual=float(ax.get_ylim()[0]))


      TESTS = [custom("Three months of rain", chart)]
    solution: |
      import matplotlib
      matplotlib.use("Agg")
      import matplotlib.pyplot as plt


      def rain_chart(months, rain):
          fig, ax = plt.subplots()
          ax.plot(months, rain)
          ax.set_ylabel("rain (mm)")
          ax.set_ylim(bottom=0)
          return fig, ax
