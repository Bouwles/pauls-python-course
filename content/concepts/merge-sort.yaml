  - type: choice
    prompt: "Merge sort starts with 8 piles of one part each. How many rounds of merging pairs until there's one pile?"
    verify: none
    options:
      - text: "3"
        correct: true
        feedback: "8 piles, then 4, then 2, then 1. Each round halves the number of piles: log of 8 is 3."
      - text: "7"
        misconception: merge-rounds-per-item
        feedback: "Each round merges every pair at once, so the number of piles halves each time. That's 7 merges in all, but only 3 rounds."
      - text: "4"
        feedback: "8 to 4 is one round, 4 to 2 is two, 2 to 1 is three."
  - type: choice
    prompt: "Merge sort is handed 10,000 parts that are already in order. How does that change the work it does?"
    verify: none
    options:
      - text: "Hardly at all: it still merges, round after round"
        correct: true
        feedback: "Merge sort never checks whether it's finished early. It's O(n log n) on any pile, which is good on a jumbled pile and wasted on a tidy one."
      - text: "It finishes after the first round"
        misconception: merge-sort-notices-order
        feedback: "Nothing in merge sort notices that the piles were already in order. It does every round regardless."
