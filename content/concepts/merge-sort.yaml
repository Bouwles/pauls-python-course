id: merge-sort
title: Merge sort
summary: |
  Merging two sorted piles is quick: compare the two front items, take the smaller, repeat, then tip whatever's left on the end. Merge sort is built from that. Every item starts as a pile of one; neighbouring piles are merged in pairs, round after round, until one pile is left. Each round touches every item once and there are about log n rounds, so it's O(n log n) whatever order the list started in. Take from the left pile on a tie and it's stable.
example: |
  def merge(left, right):
      merged = []
      next_left = 0
      next_right = 0
      while next_left < len(left) and next_right < len(right):
          if left[next_left] <= right[next_right]:
              merged.append(left[next_left])
              next_left = next_left + 1
          else:
              merged.append(right[next_right])
              next_right = next_right + 1
      merged.extend(left[next_left:])
      merged.extend(right[next_right:])
      return merged


  print(merge([2, 5, 9], [1, 5, 6, 12]))
misconceptions: [merge-rounds-per-item, merge-sort-notices-order]
related: [simple-sorts, quicksort, sort-stability, big-o]
