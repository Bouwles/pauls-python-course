id: honest-charts
title: Honest charts
summary: |
  A chart makes a claim, so it can lie even when every number on it is right. Bars show a value by their length, so a bar chart's scale starts at 0: `ax.set_ylim(bottom=0)`. A line may fit its scale to the data, which matplotlib does by default, but then the axis must say so, and a change is often clearer drawn as a difference from an average, around a 0 that means something. Panels meant to be compared share one scale (`plt.subplots(1, 2, sharey=True)`). Missing readings stay missing: `NaN` leaves a gap in a line, and the gap is the truth. Every axis says what it measures and in what units.
example: |
  import matplotlib.pyplot as plt

  decades = ["1920s", "1960s", "2020s"]
  temps = [11.1, 10.9, 12.3]
  fig, (bars, change) = plt.subplots(1, 2, figsize=(9, 3))
  bars.bar(decades, temps)
  bars.set_ylim(bottom=0)
  bars.set_ylabel("temperature (degrees C)")
  average = sum(temps) / len(temps)
  change.bar(decades, [t - average for t in temps])
  change.axhline(0, color="grey")
  change.set_ylabel("difference from average (degrees C)")
  plt.show()
misconceptions: [axis-starts-at-zero, bars-zoom-to-fit, truncated-bars-honest, subplots-share-scale, gap-joined-up]
related: [matplotlib]
cards:
  - type: predict
    prompt: "Pip's bars start at 10.8. How many times taller does the 2020s bar look than the 1960s one?"
    code: |
      bottom = 10.8
      sixties, twenties = 10.9, 12.3
      print(round((twenties - bottom) / (sixties - bottom), 1))
    answer: "15.0"
  - type: choice
    prompt: "What does this print?"
    code: |
      import matplotlib
      matplotlib.use("Agg")
      import matplotlib.pyplot as plt

      fig, (left, right) = plt.subplots(1, 2)
      left.bar(["1982", "1960"], [798, 1439])
      right.plot(["1982", "1960"], [798, 1439])
      print(left.get_ylim()[0] == 0, right.get_ylim()[0] == 0)
    options:
      - text: "True False"
        correct: true
        feedback: "Bars are drawn up from 0, so matplotlib keeps 0 on the scale. A line's scale is fitted to the data."
      - text: "True True"
        misconception: axis-starts-at-zero
        feedback: "matplotlib only keeps 0 for bars. A line's scale starts just under its smallest value, here a little below 798."
      - text: "False False"
        misconception: bars-zoom-to-fit
        feedback: "Bars are the exception: their length is their value, so matplotlib starts their scale at 0 unless you tell it otherwise."
  - type: choice
    prompt: "Two panels, made without `sharey`. What does this print?"
    code: |
      import matplotlib
      matplotlib.use("Agg")
      import matplotlib.pyplot as plt

      fig, axes = plt.subplots(1, 2)
      axes[0].bar(["Jan", "Feb"], [101.6, 77.6])
      axes[1].bar(["Jan", "Feb"], [160.2, 80.5])
      print(axes[0].get_ylim() == axes[1].get_ylim())
    options:
      - text: "False"
        correct: true
        feedback: "Each panel fits its own scale, so 101.6 reaches as high on the left as 160.2 does on the right. `sharey=True` gives them one scale."
      - text: "True"
        misconception: subplots-share-scale
        feedback: "Panels don't share a scale unless you ask. Each one fits its own data, which is how a dry January can look as wet as a wet one."
  - type: fill
    prompt: "Fill the gap so the two years are drawn on one scale."
    code: |
      import matplotlib
      matplotlib.use("Agg")
      import matplotlib.pyplot as plt

      fig, axes = plt.subplots(1, 2, ___=True)
      axes[0].bar(["Jan", "Feb"], [101.6, 77.6])
      axes[1].bar(["Jan", "Feb"], [160.2, 80.5])
      print(axes[0].get_ylim() == axes[1].get_ylim())
    blanks: [["sharey"]]
    tests: |
      TESTS = [output("One scale for both", expect="True")]
  - type: choice
    prompt: "The sunshine recorder was down in 1942. What does this print?"
    code: |
      import matplotlib
      matplotlib.use("Agg")
      import matplotlib.pyplot as plt
      import numpy as np

      fig, ax = plt.subplots()
      line, = ax.plot([1940, 1941, 1942, 1943], [1610.0, 1544.0, np.nan, 1580.0])
      print(int(np.isnan(line.get_ydata()).sum()))
    options:
      - text: "1"
        correct: true
        feedback: "The NaN stays in the line's data, and matplotlib leaves a gap where it is. Nothing is drawn across a year nobody measured."
      - text: "0"
        misconception: gap-joined-up
        feedback: "matplotlib doesn't fill in or skip over a missing value. The NaN stays, and the line has a gap at 1942."
  - type: fix
    prompt: "Pip zoomed in on his bars to make the change dramatic. Fix it so the scale starts at 0."
    code: |
      import matplotlib
      matplotlib.use("Agg")
      import matplotlib.pyplot as plt

      fig, ax = plt.subplots()
      ax.bar(["1920s", "1960s", "2020s"], [11.1, 10.9, 12.3])
      ax.set_ylim(10.8, 12.4)
      print(ax.get_ylim()[0])
    tests: |
      TESTS = [output("The bars start at 0", expect="0.0")]
    solution: |
      import matplotlib
      matplotlib.use("Agg")
      import matplotlib.pyplot as plt

      fig, ax = plt.subplots()
      ax.bar(["1920s", "1960s", "2020s"], [11.1, 10.9, 12.3])
      ax.set_ylim(bottom=0)
      print(ax.get_ylim()[0])
  - type: write
    prompt: "Write `honest_bars(names, values, label)`: bars of `values` against `names`, the scale starting at 0, the y axis labelled `label`. Return `fig, ax`."
    starter: |
      import matplotlib
      matplotlib.use("Agg")
      import matplotlib.pyplot as plt


      def honest_bars(names, values, label):
          fig, ax = plt.subplots()
          return fig, ax
    tests: |
      def check(ctx):
          import matplotlib.pyplot as plt

          try:
              fig, ax = ctx.module().honest_bars(["Mon", "Sat"], [40, 96], "loaves sold")
              heights = [b.get_height() for b in ax.patches]
              if heights != [40, 96]:
                  raise CheckFailed("One bar per value.", expected=[40, 96], actual=heights)
              if ax.get_ylim()[0] != 0:
                  raise CheckFailed("The scale starts at 0.", expected=0, actual=ax.get_ylim()[0])
              if ax.get_ylabel() != "loaves sold":
                  raise CheckFailed("The y axis says what it measures.", expected="loaves sold", actual=ax.get_ylabel())
          finally:
              plt.close("all")


      TESTS = [custom("Two days of loaves", check)]
    solution: |
      import matplotlib
      matplotlib.use("Agg")
      import matplotlib.pyplot as plt


      def honest_bars(names, values, label):
          fig, ax = plt.subplots()
          ax.bar(names, values)
          ax.set_ylim(bottom=0)
          ax.set_ylabel(label)
          return fig, ax
