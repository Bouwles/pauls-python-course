id: indexing
title: Indexes start at 0
summary: |
  Each item in a list has an index: how many steps it is from the start. The first item is at index 0, so in a list of four the last is at index 3. `guests[1]` gives the second item, and `guests[1] = "Paul"` replaces it. An index past the end is an IndexError.
example: |
  guests = ["Riya", "Yahya", "Aaesha"]
  print(guests[0])
  guests[1] = "Paul"
  print(guests)
misconceptions: [index-from-one, index-gives-list, index-past-end-gives-nothing]
related: [lists, negative-indices]
drill: true
cards:
  - type: predict
    prompt: What does this print?
    code: |
      seats = ["Riya", "Yahya", "Aaesha"]
      print(seats[0])
    answer: "Riya"
  - type: predict
    prompt: What does this print?
    code: |
      guests = ["Riya", "Yahya", "Aaesha"]
      guests[1] = "Paul"
      print(guests)
    answer: "['Riya', 'Paul', 'Aaesha']"
  - type: choice
    prompt: What happens?
    code: |
      seats = ["Riya", "Yahya", "Aaesha"]
      print(seats[3])
    verify: error
    options:
      - text: An IndexError
        correct: true
        error: IndexError
        feedback: "Three items have indexes 0, 1 and 2. There is no index 3."
      - text: It prints Aaesha
        misconception: index-from-one
        feedback: "Aaesha is the third item, but indexes start at 0, so she is at index 2."
      - text: It prints None
        misconception: index-past-end-gives-nothing
        feedback: "Asking for an index that isn't there is an error, not an empty answer."
  - type: fix
    prompt: "This should print `Aaesha`, the third guest. Fix the index."
    code: |
      guests = ["Riya", "Yahya", "Aaesha", "Caitlin"]
      print(guests[3])
    tests: |
      TESTS = [output("Aaesha", expect="Aaesha")]
    solution: |
      guests = ["Riya", "Yahya", "Aaesha", "Caitlin"]
      print(guests[2])
  - type: fill
    prompt: "Fill the gap so this prints `Yahya`."
    code: |
      guests = ["Riya", "Yahya", "Aaesha"]
      print(guests[___])
    blanks: [["1"]]
    tests: |
      TESTS = [output("Yahya", expect="Yahya")]
  - type: write
    prompt: "Print the first guest and then the fourth, on separate lines, using indexes."
    starter: |
      guests = ["Riya", "Yahya", "Aaesha", "Caitlin", "Paul"]
    tests: |
      TESTS = [
          output("First and fourth", expect="Riya\nCaitlin"),
          structure("Uses indexes", requires=["Subscript"], message="Pick the guests out of the list with square brackets."),
      ]
    solution: |
      guests = ["Riya", "Yahya", "Aaesha", "Caitlin", "Paul"]
      print(guests[0])
      print(guests[3])
