      print(seat([]))
    blanks: [["pop"]]
    tests: |
      TESTS = [output("The Debuggers in the middle", expect="['Back Row', 'Debuggers', 'Tabs']")]
  - type: fix
    prompt: "`crates_for` should find crates that add up to exactly `target` kilos, each crate used at most once. For 7 kg it gives `[5, 4, 3]`. Fix it."
    code: |
      def crates_for(weights, target):
          chosen = []

          def pick(start, left):
              if left == 0:
                  return True
              for position in range(start, len(weights)):
                  if weights[position] <= left:
                      chosen.append(weights[position])
                      if pick(position + 1, left - weights[position]):
                          return True
              return False

          if pick(0, target):
              return chosen
          return None


      print(crates_for([8, 5, 4, 3], 7))
    tests: |
      TESTS = [
          output("Seven kilos", expect="[4, 3]", hint="When a crate leads nowhere, take it back off chosen before trying the next one."),
          function("Twelve kilos", call="crates_for", args=([8, 5, 4, 3], 12), expect=[8, 4]),
          function("Can't be done", call="crates_for", args=([6, 5], 4), expect=None),
      ]
    solution: |
      def crates_for(weights, target):
          chosen = []

          def pick(start, left):
              if left == 0:
                  return True
              for position in range(start, len(weights)):
                  if weights[position] <= left:
                      chosen.append(weights[position])
                      if pick(position + 1, left - weights[position]):
                          return True
                      chosen.pop()
              return False

          if pick(0, target):
              return chosen
          return None


      print(crates_for([8, 5, 4, 3], 7))
  - type: write
    prompt: "Write `all_orders(teams)`, which gives back every order the teams could sit in, as a list of lists. Use backtracking, not `itertools`."
    starter: |
      def all_orders(teams):
          pass
    tests: |
      def three(ctx):
          module = ctx.module()
          got = module.all_orders(["Debuggers", "Night Owls", "Tabs"])
          expected = [["Debuggers", "Night Owls", "Tabs"], ["Debuggers", "Tabs", "Night Owls"], ["Night Owls", "Debuggers", "Tabs"],
                      ["Night Owls", "Tabs", "Debuggers"], ["Tabs", "Debuggers", "Night Owls"], ["Tabs", "Night Owls", "Debuggers"]]
          if not isinstance(got, list) or sorted(map(list, got)) != expected:
              raise CheckFailed("Three teams sit in six orders.", expected=expected, actual=got)


      TESTS = [
          custom("Three teams", three),
          function("One team", call="all_orders", args=(["Spaces"],), expect=[["Spaces"]]),
          structure("No itertools", forbids_calls=["permutations"], message="Build the orders yourself, one seat at a time."),
      ]
    solution: |
      def all_orders(teams):
          orders = []
          row = []

          def seat():
              if len(row) == len(teams):
                  orders.append(list(row))
                  return
              for team in teams:
                  if team not in row:
                      row.append(team)
                      seat()
                      row.pop()

          seat()
          return orders
