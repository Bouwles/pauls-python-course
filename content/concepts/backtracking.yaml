id: backtracking
title: Backtracking
summary: |
  Backtracking builds an answer one choice at a time, checks each choice the moment it's made, and when nothing fits, undoes the last choice and tries the next one there. A recursive function does it naturally: for each choice, make it, call yourself for the rest, and undo it if the call comes back with nothing. A branch that breaks a rule is dropped at once, so every arrangement that starts that way is never built. Seating plans, word grids, sudoku and mazes all go this way.
example: |
  TEAMS = ["Back Row", "Tabs", "Debuggers"]
  FEUDS = {("Back Row", "Tabs"), ("Tabs", "Back Row")}


  def seat(row):
      if len(row) == len(TEAMS):
          return list(row)
      for team in TEAMS:
          if team not in row and not (row and (row[-1], team) in FEUDS):
              row.append(team)
              seating = seat(row)
              if seating:
                  return seating
              row.pop()
      return None


  print(seat([]))
misconceptions: [backtracking-keeps-choices, backtracking-builds-everything, backtracking-stops-at-dead-end]
related: [recursion, call-stack, dfs, dynamic-programming]
drill: true
cards:
  - type: predict
    prompt: What does this print?
    code: |
      TEAMS = ["Debuggers", "Night Owls", "Tabs"]
      FEUDS = {("Debuggers", "Night Owls")}


      def seat(row):
          if len(row) == len(TEAMS):
              print(" ".join(row))
              return
          for team in TEAMS:
              if team in row:
                  continue
              if row and ((row[-1], team) in FEUDS or (team, row[-1]) in FEUDS):
                  continue
              row.append(team)
              seat(row)
              row.pop()


      seat([])
    answer: "Debuggers Tabs Night Owls\nNight Owls Tabs Debuggers"
  - type: choice
    prompt: "In Paul's quiz seating, the Back Row goes at table one, and then nobody can sit at table three without a feud. What happens next?"
    verify: none
    options:
      - text: "The team at table two stands up, and the next team is tried there"
        correct: true
        feedback: "Backtracking undoes the most recent choice first. Only when every team has failed at table two does the Back Row itself stand up."
      - text: "The search gives up: there's no seating"
        misconception: backtracking-stops-at-dead-end
        feedback: "One dead end only rules out that branch. There are other teams to try at table two, and others at table one after that."
      - text: "It finishes the row anyway, and checks the feuds at the end"
        misconception: backtracking-builds-everything
        feedback: "Backtracking checks each choice as it's made. A row that's already broken is never finished."
  - type: fill
    prompt: "Fill the gap so a team that led nowhere is stood up again."
    code: |
