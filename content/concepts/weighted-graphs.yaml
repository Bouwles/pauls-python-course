id: weighted-graphs
title: Weighted graphs
summary: |
  A weighted graph puts a number on each connection: minutes on a road, pence on a fare, kilos on a crane lift. In Python, give each place a dictionary of its neighbours instead of a list, so `MINUTES["scrapyard"]["tailor"]` is the minutes from the scrapyard to the tailor's. A route's length is the sum of its roads' weights, so the route with the fewest roads isn't always the shortest. `zip(route, route[1:])` pairs each place with the next one along.
example: |
  MINUTES = {
      "scrapyard": {"workshop": 8, "tailor": 4},
      "tailor": {"scrapyard": 4, "workshop": 3},
      "workshop": {"scrapyard": 8, "tailor": 3},
  }
  route = ["scrapyard", "tailor", "workshop"]
  print(sum(MINUTES[here][there] for here, there in zip(route, route[1:])))
misconceptions: [weighted-route-counts-roads, fewest-roads-is-quickest, weights-on-places, zip-pairs-wrap-round]
related: [graphs, dijkstra, dictionaries, zip]
drill: true
cards:
  - type: predict
    prompt: What does this print?
    code: |
      MINUTES = {
          "pub": {"harbour-office": 2, "post-office": 3},
          "harbour-office": {"pub": 2, "ferry": 3},
          "post-office": {"pub": 3, "ferry": 4},
          "ferry": {"harbour-office": 3, "post-office": 4},
      }
      print(MINUTES["pub"]["harbour-office"] + MINUTES["harbour-office"]["ferry"])
    answer: "5"
  - type: predict
    prompt: What does this print?
    code: |
      MINUTES = {
          "pub": {"harbour-office": 2, "post-office": 3},
          "harbour-office": {"pub": 2, "ferry": 3},
          "post-office": {"pub": 3, "ferry": 4},
          "ferry": {"harbour-office": 3, "post-office": 4},
      }
      route = ["ferry", "post-office", "pub", "harbour-office"]
      print(sum(MINUTES[here][there] for here, there in zip(route, route[1:])))
    answer: "9"
  - type: choice
    prompt: What does this print?
    code: |
      MINUTES = {"quay": {"chapel": 4}, "chapel": {}}
      print(MINUTES["chapel"].get("quay"))
    options:
      - text: "None"
        correct: true
        feedback: "The road from the quay to the chapel is written in the quay's dictionary only. From the chapel there's no road back, so `.get` gives None."
      - text: "4"
        misconception: graph-roads-one-list-both-ways
        feedback: "A weighted road is still one way unless it's written in both dictionaries. The chapel's dictionary is empty."
  - type: fill
    prompt: "Fill the gap so this prints each road out of the bakery with its minutes."
    code: |
      MINUTES = {"bakery": {"workshop": 2, "post-office": 2, "library": 3}}
      for neighbour, minutes in MINUTES["bakery"].___():
          print(neighbour, minutes)
    blanks: [["items"]]
    tests: |
      TESTS = [output("Three roads", expect="workshop 2\npost-office 2\nlibrary 3")]
  - type: fix
    prompt: "`route_minutes` should add up the minutes along a route. It counts the roads instead. Fix it."
    code: |
      MINUTES = {
          "scrapyard": {"workshop": 8, "tailor": 4},
          "tailor": {"scrapyard": 4, "workshop": 3},
          "workshop": {"scrapyard": 8, "tailor": 3},
      }


      def route_minutes(route):
          total = 0
          for here, there in zip(route, route[1:]):
              total = total + 1
          return total


      print(route_minutes(["scrapyard", "tailor", "workshop"]))
    tests: |
      TESTS = [
          output("Round by the tailor's", expect="7", hint="Each step adds MINUTES[here][there], the minutes on that road."),
          function("The direct road", call="route_minutes", args=(["scrapyard", "workshop"],), expect=8),
      ]
    solution: |
      MINUTES = {
          "scrapyard": {"workshop": 8, "tailor": 4},
          "tailor": {"scrapyard": 4, "workshop": 3},
          "workshop": {"scrapyard": 8, "tailor": 3},
      }


      def route_minutes(route):
          total = 0
          for here, there in zip(route, route[1:]):
              total = total + MINUTES[here][there]
          return total


      print(route_minutes(["scrapyard", "tailor", "workshop"]))
  - type: write
    prompt: "Write `nearest(roads, place)`: the neighbour of `place` with the fewest minutes on its road, or `None` if it has no roads out."
    starter: |
      def nearest(roads, place):
          pass
    tests: |
      MINUTES = {"pub": {"harbour-office": 2, "post-office": 3, "greengrocer": 3}, "lighthouse": {}}
      TESTS = [
          function("From the pub", call="nearest", args=(MINUTES, "pub"), expect="harbour-office"),
          function("Nowhere to go", call="nearest", args=(MINUTES, "lighthouse"), expect=None),
          function("Not on the map", call="nearest", args=(MINUTES, "chapel"), expect=None),
      ]
    solution: |
      def nearest(roads, place):
          neighbours = roads.get(place, {})
          if not neighbours:
              return None
          return min(neighbours, key=neighbours.get)
  - type: choice
    prompt: "From the scrapyard, one route to the ferry has four roads and another has five. Which is quicker?"
    verify: none
    options:
      - text: "It depends on the minutes on the roads"
        correct: true
        feedback: "Add up each route's minutes. One slow road can make the four-road route the longer one, as the yard track does."
      - text: "The one with four roads"
        misconception: fewest-roads-is-quickest
        feedback: "Fewer roads only means quicker when every road takes the same time. Here they don't."
