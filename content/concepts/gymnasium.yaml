  - type: write
    prompt: "Write `run_episode(env, policy, seed=None)`: reset with the seed, step with `policy(observation)` until the episode is terminated or truncated, and return the total reward. `corridor.py` has an environment to try it on."
    files:
      corridor.py: |
        class Corridor:
            """Walk right to the end of a corridor of `length` tiles; every step costs 1. Truncated at `limit`."""

            def __init__(self, length=4, limit=10):
                self.length, self.limit = length, limit

            def reset(self, seed=None, options=None):
                self.tile, self.steps = 0, 0
                return self.tile, {}

            def step(self, action):
                self.tile = max(0, self.tile + (1 if action == 1 else -1))
                self.steps += 1
                terminated = self.tile == self.length
                truncated = not terminated and self.steps >= self.limit
                return self.tile, -1.0, terminated, truncated, {}
    starter: |
      from corridor import Corridor


      def run_episode(env, policy, seed=None):
          pass
    tests: |
      def straight(ctx):
          m = ctx.module()
          got = m.run_episode(m.Corridor(), lambda observation: 1)
          if got != -4.0:
              raise CheckFailed("Walking right down a corridor of 4 costs -4.0.", expected=-4.0, actual=got)


      def clock(ctx):
          m = ctx.module()
          got = m.run_episode(m.Corridor(limit=6), lambda observation: 0)
          if got != -6.0:
              raise CheckFailed("Walking into the wall, the clock stops it after 6 steps: -6.0.", expected=-6.0, actual=got)


      TESTS = [custom("Straight to the end", straight), custom("Stopped by the clock", clock)]
    solution: |
      from corridor import Corridor


      def run_episode(env, policy, seed=None):
          observation, info = env.reset(seed=seed)
          total = 0.0
          while True:
              observation, reward, terminated, truncated, info = env.step(policy(observation))
              total += reward
              if terminated or truncated:
                  return total
