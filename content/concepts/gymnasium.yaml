id: gymnasium
title: Gymnasium environments
summary: |
  Gymnasium is the standard shape for reinforcement learning environments. `reset(seed=...)` starts an episode and returns `(observation, info)`; `step(action)` returns `(observation, reward, terminated, truncated, info)`. `terminated` means the episode ended in its own right (a goal, a fall, a flood); `truncated` means it was stopped from outside, usually by a time limit, so the last state still has a future worth counting. `action_space` and `observation_space` (`Discrete`, `Box`) say what's allowed. A custom environment subclasses `gym.Env`, calls `super().reset(seed=seed)`, and draws every random number from `self.np_random`, so a seed repeats a run exactly.
example: |
  class Kettle:
      def reset(self, seed=None, options=None):
          self.temperature, self.steps = 30, 0
          return self.temperature, {}

      def step(self, action):
          self.temperature += 20
          self.steps += 1
          terminated = self.temperature >= 100
          truncated = not terminated and self.steps >= 3
          return self.temperature, 1.0, terminated, truncated, {}


  env = Kettle()
  observation, info = env.reset()
  while True:
      observation, reward, terminated, truncated, info = env.step(0)
      if terminated or truncated:
          break
  print(observation, terminated, truncated)
misconceptions: [truncated-is-terminated, loop-ignores-truncated, step-returns-four, reset-returns-observation-only, unseeded-reset-repeats, truncated-state-worthless]
related: [q-learning, td-learning, classes]
cards:
  - type: predict
    prompt: "A kettle that's done at 100 degrees, and a timer that stops it after five steps. What does this print?"
    code: |
      class Kettle:
          def reset(self, seed=None, options=None):
              self.temperature, self.steps = 20, 0
              return self.temperature, {}

          def step(self, action):
              self.temperature += 25
              self.steps += 1
              terminated = self.temperature >= 100
              truncated = not terminated and self.steps >= 5
              return self.temperature, 1.0, terminated, truncated, {}


      env = Kettle()
      observation, info = env.reset()
      total = 0.0
      while True:
          observation, reward, terminated, truncated, info = env.step(0)
          total += reward
          if terminated or truncated:
              break
      print(observation, total, terminated, truncated)
    answer: "120 4.0 True False"
  - type: choice
    prompt: "What happens?"
    code: |
      class Corridor:
          def reset(self, seed=None, options=None):
              self.tile = 0
              return self.tile, {}


      env = Corridor()
      observation = env.reset()
      print(observation + 1)
    verify: error
    options:
      - text: A TypeError
        correct: true
        error: TypeError
        feedback: "reset returns two things, the observation and an info dictionary, so `observation` here is the tuple `(0, {})`. Unpack it: `observation, info = env.reset()`."
      - text: It prints 1
        misconception: reset-returns-observation-only
        feedback: "That would be right if reset returned only the observation. In Gymnasium's shape it returns `(observation, info)`."
  - type: choice
    prompt: "A practice race hits its time limit with the crab on (1, 2), so `truncated` is True. What should the Q-learning target for that last step be?"
    verify: none
    options:
      - text: The reward plus gamma times the best Q-value on (1, 2)
        correct: true
        feedback: "The race was stopped, not finished. (1, 2) still has a future; only the race clock ran out."
      - text: The reward alone
        misconception: truncated-state-worthless
        feedback: "That's right for terminated, at the finish or the pool. After a truncation, leaving the future out teaches it that (1, 2) is a dead end."
  - type: predict
    prompt: "A seeded die, in Gymnasium's shape. What does this print?"
    code: |
      import numpy as np


      class Die:
          def reset(self, seed=None, options=None):
              if seed is not None:
                  self.rng = np.random.default_rng(seed)
              return 0, {}

          def step(self, action):
              roll = int(self.rng.integers(1, 7))
              return roll, float(roll), True, False, {}


      env = Die()
      env.reset(seed=3)
      first = env.step(0)[0]
      env.reset()
      second = env.step(0)[0]
      env.reset(seed=3)
      again = env.step(0)[0]
      print(first == again, first == second)
    answer: "True False"
  - type: fix
    prompt: "This loop only stops when the episode terminates. On the pacing yard, which never terminates, it runs 1000 steps instead of stopping at the time limit. Fix it so `run` returns the number of steps the episode really had."
    code: |
      class PacingYard:
          """The crab paces up and down. Nothing ends it but the clock: 5 steps."""

          def reset(self, seed=None, options=None):
              self.steps = 0
              return 0, {}

          def step(self, action):
              self.steps += 1
              return 0, -1.0, False, self.steps >= 5, {}


      def run(env):
          observation, info = env.reset()
          for steps in range(1, 1001):
              observation, reward, terminated, truncated, info = env.step(0)
              if terminated:
                  break
          return steps
    tests: |
      def stops(ctx):
          m = ctx.module()
          got = m.run(m.PacingYard())
          if got != 5:
              raise CheckFailed("run should return 5: the episode is truncated after 5 steps.", expected=5, actual=got)


      TESTS = [custom("Stops at the time limit", stops)]
    solution: |
      class PacingYard:
          """The crab paces up and down. Nothing ends it but the clock: 5 steps."""

          def reset(self, seed=None, options=None):
              self.steps = 0
              return 0, {}

          def step(self, action):
              self.steps += 1
              return 0, -1.0, False, self.steps >= 5, {}


      def run(env):
          observation, info = env.reset()
          for steps in range(1, 1001):
              observation, reward, terminated, truncated, info = env.step(0)
              if terminated or truncated:
                  break
          return steps
