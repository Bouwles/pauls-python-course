id: functions
title: Functions
summary: |
  `def ring_bell():` teaches Python a new command, and the indented lines under it are what the command does. Nothing in them runs until the function is called, with brackets: `ring_bell()`. Call it as often as you like. A function names one piece of work, so you can check it on its own and stop writing it out twice.
example: |
  def ring_bell():
      print("Ding")

  print("Class starts")
  ring_bell()
  ring_bell()
misconceptions: [def-runs-body, call-needs-print, call-without-brackets]
related: [parameters, return-values]
drill: true
cards:
  - type: predict
    prompt: What does this print?
    code: |
      def alarm():
          print("Beep")

      print("Seven o'clock")
      alarm()
    answer: |-
      Seven o'clock
      Beep
  - type: predict
    prompt: What does this print?
    code: |
      def cheer():
          print("Hooray")
          print("Again")

      cheer()
      cheer()
    answer: |-
      Hooray
      Again
      Hooray
      Again
  - type: choice
    prompt: What does this print?
    code: |
      def greet():
          print("Evening")

      greet
      print("Done")
    options:
      - text: |-
          Evening
          Done
        misconception: call-without-brackets
        feedback: "Without brackets, `greet` is just the function's name. Nothing calls it. `greet()` would."
      - text: Done
        correct: true
  - type: choice
    prompt: What does this print?
    code: |
      def welcome():
          print("Welcome in")

      print("Doors open")
    options:
      - text: |-
          Welcome in
          Doors open
        misconception: def-runs-body
        feedback: "A `def` only stores the instructions. Nothing here calls `welcome()`, so it never runs."
      - text: Doors open
        correct: true
  - type: fix
    prompt: "The bell should ring twice. Fix the last two lines."
    code: |
      def ring():
          print("Ding")

      ring
      ring
    tests: |
      TESTS = [output("Two rings", expect="Ding\nDing")]
    solution: |
      def ring():
          print("Ding")

      ring()
      ring()
  - type: fill
    prompt: "Fill the gap so this prints `Ding`."
    code: |
      ___ ring_bell():
          print("Ding")

      ring_bell()
    blanks: [["def"]]
    tests: |
      TESTS = [output("Ding", expect="Ding")]
  - type: write
    prompt: "Write a function `pens_down()` that prints `Pens down, please.` Then call it once."
    tests: |
      TESTS = [
          function("pens_down() prints the line", call="pens_down", expect=None, prints="Pens down, please."),
          output("Called once", expect="Pens down, please.", hint="Call the function once, below the def."),
      ]
    solution: |
      def pens_down():
          print("Pens down, please.")

      pens_down()
