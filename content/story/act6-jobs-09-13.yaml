# Ada Penhallow's notes from the observatory's upper floors, Act VI Jobs 9 to 13.
# Each note is a comment in a starter file; finding it sets a story flag.
# They hint at the machine on the hill and never say where she went.
notes:
  - id: hard-to-stop
    job: regularising
    title: "Very hard to tell a thing to stop"
    text: "Stopped it the winter it was best, and kept those weights in a drawer. It went on learning anyway. It is very hard to tell a thing to stop. A.P."
    where: "A comment above train() in regular.py, copied by Professor Wendt from the back of Penhallow's seeing log, in the Make step of Regularising."
  - id: what-any-of-us-do
    job: sequences
    title: "All any of us do"
    text: "It carries the last hour into the next, and that one into the one after. By morning it remembers the whole night, a little. Tom says that's all any of us do. A.P."
    where: "A comment above step() in rnn.py, copied by Professor Wendt from the margin of Penhallow's tide roll, in the Make step of Sequences."
  - id: what-i-mean
    job: words-as-numbers
    title: "How I talk"
    text: "Every forecast since 1979, and every comment I ever wrote, in it goes. It knows how I talk now. It still doesn't know what I mean. A.P."
    where: "A comment above build_vocab() in words.py, copied by Professor Wendt from the envelope the forecasts came in, in the first Make of Words as Numbers."
  - id: which-parts-matter
    job: paying-attention
    title: "Which parts mattered"
    text: "It looks back over everything I ever did and decides which parts matter. It is better at that than I am. It is worse at knowing why they mattered. A.P."
    where: "A comment above attention() in attention.py, copied by Professor Wendt from the bottom corner of the last blackboard, in the first Make of Paying Attention."
  - id: finish-my-sentences
    job: penhallows-notebook-reader
    title: "Finish my sentences"
    text: "If a machine can finish my sentences, I can stop writing them. I am not sure that is the good news I meant it to be. A.P."
    where: "A comment near the top of reader.py, copied by Professor Wendt from the last written page of Penhallow's notebook, in the reader step of Penhallow's Notebook Reader."
