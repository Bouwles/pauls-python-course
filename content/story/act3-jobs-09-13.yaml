# Ada Penhallow's notes in Act IV (the Scrapyard), from the Maze Solver on.
notes:
  - id: one-road-in
    job: the-road-map
    title: "One road in"
    text: "The lighthouse is a dead end on this map: one road in, and the same road out. Tom says that's the whole point of a lighthouse. I've come round to his way of thinking. A.P."
    where: "A comment Nell copied from the back of Penhallow's town map, at the top of maze.py, in the starter for the Make step of Maze Solver."
  - id: tom-knows-where
    job: puzzles-from-the-pub
    title: "Tom knows where"
    text: "Sudoku, for Gwen's quiz, 1994. Three of them; one can't be done, and that's the puzzle. If I'm not back by the next quiz, Tom knows where the answers are. A.P."
    where: "A comment near the top of sudoku.py, in the starter for the Make step of Sudoku Solver."
  - id: the-other-end
    job: the-cheapest-route
    title: "The other end"
    text: "Nell's yard, on paper, winter of '96: I walked it with a tape measure. The machine on the hill found the way across in a blink, and never asked what was at the other end. A.P."
    where: "A comment at the top of planner.py, in the starter for the yard Make step of Route Planner."
