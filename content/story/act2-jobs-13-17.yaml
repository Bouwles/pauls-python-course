# Ada Penhallow's notes from the High Street, Jobs 13 to 17.
notes:
  - id: the-winter-i-went-up
    job: the-shop-timer
    title: "The winter I went up the hill"
    text: "Reads the whole price book for every single item. I know. I meant to fix it the winter I went up the hill. A.P."
    where: "A comment inside look_up_price, in Sanjay's till, in the starter for the Shop Timer's Make step."
  - id: no-stall-thirteen
    job: high-street-market-app
    title: "There is no stall 13"
    text: "There is no stall 13. The traders asked, and I don't argue with people who own that many knives. The machine on the hill numbered it anyway. It doesn't know about luck yet. A.P."
    where: "A comment at the top of stalls.py in the Market App, copied in by Moss from the old market ledger."
