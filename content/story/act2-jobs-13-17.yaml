# Ada Penhallow's notes from the High Street, Jobs 13 to 17.
notes:
  - id: the-winter-i-went-up
    job: the-shop-timer
    title: "The winter I went up the hill"
    text: "Reads the whole price book for every single item. I know. I meant to fix it the winter I went up the hill. A.P."
    where: "A comment inside look_up_price, in Sanjay's till, in the starter for the Make step of Timing and Retry Decorators."
  - id: every-penny
    job: high-street-market-app
    title: "Every penny"
    text: "Every penny in, every penny out, in pencil, since 1979. One line a month has no category: the hill. I stopped writing down what it cost the second winter. A.P."
    where: "Inside the front cover of the money book Sanjay bought at the jumble sale, its pages still blank. He copied it to the top of money.py in the Personal Finance App."
