# Ada Penhallow's notes in Act IV (the Scrapyard), Jobs 4 to 8.
notes:
  - id: writes-nothing-down
    job: recursion-junk-tower
    title: "Writes nothing down"
    text: "It adds up every file in a folder, and every folder above asks again, so the same small folders get measured over and over. It writes nothing down. The machine on the hill writes everything down and never works anything out twice. Between the two of them, there's one sensible program. A.P."
    where: "A comment above Penhallow's folder_size in tree.py, in the starter for the Make step of Recursive File Tree Printer."
  - id: branches-without-reasons
    job: family-tree-of-parts
    title: "Branches without reasons"
    text: "The catalogue, in the order I filed it. Every card knows which side of its parent it belongs on, and why: smaller, or bigger. I tried drawing the hill's decisions as a tree like this one, with a reason written on every branch. Some branches I couldn't fill in. A.P."
    where: "A comment above Penhallow's cards in catalogue.py, in the starter for the Make step of Parts Catalogue."
