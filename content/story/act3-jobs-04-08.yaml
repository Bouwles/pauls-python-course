# Ada Penhallow's notes in Act III, Jobs 4 to 8.
notes:
  - id: writes-nothing-down
    job: recursion-junk-tower
    title: "Writes nothing down"
    text: "It writes nothing down, so it works out the same short beds again and again. The machine on the hill writes everything down and never works anything out twice. Between the two of them, there's one sensible program. A.P."
    where: "A comment above Penhallow's lorry packer in tower.py, in the starter for the Make step of Recursion in the Junk Tower."
  - id: branches-without-reasons
    job: family-tree-of-parts
    title: "Branches without reasons"
    text: "The catalogue, in the order I filed it. Every card knows which side of its parent it belongs on, and why: smaller, or bigger. I tried drawing the hill's decisions as a tree like this one, with a reason written on every branch. Some branches I couldn't fill in. A.P."
    where: "A comment above Penhallow's cards in catalogue.py, in the starter for the Make step of The Family Tree of Parts."
