# Ada Penhallow's notes in Act V, Jobs 9 to 13: the observatory's lower floors.
# Each note is a comment in a starter file; finding it sets a story flag.
notes:
  - id: the-fourth-pile
    job: squashing-dimensions
    title: "The fourth pile"
    text: "I asked the machine to sort my nights into piles, and didn't say what a pile was. It made four. Three I recognised: clear, fog, gales. The fourth I still can't name, and it won't say. A.P."
    where: "A comment at the top of segments.py, copied by Professor Wendt from a note pinned inside Penhallow's plate box, in the Make steps of Customer Segmentation."
  - id: the-kettle
    job: fair-and-honest-models
    title: "Tom's kettle"
    text: "The machine learned to light the lamp when Tom's kettle boiled. Right every night for a month, for the wrong reason: Tom puts the kettle on at dusk. I took the kettle out of its readings, and it was wrong for a week. It had never known why. A.P."
    where: "A comment at the top of clinic.py, copied by Professor Wendt from a card in the bottom drawer of Penhallow's desk, in the Make step of the Model Evaluation Clinic."
  - id: the-fish-moved
    job: the-fishing-forecast
    title: "The fish moved"
    text: "The machine on the hill forecast the fishing better than the fleet for three winters running. Then the fish moved. It took the machine a season to notice, and Captain Ferro one morning. A.P."
    where: "A comment at the top of features.py, copied by Professor Wendt from the back of the fleet's catch book, in the first Make of The Fishing Forecast."
