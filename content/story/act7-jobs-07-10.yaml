# Ada Penhallow's notes from the Crab Racing Club, Act VII Jobs 7 to 10.
# Each note is a comment in a starter file; finding it sets a story flag.
notes:
  - id: every-night-was-the-night-before
    job: deep-q
    title: "The night before"
    text: "The machine on the hill does its learning at night, from memory: six winters of my evenings, shuffled. When it learned only from the night before, it decided every night was the night before. A.P."
    where: "A comment above the ReplayBuffer class in dqn.py, in the Make step of CartPole with DQN."
  - id: what-went-well
    job: learning-the-policy
    title: "What went well"
    text: "I gave the machine on the hill the simplest rule there is: do more of whatever went well. It got very good at what went well. I never found a way to tell it why it had. A.P."
    where: "A comment above reinforce_gradient() in reinforce.py, in the Make step of Policy Gradients."
  - id: lady-agatha-sat-down
    job: the-championship
    title: "When they moved the rocks"
    text: "Lady Agatha raced the club's course every Sunday for three years and never lost. The first Sunday they moved the rocks, she sat down on the start line and would not race. The machine on the hill has only ever known one town. A.P."
    where: "A comment above train() in crab.py, in the Championship."
