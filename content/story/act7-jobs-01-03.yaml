# Ada Penhallow's notes from the Crab Racing Club, Act VII Jobs 1 to 3.
notes:
  - id: one-bucket-at-a-time
    job: which-bucket
    title: "One bucket at a time"
    text: "Lady Agatha tried every bucket in the shed, one run each, before I let her choose. The committee called it dithering. She won the autumn cup on whelks and retired to the rock pool. The machine on the hill dithers too, on purpose. I taught it that before I taught it anything else. A.P."
    where: "A page from the club's 1994 bait ledger, tucked in the arcade's handbill drawer and copied into the top of abtest.py in the Make step of the A/B Test Bandit."
