# Ada Penhallow's notes for Act I, Jobs 5 to 9.
notes:
  - id: the-hill-sees-further
    job: the-fog-horn
    title: "The hill can see further"
    text: "Fog log. Visibility in metres, read off the buoys. Tom rounds up. Let him; he has earned it. On a clear night you can see the hill from the gallery. The hill can see a good deal further. That was the idea. A.P."
    where: "A comment at the top of the fog log, in the Make step of The Fog Horn."
