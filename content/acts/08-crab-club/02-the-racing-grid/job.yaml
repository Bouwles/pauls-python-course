id: the-racing-grid
title: "Gridworld Simulator"
project_name: "Gridworld Simulator"
portfolio_readme: |
  # Gridworld Simulator

  A small gridworld written as a Markov decision process: every tile, every move, the chance of slipping sideways, and the reward for each step. It simulates races that follow a policy and works out what each race was worth, so two ways round the grid can be compared fairly over a thousand races.

  Written by {name} for Neil, at Paul's Python Course. Finished {date}.

  ## Run it

  ```
  pip install numpy
  python track.py
  ```

  ```
  The traditional line
  > > > F
  ^ # ^ P
  > > > ^
  Average return over 1000 races: -7.79

  My line
  > > > F
  ^ # ^ P
  ^ < ^ <
  Average return over 1000 races: 0.92
  ```

  ## What it shows

  - A Markov decision process in plain Python: states as `(row, column)` tuples, actions, rewards, and `outcomes()`, every next state with its probability
  - A policy as a dictionary from state to action, simulated with a seeded NumPy random generator
  - The discounted return, worked backwards from the last reward
  - Comparing two policies honestly: the same rules, a thousand races each, and the average
  - In the browser the races are drawn with the workshop's `show_grid`; anywhere else the drawing is skipped and the rest runs as normal
downloadable: true
datasets: []
client: neil
building: crab-club
estimated_minutes: 80
summary: "Neil's search for a better racing line on the crab cabinet's grid, as a Markov decision process: tiles, moves, slips, rewards, policies and what a race is worth."
concepts_introduced: [mdps, returns-discounting]
concepts_reviewed: [bandits, dictionaries, tuples, while-loops, functions, default-arguments, numpy-arrays, probability]
ask:
  dialogue:
    - neil.pleased.wave: "Caitlin's crab cabinet. League night isn't a straight race. It's the grid."
    - neil.thinking: "Everyone races the traditional line. Along the bottom and up the far side."
    - paul.unimpressed: "Right past the pool."
    - neil.neutral: "It's the shortest way round. In karting, shortest is rarely fastest. I want numbers."
    - paul.thinking.point: "Then work out what it's worth. With the slips in."
  spec: |
    Write `track.py`, the racing grid as a Markov decision process:

    ```text
    ...F    F  the finish: +10, and the race is over
    .#.P    #  a rock: nothing goes through it
    S...    P  the rock pool: -10, and the race is over
            S  the start, (2, 0). Every other tile costs -1.
    ```

    A tile is a `(row, column)` pair. Told up, down, left or right, the crab goes that way with chance 0.8, and sideways with chance 0.1 each way. A step off the edge or into the rock leaves it where it was, and still costs -1.

    1. `move(tile, direction)`: where one step leads.
    2. `outcomes(tile, action, slip=0.2)`: a list of every `(probability, next tile, reward, over)` that can follow.
    3. `race(policy, rng, start=(2, 0), slip=0.2, limit=100)`: one race following a policy, a dictionary from tile to action. Returns the rewards in order.
    4. `discounted_return(rewards, gamma)`.
    5. `MY_LINE`: your own policy, better than the traditional line.

    Run as a program, it races both lines 1000 times and prints each one's average return, with `gamma = 0.9`.
  example: |
    The traditional line
    > > > F
    ^ # ^ P
    > > > ^
    Average return over 1000 races: -7.79

    My line
    > > > F
    ^ # ^ P
    ^ < ^ <
    Average return over 1000 races: 0.92
ship:
  dialogue:
    - neil.surprised: "Minus seven point eight. The line everyone races averages minus seven point eight."
    - caitlin.laughing: "Including you. Twice a week."
    - neil.pleased.thumbs: "Not any more. That's a racing line, and I'll be studying it."
    - paul.neutral: "Next time, the worth of every tile, without running a single race."
  shelf: { object: racing-grid, label: "Neil's racing line on the crab's grid, slips and all" }
  cards: [mdps, returns-discounting]
stretch:
  - id: rough-weather
    title: "Rough weather"
    prompt: |
      On the cabinet's hard setting the crab slips four times in ten. Race both lines with `slip=0.4`. Which one suffers more, and why? Does your line still beat tradition?
  - id: how-long
    title: "How long is a race"
    prompt: |
      Print the average number of steps in a race for each line, and how often each ends in the pool. Neil wants both figures, the way a race engineer would.
