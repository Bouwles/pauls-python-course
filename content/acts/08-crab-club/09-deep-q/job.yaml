id: deep-q
title: "CartPole with DQN"
project_name: "CartPole with DQN"
portfolio_readme: |
  # CartPole with DQN

  A Deep Q-Network written from scratch in NumPy that learns to balance Gymnasium's CartPole-v1. A small network gives a Q-value for pushing the cart left or right from the four numbers that describe it; a replay buffer of 50,000 steps and a target network refreshed every 500 steps keep the learning steady. After 100,000 steps of practice it keeps the pole up for the full 500 steps. Pushing at random manages about 22.

  Written by {name} for Neil, at Paul's Python Course. Finished {date}.

  ## Run it

  ```
  python -m venv .venv
  source .venv/bin/activate        # on Windows: .venv\Scripts\activate
  pip install -r requirements.txt
  python cartpole_dqn.py
  pytest
  ```

  ```
  Pushing at random: 21.7 steps, on average
  The network: 500.0 steps of 500, on average
  ```

  `cartpole_dqn.py` lives in the Take It Home project folder, with its tests. `dqn.py` and `track.py`, here, are the first version, built in the workshop on a small racing grid where every Q-value can be checked against the exact answer: `python dqn.py` trains it and races the result.

  ## What it shows

  - Deep Q-learning: a network trained by regression on targets made from its own frozen copy
  - Experience replay, kept in NumPy arrays and sampled at random, so the network doesn't learn only from the last few steps
  - The difference between an episode that is terminated (the pole fell) and one that is truncated (time ran out), and why only one of them stops the target
  - A forward pass and backpropagation by hand, Adam, the Huber loss, and the best network kept by checking it on episodes it never trains on
