id: crab-club
number: 8
title: "The Arcade"
district: crab-club
subject: "Reinforcement learning"
hours: 50
summary: "Aaesha and Caitlin's floor: a row of cabinets, a leaderboard, a prize shelf and a racing crab that knows nothing yet. Caitlin brings the games; Aaesha wants to know how anything learns to decide. Bandits, Markov decision processes, dynamic programming, Monte Carlo and TD learning, Q-learning, DQN, policy gradients, actor-critic and PPO, all the way to the weekly Arcade League."
locked_line: "The seventh floor. Dust sheets over the cabinets, a blank leaderboard, and the crab asleep in cabinet three."
intro:
  - paul.neutral.wave: "Welcome up to the seventh floor, this is the Arcade. Mind the cables on your way in."
  - paul.thinking: "Up to now you've been telling programs what to do, but up here they work it out for themselves by trying."
  - aaesha.pleased: "It's basically how people learn, isn't it? You try something, see how it went and do a bit better next time."
  - caitlin.laughing.point: "The crab's in cabinet three and it doesn't know a thing yet, which is where you come in."
  - yahya.unimpressed: "The leaderboard's by the door, if you're wondering. Your name isn't on it yet."
