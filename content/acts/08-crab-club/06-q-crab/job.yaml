id: q-crab
title: "Q-Learning Crab"
project_name: "Q-Learning Crab"
portfolio_readme: |
  # Q-Learning Crab

  The Arcade's racing crab learns a 7 by 9 course by racing it. Tabular Q-learning with epsilon-greedy exploration fills a table of what every move is worth on every tile; the greedy policy from that table is raced fifty times and saved in the Arcade League's entry format.

  Written by {name} for Caitlin, at Paul's Python Course. Finished {date}.

  ## Run it

  ```
  pip install numpy
  python crab.py
  ```

  ```
  > > v v # < > v v
  v # v v # v > v v
  v # v > > v v v <
  > > v # # v > v #
  > > > > > v # v v
  v > # > > v # v v
  > > > ^ # > > > F
  50 races: 15.72 moves on average, 50 finished
  Saved league.json
  ```

  `course.py` has the League's rules and reads the course from `club-course.json`; `crab.py` is the learner.

  ## What it shows

  - Q-learning: the TD update towards the reward plus the best Q-value of the next tile, learned without a model of the course
  - Epsilon-greedy exploration over a Q-table held as a 7 by 9 by 4 NumPy array
  - Practice races that alternate between the start and random tiles, so every part of the course gets visited
  - Reading and writing JSON, in an agreed format another program can race
