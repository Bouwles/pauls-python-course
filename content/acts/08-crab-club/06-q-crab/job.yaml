ask:
  dialogue:
    - caitlin: "The Arcade League. Every week, the same course and the same rules for everyone's crab."
    - yahya: "Seven rows, nine columns, two rock pools and a lot of rocks."
    - caitlin: "Nobody gets a map of the chances. You race it until you know it."
    - paul: "Then the crab learns the worth of every move, not just every tile."
  spec: |
    The League course is in `club-course.json`, and Yahya has copied the League's rules into `course.py`. The crab starts at S, top left, and races to F, bottom right. It slips sideways one move in ten on sand and 35 in a hundred in a rock pool. Into a rock or off the course, it stays put. A race stops at 100 moves, and the League's score is the average number of moves: lower is better.

    Write `crab.py`:

    1. `choose(Q, tile, epsilon, rng)`: epsilon-greedy over the four actions. Ties go to the first, as `np.argmax` does.
    2. `q_update(Q, tile, action, reward, after, over, alpha=0.1, gamma=1.0)`: one Q-learning update, in place; returns the TD error.
    3. `train(races, rng, alpha=0.1, gamma=1.0, epsilon=0.1)`: Q-learning. Practice races alternate: one from `START`, the next from `random_start(rng)`. Returns the Q-table, a 7 by 9 by 4 array.
    4. `greedy_policy(Q)`: the best action on every tile, as 7 lists of 9.
    5. `save_entry(Q, path="league.json")`: `{"format": "ppc-league-1", "q": ...}`, the League's entry format.

    Run as a program, it trains for 3000 practice races, shows the policy, races it 50 times, and saves `league.json`.
  example: |
    > > v v # < > v v
    v # v v # v > v v
    v # v > > v v v <
    > > v # # v > v #
    > > > > > v # v v
    v > # > > v # v v
    > > > ^ # > > > F
    50 races: 15.72 moves on average, 50 finished
    Saved league.json
ship:
  dialogue:
    - yahya: "Fifteen point seven moves. The League record is..."
    - yahya: "...also fifteen point seven moves. As of this afternoon."
    - caitlin: "Enter league.json on the League page. This week's races start on Monday."
    - paul: "Same course and same luck for every crab. Only the training differs."
  shelf: { object: rosette, label: "The crab's Arcade League entry" }
  cards: [q-learning, sarsa]
stretch:
  - id: sarsa-on-the-course
    title: "SARSA on the League course"
    prompt: |
      Write `sarsa_update` and a `train_sarsa` that chooses the next action before updating and uses it in the target. Train both for 3000 and for 6000 practice races and race each greedy policy 50 times. Which learns the course faster? Is there anywhere on the League course that SARSA would be wise to give a wide berth?
  - id: calmer-exploring
    title: "Exploring less as it learns"
    prompt: |
      Let epsilon fall from 0.3 to 0.01 over the practice races. Does the crab need fewer races to get under 16 moves? Plot the 50-race average every 250 races for fixed and falling epsilon, on one chart.
