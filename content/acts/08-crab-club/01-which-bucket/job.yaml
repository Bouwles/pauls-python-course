id: which-bucket
title: "A/B Test Bandit"
project_name: "A/B Test Bandit"
portfolio_readme: |
  # A/B Test Bandit

  Tests four attract screens for an arcade cabinet against each other, and shows the winner more often while the test is still running. It runs the same test five ways, from a plain even split to Thompson sampling, counts what each way cost in visitors who walked past without playing, and recommends a winner with the chance that it really is the best.

  Written by {name} for Caitlin, at Paul's Python Course. Finished {date}.

  ## Run it

  ```
  pip install numpy matplotlib
  python abtest.py
  ```

  ```
  strategy            played  lost  its pick
  even split             584   238  waving crab
  greedy                 485   350  high-score table
  epsilon-greedy         749    69  waving crab
  UCB                    690   124  waving crab
  Thompson sampling      827    26  waving crab

  Recommendation: waving crab, 96% likely to be the best
  ```

  Then a chart opens: each strategy's share of visitors who played so far, against the number of visitors, with the best screen's rate as a dashed line.

  The visitors are simulated. Each screen has a true rate in `RATES` that no strategy is allowed to read, which is what lets the program count exactly what each test cost. For a real test, the strategies and `chance_best` work unchanged on real counts.

  ## What it shows

  - A multi-armed bandit: choices that each pay off at an unknown rate, learned one try at a time with a running average that keeps no list of old results
  - Three ways to trade exploring against exploiting: epsilon-greedy, UCB (an upper confidence bound) and Thompson sampling from Beta distributions
  - Regret, the cost of a test: the visitors each version was expected to lose against the best one
  - Strategies as functions passed to other functions, a `lambda`, NumPy arrays changed in place, and a seeded random generator so every run can be repeated
downloadable: true
# The visitors are simulated from invented rates: a bandit has to be judged against a
# truth it can't see, and no public dataset of attract screens exists. See the README.
datasets: []
client: caitlin
building: crab-club
estimated_minutes: 90
summary: "Four attract screens for Caitlin's new cabinet, five thousand visitors walking past, and a test that shows the winner more often as it learns: epsilon-greedy, UCB and Thompson sampling."
concepts_introduced: [bandits, exploration-exploitation, ab-testing]
concepts_reviewed: [numpy-arrays, matplotlib, probability, functions-as-values, lambda, mutability, default-arguments, f-strings, zip]
ask:
  dialogue:
    - caitlin.pleased.wave: "New cabinet. Riya drew four attract screens for it: the loop it plays when nobody's playing."
    - riya.proud: "A high-score table, a demo race, a flashing coin and a crab that waves at you."
    - caitlin.unimpressed: "The fair way is a quarter of the visitors each. For a fortnight. I'll be bored by Tuesday."
    - aaesha.thinking.think: "People choose like this every day. Stick with the best so far, or try something new?"
    - paul.unimpressed: "Fair to the screens. The visitors pay for it. There's a cheaper kind of fair."
  spec: |
    Every visitor who walks past Caitlin's new cabinet sees one of four attract screens. If they stop and play, that screen scored (reward 1); if they walk on, it didn't (reward 0). Each version has its own chance of bringing a visitor in, and nobody knows what it is.

    A plain A/B test shows the versions in turn and compares them at the end. A bandit test learns as it goes, and shows whichever is winning more often.

    Write `abtest.py`:

    1. `update(estimates, counts, version, reward)` keeps a running average for each version, in place.
    2. Four strategies, each `choose(estimates, counts, rng)` returning a version number: `choose_even_split` (the plain A/B test), `choose_epsilon_greedy` (with `epsilon=0.1`), `choose_ucb` (with `c=1.0`) and `choose_thompson`.
    3. `run_test(choose, rates, visitors, rng)` shows one screen to each visitor and returns `(estimates, counts, rewards)`.
    4. `regret(counts, rates)`: the visitors a test is expected to have lost, against showing everyone the best version.
    5. `chance_best(estimates, counts, rng, draws=10000)`: each version's chance of really being the best.
    6. Run as a program, it tries the even split, plain greedy, epsilon-greedy, UCB and Thompson sampling on 5000 visitors each, prints a line for each, recommends a screen, and draws a chart.
  example: |
    strategy            played  lost  its pick
    even split             584   238  waving crab
    greedy                 485   350  high-score table
    epsilon-greedy         749    69  waving crab
    UCB                    690   124  waving crab
    Thompson sampling      827    26  waving crab

    Recommendation: waving crab, 96% likely to be the best
ship:
  dialogue:
    - caitlin.laughing.cheer: "The waving crab. I said it would be the waving crab."
    - yahya.unimpressed: "You said the demo race."
    - caitlin.unimpressed: "We don't talk about the demo race."
    - aaesha.pleased: "Twenty-six visitors lost. The fair way would have lost two hundred and thirty-eight."
    - paul.proud.thumbs: "Same answer, a tenth of the cost. That's the whole idea."
  shelf: { object: tally-counter, label: "Caitlin's attract-screen test" }
  cards: [bandits, exploration-exploitation, ab-testing]
stretch:
  - id: optimistic-start
    title: "An optimistic start"
    prompt: |
      Start every estimate at 1.0 instead of 0, and run plain greedy again. A screen only loses its shine by being shown, so greedy tries them all before it settles. How does it do now, and why does it still lose more visitors than Thompson sampling?
  - id: calming-down
    title: "Exploring less as you learn"
    prompt: |
      Epsilon-greedy explores one visitor in ten for ever. Write `choose_decaying(estimates, counts, rng)` whose epsilon is `1 / sqrt(total visitors + 1)`, so it explores a lot early and hardly at all later. Add it to the table and the chart.
  - id: stop-when-sure
    title: "Stop when you're sure"
    prompt: |
      Caitlin would rather not wait a fortnight. Write `run_until_sure(choose, rates, rng, confidence=0.95, check_every=100, most=20000)`, which checks `chance_best` every 100 visitors and stops as soon as one version is at least 95 per cent likely to be the best. Return the winner and the number of visitors it took. How many does the even split need, and how many does Thompson sampling? Run each ten times with different seeds: how often does each stop on the wrong screen?
