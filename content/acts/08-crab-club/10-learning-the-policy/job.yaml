id: learning-the-policy
title: "Policy Gradients"
project_name: "Policy Gradients"
portfolio_readme: |
  # Policy Gradients

  REINFORCE on a gridworld: a policy that is a softmax over four preferences on every tile, learned directly from races by nudging the preferences towards whatever went well. It measures how much a baseline steadies the gradient estimates, then trains with one and races the result.

  Written by {name} for the Arcade Committee, on the pier at {{town}}. Finished {date}.

  ## Run it

  ```
  pip install numpy
  python reinforce.py
  ```

  ```
  Spread of 200 estimates at random, no baseline: 39.26
  Spread of 200 estimates at random, with a baseline: 16.72

  After 500 races with a baseline, his most likely moves
  > > > F
  ^ # ^ P
  ^ < > v
  Average return over 1000 races: 1.12
  ```

  ## What it shows

  - A softmax policy and the gradient of the log of each move's chance, worked out by hand and checked against a numerical gradient
  - REINFORCE: returns to go, times that gradient, averaged over races, as a step uphill
  - A learned baseline, and a measurement of how much it cuts the spread of the gradient estimates
  - A stochastic policy raced as it is, chances and all
downloadable: true
datasets: []
client: committee
building: crab-club
estimated_minutes: 120
summary: "REINFORCE on the racing grid: a softmax policy nudged towards whatever went well, and a baseline that steadies every nudge."
concepts_introduced: [policy-gradients]
concepts_reviewed: [dqn, monte-carlo, returns-discounting, mdps, bandits, exploration-exploitation, numerical-gradient-checking, gradient-descent, numpy-arrays]
ask:
  dialogue:
    - committee: "Values, Q-values, targets, frozen copies. The committee has a simpler question."
    - committee: "On each tile, what should he do?"
    - committee: "Not what it is worth. What to do."
    - moss: "Then learn that and nothing else. Whatever went well, more often."
  spec: |
    Write `reinforce.py`, REINFORCE on the racing grid in `track.py`. Sir Reginald's policy is `theta`, an array of shape `(3, 4, 4)`: four preferences for every tile, in the order of `ACTIONS`.

    1. `chances(theta, tile)`: the softmax of the tile's four preferences.
    2. `grad_log_chance(theta, tile, action)`: the gradient of the log of that move's chance, for every number in `theta`.
    3. `race(theta, rng, limit=50)`: one race from the start, every move drawn from its chances, as a list of `(tile, action, reward)`.
    4. `returns_to_go(rewards, gamma=0.9)`: for every step, the discounted return from there to the end.
    5. `reinforce_gradient(theta, races, gamma=0.9, baseline=None)`: for every move of every race, its return to go, less `baseline[tile]` if there is a baseline, times `grad_log_chance`; added up, and averaged over the races.
    6. `train(episodes, rng, rate=0.1, gamma=0.9, use_baseline=True)`: one race and one step uphill per episode. The baseline is a `(3, 4)` array, each tile's number nudged 0.1 of the way towards every return that followed it. Returns `(theta, baseline)`.

    Run as a program, it compares how much 200 estimates disagree without and with a baseline, then trains for 500 races and races his policy 1000 times.
  example: |
    Spread of 200 estimates at random, no baseline: 39.26
    Spread of 200 estimates at random, with a baseline: 16.72

    After 500 races with a baseline, his most likely moves
    > > > F
    ^ # ^ P
    ^ < > v
    Average return over 1000 races: 1.12
ship:
  dialogue:
    - committee: "One point one two. And he still takes a wrong turning now and then..."
    - committee: "...on purpose. In case it is not wrong."
    - committee: "We have decided to call it character."
    - moss: "He waits for the end of every race to learn anything. Next, someone tells him sooner."
  shelf: { object: pennant, label: "Sir Reginald's own policy" }
  cards: [policy-gradients]
story_note: what-went-well
stretch:
  - id: batches
    title: "Five races a step"
    prompt: |
      Change `train` to race five times and step once on `reinforce_gradient` of all five, with `rate=0.3`. Train ten seeds with one race a step and ten with five, at the same total number of races. Which gives steadier results?
  - id: whole-race
    title: "Credit where it's due"
    prompt: |
      Pip credits every move with the return of the whole race, from the start, not from that move on. Try it. It still learns, on average, but more slowly. Measure the spread of 200 estimates both ways and explain to Dennis why a move shouldn't take credit for what happened before it.
