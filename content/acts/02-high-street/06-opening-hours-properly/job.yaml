id: opening-hours-properly
title: "Opening Hours, Properly"
client: sanjay
building: high-street
estimated_minutes: 60
summary: "One module of opening-hours helpers, imported by every shop on the High Street."
concepts_introduced: [modules, main-guard, standard-library]
concepts_reviewed: [imports, functions, return-values, none, dictionaries, dict-get, tuples, unpacking, list-comprehensions]
ask:
  dialogue:
    - sanjay: "Every shop on the High Street has its own copy of Penhallow's opening-hours code."
    - sanjay: "Mrs Vance changed hers, and now the library closes at half past never."
    - sanjay: "We want one copy that everyone uses. I said I'd ask. I'm good at asking."
    - moss: "A module, then. Write it once, import it everywhere."
  spec: |
    Write `hours.py`, a module the shops can import. A shop's hours are a dictionary of day to `(opens, closes)`, in whole hours on the 24-hour clock. A day that's missing is a day the shop is closed.

    - `is_open(hours, when)`: `True` if the shop is open at `when`, a `datetime`. Open from the opening hour; closed from the closing hour.
    - `sign(hours)`: seven lines for the door, Monday first: `Mon 8 till 18`, or `Sun closed`.
    - `busiest_day(visits)`: the day name, like `Sat`, that comes up most in a list of visit times. If days tie, the one seen first. No visits: `None`.

    The traders' board, `main.py`, is already written. Run on its own, `hours.py` prints a quick check of itself; imported, it stays quiet.
  example: |
    Saturday 11:30 on the High Street
    Sanjay's: open
    Okonjo's: closed
    The Library: open

    Sanjay's door:
      Mon 8 till 18
      Tue 8 till 18
      Wed 8 till 18
      Thu 8 till 18
      Fri 8 till 18
      Sat 8 till 13
      Sun closed

    Busiest at Sanjay's: Sat
ship:
  dialogue:
    - sanjay: "Okonjo's shut on a Saturday. I knew that. Now the board knows it too."
    - okonjo: "Correct to the hour. I'd prefer the minute, but one thing at a time."
    - moss: "One copy. When it's wrong, it's wrong in one place. That's the point."
  shelf: { object: shop-sign, label: "The High Street hours module" }
  cards: [modules, main-guard, standard-library]
story_note: the-hill-took-the-time
stretch:
  - id: closing-soon
    title: "Closing soon"
    prompt: |
      Add `closing_soon(hours, when)` to `hours.py`: `True` if the shop is open now and closes within the next hour. Sanjay wants to put the kettle on at the right moment. Add a quick check for it under the main guard: Saturday at 12:30 should be `True`, at 11:30 `False`.
  - id: another-program
    title: "A second customer for the module"
    prompt: |
      Write a second program, for the library's front door, that imports `hours` and prints the library's sign. Nothing about opening hours should be written twice. That's what the module is for.
