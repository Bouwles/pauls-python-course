id: penhallows-logs
title: "Penhallow's Logs"
client: moss
building: workshop
estimated_minutes: 60
summary: "Read Penhallow's log report, then teach it to survive a bad line."
concepts_introduced: [exceptions, try-except, raising-errors, defensive-input]
concepts_reviewed: [reading-tracebacks, value-error, enumerate, unpacking, multiple-returns, with-statement, files, strip-replace, dict-get, dict-items, comments]
ask:
  dialogue:
    - moss: "Every machine in town writes to one log. Penhallow wrote the program that reads it."
    - moss: "It stops at the first bad line. These days, a lot of the lines are bad."
    - moss: "Read it properly before you touch it. She usually had a reason."
  spec: |
    Penhallow's script reads `machines.log` and counts the errors from each machine. It stops dead at the first line it can't read.

    Change it so it reads every line it can, skips the ones it can't, and says which it skipped and why. Blank lines aren't problems, and a level in lower case still counts.
  example: |
    11 entries read
    Errors by machine:
      fog-horn: 2
      lamp: 2
      tide-gauge: 1
    Skipped 3 lines:
      line 6: expected 4 parts, got 3
      line 9: unknown level WARNING
      line 12: expected 4 parts, got 1
ship:
  dialogue:
    - moss: "Eleven read, three skipped, and it says which three. Agnes can chase the ferry machine."
    - moss: "Line one, though. Something on the hill, at two in the morning."
    - moss: "Nothing up there writes logs. Not that I know of."
  shelf: { object: log-book, label: "Penhallow's log report, now with manners" }
  cards: [exceptions, try-except, raising-errors, defensive-input]
story_note: still-learning
stretch:
  - id: proper-time
    title: "A proper time"
    prompt: |
      Some machines write `7:5` instead of `07:05`. Make `parse_line` raise a `ValueError` unless the time is five characters with a colon in the middle, like `06:42`. The message should say which line, as hers do: `line 3: bad time 7:5`.
    tests: tests/stretch-proper-time.py
    solution: solutions/stretch-proper-time.py
  - id: by-hour
    title: "Errors by the hour"
    prompt: |
      Moss suspects the fog horn fails in the early morning. After the report, print how many errors there were in each hour, using the first two characters of the time: `07: 2`, `08: 1`. A dictionary and `.get()` will do it.
