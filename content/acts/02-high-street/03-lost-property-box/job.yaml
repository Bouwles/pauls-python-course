id: lost-property-box
title: "Lost Property Matcher"
project_name: "Lost Property Matcher"
portfolio_readme: |
  # Lost Property Matcher

  Matches what was handed in against what people have asked about. Repeats are counted once, so an umbrella written down three times is one umbrella. It reports how many different things were handed in, which of them someone is looking for, which nobody has asked about, and what has been asked about but hasn't turned up.

  Written by {name} for Caitlin, at Paul's Python Course, for the Studio's lost property box. Finished {date}.

  ## Run it

  ```
  python main.py
  ```

  ```
  Handed in: 4 different items
  Matched: black umbrella, red scarf
  Nobody has asked about: blue headphones, dice bag
  Still missing: spare controller
  ```

  ## What it shows

  - Sets: a list with the repeats taken out, in one step
  - Set operations: `&` for what's in both, `-` for what's in one and not the other
  - Why `in` on a set is fast, however much is in the box
downloadable: true
datasets: []
client: caitlin
building: town-hall
estimated_minutes: 50
summary: "Match what was left behind after the Studio's game nights against what people have asked about, counting every umbrella once."
concepts_introduced: [sets, set-operations, membership-speed]
concepts_reviewed: [lists, in-operator, split-join, sorted-vs-sort, functions, for-loops, tuples]
ask:
  dialogue:
    - caitlin.pleased.wave: "The Studio's lost property box is mine now. Friday game nights keep it full."
    - caitlin.unimpressed: "Every umbrella is written down twice. Some three times. One scarf, eleven times."
    - caitlin.thinking: "I want each thing once. And I want to know which ones people have asked about."
    - paul.neutral: "Sets, then. They don't hold with duplicates either."
  spec: |
    `found` lists everything handed in, repeats and all. `reported` lists what people have asked about.

    Write `report(found, reported)`. It prints four lines:

    - how many different items were handed in
    - the items handed in that someone has asked about
    - the items handed in that nobody has asked about
    - the items asked about that haven't turned up

    Items go in alphabetical order, separated by `, `. A line with no items says `none`.
  example: |
    Handed in: 4 different items
    Matched: black umbrella, red scarf
    Nobody has asked about: blue headphones, dice bag
    Still missing: spare controller
ship:
  dialogue:
    - caitlin.laughing.cheer: "One red scarf. One. It was handed in eleven times, by the same person."
    - caitlin.pleased.point: "And the dice bag is Yahya's. He says his luck was in it."
    - yahya.unimpressed: "It was. I lost four games without it."
  shelf: { object: umbrella, label: "Caitlin's lost property matcher" }
  cards: [sets, set-operations, membership-speed]
stretch:
  - id: capitals
    title: "Red Scarf and red scarf"
    prompt: |
      People write `Red Scarf`, `red scarf` and `RED SCARF` for the same scarf. Make `report` treat them as one item, shown in lower case. Lower-case each item before it goes into a set.
    tests: tests/stretch-capitals.py
    solution: solutions/stretch-capitals.py
  - id: last-year
    title: "Same as last year"
    prompt: |
      Caitlin kept last term's list too. Print the items handed in both terms, and the items that are new this term. `&` and `-` again, on two different sets.
