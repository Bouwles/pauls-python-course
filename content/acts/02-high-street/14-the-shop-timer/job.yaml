id: the-shop-timer
title: "The Shop Timer"
client: sanjay
building: greengrocer
estimated_minutes: 80
summary: "Time every function in Sanjay's till, log it, and find the slow one."
concepts_introduced: [functions-as-values, lambda, map-filter, sort-key, closures, decorators]
concepts_reviewed: [functions, parameters, return-values, tuples, unpacking, args-kwargs, list-comprehensions, dictionaries, standard-library, main-guard, f-strings, slicing, sorted-vs-sort]
ask:
  dialogue:
    - sanjay: "Saturday mornings the till goes slow. The queue goes right out past the leeks."
    - sanjay: "Lovely queue, mind. Great chats. But Mrs Vance timed me. Four minutes for two plums."
    - sanjay: "Penhallow's till has a function for everything. One of them is dawdling."
    - moss: "Don't guess which. Measure."
  spec: |
    Write a decorator `timed` that times a function every time it runs, appends `(name, seconds)` to the list `log`, and hands back the function's own result. Read the time with `clock()`: it starts as `time.perf_counter`, and the checks swap it for a clock that ticks in known steps.

    Put `@timed` on Sanjay's three till functions. Then write two helpers for the report:

    - `slowest(entries, count)`: a list of the names of the `count` slowest calls, slowest first
    - `slow_calls(entries, limit)`: a list of the entries that took longer than `limit` seconds, in the order they happened
  example: |
    Plums: £3.15
    Leeks: £1.80
    Figs: £1.60
    Slowest: ['look_up_price']
    look_up_price took 0.30 s
    look_up_price took 0.30 s
    look_up_price took 0.30 s
ship:
  dialogue:
    - sanjay: "Look up price. Three tenths of a second, every single time."
    - sanjay: "Ten things a customer, that's three seconds of standing about. I knew it wasn't my chatting."
    - moss: "Some of it was your chatting."
  shelf: { object: stopwatch, label: "Sanjay's till timer" }
  cards: [functions-as-values, lambda, map-filter, sort-key, closures, decorators]
story_note: the-winter-i-went-up
stretch:
  - id: remembered
    title: "Fix the dawdler"
    prompt: |
      Penhallow's note says `look_up_price` reads the whole price book every time. Write a second decorator, `remembered`, that keeps each answer in a dictionary inside a closure, so asking for plums twice only looks once.

      Put `@timed` above `@remembered`. The log shows the second lookup taking almost nothing.
  - id: timed-as
    title: "Timed, with a label"
    prompt: |
      Write `timed_as(label)`, a decorator that takes an argument: `@timed_as("till")` logs `("till: weigh", seconds)`. It's one more function wrapped around the decorator you already have, and a closure keeps hold of `label`.
