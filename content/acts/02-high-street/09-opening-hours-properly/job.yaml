id: opening-hours-properly
title: "Opening Hours Module"
project_name: "Opening Hours Module"
portfolio_readme: |
  # Opening Hours Module

  One module of opening-hours helpers, `hours.py`, written once and imported by every floor of the Clocktower. It says whether a room is open at a given moment, prints the seven lines for the door, and finds the busiest day from a list of visits. A board for the front door, `main.py`, imports it and shows every room.

  Written by {name} for Caitlin, at Paul's Python Course. Finished {date}.

  ## Run it

  ```
  python main.py
  ```

  shows the board. `python hours.py` runs the module's own quick checks instead: run directly, it tests itself; imported, it stays quiet.

  ## Use it in your own programs

  ```python
  from datetime import datetime
  import hours

  studio = {"Mon": (8, 18), "Sat": (8, 13)}
  hours.is_open(studio, datetime(2026, 11, 7, 11, 30))   # True
  print("\n".join(hours.sign(studio)))
  ```

  ## What it shows

  - A module of your own, imported with `import hours`, so nothing is written twice
  - `if __name__ == "__main__":` for code that runs only when the file is run directly
  - The standard library: `datetime` for moments in time, `collections.Counter` for counting
