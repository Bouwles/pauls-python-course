id: opening-hours-properly
title: "Opening Hours Module"
project_name: "Opening Hours Module"
portfolio_readme: |
  # Opening Hours Module

  One module of opening-hours helpers, `hours.py`, written once and imported by every shop on the High Street. It says whether a shop is open at a given moment, prints the seven lines for the shop door, and finds the busiest day from a list of visits. A traders' board, `main.py`, imports it and shows the whole street.

  Written by {name} for the traders of {{town}}'s High Street. Finished {date}.

  ## Run it

  ```
  python main.py
  ```

  shows the board. `python hours.py` runs the module's own quick checks instead: run directly, it tests itself; imported, it stays quiet.

  ## Use it in your own programs

  ```python
  from datetime import datetime
  import hours

  sanjays = {"Mon": (8, 18), "Sat": (8, 13)}
  hours.is_open(sanjays, datetime(2026, 11, 7, 11, 30))   # True
  print("\n".join(hours.sign(sanjays)))
  ```

  ## What it shows

  - A module of your own, imported with `import hours`, so nothing is written twice
  - `if __name__ == "__main__":` for code that runs only when the file is run directly
  - The standard library: `datetime` for moments in time, `collections.Counter` for counting
