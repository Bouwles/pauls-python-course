summary: "One module of opening-hours helpers, imported by every floor of the Clocktower, and Caitlin's board by the front door to show it off."
concepts_introduced: [modules, main-guard, standard-library]
concepts_reviewed: [imports, functions, return-values, none, dictionaries, dict-get, tuples, unpacking, list-comprehensions, counter]
ask:
  dialogue:
    - caitlin.pleased.wave: "I want a board by the front door. Every floor, open or shut, right now."
    - caitlin.thinking: "But every floor has its own copy of the opening-hours code."
    - caitlin.unimpressed: "Somebody changed the Workshop's copy. Now it closes at half past never."
    - paul.laughing: "That somebody was me. A module, then. Write it once, import it everywhere."
  spec: |
    Write `hours.py`, a module every floor can import. A room's hours are a dictionary of day to `(opens, closes)`, in whole hours on the 24-hour clock. A day that's missing is a day the room is closed.

    - `is_open(hours, when)`: `True` if the room is open at `when`, a `datetime`. Open from the opening hour; closed from the closing hour.
    - `sign(hours)`: seven lines for the door, Monday first: `Mon 8 till 18`, or `Sun closed`.
    - `busiest_day(visits)`: the day name, like `Sat`, that comes up most in a list of visit times. If days tie, the one seen first. No visits: `None`.

    The board for the front door, `main.py`, is already written. Run on its own, `hours.py` prints a quick check of itself; imported, it stays quiet.
  example: |
    Saturday 11:30 at the Clocktower
    The Studio: open
    The Makerspace: closed
    The Workshop: open

    The Studio's door:
      Mon 8 till 18
      Tue 8 till 18
      Wed 8 till 18
      Thu 8 till 18
      Fri 8 till 18
      Sat 8 till 13
      Sun closed

    Busiest in the Studio: Sat
ship:
  dialogue:
    - riya.laughing: "The Makerspace is shut on a Saturday. I knew that. Now the board knows it too."
    - caitlin.pleased.point: "Correct to the hour. I'd like a countdown on it, but one thing at a time."
    - paul.proud.thumbs: "One copy. When it's wrong, it's wrong in one place. That's the point."
  shelf: { object: shop-sign, label: "The Clocktower hours module" }
  cards: [modules, main-guard, standard-library]
stretch:
  - id: closing-soon
    title: "Closing soon"
    prompt: |
      Add `closing_soon(hours, when)` to `hours.py`: `True` if the room is open now and closes within the next hour. Caitlin wants to start the last game before the Studio shuts. Add a quick check for it under the main guard: Saturday at 12:30 should be `True`, at 11:30 `False`.
  - id: another-program
    title: "A second customer for the module"
    prompt: |
      Write a second program, for the Workshop's door, that imports `hours` and prints the Workshop's sign. Nothing about opening hours should be written twice. That's what the module is for.
