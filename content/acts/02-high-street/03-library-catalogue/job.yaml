id: library-catalogue
title: "The Library Catalogue"
client: vance
building: library
estimated_minutes: 60
summary: "Read Mrs Vance's catalogue from a file, add the donations, and write it back."
concepts_introduced: [files, with-statement, csv-module, paths]
concepts_reviewed: [sets, membership-speed, dictionaries, lists, append-pop, functions, f-strings, split-join]
ask:
  dialogue:
    - vance: "Penhallow put my catalogue in a file. The program that read it went with her."
    - vance: "People leave books in a box by the door. Donations, they call it."
    - vance: "Some are new. Some we've had since 1815. I will not have two cards for one book."
    - moss: "Read the file, check the box, write the file back. In that order."
  spec: |
    The catalogue is `catalogue.csv` and the donations box is `donations.csv`. Both have the columns `title`, `author`, `year` and `shelf`.

    Write `load_books(path)`: it takes a file name and returns the books in it as a list of dictionaries, or an empty list if the file doesn't exist.

    Then, for each donation: if a book with that title is already in the catalogue, say so; otherwise add it. Save the catalogue back to `catalogue.csv`, header first, and say how many books it has.

    If there are no donations, because the file is missing or has no books in it, print `No donations today.` and leave the catalogue alone.
  example: |
    Emma is already catalogued.
    Added: The Saltmarsh Almanac
    Added: Knots, Unexplained
    The catalogue has 7 books.
ship:
  dialogue:
    - vance: "Seven books. The almanac is new. The Emma is a duplicate, and it's going back in the box."
    - vance: "Knots, Unexplained, by Captain Ferro. That sounds about right."
  shelf: { object: card-index, label: "Mrs Vance's catalogue, saved properly" }
  cards: [files, with-statement, csv-module, paths]
stretch:
  - id: by-author
    title: "Everything by one author"
    prompt: |
      Write `by_author(books, author)`: it returns the titles by that author, in alphabetical order. `by_author(load_books("catalogue.csv"), "Jane Austen")` gives `["Emma"]`.
    tests: tests/stretch-by-author.py
    solution: solutions/stretch-by-author.py
  - id: backup
    title: "A backup first"
    prompt: |
      Before saving, copy the old catalogue to `backups/catalogue.csv`, so a bad day can be undone. `Path("backups").mkdir(exist_ok=True)` makes the folder if it isn't there yet.
