id: tuples-at-the-tailors
title: "Tuples at the Tailor's"
client: okonjo
building: tailor
estimated_minutes: 50
summary: "Mr Okonjo's measurements, kept together and kept still."
concepts_introduced: [tuples, unpacking, multiple-returns, enumerate, zip]
concepts_reviewed: [lists, looping-lists, for-loops, functions, return-values, negative-indices, f-strings]
ask:
  dialogue:
    - okonjo: "Penhallow kept my measurements in two lists. Names in one, numbers in the other."
    - okonjo: "Last spring the lists slipped by one. Captain Ferro was fitted for Bea's trousers."
    - okonjo: "A measurement written down wrong is worse than one not taken."
    - moss: "Keep each person's numbers together, then. And keep them still."
  spec: |
    Each client's measurements are a tuple in centimetres: `(chest, waist, leg)`. The names are in a second list, in the same order.

    Write two functions:

    - `print_book(names, sizes)` prints one numbered line per client, starting at 1.
    - `longest_leg(names, sizes)` returns two values: the name and the leg of the client with the longest leg. If two tie, the first in the book wins.

    Then print the book and the longest leg for Mr Okonjo's three clients.
  example: |
    1. Captain Ferro: chest 112, waist 98, leg 84
    2. Bea Hollis: chest 96, waist 88, leg 74
    3. Old Tom: chest 101, waist 95, leg 79
    Longest leg: Captain Ferro, 84 cm
ship:
  dialogue:
    - okonjo: "Captain Ferro, eighty-four. Still the longest leg on the quay."
    - okonjo: "And every number beside its owner. I checked each line against my book."
  shelf: { object: tape-measure, label: "Mr Okonjo's fitting book" }
  cards: [tuples, unpacking, multiple-returns, enumerate, zip]
stretch:
  - id: what-changed
    title: "What changed since spring"
    prompt: |
      People change. Write `changes(old, new)`: it takes two measurement tuples for the same person and returns a tuple of the differences, new minus old.

      `changes((112, 98, 84), (113, 100, 84))` gives `(1, 2, 0)`. `zip` works on two tuples as well as two lists.
    tests: tests/stretch-what-changed.py
    solution: solutions/stretch-what-changed.py
  - id: swap
    title: "Chest and waist, swapped"
    prompt: |
      Someone wrote Old Tom's chest and waist the wrong way round. Swap them back in one line, without a third variable: `chest, waist = waist, chest`. Then build his corrected tuple.
