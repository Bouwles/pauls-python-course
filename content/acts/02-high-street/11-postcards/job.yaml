id: postcards
title: "Postcards"
client: mira
building: post-office
estimated_minutes: 55
summary: "Postcard records that nobody can change once they're posted."
concepts_introduced: [dataclasses, type-hints, enums]
concepts_reviewed: [classes, dunder-methods, methods, mutable-default, immutability, list-comprehensions, lists, f-strings, is-vs-equals]
ask:
  dialogue:
    - mira: "Summer visitors send four hundred postcards a week. I record every one."
    - mira: "Last August a record changed. Truro became Tresco. Nobody owns up."
    - mira: "Once a postcard is posted, its record should never change."
    - moss: "Then make it so it can't."
  spec: |
    In `postcards.py`:

    1. `Stamp`, an `Enum` with three members: `FIRST` (135 pence), `SECOND` (85) and `ABROAD` (220).
    2. `Postcard`, a frozen dataclass with type hints: `sender`, `to` (the town), `stamp` (a `Stamp`) and `message` (default `""`). Its method `postage()` returns the stamp's price in pence.
    3. `total_postage(cards)` returns the postage for a list of postcards, in pence.
    4. `redirect(card, town)` returns a new postcard going to `town`. The original stays exactly as it was.

    Give the two functions type hints too.
  example: |
    Postcard(sender='Bea', to='Truro', stamp=<Stamp.FIRST: 135>, message='Wish you were here')
    Postage today: 440 pence
    Redirected to Penzance; the original still says Truro
ship:
  dialogue:
    - mira: "Truro stays Truro. I tried to change it. It told me off, politely."
    - mira: "Four hundred and forty pence. Pigeonhole three for the receipts."
  shelf: { object: postcard, label: "Mira's postcard records" }
  cards: [dataclasses, type-hints, enums]
stretch:
  - id: by-stamp
    title: "Sorted by stamp"
    prompt: |
      Write `by_stamp(cards: list[Postcard], stamp: Stamp) -> list[Postcard]`, which returns only the postcards with that stamp, in the order they were posted.
  - id: ordered
    title: "In order of posting"
    prompt: |
      Add a `posted: int` field, the minute of the day it was posted, and make the dataclass ordered with `@dataclass(frozen=True, order=True)`. Put `posted` first, so `sorted(cards)` sorts by time. What does `order=True` write for you?
