id: bike-hire-shed-2
title: "The Bike Hire Shed, part 2"
client: kat
building: bike-shed
estimated_minutes: 70
summary: "Electric bikes, a shed full of them, and an argument about what a bike is."
concepts_introduced: [inheritance, super, composition, dunder-methods]
concepts_reviewed: [classes, init, attributes, methods, self, is-vs-equals, lists, list-comprehensions, f-strings, none]
ask:
  dialogue:
    - kat: "Two electric bikes arrived. There's a battery fee, and they run down."
    - dev: "An electric bike is a bike. So ElectricBike inherits from Bike. Done."
    - kat: "And the shed? Is the shed a kind of bike too?"
    - moss: "You're both right. That's the annoying part."
  spec: |
    In `bikes.py`, `Bike` already hires bikes out and takes them back. Add:

    1. To `Bike`: `__str__` gives `Bike 7`, `__repr__` gives `Bike(7, 4)`, and `__eq__` makes two bikes equal when their numbers match. A bike is never equal to something that isn't a bike.
    2. `ElectricBike`, a kind of `Bike`: `ElectricBike(number, rate, charge=100)`. Giving it back costs the usual amount plus a £2 battery fee, and takes 10 off the charge for each hour, never going below 0. It shows itself as `Electric bike 9 (80%)`.
    3. `Shed`, which has bikes: it keeps them in a list called `bikes`. `add(bike)` puts one in, `free()` returns the bikes with no rider, and `len(shed)` is how many bikes it holds.
  example: |
    Shed of 3 bikes
    Free: [Bike(7, 4), Bike(12, 5)]
    Electric bike 9 (80%)
ship:
  dialogue:
    - dev: "ElectricBike inherits from Bike. As I said."
    - kat: "And the shed has bikes. As I said."
    - moss: "Both right. Now go and charge them."
  shelf: { object: bike-shed, label: "The bike shed, electric bikes included" }
  cards: [inheritance, super, composition, dunder-methods]
stretch:
  - id: tandem
    title: "The tandem, Kat's way"
    prompt: |
      Dev says `Tandem(Bike)`. Kat says a tandem has a bike and two riders. Write `Tandem` Kat's way: it holds a `Bike` in an attribute and a list of riders, and its `give_back` charges the bike's cost once per rider. Then decide which way you'd rather maintain.
  - id: sorted-shed
    title: "In number order"
    prompt: |
      Add `__lt__` to `Bike`, so that `bike_a < bike_b` compares their numbers. Then `sorted(shed.bikes)` puts them in number order without a `key=`.
