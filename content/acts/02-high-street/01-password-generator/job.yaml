id: password-generator
title: "Password Generator"
project_name: "Password Generator"
portfolio_readme: |
  # Password Generator

  Makes passwords and passphrases that nobody can guess. Sensible defaults for everyday use, and options for the rest: the length, digits, symbols, and leaving out characters that look like each other. Written for Neil, who needed a password for everyone in the class on the Studio's new server.

  Written by {name} for Neil, at Paul's Python Course. Finished {date}.

  ## Run it

  ```
  python passwords.py
  ```

  It prints a password for three classmates and a passphrase for the Wi-Fi. Keep `wordlist.txt` in the same folder.

  ## Use it in your own programs

  ```python
  from passwords import make_password, make_passphrase, make_passwords

  make_password()                                # 12 characters: letters and digits
  make_password(20, symbols=True)                # 20 characters, with symbols
  make_passphrase(words=5, sep=" ")              # five words from the word list
  make_passwords("Aaesha", "Caitlin", length=16) # one password each, as a dictionary
  ```

  ## What it shows

  - Functions with default and keyword arguments, `*args` and `**kwargs`, and docstrings
  - Why passwords come from the `secrets` module, not `random`
  - The mutable default trap, and the `None` default that avoids it

  ## Credits

  The passphrase words are the EFF's short word list (https://www.eff.org/dice), used under CC BY 4.0. One hyphenated word was taken out.
downloadable: true
datasets:
  - name: "EFF short word list for passphrases"
    source: "https://www.eff.org/dice"
    licence: "CC BY 4.0 (EFF's site licence, https://www.eff.org/copyright)"
    file: wordlist.txt
    notes: "Short Wordlist 1 (1,296 words), dice numbers removed. yo-yo removed so a hyphen always separates words: 1,295 words."
client: neil
building: post-office
estimated_minutes: 100
summary: "Passwords and passphrases for the Studio's new server: sensible defaults, options by name, and nothing anyone can guess."
concepts_introduced: [default-arguments, keyword-arguments, args-kwargs, mutable-default, docstrings]
concepts_reviewed: [functions, parameters, return-values, none, random-module, imports, strings, string-methods, in-operator, for-loops, while-loops, dictionaries, dict-items, f-strings]
ask:
  dialogue:
    - neil: "The Studio's getting its own server. Everyone in the class needs a password for it."
    - neil: "I made six up. Aaesha ran them through her password checker. It turned down five."
    - neil: "The sixth was kettle3. It got through, but she gave me a look."
    - paul: "Then let a program make them. Good defaults, and options for anyone fussy."
  spec: |
    Write `passwords.py`, with a docstring in every function.

    1. `make_password(length=12, digits=True, symbols=False, avoid_lookalikes=True)` returns a password of `length` characters. It always uses lower case and capital letters; digits if `digits` is true; and the characters in `SYMBOLS` if `symbols` is true. It has at least one character of every kind it uses. With `avoid_lookalikes`, it never uses any of `LOOKALIKES` (`Il1O0o`).
    2. `make_passphrase(words=4, sep="-", capitalise=False)` returns that many words from the word list, joined by `sep`. With `capitalise`, each word starts with a capital.
    3. `make_passwords(*names, issued=None, **options)` makes a password for each name with `make_password(**options)` and returns a dictionary of name to password. Given an `issued` dictionary, it adds to that one and returns it; without one, it starts a new dictionary every time.

    Anything a password is made from comes from `secrets`, never `random`.
  example: |
    Passwords for the Studio:
      Aaesha: tK7fWq2mRbXe
      Caitlin: Hn3zVp8sCwYd
      Yahya: qD4hTx9jMkPa
    Passphrase for the Wi-Fi: ample-crust-vowel-tidal
ship:
  dialogue:
    - neil: "Three passwords, no two alike, and no O pretending to be a zero."
    - neil: "Aaesha's checker passed all three. She didn't even look up."
    - paul: "And it's secrets, not random. Nobody works those out from yesterday's."
  shelf: { object: type-case, label: "Neil's password generator for the Studio" }
  cards: [default-arguments, keyword-arguments, args-kwargs, mutable-default, docstrings]
stretch:
  - id: pin
    title: "Codes for the lockers"
    prompt: |
      The lockers on the Studio landing want number codes, not passwords. Write `make_pin(length=4)`: `length` digits from `secrets`, never one of the codes everybody tries first.

      ```python
      COMMON_PINS = ["0000", "1111", "1234", "1212", "7777", "2580", "4321", "6969", "1004", "2000"]
      ```

      Try again until the code isn't in `COMMON_PINS`. A six-digit code is never in it, so that one comes out first time.
    tests: tests/stretch-pin.py
    solution: solutions/stretch-pin.py
  - id: strength
    title: "How strong is it"
    prompt: |
      A password picked from a pool of `n` characters has `n` choices for each place. Its strength in bits is `length * math.log2(n)`. Work it out for the default password (letters and digits without the lookalikes: 56 characters) and for a four-word passphrase (1,295 words a word). Which is stronger, and which would Neil rather type?
