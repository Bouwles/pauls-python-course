id: version-control
title: "Git and GitHub"
project_name: "Git and GitHub"
portfolio_readme: |
  # Git and GitHub

  The Workshop's job tracker, under version control: a git repository with an honest history of commits, an idea tried on a branch and merged back, a conflict settled by hand, and a copy pushed to GitHub. It was practised in the browser first, then done for real on my own computer.

  Written by {name} for Paul's Workshop, at Paul's Python Course. Finished {date}.

  ## Run it

  ```
  python jobs.py
  pytest
  ```

  ## What it shows

  - `git init`, `add`, `commit`, `status`, `diff` and `log`, with commit messages that say what changed and why
  - Branches for ideas, `git merge`, and settling a merge conflict
  - A `.gitignore` that keeps clutter out
  - A remote on GitHub, and `git push`
downloadable: true
datasets: []
client: paul
building: workshop
estimated_minutes: 100
summary: "Keep the history of a project with git: commits, branches and a conflict in the browser, then a real repository of your own, pushed to GitHub."
concepts_introduced: [git-basics, git-branches, merge-conflicts]
ask:
  dialogue:
    - paul: "My first course notes live in one folder. Every version of everything, labelled by date."
    - paul: "Half the labels are wrong. Some are just labelled 'better'."
    - caitlin: "Mine are labelled 'final', 'final2' and 'actually final'."
    - paul: "There's a proper way. It's called git. You'll use it for the rest of your life."
  spec: |
    Put the Workshop's job tracker under version control, here in the browser first:

    1. Make a repository and commit the project as it is.
    2. Change something, look at the difference, and commit again.
    3. Try an idea on a branch, then merge it back.
    4. When two changes collide, sort out the conflict and finish the merge.

    Then for real, on your own computer:

    5. Make it a repository, with a README in your own words and a `.gitignore`, and commit it.
    6. Push it to a repository of your own on GitHub.
  example: |
    workshop $ git log --oneline
    3f9c2a1 (HEAD -> main) Merge branch 'prices'
    8b0d4e2 Charge more for urgent jobs
    c41a9e7 Add the gate repair
    1d27f53 First version of the job tracker
ship:
  dialogue:
    - paul: "Every version, labelled honestly. Nothing in a folder called 'better'."
    - paul: "And a copy on GitHub, where anyone you show it to can read the whole history."
    - caitlin: "Mine's on GitHub too. One commit, called stuff. The next one will be better."
  shelf: { object: book, label: "The Workshop job tracker, with all its history" }
  cards: [git-basics, git-branches, merge-conflicts]
stretch:
  - id: honest-messages
    title: "Honest messages"
    prompt: |
      Look at `git log`. Would someone reading only the messages know what happened, and why? Paul's rule: a message finishes the sentence "This commit will...". Rewrite your next three commit messages that way.
