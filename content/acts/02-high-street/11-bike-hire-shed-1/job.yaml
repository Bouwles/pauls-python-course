id: bike-hire-shed-1
title: "Bank Account System"
project_name: "Bank Account System"
portfolio_readme: |
  # Bank Account System

  Savings accounts as a Python class. Each account knows its holder, its number, its balance and every payment in and out. It refuses a withdrawal bigger than the balance, and raises an error for a payment of nothing or less than nothing, so a mistake can't quietly become money. Amounts are kept in whole pence, so nothing is ever lost to rounding.

  Written by {name} for Riya's class trip fund, at Paul's Python Course. Finished {date}.

  ## Run it

  ```
  python bank.py
  ```

  ```
  Account 1042, Aaesha: £12.50
  False
  [2000, -750]
  ```

  ## Use it in your own programs

  ```python
  from bank import Account

  savings = Account("Aaesha", 1042)
  savings.deposit(2000)        # £20.00, in pence
  savings.withdraw(750)        # True
  savings.withdraw(5000)       # False: there isn't enough
  print(savings)               # Account 1042, Aaesha: £12.50
  savings.deposit(-500)        # ValueError
  ```

  ## What it shows

  - A class with `__init__`, attributes and methods, and what `self` is
  - Validation: refusing bad requests before anything changes, by returning `False` or raising a `ValueError`
  - `__str__`, so an account can be printed in plain words
  - Money kept in whole pence, never in floats
