ask:
  dialogue:
    - riya: "I'm running the savings for the end-of-term trip. Everyone pays a bit in each week."
    - riya: "Last week somebody typed minus five pounds into my spreadsheet. It let them. Then they took it out again."
    - riya: "An account should know its own balance. And nobody takes out more than they put in."
    - paul: "Then each account should know that about itself, and say no for itself."
  spec: |
    Write a class `Account` in `bank.py`. Money is kept in whole pence, so 2000 is £20.

    - `Account(holder, number)` opens an account: the holder's name, the account number, a `balance` of 0, and `history`, an empty list.
    - `deposit(pence)` pays money in: it adds to the balance and appends the amount to `history`. An amount that isn't more than 0 raises a `ValueError` and changes nothing.
    - `withdraw(pence)` takes money out, appends it to `history` as a negative number, and returns `True`. More than the balance changes nothing and returns `False`: the trip fund doesn't lend. An amount that isn't more than 0 raises a `ValueError`.
    - `str(account)` gives one line, the balance in pounds: `Account 1042, Aaesha: £12.50`.
  example: |
    Account 1042, Aaesha: £12.50
    False
    [2000, -750]
ship:
  dialogue:
    - riya: "Aaesha, twelve pounds fifty. Nobody below zero, which is an improvement."
    - riya: "Every penny in the history, in the order it moved. My spreadsheet can retire."
    - paul: "Each account looks after itself. Next time, we find out if it really does. With tests."
  shelf: { object: abacus, label: "Riya's trip fund accounts" }
  cards: [classes, init, attributes, methods, self, dunder-methods]
