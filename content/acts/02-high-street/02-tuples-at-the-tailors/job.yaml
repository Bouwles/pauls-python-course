id: tuples-at-the-tailors
title: "Measurement Book"
project_name: "Measurement Book"
portfolio_readme: |
  # Measurement Book

  The measurement book for a five-a-side team's kit order. Each player's chest, waist and leg are kept together in one tuple, so a name can never slip out of step with its numbers. It prints the book with every line numbered, and finds the player with the longest leg.

  Written by {name} for Caitlin, at Paul's Python Course, for a kit order once kept in two lists. Finished {date}.

  ## Run it

  ```
  python main.py
  ```

  ```
  1. Jon Hale: chest 112, waist 98, leg 84
  2. Mae Grant: chest 96, waist 88, leg 74
  3. Ray Lowe: chest 101, waist 95, leg 79
  Longest leg: Jon Hale, 84 cm
  ```

  ## What it shows

  - Tuples for records that shouldn't change, and unpacking them into honest names: `chest, waist, leg = size`
  - `zip` to walk two lists side by side, and `enumerate` to number the lines from 1
  - A function that returns two answers at once, unpacked where they land
downloadable: true
datasets: []
client: caitlin
building: tailor
estimated_minutes: 50
summary: "The measurement book for the Clocktower's five-a-side kit: each player's numbers kept together in a tuple, every line numbered, and the longest leg found."
concepts_introduced: [tuples, unpacking, multiple-returns, enumerate, zip]
concepts_reviewed: [lists, looping-lists, for-loops, functions, return-values, negative-indices, f-strings]
ask:
  dialogue:
    - caitlin.pleased.wave: "The Clocktower has a five-a-side team now. I'm doing the kit."
    - caitlin.thinking: "I kept the sizes in two lists. Names in one, numbers in the other."
    - caitlin.laughing: "Then the lists slipped by one. Our keeper's tracksuit arrived with someone else's legs."
    - paul.neutral: "Keep each person's numbers together, then. And keep them still."
  spec: |
    Each player's measurements are a tuple in centimetres: `(chest, waist, leg)`. The names are in a second list, in the same order.

    Write two functions:

    - `print_book(names, sizes)` prints one numbered line per player, starting at 1.
    - `longest_leg(names, sizes)` returns two values: the name and the leg of the player with the longest leg. If two tie, the first in the book wins.

    Then print the book and the longest leg for the three players who have sent their sizes so far.
  example: |
    1. Jon Hale: chest 112, waist 98, leg 84
    2. Mae Grant: chest 96, waist 88, leg 74
    3. Ray Lowe: chest 101, waist 95, leg 79
    Longest leg: Jon Hale, 84 cm
ship:
  dialogue:
    - caitlin.pleased.cheer: "Kit's ordered. I checked every line against the forms. Every number is beside its owner."
    - caitlin.laughing: "The keeper's tracksuit fits. He sent a photo of his ankles to prove it."
    - paul.proud: "Names and numbers that can't drift apart. That's the whole fix, and it's a good one."
  shelf: { object: tape-measure, label: "The five-a-side kit book, for Caitlin" }
  cards: [tuples, unpacking, multiple-returns, enumerate, zip]
stretch:
  - id: what-changed
    title: "What changed since last season"
    prompt: |
      Players change. Write `changes(old, new)`: it takes two measurement tuples for the same person and returns a tuple of the differences, new minus old.

      `changes((112, 98, 84), (113, 100, 84))` gives `(1, 2, 0)`. `zip` works on two tuples as well as two lists.
    tests: tests/stretch-what-changed.py
    solution: solutions/stretch-what-changed.py
  - id: swap
    title: "Chest and waist, swapped"
    prompt: |
      Someone wrote Ray Lowe's chest and waist the wrong way round. Swap them back in one line, without a third variable: `chest, waist = waist, chest`. Then build his corrected tuple.
