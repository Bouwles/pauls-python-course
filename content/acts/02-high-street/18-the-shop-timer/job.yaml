id: the-shop-timer
title: "Timing and Retry Decorators"
project_name: "Timing and Retry Decorators"
portfolio_readme: |
  # Timing and Retry Decorators

  Two decorators that can go on any function. `@timed` logs how long every call takes, so the slow one can be found by measuring instead of guessing; `slowest` and `slow_calls` read the log. `@retry` calls a function again when it fails with a `ConnectionError`, up to three times, then lets the error out. Both were put on a greengrocer's till: the timer found the dawdling price look-up, and retry kept the card reader from turning a customer away.

  Written by {name} for Sanjay's greengrocer in {{town}}. Finished {date}.

  ## Run it

  ```
  python main.py
  ```

  ```
  Plums: £3.15
  Leeks: £1.80
  Figs: £1.60
  Paid £6.55 by card
  Slowest: ['look_up_price']
  look_up_price took 0.30 s
  ```

  ## Use them in your own programs

  ```python
  from main import timed, retry, log, slowest

  @timed
  @retry
  def fetch_prices():
      ...
  ```

  ## What it shows

  - Functions as values: passed in, wrapped and handed back
  - Decorators with `functools.wraps`, closures, and `*args, **kwargs` passed straight through
  - `lambda`, `sorted(key=...)` and `filter` for reading the log
  - Retrying only the error that's worth another go, and giving up honestly
