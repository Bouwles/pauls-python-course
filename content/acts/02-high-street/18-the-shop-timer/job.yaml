id: the-shop-timer
title: "Timing and Retry Decorators"
project_name: "Timing and Retry Decorators"
portfolio_readme: |
  # Timing and Retry Decorators

  Two decorators that can go on any function. `@timed` logs how long every call takes, so the slow one can be found by measuring instead of guessing; `slowest` and `slow_calls` read the log. `@retry` calls a function again when it fails with a `ConnectionError`, up to three times, then lets the error out. Both were put on the till for a bake sale's fruit table: the timer found the dawdling price look-up, and retry kept the card reader from turning a customer away.

  Written by {name} for Caitlin's bake sale, at Paul's Python Course. Finished {date}.

  ## Run it

  ```
  python main.py
  ```

  ```
  Plums: £3.15
  Leeks: £1.80
  Figs: £1.60
  Paid £6.55 by card
  Slowest: ['look_up_price']
  look_up_price took 0.30 s
  ```

  ## Use them in your own programs

  ```python
  from main import timed, retry, log, slowest

  @timed
  @retry
  def fetch_prices():
      ...
  ```

  ## What it shows

  - Functions as values: passed in, wrapped and handed back
  - Decorators with `functools.wraps`, closures, and `*args, **kwargs` passed straight through
  - `lambda`, `sorted(key=...)` and `filter` for reading the log
  - Retrying only the error that's worth another go, and giving up honestly
downloadable: true
datasets: []
client: caitlin
building: greengrocer
estimated_minutes: 80
summary: "Two decorators for the till on the fruit table at Caitlin's bake sale: one times every call and finds the slow one, one tries the card reader again when it doesn't answer."
concepts_introduced: [functions-as-values, lambda, map-filter, sort-key, closures, decorators]
concepts_reviewed: [functions, parameters, return-values, tuples, unpacking, args-kwargs, list-comprehensions, dictionaries, standard-library, main-guard, f-strings, slicing, sorted-vs-sort]
ask:
  dialogue:
    - caitlin.pleased.wave: "The bake sale has a fruit table now. The till weighs everything, and it's slow."
    - yahya.unimpressed: "I timed it. Four minutes for two plums. The queue went past the next stall."
    - caitlin.thinking: "My till has a function for everything. One of them is dawdling. I want to know which."
    - yahya.laughing: "And the card reader only answers if you ask it twice. Caitlin asks it twice. Out loud."
    - paul.neutral: "Don't guess which is slow. Measure. And let the till do the asking twice."
  spec: |
    Write a decorator `timed` that times a function every time it runs, appends `(name, seconds)` to the list `log`, and hands back the function's own result. Read the time with `clock()`: it starts as `time.perf_counter`, and the checks swap it for a clock that ticks in known steps.

    Put `@timed` on the till's three functions. Then write two helpers for the report:

    - `slowest(entries, count)`: a list of the names of the `count` slowest calls, slowest first
    - `slow_calls(entries, limit)`: a list of the entries that took longer than `limit` seconds, in the order they happened

    Then a second decorator, `retry`, for the card reader. When the function raises a `ConnectionError`, it calls it again, up to `TRIES` calls in all, and hands back the first answer that comes. If the last try fails too, the error comes out. Any other error comes straight out, with no second go. Put `@retry` on `take_card`.
  example: |
    Plums: £3.15
    Leeks: £1.80
    Figs: £1.60
    Paid £6.55 by card
    Slowest: ['look_up_price']
    look_up_price took 0.30 s
    look_up_price took 0.30 s
    look_up_price took 0.30 s
ship:
  dialogue:
    - yahya.proud: "Look up price. Three tenths of a second, every single time. Told you it was the code."
    - caitlin.laughing.cheer: "And the reader got asked twice without me shouting. The queue's gone."
    - paul.neutral.point: "Measured, not guessed. Now go and fix the dawdler."
  shelf: { object: stopwatch, label: "Caitlin's bake sale till, timed and patient" }
  cards: [functions-as-values, lambda, map-filter, sort-key, closures, decorators]
stretch:
  - id: remembered
    title: "Fix the dawdler"
    prompt: |
      Caitlin's note says `look_up_price` reads the whole price book every time. Write a second decorator, `remembered`, that keeps each answer in a dictionary inside a closure, so asking for plums twice only looks once.

      Put `@timed` above `@remembered`. The log shows the second lookup taking almost nothing.
  - id: timed-as
    title: "Timed, with a label"
    prompt: |
      Write `timed_as(label)`, a decorator that takes an argument: `@timed_as("till")` logs `("till: weigh", seconds)`. It's one more function wrapped around the decorator you already have, and a closure keeps hold of `label`.
