id: penhallows-notebook-reader
title: "Penhallow's Notebook Reader"
client: wendt
building: observatory
estimated_minutes: 600
summary: "Act VI's last Job: a small network learns Penhallow's notes four characters at a time, beats the bigram on notes it never saw, and finishes a note when you start one. With a write-up."
concepts_introduced: []
concepts_reviewed: [language-models, embeddings, tokenisation, backpropagation, numerical-gradient-checking, optimisers, activation-functions, neural-networks, train-test-split, overfitting, regularisation, random-module, json-module, files, modules, docstrings]
ask:
  dialogue:
    - wendt: "Every comment she left in the town's code, and the ones in her notebooks. Eighty-five, one a line."
    - wendt: "I'd like a machine that reads them, and finishes a note when you start one. In her voice."
    - moss: "And when it finishes one she never wrote?"
    - wendt: "Then we'll know how well it learnt her. How she sounded, anyway. Not what she meant."
    - pip: "I can do her voice. A.P. There."
  spec: |
    Penhallow's Notebook Reader, in four files, built in this order. Each starter is almost empty: a docstring listing what to write.

    1. `notes.py`: load the 85 notes, hold every fifth back, build the vocabulary (with the newline), and cut the notes into windows: the ids of the characters before each character, padded with newlines, and its own id.
    2. `baseline.py`: perplexity, and the bigram, counted from the last character of each window. The scores to beat.
    3. `model.py`: a network that looks up the embeddings of four characters, lays them in a row, and guesses the fifth through a tanh layer and softmax. Forward, backward, and training on mini-batches. Run as a program, it trains and saves `my_weights.json`.
    4. `reader.py`: `complete(start, params, vocab, rng, temperature=1.0, limit=200)` finishes a note, with the same note every time for the same seed. Run as a program, it reads with your weights if you've trained them, and Wendt's if not.
    5. A write-up and a test plan, through Moss's checklist.
  example: |
    Reading with Wendt's weights.
    The machine on the hill does. A.P.
    Tom says it works the kead the hill say. A.P.
    Whoever reads this mowhing a fon the late itce tell'bd them. A.P.
story_note: finish-my-sentences
ship:
  dialogue:
    - wendt: "Perplexity 6.9 on notes it never saw. The bigram managed 9.8, and guessing 65."
    - wendt: "'The machine on the hill does.' Full stop. She'd have liked that. Or crossed it out."
    - pip: "Ask it for the likeliest every time and it says 'on the hill' for ever. Like a gull."
    - moss: "It's learnt how she sounded. Nobody's learnt what she meant. Not yet."
  shelf: { object: lectern, label: "Penhallow's Notebook Reader" }
  cards: []
stretch:
  - id: early-stopping
    title: "Stop it the winter it was best"
    prompt: |
      Hold back every fourth of the 68 learning notes as a validation set. Train for 5000 steps, measuring the validation perplexity every 100, and keep the weights from the best, as in Regularising. Does it beat 6.88 on the held-back notes? You chose with the validation notes, not the held-back ones, so the held-back score is still fair.
  - id: wider-window
    title: "Further back"
    prompt: |
      Try windows of 2, 3, 6 and 8 characters, retraining each time, and compare the held-back perplexities. Longer should know more. Does it, with only 68 notes to learn from? Write down what you find, and a guess at why.
  - id: attention-instead
    title: "Attention instead of a window, at home"
    prompt: |
      On your own computer, with PyTorch: replace the window with the transformer block from Paying Attention, two blocks of four heads over the last 32 characters, and train it on `notes.txt`. Compare its held-back perplexity with your window's, and its notes with your reader's.
