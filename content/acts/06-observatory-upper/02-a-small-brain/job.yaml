id: a-small-brain
title: "A Small Brain"
client: wendt
building: observatory
estimated_minutes: 80
summary: "Penhallow's two-layer network, run forward in NumPy with the weights from her notebook."
concepts_introduced: [neural-networks, activation-functions]
concepts_reviewed: [perceptron, numpy-arrays, matrices, broadcasting, feature-scaling, logistic-regression, functions, enumerate]
ask:
  dialogue:
    - wendt: "Second floor. Her notebook, and two pages that are nothing but numbers."
    - wendt: "It's a brain. A small one. Four readings in, three answers out, six neurons between. Five. Five neurons."
    - wendt: "She labelled the answers. Lamp, horn, gate."
    - moss: "Then put an evening through it and see what it says."
  spec: |
    In `brain.py`, Penhallow's weights are already copied in. Each evening is four readings from 0 to 1: visibility, wind, tide and dark.

    1. `relu(z)` and `sigmoid(z)`, working on whole arrays at once.
    2. `forward(evenings, W1, b1, W2, b2)`: `evenings` has one row per evening. The hidden layer is the ReLU of `evenings @ W1 + b1`; the output is the sigmoid of `hidden @ W2 + b2`. It returns one row of answers per evening, with no loop over the evenings, and works for any layer sizes whose shapes line up.
    3. `decisions(outputs)`: for each row, a list of the names in `ANSWERS` whose output is above 0.5, in order.
    4. Run as a program, it puts four evenings from her log through her weights.
  example: |
    Evening 1: lamp
    Evening 2: lamp, horn
    Evening 3: lamp, gate
    Evening 4: nothing
story_note: learning-the-town
ship:
  dialogue:
    - wendt: "Lamp after dark. Horn in fog. The gate when the sea's up."
    - wendt: "That's Tom's whole evening, and the sea wall's. She was teaching it the town."
    - wendt: "Why teach a machine that? I don't know yet. I'd like to."
    - moss: "Somebody always has to keep the lamp lit."
  shelf: { object: notebook-page, label: "Penhallow's small brain, running" }
  cards: [neural-networks, activation-functions]
stretch:
  - id: probe-the-fog
    title: "Walk into the fog"
    prompt: |
      Hold wind at 0.3, tide at 0.4 and dark at 0, and slide visibility from 1 down to 0 in steps of 0.05. Plot the three outputs against visibility with matplotlib. Where does the horn come on? Is it a sudden switch or a slope, and which part of her brain decides?
  - id: count-the-numbers
    title: "How many numbers is a brain?"
    prompt: |
      Write `count_parameters(W1, b1, W2, b2)`, returning how many weights and biases there are in total. Penhallow's has 43. A brain with 784 readings, 128 hidden units and 10 answers has rather more. Work it out before you run it.
