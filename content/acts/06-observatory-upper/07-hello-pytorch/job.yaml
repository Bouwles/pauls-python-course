id: hello-pytorch
title: "Hello, PyTorch"
client: wendt
building: observatory
estimated_minutes: 120
summary: "The digit reader again, on your own computer, in PyTorch: tensors, autograd, nn.Module and a training loop, checked by a real pytest suite."
concepts_introduced: [pytorch]
concepts_reviewed: [autograd, classification-networks, optimisers, weight-initialisation, neural-networks, classes, init, super, methods, virtual-environments, terminal-basics, pytest, train-test-split]
ask:
  dialogue:
    - wendt: "Everyone downstairs trains their brains in PyTorch. I'd like to know if everyone is right."
    - wendt: "Your NumPy brain reads her digits. Build the same brain in PyTorch, at home, and see if it agrees."
    - pip: "PyTorch does the backward pass for you. So the cards were a waste of a week."
    - moss: "The cards are how you'll know what it's doing when it goes wrong."
  spec: |
    On your own computer, in `reader.py`:

    1. `to_tensors(X, labels)`: the greys as a `float32` tensor and the labels as `int64` (`torch.long`).
    2. `blackboard_gradients()`: the blackboard chain from Learning Backwards, in tensors made with `requires_grad=True`. After `backward()`, return dL/dw1 and dL/dw2 as plain floats.
    3. `DigitReader(hidden=32)`, an `nn.Module`: `self.hidden` is `nn.Linear(64, hidden)` and `self.out` is `nn.Linear(hidden, 10)`, with a ReLU between. `forward` returns the raw scores, with no softmax.
    4. `train(model, X, labels, epochs, batch_size, rate, seed)`: Adam and `nn.CrossEntropyLoss`, in mini-batches shuffled by a `torch.Generator` seeded with `seed`. It returns the loss on every row of `X` after each epoch, as floats.
    5. `accuracy(model, X, labels)`: the fraction of rows whose biggest score is on the right digit, as a float, worked out under `torch.no_grad()`.
    6. `python reader.py` learns from the same 1500 digits as upstairs, and reads the same 297.

    Hand in the pytest report when every test passes.
  example: |
    (.venv) $ python reader.py
    Loss: 0.481 after the first epoch, 0.035 after the last
    Read 291 of 297 digits it had never seen
ship:
  dialogue:
    - wendt: "Two hundred and ninety-one. Ours read two hundred and ninety-three. Within two digits of each other."
    - wendt: "Different engine, different shuffles, nearly the same answers. That's the nicest thing I can say about either."
    - moss: "And you know what it does under the lid. That's what makes it a tool and not a charm."
  shelf: { object: torch, label: "The digit reader, in PyTorch, at home" }
  cards: [pytorch]
stretch:
  - id: gpu
    title: "The GPU, if you have one"
    prompt: |
      Pick `device = "cuda" if torch.cuda.is_available() else "cpu"` (or `"mps"` on a Mac with Apple silicon). Move the model with `model.to(device)` and every batch with `.to(device)`, and check the accuracy is unchanged. For a brain this small, copying numbers to the GPU may cost more than the sums save. Try `hidden=4096` and see where that changes.
  - id: save-and-load
    title: "Keep what it learned"
    prompt: |
      Save the trained weights with `torch.save(model.state_dict(), "reader.pt")`. In a second script, make a fresh `DigitReader`, load them with `load_state_dict(torch.load("reader.pt"))`, and check it reads the same 291 digits without any training. Write a test for it.
