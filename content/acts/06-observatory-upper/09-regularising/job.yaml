id: regularising
title: "Regularising"
client: wendt
building: observatory
estimated_minutes: 90
summary: "Pip's seeing network fits 24 nights perfectly and the rest badly. Weight decay, dropout, early stopping and batch norm teach it to hold back."
concepts_introduced: [regularisation, dropout, batch-normalisation]
concepts_reviewed: [overfitting, train-test-split, neural-networks, backpropagation, gradient-descent, mean-squared-error, feature-scaling, copying, mutability, dictionaries, numpy-arrays, broadcasting, matplotlib, default-arguments]
ask:
  dialogue:
    - wendt: "Penhallow rated the seeing every night she could. How much the stars shimmer, in arcseconds."
    - wendt: "Under one, and she'd stay up until dawn. Over three, she'd go to bed."
    - pip: "I've trained a network on it. Training loss: zero. I've done it again."
    - moss: "And on the nights it hasn't seen?"
    - pip: "I haven't asked it those. On purpose."
  spec: |
    In `regular.py`, add three regularisers to Wendt's seeing network in `net.py`, and compare them on the nights it never learnt from.

    1. `dropout_mask(shape, rate, rng)`: an array of that shape in which each entry is 0 with chance `rate`, and otherwise `1 / (1 - rate)`.
    2. `with_weight_decay(grads, params, decay)`: a new dict of gradients, with `decay` times each weight matrix added to its gradient. The biases, `b1` and `b2`, are left alone.
    3. `train(X, T, X_val, T_val, params, rate, epochs, decay=0.0, drop=0.0, patience=None, seed=0)`: gradient descent that changes `params` in place. Each epoch: a fresh dropout mask for the hidden layer if `drop` is above 0, one step with weight decay, then the training and validation losses with no mask. With `patience`, stop once the validation loss hasn't improved for `patience` epochs, and put the best epoch's weights back. It returns the training losses, the validation losses and the best epoch.
    4. Run as a program, it compares Pip's network with each regulariser.
    5. In `batchnorm.py`, `batch_norm` for training and for evaluation.
  example: |2
                          training  validation
    Pip's                   0.0000      0.2455
    weight decay 0.02       0.0451      0.1340
    dropout 0.5             0.0106      0.1890
    early stopping          0.0603      0.1842
    Guessing the average                0.4213
story_note: hard-to-stop
ship:
  dialogue:
    - wendt: "Weight decay: 0.134 on nights it never saw. Pip's scored 0.246, and guessing scored 0.421."
    - wendt: "So it's out by a third of an arcsecond. The square root, yes. I did it in my head. Twice."
    - pip: "Mine was perfect for 24 nights. That's nearly a month."
    - moss: "A joint that only fits one board isn't a joint."
  shelf: { object: seeing-chart, label: "The seeing network, held back" }
  cards: [regularisation, dropout, batch-normalisation]
stretch:
  - id: draw-the-curves
    title: "Four curves, one chart"
    prompt: |
      Draw the validation curves of all four runs on one chart with matplotlib, with a log scale on the loss, and mark the epoch early stopping chose with `plt.axvline`. Which curve wobbles, and why that one?
  - id: more-nights
    title: "More nights from the same nights"
    prompt: |
      Penhallow's readings are only good to about 0.02 either way. Make four extra copies of each training night with `rng.normal(0, 0.02, X.shape)` added to its readings, keeping its seeing, and train Pip's network on all 120. Does the validation loss improve? Making more training data out of the data you have is **data augmentation**.
  - id: choose-the-decay
    title: "Choose the decay"
    prompt: |
      Try weight decay of 0.005, 0.01, 0.02, 0.05 and 0.1, each with patience 100, and choose the one with the lowest validation loss. Then remember the bottom drawer downstairs: the nights you chose with are no longer a fair test. What would you need to report an honest error?
