id: learning-backwards
title: "Learning Backwards"
client: wendt
building: observatory
estimated_minutes: 100
summary: "Backpropagation on paper, then in NumPy, checked against measured gradients and trained on the captain's rule."
concepts_introduced: [backpropagation, numerical-gradient-checking]
concepts_reviewed: [neural-networks, activation-functions, chain-rule, numerical-gradients, gradient-descent, mean-squared-error, matrices, dictionaries, mutability]
ask:
  dialogue:
    - wendt: "Her weights came from somewhere. Nobody types 12.9 by hand. Well, she might. She didn't."
    - wendt: "Top floor. A blackboard, half rubbed out. The chain rule, all the way down."
    - wendt: "Paper first, then code. Then we check the code against plain arithmetic, because I trust neither."
    - pip: "I've already written a checker."
    - moss: "Then we'll check that too."
  spec: |
    In `backprop.py`, `forward`, `loss` and a working `numerical_gradient` are already written. The brain is the one from A Small Brain, a ReLU hidden layer and a sigmoid output, with its weights in a dict, `params`, under `"W1"`, `"b1"`, `"W2"` and `"b2"`. The loss is the mean squared error over every answer.

    1. `backward(X, T, params, cache)`: the gradient of the loss for every weight and bias, as a dict with the same keys as `params`, each gradient the same shape as its weight. `cache` is what `forward` returned alongside its answers. No loops.
    2. `check_gradients(X, T, params)`: for each key, compare `backward`'s gradient with `numerical_gradient`'s using `np.allclose`. Return a dict of `True` or `False` by key.
    3. `train(X, T, params, rate, steps)`: gradient descent. Each step: forward, note the loss, backward, then subtract `rate` times each gradient from its weight. It changes `params` in place and returns the list of losses, one per step.
    4. Run as a program, it checks the gradients on Captain Ferro's crossings, then trains a brain from random weights to learn his rule.
  example: |
    W1: ok
    b1: ok
    W2: ok
    b2: ok
    Loss: 0.2181 at the start, 0.0003 at the end
    Sails: [1 0 0 1]
story_note: it-does-not-need-me
ship:
  dialogue:
    - wendt: "Four gradients, four oks. Then it learned the captain's rule from random numbers."
    - ferro: "Flood and a sea breeze, we cross. I could have told it."
    - wendt: "You did. Four times. That was the training data."
    - moss: "Worked out one way, measured another, and they agree. That's measuring twice."
  shelf: { object: chalkboard, label: "The blackboard, backwards and checked" }
  cards: [backpropagation, numerical-gradient-checking]
stretch:
  - id: watch-it-learn
    title: "Watch it learn"
    prompt: |
      Plot the list of losses from `train` with matplotlib, with a log scale on the loss (`plt.yscale("log")`). Then try `rate=0.2` and `rate=8.0` on the same starting weights. One crawls; what does the other do?
  - id: penhallows-brain
    title: "Her brain, from nothing"
    prompt: |
      Your `backward` already works for any layer sizes. Make a 4-5-3 brain with random weights and train it on the four evenings from A Small Brain, using the answers her weights gave as targets. Does it end up with her weights, or different ones that give the same answers?
