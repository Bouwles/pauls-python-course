id: the-championship
title: "The Championship"
client: committee
building: crab-club
estimated_minutes: 600
summary: "A crab that learns whatever course the stewards lay out: practice on a budget, races on courses nobody has seen, and an entry for the Crab League."
concepts_introduced: []
concepts_reviewed: [q-learning, dqn, policy-gradients, actor-critic, exploration-exploitation, td-learning, mdps, bfs, classes, exceptions, raising-errors, try-except, train-test-split, overfitting, numpy-arrays]
ask:
  dialogue:
    - committee: "The Championship. Thirty clubs. One course, laid out on the morning."
    - committee: "Five thousand practice moves, counted by the stewards..."
    - committee: "...then the races. Fewest moves wins."
    - moss: "So he can't learn the course beforehand. He has to learn how to learn one."
  spec: |
    A crab who races well on a course nobody has seen, in three files.

    1. `course.py`, the committee's rules. `generate(seed, rows=7, cols=9)` lays out rocks, rock pools and two groynes, the same course for the same seed, always with a way through. `Course(layout)` knows its rules; `race(course, policy, rng)` counts the moves of one race; `Practice(course, budget, rng)` is the course as Sir Reginald meets it, with no map and a budget of moves.
    2. `crab.py`. `train(practice, rng)` practises until the stewards say stop, and returns a policy: rows of actions from 0 to 3, a move for every tile.
    3. `race_day.py`. Two baselines, the gull line and the shortest line; a table of results on courses he trained on and on courses kept back; a race to watch; and `league.json`, his entry for the Crab League on the Club Course.

    On a course he has never seen, given 5000 practice moves, he must finish at least 190 races in 200, and average within a quarter of par: the moves the shortest line takes.
  example: |
    Training courses
    Course 1: 19.1 moves, 200 of 200 finished (par 18.9, the gull 98.3)
    Course 2: 17.4 moves, 200 of 200 finished (par 18.1, the gull 92.5)
    Course 3: 12.7 moves, 200 of 200 finished (par 14.2, the gull 43.1)
    Courses he has never seen
    Course 101: 18.1 moves, 200 of 200 finished (par 18.0, the gull 99.1)
    Course 102: 13.6 moves, 200 of 200 finished (par 14.1, the gull 81.1)
    The Club Course: 15.5 moves, 200 of 200 finished
    Saved league.json for the Crab League.
ship:
  dialogue:
    - committee: "Eighteen point one moves, on a course laid out at dawn. Par was eighteen."
    - committee: "The Cockle Bay crab sat down at the first groyne and..."
    - committee: "...would not be moved. We did not laugh. Not in public."
    - moss: "He learned a course nobody had seen. That's the whole trade, in a crab."
  shelf: { object: trophy, label: "The Championship cup, won on an unseen course" }
  cards: []
story_note: lady-agatha-sat-down
stretch:
  - id: the-league
    title: "The Crab League"
    prompt: |
      Enter `league.json` on the Crab League page, /league. The League races the Club Course fifty times a week on its own seeds. Then try to climb: more replay, a better first guess, or a crab built on Deep Q or actor-critic instead. Keep every change honest by racing your testing courses, not the Club Course, before you decide.
  - id: what-carries-over
    title: "What carries over"
    prompt: |
      He starts every course with nothing but the gull's guess. Train a small network, as in Deep Q, on features that mean the same on any course: rocks beside him, pools, which way the finish lies. Use it as his first guess on a new course. Does he need fewer practice moves to reach par? Try a budget of 1500.
  - id: half-the-practice
    title: "Half the practice"
    prompt: |
      Rumour says next year's Championship allows 2500 practice moves. Find the smallest budget at which he still averages within a quarter of par on ten testing courses, and which of your settings matter most when practice is short.
