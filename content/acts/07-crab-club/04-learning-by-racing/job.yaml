id: learning-by-racing
title: "Learning by Racing"
client: committee
building: crab-club
estimated_minutes: 90
summary: "The worth of every tile, learned from races alone, with no map: Monte Carlo and temporal difference learning."
concepts_introduced: [monte-carlo, td-learning]
concepts_reviewed: [policy-evaluation, returns-discounting, mdps, bandits, dictionaries, tuples, zip, default-arguments, numpy-arrays]
ask:
  dialogue:
    - committee: "Your figures for the grid are very fine. On paper."
    - committee: "Sir Reginald has never seen the paper. He..."
    - committee: "...cannot read. He learns by racing."
    - moss: "Then race him, and see if the races agree with the paper."
  spec: |
    Write `learn.py`. Sir Reginald gets no map: nothing in it may read `outcomes`. All he has is `step(tile, action, rng)` from `track.py`, which takes one real step and tells him where he landed, what it earned, and whether the race is over. Practice races start on a random tile, `random_start(rng)`.

    1. `episode(policy, rng, start, limit=100)`: one race, as a list of `(tile, action, reward)`.
    2. `returns_from(rewards, gamma=0.9)`: the return from every step of a race.
    3. `mc_evaluate(policy, races, rng, gamma=0.9)`: Monte Carlo. A tile's worth is the average of every return that followed it.
    4. `td_update(values, tile, reward, after, over, alpha=0.1, gamma=0.9)`: one TD(0) update, in place; returns the TD error.
    5. `td_evaluate(policy, races, rng, alpha=0.1, gamma=0.9, limit=100)`: TD(0), updating after every step.

    Run as a program, it learns the traditional line's values both ways from 2000 races each, and compares them with the values `evaluate` (from your `dp.py`) works out from the map.
  example: |
    The traditional line, worked out from the map
       4.5   6.7   9.1   0.0
       2.7     #   5.1   0.0
      -7.6  -8.6  -8.4  -9.8

    Monte Carlo, 2000 races
       4.4   6.7   9.1   0.0
       2.6     #   5.2   0.0
      -7.5  -8.6  -8.6  -9.9
    Furthest from the map: 0.18

    TD(0), 2000 races
       4.6   6.7   8.8   0.0
       2.8     #   3.6   0.0
      -6.9  -8.9  -9.2 -10.0
    Furthest from the map: 1.45
ship:
  dialogue:
    - committee: "Two thousand races, and he knows the grid to within a fifth of a point."
    - committee: "Without reading a word. We always said he was..."
    - committee: "...a natural."
    - moss: "He knows what a line is worth. Next, he finds a better one himself."
  shelf: { object: race-card, label: "Two thousand practice races, written up" }
  cards: [monte-carlo, td-learning]
stretch:
  - id: first-visit
    title: "First visits only"
    prompt: |
      When Sir Reginald bumps the rock and stays put, one race gives a tile several returns. First-visit Monte Carlo counts only the return after his first visit to each tile in a race. Write `mc_first_visit` and compare the two on the traditional line with `SLIP = 0.4` in `track.py`. Do they settle in the same place?
  - id: falling-alpha
    title: "Calming down"
    prompt: |
      TD(0) with a fixed `alpha` never stops wobbling. Give each tile its own count of updates and use `alpha = 1 / count`, as in the bait trials. Does TD now settle as closely as Monte Carlo? How many races does it need?
