id: actor-and-critic
title: "Actor and Critic"
client: committee
building: crab-club
estimated_minutes: 120
summary: "One-step actor-critic on the racing grid, with the critic's TD error as each move's verdict, and PPO's clipped objective read and worked by hand."
concepts_introduced: [actor-critic]
concepts_reviewed: [policy-gradients, td-learning, dqn, returns-discounting, mdps, numpy-arrays, mutability]
ask:
  dialogue:
    - committee: "REINFORCE waits until the race is over before it learns anything."
    - committee: "The committee does not wait. The committee..."
    - committee: "...comments on every move."
    - moss: "Then he needs a critic. One acts, one judges, and both learn as they go."
  spec: |
    Write `actor_critic.py`, one-step actor-critic on the racing grid in `track.py`. The actor is `theta`, a `(3, 4, 4)` array of preferences, with `chances` and `grad_log_chance` from Learning the Policy Directly. The critic is `values`, a `(3, 4)` array.

    1. `td_error(values, tile, reward, after, over, gamma=0.9)`: the critic's verdict on a move: the reward, plus `gamma` times the value of where he landed unless the race is over, minus the value of where he was.
    2. `update(theta, values, tile, action, reward, after, over, gamma=0.9, actor_rate=0.2, critic_rate=0.2)`: one step of actor-critic, in place. Work out the TD error and the gradient first; then `values[tile]` moves `critic_rate` times the error, and `theta` moves `actor_rate` times the error times the gradient. Returns the TD error.
    3. `train(episodes, rng, gamma=0.9, actor_rate=0.2, critic_rate=0.2)`: races from the start of at most 50 moves, each drawn by chance, with an `update` after every move. Returns `(theta, values)`.
    4. `clipped_objective(ratio, advantage, epsilon=0.2)`: PPO's objective, the smaller of `ratio * advantage` and the ratio clipped to between `1 - epsilon` and `1 + epsilon`, times the advantage. Numbers or NumPy arrays.

    Run as a program, it trains for 200 races and shows his most likely moves, the critic's values and his average return over 1000 races, then PPO's clip for four moves.
  example: |
    After 200 races, his most likely moves
    > > > F
    ^ # ^ P
    ^ > ^ <
    The critic's values
       4.2   7.1   9.9   0.0
       2.9     #   6.3   0.0
       0.2  -2.3   0.8  -4.8
    Average return over 1000 races: 1.05

    PPO's clip, with epsilon 0.2
    ratio 1.5, advantage 2.0: 2.4
    ratio 0.5, advantage 2.0: 1.0
    ratio 1.5, advantage -2.0: -3.0
    ratio 0.5, advantage -2.0: -1.6
ship:
  dialogue:
    - committee: "Judged on every move, and better for it. One point oh five."
    - committee: "The critic thinks the start is worth nought point two. The critic..."
    - committee: "...has never raced. We know the type."
    - moss: "Next, a course nobody has seen. Not even the committee."
  shelf: { object: scorecard, label: "Sir Reginald and his critic" }
  cards: [actor-critic]
stretch:
  - id: two-lines
    title: "The line under the pool"
    prompt: |
      Train twenty seeds for 200 races and work out each policy's worth. Some settle near 1.1; some settle near 0.1, going up the middle beside the pool. Find out why the actor stops looking for the better line, and whether a bigger `critic_rate`, a smaller `actor_rate` or more races helps. Explain it to Dennis.
  - id: ppo-batch
    title: "A small PPO"
    prompt: |
      Race 10 times with the current `theta` and keep each move's chance at the time. Then take 4 steps on that batch, each step the gradient of the clipped objective, with the critic's TD error as the advantage. The gradient of the clipped term is zero once the ratio is past the clip on the side the advantage favours. Does it learn in fewer races than plain actor-critic?
