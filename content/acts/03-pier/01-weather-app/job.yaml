summary: "A forecast for anywhere, from a real weather service: ask Open-Meteo, read the JSON it sends back, cope when it goes wrong, and print three plain days."
concepts_introduced: [web-apis, http-basics]
concepts_reviewed: [json-module, nested-data, dictionaries, dict-get, zip, tuples, unpacking, functions, return-values, none, exceptions, try-except, raising-errors, standard-library, main-guard, f-strings, string-methods, with-statement, files]
ask:
  dialogue:
    - yahya: "I run every morning. Checking the weather takes me longer than tying my laces."
    - yahya: "I want a forecast in one command. A real one, from a real service. Three days, plain words."
    - yahya: "And it credits its source. Aaesha says a forecast without one is a rumour."
    - paul: "A program that talks to another computer. It fails in new ways. Plan for every one."
  spec: |
    Write `weather.py`. It asks `Where? `, looks the place up with Open-Meteo's geocoding service, asks Open-Meteo's forecast service about the next three days, and prints a plain forecast.

    `fetch_json(url)` is written for you. It makes the real request and hands back the JSON as dictionaries and lists, or raises an `OSError` if it can't. Everything else works on replies that have already arrived:

    1. `describe(code)` returns the words for a weather code from `WEATHER`, or `Unknown weather (code 42)` for a code that isn't there.
    2. `find_place(reply)` takes the geocoding reply and returns `(label, latitude, longitude)` for the first place in its `results`. The label is the `name`, `admin1` and `country`, leaving out any that are missing: `Penzance, England, United Kingdom`. If there are no results, it returns `None`.
    3. `forecast_url(latitude, longitude)` returns `FORECAST`, then a query string with `latitude`, `longitude`, `daily` set to `DAILY`, `timezone` set to `auto` and `forecast_days` set to `3`.
    4. `forecast_lines(forecast)` returns one line per day, like `Sun 25 Oct: Light drizzle, 10 to 13°C, 90% chance of rain, wind up to 37 km/h`. Temperatures and wind are rounded with `round()`. A missing field raises a `KeyError`.
    5. `main()` puts them together and ends with `Weather data by Open-Meteo.com`. When something goes wrong it prints one line, and only that:
       - nothing typed: `Type the name of a place.`, without asking the internet anything
       - no such place: `No place called Lyonesse.`
       - no connection, or the service says no: `Can't reach the weather service. Try again later.`
       - a field missing: `The forecast came back without 'wind_speed_10m_max'.`
  example: |
    Where? Penzance
    Penzance, England, United Kingdom
    Sun 25 Oct: Light drizzle, 10 to 13°C, 90% chance of rain, wind up to 37 km/h
    Mon 26 Oct: Rain, 12 to 16°C, 100% chance of rain, wind up to 46 km/h
    Tue 27 Oct: Rain, 10 to 16°C, 96% chance of rain, wind up to 45 km/h
    Weather data by Open-Meteo.com
ship:
  dialogue:
    - yahya: "Penzance, three days, rain on all of them. I'm running Tuesday's 10K anyway. In a better jacket."
    - yahya: "And it answers in under a second. I timed it, obviously."
    - paul: "It asks another computer and stays calm when nobody answers. That's most of the job."
  shelf: { object: weathervane, label: "Yahya's three-day forecast" }
  cards: [web-apis, http-basics]
stretch:
  - id: not-known
    title: "Not known"
    prompt: |
      When Open-Meteo has no value for a day, it sends `null`, which arrives in Python as `None`, and `round(None)` crashes. Make `forecast_lines` say so instead of guessing: a chance of rain of `None` becomes `chance of rain not known`, and a wind of `None` becomes `wind not known`.

      ```
      Wed 28 Oct: Rain, 9 to 14°C, chance of rain not known, wind not known
      ```
    tests: tests/stretch-not-known.py
    solution: solutions/stretch-not-known.py
  - id: knots
    title: "Knots, for sailors"
    prompt: |
      Sailors read wind in knots. Open-Meteo will send knots if the URL asks for them with `wind_speed_unit=kn`. Give `forecast_url` a keyword argument, `wind_unit="kmh"`, add it to the query string, and make the line say `knots` when that's what came back. The reply's `daily_units` says which it is.
  - id: which-penzance
    title: "Which Penzance"
    prompt: |
      There are three places called Penzance: one in Cornwall, one in Arizona and one in Saskatchewan. Ask the geocoding service for up to five with `count=5`, number them, and let the person choose, unless there's only one.
