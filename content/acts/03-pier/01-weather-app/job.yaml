id: weather-app
title: "Weather App"
project_name: "Weather App"
portfolio_readme: |
  # Weather App

  A weather forecast for anywhere, on the command line. Type a place: it looks the place up with Open-Meteo's geocoding service, asks Open-Meteo's forecast service for the next three days, and prints them in plain words, with the weather, the low and the high, the chance of rain and the strongest wind. It needs no API key.

  Written by {name} for Yahya, at Paul's Python Course. Finished {date}.

  ## Run it

  ```
  python weather.py
  ```

  ```
  Where? Penzance
  Penzance, England, United Kingdom
  Sun 25 Oct: Light drizzle, 10 to 13°C, 90% chance of rain, wind up to 37 km/h
  Mon 26 Oct: Rain, 12 to 16°C, 100% chance of rain, wind up to 46 km/h
  Tue 27 Oct: Rain, 10 to 16°C, 96% chance of rain, wind up to 45 km/h
  Weather data by Open-Meteo.com
  ```

  It needs the internet. To try it without, set `OFFLINE = True` at the top of `weather.py`, and it reads the saved replies in the same folder, `places.json` and `forecast.json`, instead.

  ## What it shows

  - Calling a real web API: a URL with a query string built by `urlencode`, and JSON back
  - Reading nested JSON, and walking Open-Meteo's lists of daily values together with `zip`
  - Three things that go wrong, each handled on purpose: no connection (an `OSError`), no such place (an empty answer, so `None`), and a reply without a field (a `KeyError`)
  - The one function that uses the internet kept apart from the rest, so everything else can be tested with saved replies

  ## Credits

  Weather data by Open-Meteo.com (https://open-meteo.com/), under CC BY 4.0. Place names and positions come from GeoNames (https://www.geonames.org/), through Open-Meteo's geocoding service, also under CC BY 4.0. Open-Meteo's free service is for non-commercial use, at fewer than 10,000 requests a day.
