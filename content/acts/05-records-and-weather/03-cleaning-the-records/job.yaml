id: cleaning-the-records
title: "Data Cleaning Pipeline"
project_name: "Data Cleaning Pipeline"
portfolio_readme: |
  # Data Cleaning Pipeline

  A pandas pipeline that cleans a messy register in five written-down steps: tidy the text, read dates typed three different ways, turn text into numbers, throw out the impossible, and drop the duplicates. Each step is a function that takes a table and gives back a cleaner copy, so each can be checked on its own, and the original is never written on. It reports what every step did, then saves the clean table.

  Written by {name} for Mr Ashby at the Records Office in {{town}}. Finished {date}.

  ## Run it

  ```
  pip install pandas
  python main.py
  ```

  It reads `register.csv`, the lifeboat crew register as three volunteers typed it, and writes `register_clean.csv`:

  ```
  Read register.csv: 133 rows, 13 values missing
    tidy_text        133 rows, 13 values missing
    read_dates       133 rows, 13 values missing
    make_numbers     133 rows, 21 values missing
    drop_impossible  133 rows, 22 values missing
    drop_duplicates  128 rows, 21 values missing
  Saved register_clean.csv

  Crew on the register: 128
  Joined from 1925 to 2023
  Ages known for 108; average age on joining: 26.5
  Most launches: Walter Kerrow, 251
  ```

  The register is invented, for the {{town}} lifeboat, and its mistakes were put in on purpose: the kinds real registers have.

  ## What it shows

  - A cleaning pipeline: a list of functions, each DataFrame in and DataFrame out, run in order, with the order chosen for a reason (duplicates last)
  - Reading dates in several known formats with `pd.to_datetime(..., format=..., errors="coerce")` instead of letting pandas guess
  - Missing data kept missing (`NaN`, `NaT`) rather than filled with guesses, and impossible values found and removed
  - Text tidied with `.str` methods, numbers read with `pd.to_numeric`, and copies made so the raw table is never changed
downloadable: true
# register.csv is invented for the story: a {{town}} lifeboat register, typed three ways
# by three volunteers, with its mistakes chosen to teach cleaning. See the README.
datasets: []
client: ashby
building: records-office
estimated_minutes: 85
summary: "Three volunteers typed up the lifeboat register three different ways. A pandas pipeline cleans it once, in five written-down steps, so nobody has to again."
concepts_introduced: [missing-data, data-cleaning]
concepts_reviewed: [pandas-basics, selecting-filtering, vectorisation, string-methods, strip-replace, copying, none, functions, functions-as-values, docstrings, main-guard]
ask:
  dialogue:
    - ashby: "The lifeboat crew register. Everyone who has volunteered since 1925."
    - ashby: "Three volunteers typed it up. Each had their own ideas about dates."
    - ashby: "My grandfather is in it twice. And a Samuel Vosper joined at 412."
    - moss: "Clean it once, properly, and write down how. Then nobody does it again."
  spec: |
    `register.csv` has the columns `name`, `joined`, `age` (on joining), `parish` and `launches`, all as the volunteers typed them.

    Build a cleaning pipeline: five steps, each a function that takes a table and gives back a cleaner copy, run in order. `PIPELINE` lists them, and the report at the bottom, which prints what each step did and saves `register_clean.csv`, is written.

    Write `parse_dates(column)`, which reads a column of text dates written any of three ways (`1960-01-09`, `09/01/1960` or `9 Jan 1960`) and leaves any it can't read missing. Then the steps:

    1. `tidy_text(register)`: `name` and `parish` with no spaces at either end, and in title case, like `High Street`.
    2. `read_dates(register)`: `joined` as real dates, read with `parse_dates`.
    3. `make_numbers(register)`: `age` as a number, with blanks and `unknown` missing; `launches` as whole numbers, where `none` means 0.
    4. `drop_impossible(register)`: any age over 100 made missing.
    5. `drop_duplicates(register)`: rows that are the same appear once, labelled 0, 1, 2 and so on again.

    Each step changes only its own columns. Then `clean_register(raw)` runs the register through every step in `PIPELINE`, in order, and gives back the result.

    No step changes the table it's given. Mr Ashby never writes on an original.
  example: |
    Read register.csv: 133 rows, 13 values missing
      tidy_text        133 rows, 13 values missing
      read_dates       133 rows, 13 values missing
      make_numbers     133 rows, 21 values missing
      drop_impossible  133 rows, 22 values missing
      drop_duplicates  128 rows, 21 values missing
    Saved register_clean.csv

    Crew on the register: 128
    Joined from 1925 to 2023
    Ages known for 108; average age on joining: 26.5
    Most launches: Walter Kerrow, 251
ship:
  dialogue:
    - ashby: "A hundred and twenty-eight of them. Twenty-six and a half, on average, when they joined."
    - ashby: "Arthur Ashby, 1931, aged thirty-eight. Once, now. As he should be."
    - ashby: "Twenty ages we'll never know. I'd rather keep a gap than file a guess."
    - moss: "And the steps are written down, one function each. That's the part that lasts."
  shelf: { object: crew-register, label: "The lifeboat register, cleaned once and properly" }
  cards: [missing-data, data-cleaning]
stretch:
  - id: joined-in
    title: "The year of the storm"
    prompt: |
      Write `joined_in(crew, year)`. It takes the cleaned register and returns a list of the names of everyone who joined in that year, earliest first. `crew["joined"].dt.year` gives the year of every date in the column.

      `joined_in(crew, 1987)` should find a volunteer who joined the morning after the storm.
    tests: tests/stretch-joined-in.py
    solution: solutions/stretch-joined-in.py
  - id: cleaning-log
    title: "A cleaning log"
    prompt: |
      The report says how many values are missing after each step, not what each step changed. Write `changes(before, after)`, which counts the values that differ between two tables of the same shape, counting a gap in both as no change, and print it for every step but the last. For `drop_duplicates`, print the rows dropped instead. Mr Ashby would like the log pinned to the register's folder.
