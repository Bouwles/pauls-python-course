id: records-and-weather
number: 5
title: "The Archive"
district: records-office
subject: "Data science"
hours: 40
summary: "Yahya's floor: filing cabinets that came with the building, a chart that takes up a whole wall, and a weather station outside the window that has kept a book since 1925. Real data, as real programs: a grade book in NumPy, a cleaning pipeline and pivot tables in pandas, a weather dashboard, a statistics toolkit, a linear algebra lab, the calculus machine learning leans on, and a data story of your own."
locked_line: "A century of records in the cabinets, and Yahya has a question for every one."
intro:
  - paul.neutral.point: "Fourth floor. Yahya's. The cabinets came with the building."
  - paul.thinking: "A century of records, and a weather station that never stopped writing things down."
  - yahya.pleased.wave: "Every number up here has a story in it. Most of them are boring. Some aren't."
  - yahya.unimpressed: "And if your chart starts at forty, I will notice."
