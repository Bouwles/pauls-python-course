id: is-it-really-warmer
title: "Statistics Toolkit"
project_name: "Statistics Toolkit"
portfolio_readme: |
  # Statistics Toolkit

  A small toolkit for deciding whether a difference is real: the difference between two groups' means, a permutation test that shuffles the readings ten thousand times to see how often luck alone does as well, a p-value from it, and a correlation coefficient worked out from the formula. The report uses it on a century of weather and shows why a strong correlation isn't a cause.

  Written by {name} for Yahya, at Paul's Python Course. Finished {date}.

  ## Run it

  ```
  pip install numpy pandas
  python main.py
  ```

  It reads `station.csv`, a century of monthly readings, and compares the first thirty years with the last thirty:

  ```
  First thirty years: 11.06 degrees C. Last thirty: 11.92.
  Warmer by 0.86 degrees C. Shuffled 10,000 times, chance did as well 0 times.
  Drier by 35 mm a year. Shuffled 10,000 times, chance did as well 1,090 times.
  Year and temperature: r = 0.63
  The Clocktower's age and temperature: r = 0.63
  ```

  The station book is made up for the story. The functions work on any two groups of numbers.

  ## What it shows

  - Probability by simulation: shuffling with a seeded random generator, so the result can be repeated
  - A permutation test and its p-value, and the difference between "luck can't do this" and "luck does this one time in ten"
  - Pearson's correlation from its formula, with NumPy
  - Correlation against causation: the Clocktower's age correlates with the warming exactly as well as the year does
downloadable: true
# station.csv is invented for the story: the Clocktower's station book, 1925 to 2024. See the
# README; the Weather History Dashboard uses a real station's record.
datasets: []
client: yahya
building: weather-station
estimated_minutes: 90
summary: "A statistics toolkit for Yahya's bet that it's warmer outside the Clocktower than it used to be: a permutation test that says how often luck alone could have made the difference, and a correlation that isn't a cause."
concepts_introduced: [probability, permutation-tests, correlation-causation]
concepts_reviewed: [numpy-arrays, vectorisation, pandas-basics, groupby, descriptive-statistics, random-module, for-loops, functions, return-values, default-arguments, docstrings, main-guard, f-strings]
ask:
  dialogue:
    - yahya.proud.wave: "I bet Paul it's warmer now than when the station book started. He says prove it isn't luck."
    - yahya.thinking: "The last thirty years are 0.86 of a degree up on the first thirty. Could luck do that?"
    - paul.neutral.point: "Find out how often luck does it, then."
    - yahya.laughing: "Fine. And Paul says it's drier now. Same question for him."
  spec: |
    A statistics toolkit: four functions that work on any two groups of numbers, and a report at the bottom that uses them. `station.csv` is the station book: one row per month from 1925 to 2024, with `year`, `month`, `temp` (degrees C), `rain` (mm) and `sun` (hours).

    Write four functions. `before` and `after` are arrays or Series of readings; leave them as they were.

    - `difference(before, after)`: the mean of `after` minus the mean of `before`.
    - `shuffled_differences(before, after, rng, shuffles=10_000)`: an array of `shuffles` differences. For each, put all the readings together, shuffle them with `rng.permutation`, deal the first `len(before)` into one group and the rest into the other, and take the difference of their means, the second group's minus the first's.
    - `p_value(before, after, rng, shuffles=10_000)`: the share of shuffled differences at least as big as the real one.
    - `correlation(x, y)`: the correlation r between two equally long sets of numbers, from -1 to 1, worked out from the formula.

    The report compares the first thirty years with the last thirty, then correlates the temperature with the year and with the Clocktower's age: it was built in 1890.
  example: |
    First thirty years: 11.06 degrees C. Last thirty: 11.92.
    Warmer by 0.86 degrees C. Shuffled 10,000 times, chance did as well 0 times.
    Drier by 35 mm a year. Shuffled 10,000 times, chance did as well 1,090 times.
    Year and temperature: r = 0.63
    The Clocktower's age and temperature: r = 0.63
ship:
  dialogue:
    - yahya.proud.cheer: "Warmer, and luck didn't do it. Paul owes me a coffee."
    - yahya.thinking: "Drier, perhaps. Luck manages that one time in ten, so his bet's a draw."
    - paul.unimpressed: "And the line about the Clocktower's age?"
    - yahya.laughing: "Struck out. Correlated, and nothing to do with it."
  shelf: { object: thermometer, label: "Yahya's bet: warmer, and not by luck" }
  cards: [probability, permutation-tests, correlation-causation]
stretch:
  - id: either-way
    title: "Warmer or colder"
    prompt: |
      `p_value` only asks whether `after` is bigger. If you didn't know which way to expect a change, you'd count a shuffle as doing as well when its difference is at least as far from 0 in either direction. Write `two_sided_p(before, after, rng, shuffles=10_000)`. `np.abs` helps.

      Try it on the rain. Why is it about twice the one-sided answer?
    tests: tests/stretch-either-way.py
    solution: solutions/stretch-either-way.py
  - id: which-months
    title: "Which months warmed"
    prompt: |
      Run the permutation test once for each month: Januaries before against Januaries after, and so on. Print each month's difference and p-value. Then think about this: run twelve tests, and one of them will come out under 0.1 by luck about one time in... how many?
