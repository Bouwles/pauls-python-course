summary: "Real geographic data on a map: Neil's question about where in the world last year's rockets went up from, answered with every orbital launch site plotted by latitude and longitude, sized by its number of launches and coloured by how many reached orbit, over a public coastline, with an honest note on what a map projection does to distances."
