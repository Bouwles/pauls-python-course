id: grade-calculator
title: "Grade Calculator"
project_name: "Grade Calculator"
portfolio_readme: |
  # Grade Calculator

  Type in each student's marks and it works out their average and a letter grade, then the average for the whole class. It's built from small functions that each do one job, so each one can be checked on its own.

  Written by {name} in {{town}}. Finished {date}.

  ## Run it

  ```
  python main.py
  ```

  Type a name, then that student's marks with spaces between them. A blank name ends the class.

  ```
  Name? Sanjay
  Marks? 52 61 48
  Sanjay: 53.7 (C)
  Name?
  Class average: 53.7
  ```

  ## Grades

  | Average | Grade |
  | --- | --- |
  | 70 or more | A |
  | 60 or more | B |
  | 50 or more | C |
  | 40 or more | D |
  | under 40 | F |

  ## What it shows

  - Functions with parameters that hand back their answers with `return`: `read_marks`, `average` and `grade`.
  - `None` for the average of no marks at all, checked with `is None`, instead of a crash from dividing by zero.
  - A `main()` that does all the asking and printing, so the other functions can be imported and tested on their own.
downloadable: true
datasets: []
client: gwen
building: pub
estimated_minutes: 55
summary: "Marks in, averages and letter grades out, built from small functions that each do one job."
concepts_introduced: [functions, parameters, return-values, none, scope]
concepts_reviewed: [split-join, lists, append-pop, for-loops, while-loops, sentinels, if-elif-else, int-conversion, f-strings]
ask:
  dialogue:
    - gwen: "Mrs Vance holds her evening class in my back room. Local history, Thursdays."
    - gwen: "She's at her sister's for a fortnight. Guess who's been left the marking."
    - gwen: "An average and a letter for everyone, on her desk by Friday. She will check."
    - moss: "Small pieces, each with a name. Then you can check each one."
  spec: |
    Write three functions, then a `main()` that uses them.

    - `read_marks(text)` takes marks typed with spaces between them, like `"52 61 48"`, and returns them as a list of whole numbers: `[52, 61, 48]`. Nothing typed gives `[]`.
    - `average(marks)` returns the mean of a list of marks, or `None` if the list is empty.
    - `grade(mark)` returns `"A"` for 70 or more, `"B"` for 60 or more, `"C"` for 50 or more, `"D"` for 40 or more, and `"F"` under 40.
    - `main()` asks `Name? ` and `Marks? ` for each student until a blank name, and prints `Sanjay: 53.7 (C)`, or `Old Tom: no marks yet` if no marks were typed. At the end it prints the average of every mark in the class, `Class average: 70.0`, or `Class average: no marks yet`.

    Averages are shown to one decimal place.
  example: |
    Name? Sanjay
    Marks? 52 61 48
    Sanjay: 53.7 (C)
    Name? Mr Ashby
    Marks? 88 92 79
    Mr Ashby: 86.3 (A)
    Name? Old Tom
    Marks?
    Old Tom: no marks yet
    Name?
    Class average: 70.0
ship:
  dialogue:
    - gwen: "Mr Ashby, eighty-six point three. He'll want it framed."
    - gwen: "Old Tom, no marks yet. He wrote about the 1987 storm again. On all three papers."
  shelf: { object: exam-paper, label: "Mrs Vance's marks, done by Gwen" }
  cards: [functions, parameters, return-values, none, scope]
stretch:
  - id: top
    title: "Top of the class"
    prompt: |
      Mrs Vance likes to know who came first. After the class average, print `Top: Mr Ashby (86.3)`. If two students tie, the one typed in first wins. If nobody has any marks, leave the line out.
    tests: tests/stretch-top.py
    solution: solutions/stretch-top.py
  - id: smudged
    title: "A smudged mark"
    prompt: |
      Some marks come in smudged, and Gwen types `6O` with a letter O. `int()` crashes on it. Make `read_marks` skip any word that isn't all digits: `word.isdigit()` tells you. The Calculator job, two along, has a better way of catching that kind of crash.
