id: grade-calculator
title: "Grade Calculator"
project_name: "Grade Calculator"
portfolio_readme: |
  # Grade Calculator

  Type in the marks on each paper from a Python test and it works out the paper's average and a letter grade, then the average for the whole class. It's built from small functions that each do one job, so each one can be checked on its own.

  Written by {name} for Paul, at Paul's Python Course. Finished {date}.

  ## Run it

  ```
  python main.py
  ```

  Type a name, then that paper's marks with spaces between them. A blank name ends the class.

  ```
  Name? Candidate 1
  Marks? 52 61 48
  Candidate 1: 53.7 (C)
  Name?
  Class average: 53.7
  ```

  ## Grades

  | Average | Grade |
  | --- | --- |
  | 70 or more | A |
  | 60 or more | B |
  | 50 or more | C |
  | 40 or more | D |
  | under 40 | F |

  ## What it shows

  - Functions with parameters that hand back their answers with `return`: `read_marks`, `average` and `grade`.
  - `None` for the average of no marks at all, checked with `is None`, instead of a crash from dividing by zero.
  - A `main()` that does all the asking and printing, so the other functions can be imported and tested on their own.
downloadable: true
datasets: []
client: paul
building: pub
estimated_minutes: 55
summary: "Marks for the class's first Python test in, averages and letter grades out, built from small functions that each do one job."
concepts_introduced: [functions, parameters, return-values, none, scope]
concepts_reviewed: [split-join, lists, append-pop, for-loops, while-loops, sentinels, if-elif-else, int-conversion, f-strings]
ask:
  dialogue:
    - paul.neutral.wave: "The class sat its first Python test on Friday. I've been putting off the marking."
    - paul.unimpressed: "Papers are marked blind: candidate numbers, no names. Nobody gets a kind mark."
    - paul.neutral.point: "An average and a letter for each paper, and one for the class. Small functions, each one checkable."
    - neil.laughing: "He means he'll check every function. Twice."
  spec: |
    Write three functions, then a `main()` that uses them.

    - `read_marks(text)` takes marks typed with spaces between them, like `"52 61 48"`, and returns them as a list of whole numbers: `[52, 61, 48]`. Nothing typed gives `[]`.
    - `average(marks)` returns the mean of a list of marks, or `None` if the list is empty.
    - `grade(mark)` returns `"A"` for 70 or more, `"B"` for 60 or more, `"C"` for 50 or more, `"D"` for 40 or more, and `"F"` under 40.
    - `main()` asks `Name? ` and `Marks? ` for each paper until a blank name, and prints `Candidate 1: 53.7 (C)`, or `Candidate 3: no marks yet` if no marks were typed. At the end it prints the average of every mark in the class, `Class average: 70.0`, or `Class average: no marks yet`.

    Averages are shown to one decimal place.
  example: |
    Name? Candidate 1
    Marks? 52 61 48
    Candidate 1: 53.7 (C)
    Name? Candidate 2
    Marks? 88 92 79
    Candidate 2: 86.3 (A)
    Name? Candidate 3
    Marks?
    Candidate 3: no marks yet
    Name?
    Class average: 70.0
ship:
  dialogue:
    - paul.pleased: "Candidate 2, eighty-six point three. Tidy code, whoever you are."
    - yahya.surprised: "Is Candidate 2 me?"
    - paul.pleased: "Blind marking, Yahya. You'll find out on Friday."
  shelf: { object: exam-paper, label: "Marks for the class's first Python test" }
  cards: [functions, parameters, return-values, none, scope]
stretch:
  - id: top
    title: "Top of the class"
    prompt: |
      Yahya would like to know who came first. After the class average, print `Top: Candidate 2 (86.3)`. If two papers tie, the one typed in first wins. If nobody has any marks, leave the line out.
    tests: tests/stretch-top.py
    solution: solutions/stretch-top.py
  - id: smudged
    title: "A smudged mark"
    prompt: |
      Some marks come in smudged, and Paul types `6O` with a letter O. `int()` crashes on it. Make `read_marks` skip any word that isn't all digits: `word.isdigit()` tells you. The Calculator job, two along, has a better way of catching that kind of crash.
