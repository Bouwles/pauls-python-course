id: ferry-fare-machine
title: "The Ferry Fare Machine"
client: ferro
building: ferry-dock
estimated_minutes: 40
summary: "Fares by age and time of day."
concepts_introduced: [bool, comparisons, if-elif-else, boolean-operators, nested-conditions]
concepts_reviewed: [input-returns-text, int-conversion, f-strings, variables]
ask:
  dialogue:
    - ferro: "The fare machine charges every soul aboard three pounds. Has done since Easter."
    - ferro: "Under fives sail free. Children and pensioners, one fifty."
    - ferro: "Night crossings are a pound dearer for adults. The purser insists."
    - moss: "It'll have to make decisions, then. That's new."
  spec: |
    Ask for the passenger's age and the hour of sailing, on the 24-hour clock (0 to 23).

    - Under 5: free.
    - 5 to 15, or 65 and over: 1.50.
    - 16 to 64: 3.00 by day, 4.00 at night. A crossing is at night if it sails before 7, or at 19 or later.

    Print the fare with two decimal places.
  example: |
    Age? 34
    Hour of sailing? 20
    Fare: 4.00
ship:
  dialogue:
    - ferro: "Thirty-four, sailing at twenty hundred. Four pounds. Correct."
    - ferro: "My mother takes the dawn crossing on Thursdays. One fifty, and not a penny more."
  shelf: { object: ticket, label: "Ferro's fare machine" }
  cards: [bool, comparisons, if-elif-else, boolean-operators, nested-conditions]
stretch:
  - id: returns
    title: "Return tickets"
    prompt: |
      Ask `Return? ` after the hour. If the answer is `yes`, the fare is doubled. Free is still free.
    tests: tests/stretch-returns.py
    solution: solutions/stretch-returns.py
  - id: no-sailing
    title: "No such hour"
    prompt: |
      The crew sometimes type `25`. If the hour is below 0 or above 23, print `No sailing at that hour.` and no fare.
