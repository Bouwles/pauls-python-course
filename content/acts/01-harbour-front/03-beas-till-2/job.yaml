id: beas-till-2
title: "Bea's Till, part 2"
client: bea
building: bakery
estimated_minutes: 30
summary: "The till asks, listens and prices."
concepts_introduced: [input-returns-text, int-conversion, float-conversion, f-strings, type-function]
concepts_reviewed: [variables, arithmetic, print]
ask:
  dialogue:
    - bea: "The till from last week works. But it only knows one order."
    - bea: "I want it to ask. What are you buying, how many, then tell me the price."
    - moss: "It'll need to listen, then."
  spec: |
    Ask for the item (`bread` or `bun`) and the quantity. Bread is 2.40, a bun is 0.85.
    Print the total with two decimal places.
  example: |
    Item? bread
    How many? 3
    That's 7.20, please.
ship:
  dialogue:
    - bea: "Seven twenty for three loaves. That's what I'd have said."
    - bea: "Good. I'll stop doing it on the back of a paper bag."
  shelf: { object: loaf, label: "Bea's till, the one that asks" }
  cards: [input-returns-text, int-conversion, float-conversion, f-strings, type-function]
stretch:
  - id: any-case
    title: "Bread, BREAD or bread"
    prompt: |
      Customers type `Bread`, `BREAD` and ` bread ` too. Make the till accept all of them.
      `item.strip()` removes spaces from the ends, and `item.lower()` turns capitals into lower case.
    tests: tests/stretch-any-case.py
    solution: solutions/stretch-any-case.py
  - id: not-sold
    title: "We don't sell that"
    prompt: |
      If the item is not bread or a bun, print `We don't sell that.` and don't ask how many.
