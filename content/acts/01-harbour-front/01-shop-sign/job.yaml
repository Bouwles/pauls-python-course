id: shop-sign
title: "Course Sign"
project_name: "Course Sign"
portfolio_readme: |
  # Course Sign

  A first program. It prints the sign for the front door of a Python course: the course's name, what it teaches, its opening hours and a note for visitors, one line each.

  Written by {name} for Paul, at Paul's Python Course. Finished {date}.

  ## Run it

  ```
  python main.py
  ```

  It prints:

  ```
  PAUL'S PYTHON COURSE
  Python, from the ground floor up
  Open Monday to Friday, 9 till 5
  Ignore the clock. It says 3:14.
  ```

  To make a sign for another door, change the text inside the quotes.

  ## What it shows

  - A program runs from the top down, one line at a time
  - `print()` and strings, including an apostrophe kept safe inside double quotes
  - A comment at the top saying what the program is for
downloadable: true
datasets: []
client: paul
building: workshop
estimated_minutes: 20
summary: "A first program: print the sign for the Clocktower's front door."
concepts_introduced: [program-order, print, strings, comments]
ask:
  dialogue:
    - paul: "Welcome to the Workshop. First job: the sign on the front door."
    - paul: "The old one fell off in the rain. Nobody could tell this was a school."
    - paul: "Name, what we teach, the hours, and a warning. Four lines. Nothing clever."
  spec: |
    Write a program that prints the sign for the Clocktower's front door: the course's name, what it teaches, the opening hours and a note for visitors.

    Four lines, exactly as below, in this order.
  example: |
    PAUL'S PYTHON COURSE
    Python, from the ground floor up
    Open Monday to Friday, 9 till 5
    Ignore the clock. It says 3:14.
ship:
  dialogue:
    - paul: "Straight lines. No spelling mistakes. Apostrophe in the right place."
    - paul: "One day I'll fix the clock, and the last line will be wrong. I can live with that."
  shelf: { object: workshop-sign, label: "The sign on the Clocktower door" }
  cards: [program-order, print, strings, comments]
stretch:
  - id: border
    title: "A border"
    prompt: |
      Put a line of `=` signs above and below the sign, exactly as long as the longest line (32 characters). Then the sign looks finished from across the street.
    tests: tests/stretch-border.py
    solution: solutions/stretch-border.py
  - id: second-sign
    title: "One for the back door"
    prompt: |
      Paul wants a smaller sign for the back door: `DELIVERIES` on the first line and `Knock twice. Then wait.` on the second. Add it under the main sign, with an empty line between them. `print()` with nothing inside prints an empty line.
