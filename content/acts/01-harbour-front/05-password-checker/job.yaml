id: password-checker
title: "Password Checker"
project_name: "Password Checker"
portfolio_readme: |
  # Password Checker

  A command-line password checker for the class server, where Aaesha's memory experiments keep their results. It asks for a username and a password, tests the password against six rules, and prints a reason for every rule it breaks, so whoever is typing knows exactly what to change. Then it gives a verdict: accepted or rejected.

  Written by {name} for Aaesha, at Paul's Python Course. Finished {date}.

  ## Run it

  ```
  python main.py
  ```

  ```
  Username? paul
  Password? Clock0314
  Too short: at least 10 characters.
  Ends in a year.
  Password rejected.
  ```

  ## The rules

  1. At least 10 characters.
  2. At least one capital and one lower-case letter.
  3. Not only letters: a number or a symbol somewhere.
  4. The username isn't inside it, in any case.
  5. The word `password` isn't inside it, even written `passw0rd`.
  6. It doesn't end in four digits, like a year.

  ## What it shows

  - String methods: `.lower()`, `.upper()`, `.isalpha()`, `.isdigit()`, `.strip()` and `.replace()`
  - `len()`, slicing (`password[-4:]`) and `in` for finding text inside text
  - Booleans, and conditions combined with `and`, `or` and `not`
  - Every rule checked on its own, so every problem is reported, not just the first
downloadable: true
datasets: []
client: aaesha
building: harbour-office
estimated_minutes: 55
summary: "Six rules for the server that holds Aaesha's experiment results, and a reason for every one a password breaks."
concepts_introduced: [string-methods, string-slicing, immutability, strip-replace, boolean-operators, in-operator]
concepts_reviewed: [strings, bool, comparisons, if-elif-else, input-returns-text, variables, f-strings]
ask:
  dialogue:
    - aaesha.pleased.wave: "My memory experiments run on the class server. Everyone's results are on it."
    - aaesha.worried: "Last year, every account had the password clocktower1. Four people knew it. Then everyone did."
    - aaesha.thinking: "People pick passwords they can remember. That's exactly what makes them easy to guess."
    - aaesha.neutral.point: "Six rules, numbered. When it says no, it says why."
    - paul.pleased: "Numbered requirements. Every programmer's favourite kind."
  spec: |
    Requirements, from Aaesha. Numbered, naturally.

    Ask for a username (`Username? `) and a password (`Password? `). For every rule the password breaks, print the reason, in this order:

    1. At least 10 characters. `Too short: at least 10 characters.`
    2. At least one capital and one lower-case letter. `Needs capitals and lower case.`
    3. Not only letters. `Needs a number or a symbol.`
    4. The username isn't inside it, in any case. `Contains your username.`
    5. The word `password` isn't inside it, in any case, even with a `0` for the `o`. `Contains the word password.`
    6. It doesn't end in four digits. `Ends in a year.`

    The last line is `Password accepted.` if it broke no rules, and `Password rejected.` if it broke any.
  example: |
    Username? paul
    Password? Clock0314
    Too short: at least 10 characters.
    Ends in a year.
    Password rejected.
ship:
  dialogue:
    - aaesha.neutral.point: "Clock0314. Too short, and it ends in four digits. It told Paul both. Correct."
    - paul.laughing: "I typed that one to test it."
    - aaesha.pleased.thumbs: "He's chosen a new one. He won't tell me what it is. Also correct."
  shelf: { object: notice, label: "Aaesha's password rules, numbered" }
  cards: [string-methods, string-slicing, immutability, strip-replace, boolean-operators, in-operator]
stretch:
  - id: passphrase
    title: "Long beats clever"
    prompt: |
      Four ordinary words are easier to remember than one short clever password, and harder to guess. Aaesha studies memory, and she'd like the checker to know it. A password of 20 characters or more is a **passphrase**: for a passphrase, skip rules 2, 3 and 6. Rules 4 and 5 still apply.

      `the clock is stuck at three fourteen` is accepted. `yahya cleans every dataset twice`, typed by `yahya`, is not.
    tests: tests/stretch-passphrase.py
    solution: solutions/stretch-passphrase.py
  - id: usual-suspects
    title: "The usual suspects"
    prompt: |
      Also reject anything containing `clocktower`, `qwerty` or `123456`, in any case, with `Too common.` as a seventh reason.

      Careful: `if "clocktower" or "qwerty" in low:` reads well and is wrong. Each side of an `or` is a whole question.
