id: reading-tracebacks
title: "Reading Tracebacks"
project_name: "Reading Tracebacks"
portfolio_readme: |
  # Reading Tracebacks

  Neil's race-day board for his karting club, put back together from five broken scripts about racing, rockets and the clock. Each script crashed in a different way, and each one was fixed by reading its traceback.

  Written by {name} for Neil, at Paul's Python Course. Finished {date}.

  ## Run it

  ```
  python main.py
  ```

  It prints the race day's times:

  ```
  Race day at the indoor track
  Practice 09:30
  Race 16:00
  ```

  ## What it shows

  The five scripts between them failed with the four errors a Python programmer meets most often:

  - `SyntaxError`: a bracket left open, so Python couldn't read the file at all
  - `NameError`: one variable spelt two ways
  - `TypeError`: text and a number joined with `+`, fixed with `str()`
  - `ValueError`: `int()` asked to read `"4.5"`, fixed with `float()`

  The habit behind all four: read a traceback from the bottom. The last line says what went wrong; the line number above it says where.
downloadable: true
datasets: []
client: neil
building: workshop
estimated_minutes: 35
summary: "Five broken racing and rocket scripts from Neil's first term, and the four errors every Python programmer meets."
concepts_introduced: [reading-tracebacks, syntax-error, name-error, type-error, value-error, str-conversion]
concepts_reviewed: [print, strings, variables, input-returns-text, int-conversion, float-conversion, f-strings]
ask:
  dialogue:
    - neil.pleased.wave: "Five scripts from my first term. Karting, rockets, one about the clock. Every one crashes."
    - neil.laughing: "I kept them on purpose. Best teaching material I own."
    - paul.neutral: "When Python breaks, it leaves a note. Today you learn to read the note."
  spec: |
    Neil's first-term scripts: a race-day board for his karting club, a rocket launch date, a glider's wings, and the clock. Five small scripts, and each one crashes.
    Read the traceback, find the line, fix it. Between them they hold the four errors you will meet most: SyntaxError, NameError, TypeError and ValueError.
    When the last script runs, the race-day board prints again.
  example: |
    Race day at the indoor track
    Practice 09:30
    Race 16:00
ship:
  dialogue:
    - neil.pleased.cheer: "Practice at nine thirty, race at four. Exactly what I meant to print in my first term."
    - paul.proud: "Five scripts, six tracebacks. Most people never read one."
  shelf: { object: tide-table, label: "Neil's race-day board, working again" }
  cards: [reading-tracebacks, syntax-error, name-error, type-error, value-error, str-conversion]
stretch:
  - id: on-purpose
    title: "Break it on purpose"
    prompt: |
      Write four tiny programs, each one line long, that cause a SyntaxError, a NameError, a TypeError and a ValueError. Read each traceback. Knowing how to cause an error is most of knowing how to fix it.
  - id: dennis
    title: "Tell the duck"
    prompt: |
      Pick the script you found hardest and explain it to the duck on Neil's desk: what it should have done, what it did, and the first line that surprised you.
