id: reading-the-wreckage
title: "Reading the Wreckage"
client: moss
building: workshop
estimated_minutes: 35
summary: "Five broken programs and the tracebacks that explain them."
concepts_introduced: [reading-tracebacks, syntax-error, name-error, type-error, value-error, str-conversion]
concepts_reviewed: [input-returns-text, int-conversion, float-conversion, f-strings, strings]
ask:
  dialogue:
    - moss: "Penhallow's tide script has stopped. Agnes has been guessing the tides since Tuesday."
    - moss: "It's in five pieces. Each one breaks a different way."
    - moss: "When Python breaks, it leaves a note. Learn to read the note."
  spec: |
    Fix five small programs from Penhallow's tide script. Each one crashes.
    Read the traceback, find the line, fix it. When the last one runs, the tide table prints again.
  example: |
    Tides for the north quay
    High water 06:42
    Low water 12:55
ship:
  dialogue:
    - agnes: "Six forty-two. Same as my guess. I'm keeping the program anyway."
    - moss: "Five tracebacks read. Most people never read one."
  shelf: { object: tide-table, label: "Penhallow's tide table, working again" }
  cards: [reading-tracebacks, syntax-error, name-error, type-error, value-error, str-conversion]
story_note: the-hill-is-harder
stretch:
  - id: on-purpose
    title: "Break it on purpose"
    prompt: |
      Write four tiny programs, each one line long, that cause a SyntaxError, a NameError, a TypeError and a ValueError. Read each traceback. Knowing how to cause an error is most of knowing how to fix it.
  - id: dennis
    title: "Tell Dennis"
    prompt: |
      Pick the piece you found hardest and explain it to Dennis: what it should have done, what it did, and the first line that surprised you.
