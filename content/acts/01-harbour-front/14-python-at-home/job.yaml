id: python-at-home
title: Python at Home
project_name: "Python at Home"
portfolio_readme: |
  # Python at Home

  Set Python up on your own computer: a terminal, an editor, a virtual environment and pytest, proved by a small program and its tests.

  Written by {name} at Paul's Python Course. Finished {date}.

  ## Run it

  ```
  python main.py
  ```
sidequest: true
client: neil
building: workshop
estimated_minutes: 45
summary: "Set Python up on your own computer: a terminal, an editor, a virtual environment and pytest, proved by a small program and its tests."
concepts_introduced: [terminal-basics, virtual-environments]
concepts_reviewed: [functions, return-values, strip-replace]
ask:
  dialogue:
    - neil: "Everything so far ran here in the Workshop. Real programs run on real computers."
    - neil: "Yours, for a start. Set it up properly once and it stays set up."
    - neil: "My first laptop had Python installed four times. Three of them are still in there somewhere."
    - paul: "Mine had five. We don't talk about it."
  spec: |
    Set Python up on your own computer, and prove it with a small program and its tests:

    - Python 3.10 or newer, run from a terminal
    - an editor (VS Code is a good one, and free)
    - a virtual environment for the project, with pytest installed in it
    - `hello.py`, with a `greeting(name)` function that the tests check
  example: |
    $ python hello.py Paul
    Morning, Paul.
ship:
  dialogue:
    - neil: "Same tests, your own computer. That's the whole trick of it."
    - paul: "One Python, one environment per project. Neil, check yours."
    - neil: "One Python. I checked twice."
  shelf:
    object: terminal
    label: "A terminal of your own"
  cards: [terminal-basics, virtual-environments]
