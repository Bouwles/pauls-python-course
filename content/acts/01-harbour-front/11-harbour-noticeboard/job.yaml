id: harbour-noticeboard
title: "The Harbour Noticeboard"
client: agnes
building: harbour-office
estimated_minutes: 45
summary: "Agnes's notices, tidied, censored and centred on the board."
concepts_introduced: [string-methods, string-slicing, immutability, split-join, strip-replace]
concepts_reviewed: [strings, input-returns-text, for-loops, if-elif-else, lists, slicing]
ask:
  dialogue:
    - agnes: "The harbour noticeboard. Anyone can post on it. That is the problem."
    - agnes: "I have written requirements. Six of them. Please read all six."
    - moss: "She numbers her shopping as well."
  spec: |
    Requirements, from Agnes Rook, harbour master:

    1. Ask for a title (`Title? `) and a notice (`Notice? `).
    2. The title has no spaces at either end and is in capitals.
    3. A title longer than 40 characters keeps its first 37 and gets `...` on the end.
    4. The title is centred in 40 characters.
    5. The notice has no spaces at either end and never more than one space between words. The rude words `blasted`, `flipping` and `dratted` become stars, one per letter.
    6. A line of 40 `=` goes above and below.
  example: |
    Title?   lost: one lobster pot
    Notice? Blue,   with a blasted yellow rope.  Return to the harbour office.
    ========================================
             LOST: ONE LOBSTER POT
    Blue, with a ******* yellow rope. Return to the harbour office.
    ========================================
ship:
  dialogue:
    - agnes: "Capitals, centred, censored. Requirement six, the border, also met."
    - agnes: "The fishermen will find new words. I'll send you the list."
  shelf: { object: notice, label: "The harbour noticeboard" }
  cards: [string-methods, string-slicing, immutability, split-join, strip-replace]
stretch:
  - id: any-case
    title: "BLASTED, in capitals"
    prompt: |
      The fishermen have found the caps lock. Censor `Blasted` and `BLASTED` too, keeping any punctuation stuck to the word.

      One way: split the notice into words, and for each word compare `word.strip(".,").lower()` with the rude words.
    tests: tests/stretch-any-case.py
    solution: solutions/stretch-any-case.py
  - id: wrap
    title: "Notices that fit"
    prompt: |
      Long notices run off the side of the board. Print the notice in lines of at most 40 characters, breaking only between words. Build each line from the list that `.split()` gives you, and start a new line when the next word won't fit.
