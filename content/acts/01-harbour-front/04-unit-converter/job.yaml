id: unit-converter
title: "Unit Converter"
project_name: "Unit Converter"
portfolio_readme: |
  # Unit Converter

  A small menu-driven converter for speeds from racing, flying and rocketry: kilometres per hour to miles per hour, knots to kilometres per hour, and a Mach number to kilometres per hour, at sea level or high up.

  Written by {name} for Neil, at Paul's Python Course. Finished {date}.

  ## Run it

  ```
  python main.py
  ```

  Pick a conversion from the menu, then type the speed:

  ```
  1. Km/h to mph
  2. Knots to km/h
  3. Mach to km/h
  Choose 1, 2 or 3: 3
  Speed? 2
  At sea level (yes or no)? no
  That's 2124.00 km/h.
  ```

  A mile is 1.609344 km and a knot is 1.852 km/h. Mach 1, the speed of sound, is about 1225 km/h at sea level and about 1062 km/h at 11 km up, where the air is colder.

  ## What it shows

  - A menu that chooses what to do with `if`, `elif` and `else`, and catches any choice that isn't on it
  - Comparisons, and the `True` or `False` each one gives back
  - A decision inside a decision, for the one option that needs a second question
  - Comparing what `input()` gives back as text, and turning speeds into floats for the arithmetic
downloadable: true
datasets: []
client: neil
building: ferry-dock
estimated_minutes: 50
summary: "A menu that converts racing, flying and rocket speeds, so Neil can compare an F1 car with a jet."
concepts_introduced: [bool, comparisons, if-elif-else, nested-conditions]
concepts_reviewed: [print, input-returns-text, float-conversion, f-strings, variables, arithmetic]
ask:
  dialogue:
    - neil.pleased.wave: "F1 gives me speeds in km/h. American racing gives me mph. I want to compare them."
    - neil.thinking: "Planes come in knots. Rockets come in Mach, and Mach depends on how high you are."
    - neil.neutral.point: "One converter for every speed I read about. Mach's the awkward one."
    - paul.neutral: "It'll have to choose what to do. That's new."
  spec: |
    Print a menu of three conversions and ask which one (`Choose 1, 2 or 3: `). Then ask for the speed (`Speed? `), which may have a decimal point.

    - 1: km/h to mph. One mile is 1.609344 km, so divide by it.
    - 2: knots to km/h. One knot is 1.852 km/h, so multiply by it.
    - 3: Mach to km/h. Ask `At sea level (yes or no)? `. Mach 1 is 1225 km/h at sea level and 1062 km/h high up.
    - Anything else: print `No such option.`

    Show the answer with two decimal places.
  example: |
    1. Km/h to mph
    2. Knots to km/h
    3. Mach to km/h
    Choose 1, 2 or 3: 3
    Speed? 2
    At sea level (yes or no)? no
    That's 2124.00 km/h.
ship:
  dialogue:
    - neil.surprised: "Three hundred and forty km/h is two hundred and eleven mph. I always guessed lower."
    - neil.pleased.cheer: "Mach 2 up high, two thousand one hundred and twenty-four. Converted before I'd finished reading."
    - paul.laughing: "He'll be converting speeds over lunch now. All of them."
  shelf: { object: compass, label: "Neil's unit converter" }
  cards: [bool, comparisons, if-elif-else, nested-conditions]
stretch:
  - id: yes-or-no
    title: "Yes or no"
    prompt: |
      At the moment anything but `yes` counts as high up, including `yse`. Make option 3 accept only `yes` or `no`, and print `Yes or no, please.` for anything else.
    tests: tests/stretch-yes-or-no.py
    solution: solutions/stretch-yes-or-no.py
  - id: both-ways
    title: "Both ways"
    prompt: |
      Neil wants to go back the other way. Add a fourth option, `4. Mph to km/h`, that turns miles per hour into kilometres per hour: multiply by 1.609344.

      ```
      Choose 1, 2, 3 or 4: 4
      Speed? 10
      That's 16.09 km/h.
      ```
    tests: tests/stretch-both-ways.py
    solution: solutions/stretch-both-ways.py
  - id: below-zero
    title: "Below zero"
    prompt: |
      A speed below zero is a typing mistake. Before converting, check the speed, and print `Can't be below zero.` instead of an answer.
