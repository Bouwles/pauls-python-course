id: unit-converter
title: "Unit Converter"
project_name: "Unit Converter"
portfolio_readme: |
  # Unit Converter

  A small menu-driven converter for runners: kilometres to miles, a pace in minutes per kilometre to minutes per mile, and laps of a running track to kilometres, indoor or outdoor.

  Written by {name} for Yahya, at Paul's Python Course. Finished {date}.

  ## Run it

  ```
  python main.py
  ```

  Pick a conversion from the menu, then type the amount:

  ```
  1. Km to miles
  2. Min per km to min per mile
  3. Laps to km
  Choose 1, 2 or 3: 3
  How many? 12
  Indoor track (yes or no)? no
  That's 4.80 km.
  ```

  A mile is 1.609344 km. An outdoor track is 400 metres a lap; an indoor one is 200.

  ## What it shows

  - A menu that chooses what to do with `if`, `elif` and `else`, and catches any choice that isn't on it
  - Comparisons, and the `True` or `False` each one gives back
  - A decision inside a decision, for the one option that needs a second question
  - Comparing what `input()` gives back as text, and turning amounts into floats for the arithmetic
downloadable: true
datasets: []
client: yahya
building: ferry-dock
estimated_minutes: 45
summary: "A menu that converts distances, paces and laps, for a runner whose app and training plan disagree on units."
concepts_introduced: [bool, comparisons, if-elif-else, nested-conditions]
concepts_reviewed: [print, input-returns-text, float-conversion, f-strings, variables, arithmetic]
ask:
  dialogue:
    - yahya: "My running app gives me kilometres. Every training plan I read wants miles."
    - yahya: "My pace is in minutes per kilometre. The plans want minutes per mile."
    - yahya: "Then the track counts laps, and indoor laps are half the size. One converter for all of it."
    - paul: "It'll have to choose what to do. That's new."
  spec: |
    Print a menu of three conversions and ask which one (`Choose 1, 2 or 3: `). Then ask for the amount (`How many? `), which may have a decimal point.

    - 1: kilometres to miles. One mile is 1.609344 km, so divide by it.
    - 2: a pace in minutes per km to minutes per mile. Multiply by 1.609344.
    - 3: laps to km. Ask `Indoor track (yes or no)? `. An indoor lap is 0.2 km; an outdoor lap is 0.4 km.
    - Anything else: print `No such option.`

    Show the answer with two decimal places.
  example: |
    1. Km to miles
    2. Min per km to min per mile
    3. Laps to km
    Choose 1, 2 or 3: 3
    How many? 12
    Indoor track (yes or no)? no
    That's 4.80 km.
ship:
  dialogue:
    - yahya: "Five minutes a kilometre is eight oh five a mile. Faster than the plan asks."
    - yahya: "Twelve outdoor laps, four point eight kilometres. Converted before I'd finished typing."
    - paul: "That was Yahya being pleased. It's subtle."
  shelf: { object: compass, label: "Yahya's unit converter" }
  cards: [bool, comparisons, if-elif-else, nested-conditions]
stretch:
  - id: yes-or-no
    title: "Yes or no"
    prompt: |
      At the moment anything but `yes` counts as an outdoor track, including `yse`. Make option 3 accept only `yes` or `no`, and print `Yes or no, please.` for anything else.
    tests: tests/stretch-yes-or-no.py
    solution: solutions/stretch-yes-or-no.py
  - id: both-ways
    title: "Both ways"
    prompt: |
      Yahya wants to go back the other way. Add a fourth option, `4. Miles to km`, that turns miles into kilometres: multiply by 1.609344.

      ```
      Choose 1, 2, 3 or 4: 4
      How many? 10
      That's 16.09 km.
      ```
    tests: tests/stretch-both-ways.py
    solution: solutions/stretch-both-ways.py
  - id: below-zero
    title: "Below zero"
    prompt: |
      A distance, a pace or a lap count below zero is a typing mistake. Before converting, check the amount, and print `Can't be below zero.` instead of an answer.
