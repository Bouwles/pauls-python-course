    title: "Warm"
    prompt: |
      When a wrong guess is within 5 of the number, print `Close.` on the line after `Too low.` or `Too high.`
    tests: tests/stretch-close.py
    solution: solutions/stretch-close.py
  - id: again
    title: "Another round"
    prompt: |
      After a win or a `q`, ask `Again? `. If the answer is `yes`, pick a new number and start a new game, with the count back at 0. That's the whole game inside another `while` loop.
