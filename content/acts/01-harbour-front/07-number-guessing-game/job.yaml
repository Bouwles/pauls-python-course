ask:
  dialogue:
    - gwen: "Quiet nights, the regulars play guess the number. I think of one, they guess."
    - gwen: "Every week somebody says I changed it halfway. I didn't. Mostly."
    - gwen: "I want a machine to pick it. Nobody can say a machine fiddled it."
    - moss: "They'll say it. But they'll say it to the machine."
  spec: |
    The machine picks a whole number from 1 to 100 with `random.randint(1, 100)`. Then it asks `Guess? ` until the game is over.

    - Too low or too high: say so.
    - Right: print `Got it in 4.` (however many guesses it took) and stop.
    - `q` instead of a number: print `It was 37.` (the real number) and stop. The regulars give up a lot.
    - A guess below 1 or above 100 gets `Between 1 and 100.` and doesn't count as a guess.
  example: |
    Guess? 50
    Too high.
    Guess? 25
    Too low.
    Guess? 37
    Got it in 3.
