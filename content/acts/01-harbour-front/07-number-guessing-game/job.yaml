id: number-guessing-game
title: "Number Guessing Game"
project_name: "Number Guessing Game"
portfolio_readme: |
  # Number Guessing Game

  The computer picks a whole number from 1 to 100 and you try to find it. After each guess it says too high or too low, and when you get it, it says how many guesses you took. Type `q` to give up and see the number. A guess outside 1 to 100 is turned away and doesn't count.

  Written by {name} for the Drowned Anchor in {{town}}. Finished {date}.

  ## Run it

  ```
  python main.py
  ```

  ```
  Guess? 50
  Too high.
  Guess? 25
  Too low.
  Guess? 37
  Got it in 3.
  ```

  Halve what's left each time and you'll find any number in seven guesses or fewer.

  ## What it shows

  - The `random` module, imported and used to pick a fresh number each game
  - A `while True` loop that keeps going until something stops it
  - `break` to stop on a win or a quit, and `continue` to skip a guess that doesn't count
  - A counter for the guesses, set before the loop and added to inside it
  - A quit word (a sentinel), checked while it's still text, before anything turns it into a number
