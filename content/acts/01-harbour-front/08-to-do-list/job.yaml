id: to-do-list
title: "To-Do List"
project_name: "To-Do List"
portfolio_readme: |
  # To-Do List

  A to-do list that runs in the terminal, made for an artist's commissions. Add tasks, list them with numbers, tick them off by number, and quit to see how many are left. Tasks stay in the order they were added, so whoever asked first is drawn first, and the ones after a finished task move up to fill the gap.

  Written by {name} for Riya, at Paul's Python Course. Finished {date}.

  ## Run it

  ```
  python main.py
  ```

  The commands are `add`, `list`, `done` and `quit`.

  ```
  Command? add
  Task? Neil's rocket poster
  Command? add
  Task? Caitlin's album cover
  Command? list
  1. Neil's rocket poster
  2. Caitlin's album cover
  Command? done
  Number? 1
  Done: Neil's rocket poster
  Command? quit
  Left to do: 1
  ```

  The list lives only while the program runs. Saving it to a file is a job for later.

  ## What it shows

  - A list that grows with `.append()` and shrinks with `.pop()`
  - Indexes from 0, and turning a person's number, which starts at 1, into an index
  - Looping over a list with `range(len(...))` to number every item
  - A menu loop: `while True`, one branch per command, `break` to quit
  - Checking a number is on the list before using it
downloadable: true
datasets: []
client: riya
building: post-office
estimated_minutes: 60
summary: "Add, list, tick off and quit: Riya's commissions, numbered and kept in the order people asked."
concepts_introduced: [lists, indexing, negative-indices, append-pop, looping-lists, list-methods, slicing, sorted-vs-sort, list-aliasing]
concepts_reviewed: [in-operator, while-loops, sentinels, break-continue, for-loops, range, if-elif-else, boolean-operators, int-conversion, f-strings]
ask:
  dialogue:
    - riya.pleased.wave: "Three commissions, a print run and an exhibition. My to-do list is a sketchbook margin."
    - riya.neutral.point: "Numbered, please. New ones on the end. Done ones taken off. Never shuffled. People asked in that order."
    - riya.laughing: "And it starts at one. I know Python counts from nought. My clients don't."
    - paul.thinking: "Then you'll be adding one, and taking it away again."
  spec: |
    A menu. Ask `Command? ` over and over:

    - `add`: ask `Task? ` and put the task on the end of the list.
    - `list`: print every task with its number, starting from 1, like `1. Neil's rocket poster`. With no tasks, print `Nothing to do.`
    - `done`: ask `Number? `, take that task off the list, and print `Done: ` and the task. A number that isn't on the list gets `No task 7.` and nothing is taken off.
    - `quit`: print `Left to do: 2` (however many are left) and stop.
    - Anything else gets `Commands: add, list, done, quit.`
  example: |
    Command? add
    Task? Neil's rocket poster
    Command? add
    Task? Caitlin's album cover
    Command? add
    Task? Order more ink
    Command? done
    Number? 2
    Done: Caitlin's album cover
    Command? list
    1. Neil's rocket poster
    2. Order more ink
    Command? quit
    Left to do: 2
ship:
  dialogue:
    - riya.pleased: "Number two done, and the ink moved up to two. Nothing shuffled. Nothing lost."
    - riya.proud.thumbs: "Who's going to use it? Me, every morning, before I pick up a pencil."
    - caitlin.laughing: "My album cover was number two. I'm not complaining."
  shelf: { object: list, label: "Riya's commissions, in order" }
  cards: [lists, indexing, negative-indices, append-pop, looping-lists, list-methods, slicing, sorted-vs-sort, list-aliasing]
stretch:
  - id: undo
    title: "Put it back"
    prompt: |
      Once a week Riya ticks off the wrong one. Add an `undo` command that puts the last task taken off back where it was, and prints `Back: ` and the task. With nothing to undo, print `Nothing to undo.`

      When `done` takes a task off, keep the task and its index. `tasks.insert(index, task)` puts it back at that index and moves the rest along.
    tests: tests/stretch-undo.py
    solution: solutions/stretch-undo.py
  - id: abc
    title: "A to Z"
    prompt: |
      Add `abc`, which prints the tasks in alphabetical order, one per line, without numbers. It must leave the real list alone: after `abc`, `done` with `1` still means the first task in Riya's order.
  - id: today
    title: "Three before class"
    prompt: |
      Riya does three jobs before the first class, while the light's good. Add `today`, which prints only the first three tasks, numbered like `list`. Use a slice, so a list of two still works.
