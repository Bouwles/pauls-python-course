id: toms-lamp-check
title: "Tom's Lamp Check"
client: tom
building: lighthouse
estimated_minutes: 35
summary: "Repeat a check message N times, then count down."
concepts_introduced: [for-loops, range, loop-variables, tracing-loops]
concepts_reviewed: [int-conversion, f-strings, input-returns-text]
ask:
  dialogue:
    - tom: "Same check every night. Has been since '62."
    - tom: "One check for every hour of dark ahead. Then I count down from the same number, and light it."
    - tom: "I write it all in the book. My hand's gone a bit wobbly."
    - moss: "The same thing, over and over. Computers don't mind that. People do."
  spec: |
    Ask how many checks there are tonight. Print one check line for each, numbered from 1.
    Then count down from the same number to 1, one number per line, and finish with `Lamp lit.`
  example: |
    Checks tonight? 3
    Check 1: all well
    Check 2: all well
    Check 3: all well
    3
    2
    1
    Lamp lit.
ship:
  dialogue:
    - tom: "Three checks. Three, two, one. Lit. That's the routine exactly."
    - tom: "In the storm of '87 I did fourteen checks in one night. Did I tell you about '87."
  shelf: { object: lamp, label: "Tom's lamp check" }
  cards: [for-loops, range, loop-variables, tracing-loops]
stretch:
  - id: odd-hours
    title: "Calm nights"
    prompt: |
      On calm nights Tom only checks on the odd hours. Ask `Hours of dark? ` and print a check for hours 1, 3, 5 and so on, up to the number typed. The third number in `range` is the step.
    tests: tests/stretch-odd-hours.py
    solution: solutions/stretch-odd-hours.py
  - id: week
    title: "A week in the book"
    prompt: |
      Print a whole week of checks: `Night 1`, then its checks, then `Night 2`, and so on to `Night 7`. That's a loop inside a loop. Use a different name for each loop variable.
