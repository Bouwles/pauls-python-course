id: shopping-list-fixer
title: "The Shopping List Fixer"
client: bea
building: bakery
estimated_minutes: 45
summary: "Bea's shopping list, cleaned and sorted for the wholesaler, with hers left alone."
concepts_introduced: [list-methods, slicing, sorted-vs-sort, list-aliasing]
concepts_reviewed: [lists, append-pop, in-operator, looping-lists, for-loops, print]
ask:
  dialogue:
    - bea: "Everyone adds to my shopping list. Nobody reads it first."
    - bea: "Flour's on it twice. Salt's on it, and we've a sack of salt."
    - bea: "The wholesaler wants it alphabetical. I want mine left in my order."
    - moss: "Two lists, then. Mind they stay two."
  spec: |
    `shopping` is Bea's list, most urgent first. `in_stock` is what the storeroom already has.

    1. Remove the repeats, keeping the first of each.
    2. Take out anything that is in stock.
    3. Print `Order form:` and the items in alphabetical order, one per line.
    4. Print `If the van is small:` and the three most urgent items, one per line.
  example: |
    Order form:
    butter
    eggs
    flour
    raisins
    yeast
    If the van is small:
    flour
    yeast
    butter
ship:
  dialogue:
    - bea: "Butter, eggs, flour, raisins, yeast. Five. I make it five."
    - bea: "And mine's still in my order. Flour first. It's always flour first."
  shelf: { object: list, label: "Bea's shopping list, tidied" }
  cards: [list-methods, slicing, sorted-vs-sort, list-aliasing]
stretch:
  - id: repeats
    title: "Who wrote it twice"
    prompt: |
      Bea wants to know what keeps getting written down twice. At the very end, print `Repeats:` and then each item that was on `shopping` more than once, with how many times, like `flour x2`. Keep them in the order they first appear.

      `shopping.count("flour")` counts how many times `"flour"` is in the list.
    tests: tests/stretch-repeats.py
    solution: solutions/stretch-repeats.py
  - id: capitals
    title: "Flour or flour"
    prompt: |
      Old Tom wrote `Flour` with a capital. `sorted()` puts capitals before every lower-case letter, and `"Flour"` is not a repeat of `"flour"`. Make the program treat them as the same item. `item.lower()` gives the lower-case version of a string; the Noticeboard job does text properly.
