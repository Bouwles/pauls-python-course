id: expense-tracker
title: "Expense Tracker"
project_name: "Expense Tracker"
portfolio_readme: |
  # Expense Tracker

  A menu-driven expense tracker for the command line. Add each expense with what it was for, a category and an amount; list them; see the total for each category; and find the biggest single expense. An amount that isn't an amount gets refused, not crashed on.

  Written by {name} for the class's end-of-term trip fund, at Paul's Python Course. Finished {date}.

  ## Run it

  ```
  python main.py
  ```

  Then choose from the menu, as often as you like:

  ```
  1 add, 2 list, 3 totals, 4 biggest, 5 quit: 3
  food: 42.90
  travel: 272.00
  Total: 314.90
  ```

  ## What it shows

  - A list of dictionaries: one dictionary per expense, each with an `item`, a `category` and an `amount`.
  - Functions that each do one job with the list they're given: `category_totals` builds a dictionary of totals, and `biggest` finds the largest expense, or `None` when there aren't any.
  - A menu loop that keeps going until it's told to stop, and has an answer for every choice, including the wrong ones.
  - `try` and `except`, so an amount typed as `twenty` gets a polite refusal.

  It keeps the expenses for as long as it runs. Saving them to a file is the next thing to add.
downloadable: true
datasets: []
client: aaesha
building: bakery
estimated_minutes: 180
summary: "The Act I capstone: a menu-driven expense tracker, built from a list of dictionaries and functions."
concepts_reviewed: [while-loops, if-elif-else, break-continue, lists, append-pop, sorted-vs-sort, list-aliasing, dictionaries, dict-get, dict-items, nested-data, string-methods, strip-replace, functions, parameters, return-values, none, scope, exceptions, try-except, float-conversion, f-strings]
ask:
  dialogue:
    - aaesha: "The end-of-term trip fund. Everyone's paid in. Now the money's going out."
    - aaesha: "The receipts are in five pockets and two group chats. I want them in one place."
    - riya: "By category, too. I want to know where it went before we book the coach."
    - caitlin: "Can it have a chart?"
    - paul: "Biggest job yet. Plan it before you build it. The chart can wait."
  spec: |
    Requirements, from Aaesha, numbered:

    1. Ask `1 add, 2 list, 3 totals, 4 biggest, 5 quit: ` over and over, until the choice is `5`.
    2. **Add** asks `What for? `, `Category? ` and `Amount? `, then prints `Added snacks.` Each expense is a dictionary with an `item`, a `category` and an `amount` (a number), kept in a list in the order they were added.
    3. Tidy what's typed: no spaces at the ends of anything, and categories in lower case, so ` Travel` and `travel` are one category.
    4. An amount that isn't a number, or isn't more than 0, gets `That's not an amount.` and nothing is added.
    5. **List** prints a line for each expense, in the order they were added: `snacks: 18.40 (food)`.
    6. **Totals** prints a line for each category, alphabetical, `food: 42.90`, and then `Total: 102.90`.
    7. **Biggest** prints `Biggest: coach hire, 212.00 (travel)`. If two tie, the one added first.
    8. With no expenses yet, list, totals and biggest each print `No expenses yet.`
    9. **Quit** prints `3 expenses, 102.90 in all.` (`1 expense` for one) and stops.
    10. Any other choice gets `Choose 1 to 5.`

    Two functions are checked on their own. `category_totals(expenses)` returns a dictionary of each category's total. `biggest(expenses)` returns the dictionary of the biggest expense, or `None` if the list is empty.
  example: |
    1 add, 2 list, 3 totals, 4 biggest, 5 quit: 1
    What for? snacks
    Category? Food
    Amount? 18.40
    Added snacks.
    1 add, 2 list, 3 totals, 4 biggest, 5 quit: 1
    What for? coach hire
    Category? travel
    Amount? 212
    Added coach hire.
    1 add, 2 list, 3 totals, 4 biggest, 5 quit: 1
    What for? sandwiches
    Category? food
    Amount? twenty
    That's not an amount.
    1 add, 2 list, 3 totals, 4 biggest, 5 quit: 2
    snacks: 18.40 (food)
    coach hire: 212.00 (travel)
    1 add, 2 list, 3 totals, 4 biggest, 5 quit: 3
    food: 18.40
    travel: 212.00
    Total: 230.40
    1 add, 2 list, 3 totals, 4 biggest, 5 quit: 4
    Biggest: coach hire, 212.00 (travel)
    1 add, 2 list, 3 totals, 4 biggest, 5 quit: 5
    2 expenses, 230.40 in all.
ship:
  dialogue:
    - aaesha: "Food, forty-two ninety. Travel, two seventy-two. I did it on paper too. Same both times."
    - riya: "So the coach is the big one. I'll ring round for a cheaper quote."
    - paul: "That's the whole Workshop floor. The clock still says 3:14, mind."
  shelf: { object: till-receipt, label: "The trip fund's expense tracker" }
  cards: []
  awards: [name-plate]
stretch:
  - id: pound-sign
    title: "The pound sign"
    prompt: |
      Riya types `£18.40` about half the time. Let an amount start with a pound sign: take it off before you try `float()`. `£twenty` is still not an amount.
    tests: tests/stretch-pound-sign.py
    solution: solutions/stretch-pound-sign.py
  - id: undo
    title: "Take it back"
    prompt: |
      Add a sixth option, undo. It takes off the last expense added and prints `Removed snacks.`, or `Nothing to remove.` if there isn't one. The menu becomes `1 add, 2 list, 3 totals, 4 biggest, 5 quit, 6 undo: ` and the wrong-choice line `Choose 1 to 6.` A list's `.pop()` hands back what it removes.
    tests: tests/stretch-undo.py
    solution: solutions/stretch-undo.py
