id: harbour-logbook
title: "The Harbour Logbook"
client: agnes
building: harbour-office
estimated_minutes: 180
summary: "A menu-driven logbook for every boat in and out of the harbour, with reports. The first big job."
concepts_reviewed: [while-loops, if-elif-else, boolean-operators, break-continue, lists, list-methods, sorted-vs-sort, list-aliasing, dictionaries, dict-get, dict-items, string-methods, strip-replace, split-join, functions, parameters, return-values, f-strings]
ask:
  dialogue:
    - agnes: "Requirements. One: it logs boats out. Two: it logs them in. Three: it does not lose any."
    - agnes: "There are eight. I have written all of them down."
    - agnes: "I'll want it by the spring tides."
    - moss: "Biggest job yet. Plan it before you build it."
  spec: |
    Requirements, from Agnes Rook, harbour master:

    1. Ask `1 out, 2 in, 3 report, 4 quit: ` over and over, until the choice is `4`.
    2. **Out** asks `Boat? `, logs the boat out and prints `Kittiwake logged out.` A boat that is already out gets `Kittiwake is already out.`
    3. **In** asks `Boat? `, logs the boat in, counts one trip and prints `Kittiwake logged in.` A boat that isn't out gets `Kittiwake isn't out.`
    4. Names are tidied: no spaces at the ends, a capital on each word. ` mary rose` is `Mary Rose`. A blank name gets `A boat needs a name.`
    5. **Report** prints `Out: ` and the boats that are out, alphabetical, with `, ` between them, or `Out: none`. Then a line per boat that has come back, alphabetical: `Kittiwake: 2 trips`, or `1 trip` for one. If none has come back yet: `No trips yet.`
    6. **Quit** prints `Still out: ` and the boats still out, alphabetical, if there are any. Then `Logbook closed.`
    7. Any other choice gets `Not an option. Choose 1 to 4.`
    8. It does not lose any boats.
  example: |
    1 out, 2 in, 3 report, 4 quit: 1
    Boat? kittiwake
    Kittiwake logged out.
    1 out, 2 in, 3 report, 4 quit: 1
    Boat?  mary rose
    Mary Rose logged out.
    1 out, 2 in, 3 report, 4 quit: 2
    Boat? Kittiwake
    Kittiwake logged in.
    1 out, 2 in, 3 report, 4 quit: 3
    Out: Mary Rose
    Kittiwake: 1 trip
    1 out, 2 in, 3 report, 4 quit: 7
    Not an option. Choose 1 to 4.
    1 out, 2 in, 3 report, 4 quit: 4
    Still out: Mary Rose
    Logbook closed.
ship:
  dialogue:
    - agnes: "Out at six, in by ten, reported at noon. Every boat accounted for."
    - agnes: "It goes on my desk for the spring tides. Next to the whistle."
    - moss: "That's the whole quay. The radio still doesn't work, mind."
  shelf: { object: logbook, label: "The harbour logbook" }
  cards: []
  awards: [name-plate]
story_note: nobody-asks
stretch:
  - id: find
    title: "Where is she?"
    prompt: |
      Add option `5`, find. It asks `Boat? ` and prints one of:

      - `Kittiwake is out. 2 trips today.` for a boat that is out
      - `Kittiwake is in. 1 trip today.` for a boat that has come back
      - `No record of Kittiwake.` for a boat the logbook has never seen

      `1 trip`, `2 trips` and `0 trips` follow the same rule as the report. Change the other-choice line to `Not an option. Choose 1 to 5.`
    tests: tests/stretch-find.py
    solution: solutions/stretch-find.py
  - id: busiest
    title: "The busiest boat"
    prompt: |
      Agnes wants to know who works hardest. After the trip lines, the report prints `Busiest: Kittiwake (3 trips)`. If boats tie, the one first in the alphabet wins. If no boat has come back, leave the line out.
    tests: tests/stretch-busiest.py
    solution: solutions/stretch-busiest.py
