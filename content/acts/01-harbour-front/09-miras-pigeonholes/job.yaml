id: miras-pigeonholes
title: "Mira's Pigeonholes"
client: mira
building: post-office
estimated_minutes: 45
summary: "Manage a row of parcels."
concepts_introduced: [lists, indexing, negative-indices, append-pop, in-operator, looping-lists]
concepts_reviewed: [for-loops, range, while-loops, sentinels, if-elif-else, f-strings]
ask:
  dialogue:
    - mira: "The pigeonholes are numbered from nought. Penhallow numbered them. I have never quite forgiven her."
    - mira: "Parcels come in and go in the next hole along. People come in and ask."
    - mira: "I look, I find it, I hand it over. I would like the looking done for me."
  spec: |
    Ask for parcels, one name at a time, until Mira types `done`. Each goes in the next hole along.
    Print every hole with its number, starting from 0.
    Then ask who is at the counter. If there's a parcel for them, print its hole number and take it out of the row. If not, say so.
    Last, print how many parcels are left.
  example: |
    Parcel for? Bea Hollis
    Parcel for? Old Tom
    Parcel for? Agnes Rook
    Parcel for? done
    Hole 0: Bea Hollis
    Hole 1: Old Tom
    Hole 2: Agnes Rook
    At the counter? Old Tom
    Hole 1.
    Parcels left: 2
ship:
  dialogue:
    - mira: "Old Tom, hole one. Not two. One. Correct."
    - mira: "I shall still check by hand. But I shall check afterwards, not first."
  shelf: { object: parcel, label: "Mira's pigeonhole finder" }
  cards: [lists, indexing, negative-indices, append-pop, in-operator, looping-lists]
stretch:
  - id: two-parcels
    title: "Two for Tom"
    prompt: |
      Old Tom sometimes has two parcels. Hand over the one in the lower hole first, and leave the other where it is. `break` will help.
    tests: tests/stretch-two-parcels.py
    solution: solutions/stretch-two-parcels.py
  - id: newest
    title: "Newest in"
    prompt: |
      After listing the holes, print `Newest: Agnes Rook`, the last parcel in the row, found with a negative index. With no parcels, print `Newest: none`.
