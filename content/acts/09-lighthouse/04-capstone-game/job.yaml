id: capstone-game
title: "Arcade Catch Game"
project_name: "Arcade Catch Game"
portfolio_readme: |
  # Arcade Catch Game

  Mackerel Night, a Pygame arcade game for a cabinet in the Arcade. Mackerel and old boots fall off a pier; the player slides a bucket along it to catch the fish and dodge the boots. Three lives, nine levels that fall faster, and the best five scores kept on the cabinet overnight. The rules live in their own module with no Pygame in it, so every rule is tested without opening a window.

  Written by {name} for Caitlin, at Paul's Python Course. Finished {date}.

  ## Run it

  ```
  python -m venv .venv
  source .venv/bin/activate        # on Windows: .venv\Scripts\activate
  pip install -r requirements.txt
  python main.py
  pytest
  ```

  The left and right arrow keys move the bucket. `python main.py --frames 30` plays thirty frames and stops.

  The Pygame project lives in the Take It Home folder. `catch.py`, here, is the text version it grew from: `python catch.py`, then `a`, `d` and Enter.

  ## What it shows

  - A game loop: read the keys, update the rules once a frame, draw from the state and nothing else
  - Game rules as a class that can be tested frame by frame, with the randomness kept to one seeded place
  - High scores saved as JSON, and a command-line option with argparse
  - A game handed to real players, with what they found written down and fixed
downloadable: true
datasets: []
client: caitlin
building: lighthouse
estimated_minutes: 1200
summary: "Mackerel Night, a Pygame game for a new cabinet in the Arcade: rules you can test without a window, drawing kept apart, played by real people and handed to Caitlin."
concepts_introduced: [game-loop]
concepts_reviewed: [classes, init, attributes, methods, self, dataclasses, random-module, while-loops, if-elif-else, modules, main-guard, argparse, files, json-module, pytest, assert, edge-cases, test-first, virtual-environments, git-basics]
ask:
  dialogue:
    - caitlin.pleased.wave: "A new cabinet for the Arcade. Proper joystick, and a coin slot I've taped over."
    - caitlin.laughing.point: "Mackerel fall off a pier, you catch them in a bucket, and boots cost you a life."
    - yahya.proud: "Make the mackerel faster every level. Twice as fast."
    - caitlin.unimpressed: "Make them land first. Then we'll talk about twice as fast."
    - paul.neutral: "The rules in one file, the drawing in another. Then the rules can be tested."
  spec: |
    Caitlin's rules, written down at last:

    1. Mackerel and old boots fall from the top of the screen. The player slides a bucket along the pier at the bottom.
    2. A mackerel in the bucket scores 1. A boot in the bucket costs a life. Anything missed falls in the sea and costs nothing.
    3. Three lives. When they're gone, the game is over.
    4. Every ten mackerel is a level, up to level 9; each level, things fall faster and more often.
    5. The best five scores, three initials each, stay on the cabinet overnight.

    The project, on your own computer, has three parts:

    - `pier.py`: the rules, with no pygame anywhere in it. `Game(seed=None, spawn=True)`, with `move(direction)`, `drop(kind, x)`, `update()` for one frame, `fall_speed()`, and `state()`, a dictionary of everything there is to draw: `bucket_x`, `items` (each `{"kind", "x", "y"}`), `score`, `lives`, `level` and `over`. The sizes and speeds are constants at the top of the file, and the details are in its docstring.
    - `scores.py`: `add_score(path, initials, score)` and `top_scores(path, count=5)`, kept in a JSON file.
    - `main.py`: the pygame loop. It reads the keys, calls `update()` once a frame, and draws from `state()` and nothing else. `python main.py --frames 30` plays thirty frames and stops.

    The tests in `tests/` check the rules and the high scores without opening a window.
  example: |
    >>> game = Game(spawn=False)
    >>> game.drop("mackerel", game.state()["bucket_x"])
    >>> for frame in range(150):
    ...     game.update()
    ...
    >>> game.state()
    {'bucket_x': 208, 'items': [], 'score': 1, 'lives': 3, 'level': 1, 'over': False}
ship:
  dialogue:
    - caitlin.laughing: "Yahya got forty-two on the first night. He says he's had practice."
    - yahya.proud: "I've had practice."
    - caitlin.pleased.cheer: "Nobody's said it's fiddled. They've said it's unfair, which is different, and good for the leaderboard."
    - paul.proud.thumbs: "Rules tested, drawing kept apart, strangers playing it. That's a game, not a demo."
  shelf: { object: pier-cabinet, label: "Mackerel Night, on a new cabinet in the Arcade" }
  cards: [game-loop]
stretch:
  - id: splash
    title: "A splash and a clunk"
    prompt: |
      Add sounds with `pygame.mixer`: a splash for a mackerel, a clunk for a boot. Use sounds whose licence lets you, and credit them in the README. The rules in `pier.py` don't change at all; `main.py` can tell what happened by comparing one frame's `state()` with the last.
  - id: gulls
    title: "Gulls"
    prompt: |
      A third thing falls: a gull, which takes three mackerel back out of the bucket if it lands in it, though never below a score of zero. Add it to `pier.py` with tests first, then draw it.
