id: the-lamp-room
title: "Acceptance Test Suite"
project_name: "Acceptance Test Suite"
portfolio_readme: |
  # Acceptance Test Suite

  Tests for a controller that was never tested. The controller decides through every winter night whether to light a clock face, switch on its fog lamp and heat its hands against ice. Its rules were written down for the first time, and these pytest tests check `decide` against every one of them, edges included, so they pass on a controller that follows the rules and fail on one that only learned what usually happens.

  Written by {name} for Paul, on the roof of the Clocktower, the night the clock started again. Finished {date}.

  ## Run it

  ```
  pip install pytest
  pytest test_clock.py
  ```

  Run against `clock.py`, the controller as it learned, the tests fail, and the failures show which of the rules it breaks. That is what they're for.

  ## What it shows

  - Acceptance tests: requirements turned into checks, one rule at a time
  - Testing at the edges: the visibility just under 2000 m and just over, the ice at exactly 4.4 mm
  - Tests that tell a correct implementation from a learned one that only matches the usual nights
