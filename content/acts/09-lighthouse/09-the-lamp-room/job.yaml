  dialogue:
    - paul.pleased.wave: "Everyone's here. Good. The clock."
    - paul.proud: "It's said 3:14 since before I had the keys. Tonight it runs."
    - neil.pleased.thumbs: "The gears are fine. Aaesha and I checked every one in the Engine Room."
    - aaesha.thinking: "It's the controller. It learned the clock from old logs, and nobody ever tested it."
    - paul.neutral.point: "So we test it. Then we start it."
  spec: |
    The clock's controller decides, from the readings outside, whether to light the clock face, switch on the fog lamp and heat the hands so ice can't stop them. It learned this from three winters of logs and has never had a single test.

    Write the tests, in `test_clock.py`: test functions that check `decide` against the clockmaker's rules, written down here for the first time, and that catch what the controller never learned. Your tests should pass on a controller that follows the rules, and fail on this one.
  example: |
    lamp: lit when it's dark, or when visibility is under 2000 m
    fog lamp: on when visibility is under 500 m, whatever the ice
    heater: on with 4.4 mm of ice on the hands or more, or 4.0 mm or more in wind force 8 or above
