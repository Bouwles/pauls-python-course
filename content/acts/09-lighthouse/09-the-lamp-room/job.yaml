id: the-lamp-room
title: "Acceptance Test Suite"
project_name: "Acceptance Test Suite"
portfolio_readme: |
  # Acceptance Test Suite

  Tests for a machine that was never tested. The machine decides each night whether to light the lighthouse lamp, sound the fog horn and shut the sea wall gate. Its rules were written down for the first time, and these pytest tests check `decide` against every one of them, edges included, so they pass on a machine that follows the rules and fail on one that only learned what usually happens.

  Written by {name} for Ada Penhallow, in the lamp room at {{town}}. Finished {date}.

  ## Run it

  ```
  pip install pytest
  pytest test_hill.py
  ```

  Run against `hill.py`, the machine as it learned, the tests fail, and the failures show which of the rules it breaks. That is what they're for.

  ## What it shows

  - Acceptance tests: requirements turned into checks, one rule at a time
  - Testing at the edges: the visibility just under 2000 m and just over, the tide at exactly 4.4 m
  - Tests that tell a correct implementation from a learned one that only matches the usual nights
