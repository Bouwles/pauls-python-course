id: capstone-own
title: "Your Own Project"
project_name: "Your Own Project"
portfolio_readme: |
  # Your Own Project

  A project of my own choosing, built for someone real: proposed with its risks and a test plan, built one working slice at a time with tests, and handed over to the person it was for.

  Written by {name} at Paul's Python Course. Finished {date}.

  ## What's in this folder

  This folder holds the practice from the course: tests for the postage on Riya's prints, written from its docstring alone, which caught every one of eight deliberately broken versions.

  ```
  pip install pytest
  pytest
  ```

  The project itself lives in its own repository, with its own README, linked from my portfolio.

  ## What it shows

  - Choosing a project someone will use, small enough to finish and built to be tested
  - A test plan written as sentences first, then as pytest tests
  - Tests strong enough to catch mutants: small, realistic mistakes made on purpose
  - A handover: a README the user can follow, and a second person's review
downloadable: true
datasets: []
client: paul
building: lighthouse
estimated_minutes: 1500
summary: "A project of your own choosing, in your own interest, for someone real: proposed, built a slice at a time with tests, and handed over with Paul's review."
concepts_introduced: [mutation-testing]
concepts_reviewed: [pytest, assert, edge-cases, test-first, raising-errors, exceptions, functions, docstrings, modules, main-guard, naming, git-basics, virtual-environments]
ask:
  dialogue:
    - paul.pleased.wave: "The rest of the list was for other people. This one's yours. Choose it well."
    - paul.neutral.point: "Someone who'll use it, small enough to finish, and testable. Drop any one of the three and it goes wrong."
    - caitlin.pleased: "I'm doing a game engine. A small one. With physics."
    - paul.unimpressed: "Then read the next page twice."
  spec: |
    A project of your own choosing, built the way the other capstones are.

    Choose something that:

    1. **someone real will use**: a person you can name, even if it's you;
    2. **can be finished**: a first useful version in a few weeks of evenings;
    3. **can be tested**: most of it is logic you can check without a screen, a network or a person.

    Then, with Paul reviewing each milestone:

    1. **The proposal:** who it's for, what done looks like, three risks, and a test plan.
    2. **The first working slice:** the smallest version that does one useful thing from end to end, with tests.
    3. **The whole project:** everything the proposal promised, with a README.
    4. **The handover:** to the person it's for, with Paul's review of what a good project shows.

    Any part of Python, any libraries, at home or here in the browser. Each milestone's evidence is a link: a repository, or a gist for the proposal.
  example: |
    For:     Riya, posting her prints on Saturday mornings
    Done:    she types a parcel's weight and where it's going, and gets the price
             and a label to print
    Risks:   the label printer; big prints sent in tubes; Saturday queues
    Slice 1: weight and destination in, price out, with tests
ship:
  dialogue:
    - paul.proud: "Your own idea, finished, tested, and in somebody else's hands. That's the trade."
    - paul.pleased: "Most projects never get a second user. Yours has one."
    - caitlin.laughing.cheer: "My game engine has a README now. And a first slice: a square that falls."
    - paul.laughing: "A square that falls, with tests. I've seen worse starts. I've made worse starts."
  shelf: { object: makers-mark, label: "Your own project, with your name on it" }
  cards: [mutation-testing]
stretch:
  - id: mutants-of-your-own
    title: "Break it on purpose"
    prompt: |
      Make five small mutants of your own project's most important function: a `<` for a `<=`, a missing check, a wrong constant. Run your tests against each. Every mutant that survives is a test you haven't written yet; write it.
  - id: second-user
    title: "A second user"
    prompt: |
      Find a second person your project could help, different from the first. What would they need changed? Write it up as the proposal for version two, with its own three risks.
