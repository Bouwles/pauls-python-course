id: capstone-web-app
title: "Berth Booking Web App"
project_name: "Berth Booking Web App"
portfolio_readme: |
  # Berth Booking Web App

  A Flask web app for booking the five visitor berths in {{town}} harbour. Skippers book a berth for a number of nights from a web page or through a JSON API; the harbour master sees who is in every berth on any night. It refuses double bookings, boats too long for their berth and nonsense dates, with a reason in words, and it keeps every booking in a file that survives a restart.

  Written by {name} for Agnes Rook, the harbour master. Finished {date}.

  ## Run it

  ```
  python -m venv .venv
  source .venv/bin/activate        # on Windows: .venv\Scripts\activate
  pip install -r requirements.txt
  flask --app app run
  ```

  Then open http://127.0.0.1:5000. To book through the API:

  ```
  curl -X POST http://127.0.0.1:5000/api/bookings -H "Content-Type: application/json" -d '{"boat": "kittiwake", "length": 9.5, "berth": 2, "date": "2027-04-10", "nights": 2}'
  ```

  The tests need no server: `pytest`.

  The Flask app lives in the Take It Home project folder. `rules.py` and `berths.py`, here, are where it started: Agnes's rules on their own, written and checked before any web page existed.

  ## What it shows

  - A small web app in Flask: routes for `GET`, `POST` and `DELETE`, JSON in and out, a page rendered from a template, and a form that redirects after it books
  - The rules kept apart from the web: `rules.py` has no Flask in it, so the API and the form go through one set of checks, and each refusal is an exception carrying a message and the HTTP status it deserves (400, 404 or 409)
  - Bookings kept between runs by one storage module, and booking numbers that are never given out twice, even after a cancellation and a restart
  - An agreed test suite for every route, and tests of my own for what it leaves out
