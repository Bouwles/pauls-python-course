  - id: tomorrows-weather
    title: "Tomorrow's weather on the page"
    prompt: |
      Bring the forecast functions from your Weather App (Act III) into the project, and add `GET /api/forecast`, which gives the next three days for the harbour as JSON. Show them on the front page beside the berths, tests first, with a saved reply standing in for the network in the tests, the way the Weather App's checks did.
  - id: notice-board
    title: "The notice board"
    prompt: |
      Agnes still pins notices to a board by the harbour office. Add notices to the app: `POST /api/notices` to add one, `GET /api/notices` for those not yet expired, and a box on the front page. Decide the JSON shape yourself, write it down in the README, and test it.
