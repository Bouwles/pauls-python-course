ask:
  dialogue:
    - agnes: "Visiting boats ring ahead, and I write them in pencil. Pencil runs in the rain."
    - agnes: "Requirements. Five of them. The fifth is that it survives me switching it off."
    - tom: "She's borrowed the bottom room. Penhallow's old server is under the stairs."
    - moss: "This one's yours from the first line. Plan it, test it, and hand it over properly."
  spec: |
    Requirements, from Agnes Rook, harbour master. Visiting boats book one of the five visitor berths in `berths.py`, for a number of nights.

    1. A skipper can book a berth before arriving, from a web page or through the API.
    2. Agnes can see who is in every berth on any night.
    3. Two boats are never booked into one berth on the same night.
    4. Nothing is lost when the server is switched off.
    5. A booking number, once given, is never given to another boat.

    The agreed routes. The tests in `tests/` check every one:

    - `GET /api/berths`: 200 and a list of the berths, each like `{"id": 1, "name": "Pontoon A", "max_length": 8.0}`
    - `GET /api/bookings`: 200 and every booking, oldest first. With `?date=2027-04-11`, only the boats staying that night.
    - `POST /api/bookings`, sent as JSON with `boat`, `length` (metres), `berth` (its id), `date` (the night of arrival, `YYYY-MM-DD`) and `nights` (1 if left out): 201 and the booking, with its `id`
    - `GET /api/bookings/<id>`: 200 and that booking
    - `DELETE /api/bookings/<id>`: 204, with nothing else
    - `GET /`: a web page listing every berth, and who is in each on the night given by `?date=`

    When something is wrong, the answer is JSON, `{"error": "what went wrong, in words"}`, with this status:

    - 400 for anything wrong with what was sent: not JSON, no boat name, a length that isn't a number above 0, a berth that doesn't exist or is too short for the boat, a date that isn't a real `YYYY-MM-DD`, or nights that aren't a whole number from 1 to 14
    - 404 for a booking that doesn't exist
    - 409 for a berth already taken on any of those nights

    Boat names are tidied as in the logbook: ` mary rose` is `Mary Rose`. A boat staying two nights from the 10th leaves on the morning of the 12th, so another can arrive that day.

    Two parts. Here in the workshop, Agnes's rules go in `rules.py`, with no Flask in it, and are checked. Then on your own computer, the Flask app around them: the routes, the bookings kept in a file, the pages and your own tests, over four milestones.
  example: |
    $ flask --app app run
     * Running on http://127.0.0.1:5000

    $ curl -X POST http://127.0.0.1:5000/api/bookings -H "Content-Type: application/json" -d '{"boat": "kittiwake", "length": 9.5, "berth": 2, "date": "2027-04-10", "nights": 2}'
    {"berth":2,"boat":"Kittiwake","date":"2027-04-10","id":1,"length":9.5,"nights":2}
