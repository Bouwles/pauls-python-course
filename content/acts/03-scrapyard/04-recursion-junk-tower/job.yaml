id: recursion-junk-tower
title: "Recursion in the Junk Tower"
client: nell
building: scrapyard
estimated_minutes: 90
summary: "Weigh a tower of crates inside crates by weighing each crate the same way, then make Penhallow's lorry packer stop working things out twice."
concepts_introduced: [recursion, base-cases, call-stack, memoisation]
concepts_reviewed: [functions, return-values, scope, nested-data, dictionaries, tuples, decorators, big-o, quicksort]
ask:
  dialogue:
    - nell: "The pier lot came packed Penhallow's way. Crates inside crates inside crates."
    - nell: "Her stock list writes a crate as a list. Numbers are parts, in kilos. Lists are crates."
    - nell: "The merchant wants weights. And her lorry packer takes all night for the ferry deck."
    - moss: "A crate is parts and smaller crates. Weigh it the way it was packed."
  spec: |
    In `tower.py`, a crate is a list. A number in it is a part, weighing that many kilos; a list in it is a crate inside.

    1. `weigh(crate)` returns the total kilos of every part in the crate, however deep.
    2. `count_parts(crate)` returns how many parts are in it, however deep.
    3. `depth(crate)` returns how many crates deep it goes. A crate with no crates inside is 1 deep; otherwise it's one more than the deepest crate inside it.
    4. `packings(length)` is Penhallow's lorry packer: how many ways a bed `length` metres long can be filled, end to end, with crates 1 m and 2 m long. It's right, and very slow. Make it quick, with the same answers: a 40 m ferry deck in a blink.
  example: |
    Tower: 21 kg in 6 parts, 4 crates deep
    12 m lorry: 233 packings
    40 m ferry deck: 165580141 packings
ship:
  dialogue:
    - nell: "Twenty-one kilos, six parts. The merchant put it on his scales. Twenty-one."
    - nell: "And the ferry deck before I'd got my gloves off. Hers ran all night and never finished."
    - moss: "Same sums. It just stopped doing any of them twice."
  shelf: { object: crate-tower, label: "Nell's junk tower, weighed" }
  cards: [recursion, base-cases, call-stack, memoisation]
story_note: writes-nothing-down
stretch:
  - id: unpack
    title: "Unpack the tower"
    prompt: |
      The merchant wants a flat list. Write `unpack(crate)`, which returns every part in the tower in the order you'd meet them opening it: `unpack([4, [2, 3], [1, [5]]])` is `[4, 2, 3, 1, 5]`.
  - id: no-recursion
    title: "Two thousand crates deep"
    prompt: |
      Build a tower two thousand crates deep with a loop and weigh it: Python stops with a `RecursionError`, because it only lets the call stack grow about a thousand calls high. Write `weigh_by_hand(crate)` with no recursion at all: keep your own list of crates still to open, take one off the end, add its parts, and put its crates on the end. That list is a stack, which is the next job.
  - id: every-packing
    title: "Every packing"
    prompt: |
      Write `every_packing(length)`, which returns every way to fill the bed as a list of crate lengths: `every_packing(3)` is `[[1, 1, 1], [1, 2], [2, 1]]`. Put a 1 m crate first and pack what's left, then a 2 m crate first and pack what's left. Check its length against `packings`.
