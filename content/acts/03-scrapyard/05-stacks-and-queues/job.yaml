id: stacks-and-queues
title: "Stacks and Queues of Scrap"
client: nell
building: scrapyard
estimated_minutes: 70
summary: "A queue for the lorries at Nell's gate, a stack for the mistakes at the weighbridge, and Penhallow's crane brackets checked on the way."
concepts_introduced: [stacks, queues, deque]
concepts_reviewed: [classes, init, methods, self, append-pop, none, tuples, dictionaries, imports, big-o, call-stack]
ask:
  dialogue:
    - nell: "Saturday mornings the lorries queue back past the chip shop. First come, first weighed."
    - nell: "Penhallow's weighbridge desk kept the queue. Lost a tipper once. It turned up in Thursday's."
    - nell: "And when I weigh one wrong, I want a button that takes it back."
    - moss: "A queue for the lorries, a stack for the mistakes. Two piles, used from different ends."
  spec: |
    In `weighbridge.py`, write a class `Weighbridge` for the desk at Nell's gate.

    1. `arrive(lorry)`: the lorry joins the back of the queue.
    2. `waiting()` returns a new list of the lorries waiting, front first.
    3. `weigh(kilos)`: the lorry at the front leaves the queue and `kilos` is added to the day's total. Returns the lorry's name, or `None`, changing nothing, if nobody is waiting.
    4. `undo()` takes back the latest weighing still standing: its kilos come off the total and the lorry goes back to the front of the queue. Returns that lorry's name, or `None` if there's nothing to take back. Undo twice and it takes back the last two.
    5. `total`, an attribute, is the kilos weighed so far, starting at 0.

    The queue is a `collections.deque`, so taking from the front is quick however long it gets.
  example: |
    Waiting: ['flatbed', 'tipper', 'council van']
    Weighed flatbed: 1200 kg
    Weighed tipper: 3400 kg
    Undo: tipper goes back to the front
    Waiting: ['tipper', 'council van']
    Total: 1200 kg
ship:
  dialogue:
    - nell: "Forty lorries by ten o'clock. Every one weighed in the order it came."
    - nell: "I weighed the council van twice. One press, and it was back at the front as if it never happened."
    - moss: "The queue forgets from the front. The stack remembers from the top. Each does one job."
  shelf: { object: weighbridge-ticket, label: "Nell's weighbridge desk, with an undo button" }
  cards: [stacks, queues, deque]
stretch:
  - id: redo
    title: "Redo"
    prompt: |
      Nell pressed undo once too often. Add `redo()`, which weighs again whatever the latest undo took back, with the same kilos, and returns the lorry's name, or `None`. Keep a second stack for it. Think about what should happen to that stack when a new weighing is made.
  - id: short-memory
    title: "Fifty mistakes is plenty"
    prompt: |
      A whole Saturday of weighings is a long undo stack. Make it keep only the latest fifty with `deque(maxlen=50)`, which drops from the far end when it's full, and check that the fifty-first undo returns `None`.
  - id: crane-check
    title: "Check the crane script"
    prompt: |
      Moss's bracket checker says yes or no. Penhallow's crane script is three hundred lines long. Write `unclosed(text)`, which returns a list of the brackets still open at the end, in the order they were opened, and use it on a few broken lines to see whether it points somewhere useful.
