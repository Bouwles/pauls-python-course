id: scrapyard-route-planner
title: "The Scrapyard Route Planner"
client: nell
building: scrapyard
estimated_minutes: 600
summary: "A route planner for Nell's yard: read Penhallow's map, find the quickest way from the gate to the crane with A*, and draw it. Three whiteboard questions from Moss first."
concepts_introduced: [a-star]
concepts_reviewed: [dijkstra, bfs, dfs, graphs, weighted-graphs, heaps, priority-queues, hash-maps, sets, tuples, files, raising-errors, string-methods, big-o, edge-cases]
ask:
  dialogue:
    - nell: "The crane's at the back of the yard and the gate's at the front. Lorries get lost in between."
    - nell: "Oil and mud cost three times what clear ground does. Scrap costs a new lorry."
    - nell: "Penhallow drew the yard for me in '96. I want something that reads her map and draws the way."
    - moss: "Dijkstra, with a sense of direction. But three questions from me first, the sort they ask at a whiteboard."
  spec: |
    First, Moss's whiteboard, in `whiteboard.py`:

    1. `pair_for(weights, target)` gives back the positions `(i, j)`, with `i < j`, of two parts that weigh `target` together, or `None`. Any pair will do. Look at each weight once.
    2. `islands(yard)` counts the separate heaps of scrap in a yard drawing, a list of strings: `#` tiles joined up, down, left or right are one heap.
    3. `merge_piles(piles)` takes lists of weights, each lightest first, and gives back one list of all of them, lightest first.

    Then the planner, in `planner.py`, from a nearly empty file:

    4. `read_yard(text)` gives back `(tiles, start, goal)`. `tiles` has a row for each line of the map, each a list of what it costs to step onto that tile: `None` for scrap (`#`), 1 for clear ground (`.`, and the `S` and `G` tiles), 3 for oil and mud (`~`). `start` and `goal` are the `(row, col)` of `S` and `G`. Blank lines are ignored. Raise `ValueError` if there isn't exactly one `S` and one `G`, if the rows aren't all the same length, or for any other character.
    5. `neighbours(tiles, tile)` gives back the tiles up, down, left and right of `tile` that are inside the yard and not scrap, in that order.
    6. `manhattan(tile, goal)` is the rows apart plus the columns apart.
    7. `a_star(tiles, start, goal)` gives back `(minutes, route)` for the quickest route, where `route` lists the tiles from `start` to `goal` and `minutes` adds up the cost of every tile stepped onto after the start. `(0, [start])` if they're the same tile, `None` if there's no way there. Use A* with `manhattan` as the estimate, and your `neighbours` to find the way on. If routes tie, any will do.
    8. `draw_route(tiles, route)` gives back the yard as a list of strings, `#`, `.` and `~`, with each tile of the route but the last showing which way to step out of it (`^`, `v`, `<` or `>`), and `G` on the last.
  example: |
    Gate to crane: 23 minutes, 19 steps
    v.....#.......#.....
    v####.#.~~~~~.#.###.
    v#....#.~###~...#...
    v#.####.~#G.~####.#.
    v#......~#^#~.....#.
    v######.~#^#~####.#.
    >>>>>>>>>>^~~...#.#.
    .####.#######.#.#...
    ......#.......#...#.
ship:
  dialogue:
    - nell: "Twenty-three minutes, gate to crane. The lorry followed the arrows and never touched a heap."
    - nell: "Forty years I've known this yard. Now I can say how I know it."
    - moss: "Thirteen jobs, and every pile in the yard explained. That's the Scrapyard done."
  shelf: { object: compass, label: "Nell's yard route planner" }
  cards: [a-star]
story_note: the-other-end
stretch:
  - id: several-stops
    title: "The long way round the yard"
    prompt: |
      The lorry picks up at three heaps before the crane. Write `best_round(tiles, start, stops, goal)`, which tries every order of the stops, joins the legs with `a_star`, and gives back the quickest total and its route. How many orders are there for six stops, and how many A* searches does that take? Store each leg's answer so no leg is searched twice.
  - id: count-the-work
    title: "How much it saved"
    prompt: |
      Give `a_star` an `estimate` argument, defaulting to `manhattan`, and count the tiles it settles. Run it on Nell's yard with the estimate, and with `lambda tile, goal: 0`, which turns it back into Dijkstra. Then try an estimate of `3 * manhattan(tile, goal)`: it settles even fewer tiles. Is its route still the quickest? Why not?
  - id: diagonals
    title: "Corners"
    prompt: |
      Nell's new lorry can cut corners. Let `neighbours` include the four diagonal tiles, costing the same as straight steps, and change the estimate to the bigger of the rows apart and the columns apart. Why would `manhattan` now be the wrong estimate?
