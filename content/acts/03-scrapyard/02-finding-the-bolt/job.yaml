id: finding-the-bolt
title: "Finding the Bolt"
client: nell
building: scrapyard
estimated_minutes: 60
summary: "Search a pile one part at a time, then find a bolt in Penhallow's sorted rack in a handful of looks."
concepts_introduced: [linear-search, binary-search, bisect]
concepts_reviewed: [big-o, while-loops, indexing, return-values, imports, list-methods, edge-cases]
ask:
  dialogue:
    - nell: "Penhallow built me a bolt rack. One bolt to a drawer, smallest at the gate end."
    - nell: "Eight hundred drawers. I open them one at a time till I find the right one."
    - nell: "She said it should take ten looks, not eight hundred. I never asked her how."
    - moss: "Because they're in order. Order is worth a great deal, if you use it."
  spec: |
    Three functions in `bolts.py` for Penhallow's bolt rack. `sizes` is a list of bolt sizes in millimetres, smallest first; a drawer is a position in it.

    1. `find_bolt(sizes, size)` returns a drawer holding a bolt of that size, or `-1` if there isn't one. Write the binary search yourself, with a `while` loop. On a rack of a million drawers it should open about twenty.
    2. `count_between(sizes, low, high)` returns how many bolts are from `low` to `high` mm, both included. Use `bisect`, so it's quick on a big rack too.
    3. `add_bolt(sizes, size)` puts a new bolt into the rack in order, after any bolts of the same size, and returns the drawer it went in.
  example: |
    Rack: 24 drawers, 3 mm to 30 mm
    16 mm: drawer 17
    7 mm: none in the rack
    6 mm to 10 mm: 10 bolts
    New 11 mm bolt: drawer 15
ship:
  dialogue:
    - nell: "Twelve mil. Drawer three hundred and six. I counted my looks: nine."
    - nell: "Penhallow said ten. I thought she was showing off."
    - moss: "Ten at most, for eight hundred. She wasn't showing off. She was rounding up."
  shelf: { object: bolt-rack, label: "Nell's bolt finder" }
  cards: [linear-search, binary-search, bisect]
stretch:
  - id: nearest
    title: "Near enough"
    prompt: |
      Customers ask for a 7 mm bolt when there's no such thing. Write `nearest_bolt(sizes, size)`, which returns the size in the rack closest to `size`, choosing the smaller on a tie. `bisect_left` tells you where it would go; the answer is one of the two bolts either side of that drawer. Watch the ends of the rack.
  - id: by-name
    title: "The parts book"
    prompt: |
      Penhallow also kept the parts book in alphabetical order. Binary search works on any sorted list, because strings compare too. Write `find_part(names, name)` for it, and count the looks for a book of 5,000 names.
