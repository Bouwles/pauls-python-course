id: the-road-map
title: "The Road Map"
client: nell
building: scrapyard
estimated_minutes: 90
summary: "Saltmarsh's roads as a graph: the fewest roads to anywhere, Penhallow's old delivery round, and who's cut off when the council digs."
concepts_introduced: [graphs, bfs, dfs]
concepts_reviewed: [dictionaries, dict-get, sets, lists, while-loops, queues, deque, stacks, recursion, big-o, copying, list-comprehensions, edge-cases]
ask:
  dialogue:
    - nell: "The lorry's out every day with parts. Fewest roads, always. Every corner's a three-point turn."
    - nell: "Penhallow's delivery round went down every road to the end before it turned back. Nobody wrote it down."
    - nell: "And the council's digging up roads for the pier lorries. I need to know who I can't reach."
    - moss: "Places, and the roads between them. Write it down like that and it's a graph."
  spec: |
    `ROADS` in `roads.py` is the town: each place, and the places one road away. A road can be one way, so follow the lists exactly, and a place with no list of its own has no roads out.

    1. `close_road(roads, a, b)` gives back a new map with the road between `a` and `b` gone, both ways. `roads` itself isn't changed.
    2. `fewest_roads(roads, start, goal)` gives back the list of places along the fewest roads from `start` to `goal`, `[start]` if they're the same place, or `None` if there's no way there. If two routes tie, either will do.
    3. `the_round(roads, start)` gives back the places in the order Penhallow's round first reached them. From each place, try its roads in the order they're listed. Go down the first one that leads somewhere new, and carry on from there. When a place has no roads to anywhere new, go back the way you came and try the next road there.
    4. `cut_off(roads, start)` gives back, in alphabetical order, every place on the map that can't be reached from `start`.
  example: |
    Fewest roads to the ferry: scrapyard, workshop, bakery, post-office, ferry
    The round: scrapyard, workshop, bakery, post-office, pub, harbour-office, ferry, crab-club, bike-shed, greengrocer, town-hall, library, tailor, weather-station, records-office, observatory, lighthouse
    With the harbour road dug up, cut off: lighthouse
ship:
  dialogue:
    - nell: "Four roads to the ferry. Pip's way was seven, round by the observatory."
    - nell: "The round's exactly as I remember it. The lighthouse last, always. Tom liked his parts late."
    - moss: "One map, three questions. Breadth first for the nearest, depth first for the round."
  shelf: { object: road-map, label: "Nell's road map of Saltmarsh" }
  cards: [graphs, bfs, dfs]
story_note: one-road-in
stretch:
  - id: distances
    title: "How far is everywhere"
    prompt: |
      Write `roads_away(roads, start)`, a dictionary of every place you can reach and how many roads away it is. It's Moss's worked example, tidied into a function. Then find the place in Saltmarsh that's furthest from the scrapyard, and the place from which everywhere else is closest.
  - id: every-route
    title: "Every way round"
    prompt: |
      Nell's lorry is bored of the same route. Write `all_routes(roads, start, goal)`, which gives back every route from `start` to `goal` that never visits a place twice. Depth first works: go down a road, carry on from there, and when you come back, take that place off the route so another route can use it. How many ways are there from the scrapyard to the lighthouse?
