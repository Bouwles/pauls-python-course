id: how-long-will-it-take
title: "How Long Will It Take?"
client: nell
building: scrapyard
estimated_minutes: 60
summary: "Count the steps a program takes, and work out what happens to Nell's spares check when the pier arrives."
concepts_introduced: [big-o, timing-code]
concepts_reviewed: [for-loops, while-loops, membership-speed, sets, tuples, functions-as-values, raising-errors, main-guard, files]
ask:
  dialogue:
    - nell: "The council's clearing the old pier. All of it's coming here. Ten thousand parts, give or take."
    - nell: "Penhallow's stock program checks for spares every time a part comes in. Two hundred parts, no bother."
    - nell: "Will it cope with ten thousand? And don't tell me it depends."
    - moss: "It depends on how the steps grow. That part we can count."
  spec: |
    Penhallow's spares check finds the parts Nell has more than one of. Rewrite it so it counts its own work, write a quicker one, and work out what the pier will do to it. In `yard.py`:

    1. `spares_by_pairs(parts)` compares every part with every part after it, as hers does. It returns `(spares, comparisons)`: the names that appear more than once, in alphabetical order, each named once, and how many times two parts were compared.
    2. `spares_by_set(parts)` goes through the parts once, keeping a set of the ones it has seen. It returns `(spares, lookups)`, counting each time it checks the set.
    3. `growth_ratio(find_spares, n)` runs a spares function on `n` different parts, then on `2 * n`, and returns how many times more steps the bigger run took, rounded to one decimal place.
    4. `estimate(seconds, n_now, n_later, growth)` scales a time measured with `n_now` parts up to `n_later` parts. `growth` is `"O(1)"`, `"O(log n)"`, `"O(n)"`, `"O(n log n)"` or `"O(n^2)"`; anything else raises `ValueError`.
  example: |
    Yard today: 200 parts, 56 kinds with spares
    By pairs: 19900 comparisons, x4.0 when the yard doubles
    By set: 200 lookups, x2.0 when the yard doubles
    By pairs took 0.0011 s. With the pier: about 2.9 s, every time a part comes in.
ship:
  dialogue:
    - nell: "A few seconds every time a part comes in, and ten thousand parts coming. I'd be quicker by hand."
    - nell: "By the set, it's done before I've put the part down."
    - moss: "Same answer. Different growth. That's the whole of it."
  shelf: { object: tally-counter, label: "Nell's spares check, counted" }
  cards: [big-o, timing-code]
story_note: every-night-before
stretch:
  - id: readable
    title: "Hours, not seconds"
    prompt: |
      Nell doesn't think in seconds. Write `readable(seconds)` that gives back `"45 seconds"`, `"12 minutes"` or `"3.5 hours"`: seconds under a minute, minutes under an hour, hours above that, with hours to one decimal place. Then work out the whole pier: ten thousand parts arriving, and the check running once for each.
  - id: in-both
    title: "Already got one"
    prompt: |
      Before the lorries come, Nell wants to know which kinds of part she has already. Write `in_both(yard, pier)` twice, once with a loop inside a loop and once with a set, each returning the shared names in alphabetical order and a count of steps. Time both with 5,000 parts each, then use `estimate` to say how each would cope with 50,000.
