id: heaps-priority-pile
title: "Task Scheduler"
project_name: "Task Scheduler"
portfolio_readme: |
  # Task Scheduler

  Schedules jobs by priority: whatever is most urgent comes out first, and of two jobs equally urgent, the one that came in first. Underneath is a binary heap written by hand in a plain list, so adding a job and taking the next one each cost O(log n), however long the list of jobs gets.

  Written by {name} for Caitlin, at Paul's Python Course. Finished {date}.

  ## Run it

  ```
  python scheduler.py
  ```

  It replays a day of repair jobs from `day.txt`, where `add 1 the arcade cabinet` adds a job at priority 1 (the most urgent) and `take` hands out the next one:

  ```
  Mending the arcade cabinet
  Mending Neil's keyboard
  Mending Riya's headphones
  Mending Yahya's stopwatch
  Mending Aaesha's label printer
  Mending Paul's desk lamp
  Still waiting: 1
  ```

  Edit `day.txt` to schedule your own jobs, or use `TaskScheduler` from your own code: `add(task, priority)`, `take()` and `len()`.

  ## What it shows

  - A binary heap kept in a list: an item's children at `2 * i + 1` and `2 * i + 2`, its parent at `(i - 1) // 2`
  - `push` that climbs and `pop` that sinks, each O(log n), with no `heapq`
  - A priority queue built on the heap, with ties broken fairly by order of arrival, because tuples compare item by item
  - A class with `__len__`, and an `IndexError` when there's nothing left to take
downloadable: true
# day.txt is a day of repairs invented for the story: the scheduler's behaviour is the
# point, and no public dataset of the Makerspace's repair jobs exists. See the README.
