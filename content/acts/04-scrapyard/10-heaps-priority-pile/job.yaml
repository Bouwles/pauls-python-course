summary: "A task scheduler for the Makerspace's repair bench: the most urgent job always next, first come first served on a tie, on a heap built by hand from a list."
concepts_introduced: [heaps, priority-queues]
concepts_reviewed: [trees, big-o, tuples, classes, methods, dunder-methods, while-loops, standard-library, sort-stability, files, main-guard]
ask:
  dialogue:
    - caitlin: "Everyone brings me things to mend. Neil's keyboard, Yahya's stopwatch, the arcade cabinet."
    - caitlin: "They all want theirs first. The cabinet can't wait. The Studio kettle can wait a week."
    - caitlin: "Same urgency, they're done in the order they came. That's only fair."
    - paul: "Then you want a scheduler that keeps the most urgent on top, whatever comes in."
  spec: |
    A task scheduler for the Makerspace's repair bench. Repairs come in all day with a priority: 1 is the most urgent. Caitlin always mends the most urgent one waiting, and of two with the same priority, the one that came in first. In `scheduler.py`, by hand, with no `heapq`:

    1. `push(heap, item)` adds an item to a heap kept in a list, with the smallest item always at `heap[0]`.
    2. `pop(heap)` removes the smallest item and hands it back. On an empty heap it raises `IndexError`.
    3. `TaskScheduler`, built on your `push` and `pop`: `add(repair, priority)` schedules a repair, `take()` hands back the one to mend next (raising `IndexError` if there isn't one), and `len(scheduler)` says how many are waiting.

    Both `push` and `pop` should take O(log n) steps, so a thousand repairs waiting cost about ten swaps a time. The main block replays Caitlin's day from `day.txt`.
  example: |
    Mending the arcade cabinet
    Mending Neil's keyboard
    Mending Riya's headphones
    Mending Yahya's stopwatch
    Mending Aaesha's label printer
    Mending Paul's desk lamp
    Still waiting: 1
ship:
  dialogue:
    - caitlin: "The cabinet first, and Yahya's stopwatch the minute it came in. Riya's headphones before Paul's lamp."
    - caitlin: "The Studio kettle is still waiting. Neil has noticed."
    - paul: "That's heapq, more or less. Now you know what it's doing when you use it."
  shelf: { object: ticket-spike, label: "Caitlin's task scheduler, most urgent on top" }
  cards: [heaps, priority-queues]
stretch:
  - id: heapify
    title: "A whole pile at once"
    prompt: |
      When a thousand repairs arrive at once, pushing them one by one costs O(n log n). Write `heapify(items)`, which turns a list into a heap in place by sinking every item that has children, starting from the last one and working back to the top. Count the comparisons for 10,000 parts both ways. It's O(n), and the reason is that most items start near the bottom and have nowhere to sink.
  - id: heaviest
    title: "The three heaviest"
    prompt: |
      Paul only wants the three heaviest parts of the clockmaker's ten thousand. Write `heaviest(weights, k)` with `heapq`, keeping a heap of the k heaviest so far: push each weight, and pop whenever the heap holds more than k. Why does this keep the heaviest, when `heappop` takes the smallest? Check it against `sorted(weights)[-k:]` and `heapq.nlargest`.
