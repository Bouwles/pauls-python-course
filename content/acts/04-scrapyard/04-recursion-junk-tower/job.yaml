id: recursion-junk-tower
title: "Recursive File Tree Printer"
project_name: "Recursive File Tree Printer"
portfolio_readme: |
  # Recursive File Tree Printer

  Prints a folder and everything inside it the way the `tree` command does, with branches, and the size of every file and folder. It also counts the files and says how many folders deep it goes. Every part of it is recursive: a folder is files plus smaller folders, so each function deals with what it can see and hands each folder inside to itself. Folder sizes are memoised, written down the first time they're worked out, so no folder is measured twice.

  Written by {name} for Neil, at Paul's Python Course. Finished {date}.

  ## Run it

  ```
  python tree.py
  python tree.py path/to/any/folder
  ```

  With no folder named, it prints `backup`, the copy of Neil's old laptop that comes with it:

  ```
  backup/ (835 bytes)
  ├── README.txt (94 bytes)
  ├── karting/ (204 bytes)
  │   └── lap-timer/ (204 bytes)
  │       ├── notes.txt (70 bytes)
  │       └── versions/ (134 bytes)
  │           ├── v1.txt (73 bytes)
  │           └── v2.txt (61 bytes)
  ├── rockets/ (258 bytes)
  │   ├── checklist.txt (63 bytes)
  │   ├── design.txt (72 bytes)
  │   └── flights/ (123 bytes)
  │       ├── first.txt (60 bytes)
  │       └── second.txt (63 bytes)
  ├── scripts/ (188 bytes)
  │   ├── style/ (116 bytes)
  │   │   ├── spaces.txt (92 bytes)
  │   │   └── tabs.txt (24 bytes)
  │   └── telemetry.txt (72 bytes)
  └── teaching/ (91 bytes)
      └── duck.txt (91 bytes)
  12 files, 4 folders deep
  ```

  ## What it shows

  - Recursion on a real folder tree with `os.listdir`, `os.path.join`, `os.path.isdir` and `os.path.getsize`, each function with a base case: a folder with no folders in it
  - The call stack: every folder being printed waits while the folders inside it are printed first
  - Memoisation: a dictionary of folder sizes filled in once and read after, so printing the tree lists each folder twice at most instead of once for every folder above it
  - A program that takes its folder from `sys.argv`, so it works on any folder on your computer
downloadable: true
# The backup folder is invented for the story: a few small text files from Neil's
# old laptop, his kart lap timer and his first rockets. The printer works on any real folder. See the README.
datasets: []
client: neil
building: scrapyard
estimated_minutes: 100
summary: "A file tree printer for Neil's old backup, his first lap timer and his first rockets inside: folders inside folders, each one handled the same way, drawn like the tree command, with every folder's size worked out once and written down."
concepts_introduced: [recursion, base-cases, call-stack, memoisation]
concepts_reviewed: [functions, return-values, scope, nested-data, dictionaries, big-o, quicksort, files, sys-argv, enumerate, f-strings]
ask:
  dialogue:
    - neil.surprised.wave: "I found my old laptop's backup. Folders inside folders inside folders."
    - neil.laughing: "My first kart lap timer is in there. My first rocket's flight notes. A lot of typos."
    - neil.thinking: "I want to see what's on it without opening a thing. And how big it all is."
    - paul.neutral.point: "A folder is files and smaller folders. Look at it the way it was packed."
  spec: |
    In `tree.py`, a file tree printer for the `backup` folder, Neil's old laptop, or any folder you name. List a folder with `os.listdir(path)`, in sorted order, and build the path to each name inside with `os.path.join(path, name)`.

    1. `folder_size(path, sizes)` returns the bytes of every file under the folder, however deep. Neil's version is right but measures the same folders again and again. Memoise it: `sizes` is a dictionary of folder totals by path. If the folder is in it, hand that back without looking inside; otherwise work it out, write it in, and hand it back.
    2. `count_files(path)` returns how many files are under the folder, however deep.
    3. `depth(path)` returns how many folders deep it goes: 1 for a folder with no folders inside, otherwise one more than the deepest folder inside it.
    4. `tree_lines(path, sizes, prefix="")` returns a list of lines for everything inside the folder, names in sorted order. Each line is `prefix`, then `├── ` (or `└── ` for the last name in the folder), then `name/ (204 bytes)` for a folder, using `folder_size` with the same `sizes`, or `name (70 bytes)` for a file. Under each folder come its own lines, with `prefix` plus `│` and three spaces, or four spaces if that folder was the last name.

    The main block prints the folder named in `sys.argv`, or `backup` if none is, with its size on the first line and the files and depth on the last.
  example: |
    backup/ (835 bytes)
    ├── README.txt (94 bytes)
    ├── karting/ (204 bytes)
    │   └── lap-timer/ (204 bytes)
    │       ├── notes.txt (70 bytes)
    │       └── versions/ (134 bytes)
    │           ├── v1.txt (73 bytes)
    │           └── v2.txt (61 bytes)
    ├── rockets/ (258 bytes)
    │   ├── checklist.txt (63 bytes)
    │   ├── design.txt (72 bytes)
    │   └── flights/ (123 bytes)
    │       ├── first.txt (60 bytes)
    │       └── second.txt (63 bytes)
    ├── scripts/ (188 bytes)
    │   ├── style/ (116 bytes)
    │   │   ├── spaces.txt (92 bytes)
    │   │   └── tabs.txt (24 bytes)
    │   └── telemetry.txt (72 bytes)
    └── teaching/ (91 bytes)
        └── duck.txt (91 bytes)
    12 files, 4 folders deep
ship:
  dialogue:
    - neil.laughing: "Eight hundred and thirty-five bytes. A lap timer and two rocket flights. Humbling."
    - neil.pleased.thumbs: "And every folder measured once. Mine measured `versions` four times."
    - paul.proud: "Same sums. It just stopped doing any of them twice."
  shelf: { object: crate-tower, label: "Neil's old backup, lap timer and rockets drawn" }
  cards: [recursion, base-cases, call-stack, memoisation]
stretch:
  - id: biggest-first
    title: "Biggest first"
    prompt: |
      Add `--biggest` to the Arguments box: list each folder's contents biggest first instead of by name, using the sizes you've already written down, so nothing is measured again. Ties go by name.
  - id: no-recursion
    title: "Two thousand folders deep"
    prompt: |
      Build a folder two thousand deep with a loop and measure it: Python stops with a `RecursionError`, because it only lets the call stack grow about a thousand calls high. Write `size_by_hand(path)` with no recursion at all: keep your own list of folders still to open, take one off the end, add its files, and put its folders on the end. That list is a stack, which is the next project.
  - id: lorry-packer
    title: "Filling a trailer"
    prompt: |
      How many ways can a trailer `length` metres long be filled, end to end, with crates 1 m and 2 m long? `packings(length)` is `packings(length - 1) + packings(length - 2)`, with 1 way for a trailer of 0 and none for less. Written like that, a 40 m row of trailers takes all night. Memoise it with `@functools.cache` and it's 165580141, in a blink.
