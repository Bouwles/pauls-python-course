summary: "Neil's floor: a racing simulator rig, a model rocket on the shelf, and a wall of sticky notes and string. Real programs that have to be quick as well as right: a speed tester, a search engine, a sorting visualiser, an undo button, a hash map, a pit-stop scheduler, a maze solver, a route planner for race weekend, a sudoku solver and a spell checker."
locked_line: "A racing rig, a model rocket and a wall of string, waiting for someone who can follow it."
intro:
  - paul.neutral.point: "Third floor. Neil's. Mind the racing rig, and the string."
  - paul.thinking: "Until now, a program worked or it didn't. Up here, it also has to be quick."
  - neil.pleased.wave: "Everything on this floor gets timed. Laps, launches, and your code."
  - neil.laughing: "The rocket on the shelf is a model. Mostly."
