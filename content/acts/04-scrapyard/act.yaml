title: "The Puzzle Room"
district: scrapyard
subject: "Algorithms and data structures"
hours: 45
summary: "Neil's floor: a racing simulator rig, a model rocket on the shelf, and a wall of sticky notes and string. Real programs that have to be quick as well as right: a speed tester, a search engine, a sorting visualiser, an undo button, a hash map, a pit-stop scheduler, a maze solver, a route planner for race weekend, a sudoku solver and a spell checker."
locked_line: "A racing rig, a model rocket and a wall of string, waiting for someone who can follow it."
intro:
  - paul.neutral.point: "Up here's the third floor, which is Neil's. Mind the racing rig, and watch you don't trip on the string."
  - paul.thinking: "Up to now a program either worked or it didn't, but up here it has to be quick as well."
  - neil.pleased.wave: "Fair warning, I time everything on this floor, and that's going to include your code."
  - neil.laughing: "Don't worry about the rocket on the shelf, it's only a model. Well, mostly."
