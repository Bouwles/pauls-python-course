id: the-cheapest-route
title: "Route Planner"
project_name: "Route Planner"
portfolio_readme: |
  # Route Planner

  Finds the quickest way from one place to another, two ways. On the town map, a graph of roads with the minutes each one takes, Dijkstra's algorithm finds the quickest route and the quickest time to everywhere. In the scrapyard, a map drawn as text where mud costs three times what clear ground does, A* finds the quickest way from the gate to the crane while heading for it, and draws the route in arrows.

  Written by {name} for Nell Brannigan's scrapyard in {{town}}. Finished {date}.

  ## Run it

  ```
  python routes.py
  python planner.py
  ```

  `routes.py` plans the lorry's run across town:

  ```
  Fewest roads to the ferry: 16 minutes
  Quickest to the ferry: 14 minutes, by scrapyard, tailor, library, town-hall, post-office, ferry
  Furthest from the yard: lighthouse, 24 minutes
  ```

  `planner.py` reads `yard.txt` and plans the way through the yard:

  ```
  Gate to crane: 23 minutes, 19 steps
  v.....#.......#.....
  v####.#.~~~~~.#.###.
  v#....#.~###~...#...
  v#.####.~#G.~####.#.
  v#......~#^#~.....#.
  v######.~#^#~####.#.
  >>>>>>>>>>^~~...#.#.
  .####.#######.#.#...
  ......#.......#...#.
  ```

  ## What it shows

  - Weighted graphs, and Dijkstra's algorithm with a heap: always carry on from the nearest place not yet settled
  - Rebuilding the route from a note of where each place's best time came from
  - A*: Dijkstra plus an estimate of the distance still to go, which must never overestimate, and the Manhattan distance on a grid
  - Edge cases: one-way roads, no way there, a start that is the goal, and ties
downloadable: true
# The town's roads and Nell's yard are invented for the story: the planner works on any
# map in the same shape. See the README.
datasets: []
client: nell
building: scrapyard
estimated_minutes: 240
summary: "A route planner for Nell's lorry: Dijkstra on the town map with minutes on every road, then A* through the yard, heading for the crane, with mud at three times the cost."
concepts_introduced: [weighted-graphs, dijkstra, a-star]
concepts_reviewed: [graphs, bfs, dfs, heaps, priority-queues, dictionaries, dict-get, sets, tuples, zip, raising-errors, files, string-methods, big-o, edge-cases]
ask:
  dialogue:
    - nell: "Fewest roads was grand till the lorry took the yard track to the workshop. Eight minutes of potholes."
    - nell: "Round by the tailor's is a road longer and a minute quicker. The lorry doesn't count roads."
    - nell: "Ferro wants a winch gear at the ferry before the turn. Quickest way, in minutes."
    - moss: "Then write the minutes on the roads, and always carry on from the nearest place you haven't finished with."
    - nell: "And in the yard, mud costs three times what clear ground does. The lorry knows that too."
  spec: |
    `MINUTES` in `routes.py` is the town again, with the minutes each road takes the lorry: `MINUTES["scrapyard"]["tailor"]` is 4. Roads can still be one way, and a place with no dictionary of its own has no roads out. No road takes less than 0 minutes.

    1. `route_minutes(roads, route)` gives back the minutes along a route, a list of places; a route of one place, or none, takes 0. If two places next to each other in the route have no road between them, it raises `ValueError`, naming both.
    2. `quickest_times(roads, start)` gives back a dictionary of every place that can be reached from `start`, and the fewest minutes it takes to get there.
    3. `quickest_route(roads, start, goal)` gives back `(minutes, route)` for the quickest route, `(0, [start])` if they're the same place, or `None` if there's no way there. If two routes tie, either will do.

    Use `heapq`, and look at each place's roads once.

    Then the yard, in `planner.py`. `yard.txt` is Penhallow's map of it: `#` is scrap, `.` clear ground, `~` oil and mud, `S` the gate and `G` the crane. `read_yard(text)` and `neighbours(tiles, tile)` are the maze solver's, written for you, with a cost on every tile: 1 for clear ground, `S` and `G`, 3 for mud, `None` for scrap.

    4. `manhattan(tile, goal)` is the rows apart plus the columns apart.
    5. `a_star(tiles, start, goal)` gives back `(minutes, route)` for the quickest route through the yard, where `route` lists the tiles from `start` to `goal` and `minutes` adds up the cost of every tile stepped onto after the start. `(0, [start])` if they're the same tile, `None` if there's no way there. Use A* with `manhattan` as the estimate. If routes tie, any will do.
    6. `draw_route(tiles, route)` gives back the yard as a list of strings, `#`, `.` and `~`, with each tile of the route but the last showing which way to step out of it (`^`, `v`, `<` or `>`), and `G` on the last.
  example: |
    Fewest roads to the ferry: 16 minutes
    Quickest to the ferry: 14 minutes, by scrapyard, tailor, library, town-hall, post-office, ferry
    Furthest from the yard: lighthouse, 24 minutes

    Gate to crane: 23 minutes, 19 steps
    v.....#.......#.....
    v####.#.~~~~~.#.###.
    v#....#.~###~...#...
    v#.####.~#G.~####.#.
    v#......~#^#~.....#.
    v######.~#^#~####.#.
    >>>>>>>>>>^~~...#.#.
    .####.#######.#.#...
    ......#.......#...#.
ship:
  dialogue:
    - nell: "Fourteen minutes to the ferry, by the library. Ferro had his gear with the tide still turning."
    - nell: "Five roads, mind. I'd never have gone that way. I'd have counted corners."
    - nell: "And twenty-three minutes, gate to crane. The lorry followed the arrows and never touched a heap."
    - moss: "Nearest unfinished place first, and lean towards where you're going. Nothing can beat it."
  shelf: { object: signpost, label: "Nell's route planner, town and yard" }
  cards: [weighted-graphs, dijkstra, a-star]
story_note: the-other-end
stretch:
  - id: road-works
    title: "Road works"
    prompt: |
      The council posts a list of closed roads each morning. Write `quickest_avoiding(roads, start, goal, closed)`, where `closed` is a set of `(place, place)` pairs closed in both directions, without copying the whole map: skip a road as you look at it. How much longer is the ferry run with the library road shut?
  - id: back-to-the-yard
    title: "There and back"
    prompt: |
      The lorry has to deliver to the ferry, then the lighthouse, then come home. Write `round_trip(roads, start, stops)`, the minutes for visiting the stops in the order given and returning to `start`, using `quickest_route` for each leg. Then try every order of the stops with `itertools.permutations` and find the quickest. How many orders would ten stops have?
  - id: several-stops
    title: "The long way round the yard"
    prompt: |
      The lorry picks up at three heaps before the crane. Write `best_round(tiles, start, stops, goal)`, which tries every order of the stops, joins the legs with `a_star`, and gives back the quickest total and its route. How many orders are there for six stops, and how many A* searches does that take? Store each leg's answer so no leg is searched twice.
  - id: count-the-work
    title: "How much it saved"
    prompt: |
      Give `a_star` an `estimate` argument, defaulting to `manhattan`, and count the tiles it settles. Run it on Nell's yard with the estimate, and with `lambda tile, goal: 0`, which turns it back into Dijkstra. Then try an estimate of `3 * manhattan(tile, goal)`: it settles even fewer tiles. Is its route still the quickest? Why not?
  - id: diagonals
    title: "Corners"
    prompt: |
      Nell's new lorry can cut corners. Let `neighbours` include the four diagonal tiles, costing the same as straight steps, and change the estimate to the bigger of the rows apart and the columns apart. Why would `manhattan` now be the wrong estimate?
