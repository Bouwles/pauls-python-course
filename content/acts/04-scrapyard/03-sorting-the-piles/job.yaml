id: sorting-the-piles
title: "Sorting Visualiser"
project_name: "Sorting Visualiser"
portfolio_readme: |
  # Sorting Visualiser

  Four sorting algorithms, written by hand, each one shown at work. Selection sort and insertion sort sort a pile in place, pass by pass; merge sort merges piles of one up into a single pile, round by round; quick sort splits one pile down round a pivot, round by round. Every sort records a frame after each pass or round, and the visualiser plays the frames back as bars, then checks the two fast sorts against Python's `sorted()` on ten thousand parts and times all three.

  Written by {name} for Yahya, at Paul's Python Course. Finished {date}.

  ## Run it

  ```
  python sorter.py
  ```

  It draws a pile of seven weights, asks which sort to show, then plays it:

  ```
    7 #######
    3 ###
    9 #########
    3 ###
    1 #
   12 ############
    5 #####
  Which sort: selection, insertion, merge or quick? quick
  Step 1
    3 ###
    3 ###
    1 #
    5 #####
    7 #######
    9 #########
   12 ############
  Step 2
    1 #
    3 ###
    3 ###
    5 #####
    7 #######
    9 #########
   12 ############
  Quick sort: 2 steps
  Clockmaker's lot: 10000 parts, merge and quick agree with sorted(): True
  sorted() 0.002 s, merge 0.033 s, quick 0.016 s
  ```

  `piles.py` holds the two simple sorts and `draw`; `sorter.py` holds merge sort, quick sort and the visualiser. The timings change from run to run.

  ## What it shows

  - Selection, insertion, merge and quick sort written without `sorted()` or `.sort()`, and why the first two are O(n²) and the second two O(n log n) on a jumbled pile
  - Merge sort and quick sort done in rounds, without recursion: one merges up from piles of one, the other splits down from one pile
  - Stable sorting with a `key`, so parts of the same weight keep the order they arrived in
  - Recording copies of a list as it changes, and drawing each one as a text bar chart
downloadable: true
# The pile and the clockmaker's lot are invented for the story: the lot is generated in code
# from a seeded random generator, so every run sorts the same ten thousand parts.
datasets: []
client: yahya
building: scrapyard
