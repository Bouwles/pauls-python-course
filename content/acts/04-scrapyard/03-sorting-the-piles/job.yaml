stretch:
  - id: middle-pivot
    title: "A better pivot"
    prompt: |
      `quick_sort` takes each pile's first lap as its pivot. Hand it a pile that's already in order and every split leaves one side empty, so it takes a round for every lap: O(n²). Count the frames for `quick_sort(list(range(2000)), frames=frames)`, then make it take the middle lap of each pile as the pivot and count again.
  - id: count-the-work
    title: "Count the work"
    prompt: |
      Give each of your three sorts a counter for comparisons, and make a table for 1,000 laps in random order, already in order, and back to front. Which sort cares what order it was given? Which doesn't care at all?
  - id: watch-it
    title: "Quick sort in place"
    prompt: |
      Write a quicksort that sorts a list of numbers in place, as the simple sorts do: pick the last lap as the pivot, walk along swapping faster laps to the front, swap the pivot in after them, then sort each side the same way, calling itself. Record a frame after each split, play it in the visualiser, and press Step through on a pile of twelve to watch the bars split.
