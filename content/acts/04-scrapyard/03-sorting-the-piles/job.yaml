summary: "A sorting visualiser for the clockmaker's lot: selection, insertion, merge and quick sort, each played back frame by frame as bars, then raced against sorted()."
concepts_introduced: [simple-sorts, quicksort, merge-sort, sort-stability]
concepts_reviewed: [big-o, timing-code, sorted-vs-sort, sort-key, lambda, list-comprehensions, slicing, tuples, mutability, default-arguments, none, copying]
ask:
  dialogue:
    - yahya: "Paul wants the clockmaker's lot on the shelves lightest first. Ten thousand parts."
    - yahya: "Everyone says sort it. Nobody says which sort. I want to watch four of them race."
    - paul: "There are four ways worth knowing. After that, you'll see why nobody writes their own."
  spec: |
    A sorting visualiser, in two files, each sort written by hand: no `sorted()` or `.sort()` inside your functions. Every sort takes a `frames` list (or `None`, the default) and, if it's a list, puts a copy of the pile on it after each pass or round, so the work can be played back.

    In `piles.py`, two sorts that change the list they're given, lightest first, and hand back `None`, like `.sort()`, and a way to draw a pile:

    1. `draw(pile)` gives back the pile as text, one line per weight: the weight right-aligned in three places, a space, and a `#` for each kilo.
    2. `selection_sort(weights, frames=None)`: find the lightest of what's left and swap it into place. A frame after every pass.
    3. `insertion_sort(weights, frames=None)`: take each weight in turn and slide it left past every heavier one. A frame after every pass.

    In `sorter.py`, two faster sorts for the big lot, which hand back a new list sorted by `key` and leave `items` as it was. Both are stable: on a tie, items keep the order they came in.

    4. `merge(left, right, key)` takes two lists already sorted by `key` and gives back one, sorted by `key`. On a tie, the item from `left` comes first.
    5. `merge_sort(items, key=lambda item: item, frames=None)`: every item starts as a pile of one; neighbouring piles are merged in pairs, round after round, until one pile is left.
    6. `quick_sort(items, key=lambda item: item, frames=None)`: everything starts in one pile; each round, every pile of two or more is split round its first item into the lighter ones, then each item the same as the pivot as a pile of its own, then the heavier ones, until no pile has two items.

    For merge and quick sort, a frame is every pile after the round, laid end to end. The visualiser at the bottom of `sorter.py` is written.
