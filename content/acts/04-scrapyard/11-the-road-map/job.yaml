id: the-road-map
title: "Maze Solver"
project_name: "Maze Solver"
portfolio_readme: |
  # Maze Solver

  Reads a maze drawn as text, `#` for walls and `.` for open ground with an `S` and a `G`, and solves it. Breadth-first search finds the shortest way through; depth-first search walks every tile it can reach, as deep as it can go first; and anything the walk never reaches is reported as cut off. The answer is drawn back onto the maze.

  Written by {name} for Yahya, at Paul's Python Course. Finished {date}.

  ## Run it

  ```
  python maze.py
  ```

  It solves `maze.txt`, Yahya's maze from the Puzzle Room wall:

  ```
  Start to goal: 19 steps
  S.....#.......#.....
  *####.#.......#.###.
  *#....#..###....#...
  *#.####..#G..####.#.
  *#.......#*#......#.
  *######..#*#.####.#.
  ***********.....#.#.
  .####.#######.#.#...
  ......#.#...#.#...#.
  Depth first reaches 111 tiles
  Cut off: (8, 7), (8, 9), (8, 10), (8, 11)
  ```

  Draw your own maze in `maze.txt`, one row a line, all rows the same length.

  ## What it shows

  - A grid as a graph: every open tile a place, its neighbours the open tiles up, down, left and right
  - Breadth-first search with a `deque`, and a note of where each tile was reached from, to rebuild the shortest path
  - Depth-first search by recursion, and using it to find what can't be reached at all
  - Edge cases a maze is full of: corners, edges, no way through, and a start that is the goal
downloadable: true
# maze.txt is invented for the story: Yahya's maze, from the Puzzle Room wall. Mazes are
# drawn, not measured, so no public dataset is needed. See the README.
datasets: []
client: yahya
building: scrapyard
estimated_minutes: 100
summary: "A maze solver for Yahya's maze: graphs first, on his running routes across the city, then the maze as a grid, solved breadth first for the fewest steps and depth first for everywhere that can be reached."
concepts_introduced: [graphs, bfs, dfs]
concepts_reviewed: [dictionaries, dict-get, sets, lists, tuples, negative-indices, while-loops, queues, deque, stacks, recursion, big-o, list-comprehensions, edge-cases, files]
ask:
  dialogue:
    - yahya: "I drew a maze on the Puzzle Room wall. The class races it. Caitlin's best is twenty-three steps."
    - yahya: "I say nineteen is possible. She says prove it."
    - yahya: "And I want to know if there's anywhere in it nobody can get to."
    - paul: "Places, and the ways between them. Write it down like that and it's a graph."
  spec: |
    `maze.txt` is Yahya's maze, drawn as text: `#` is a wall, `.` is open floor, `S` is the start and `G` is the goal. A tile is a `(row, col)` pair. `read_maze` is written: it gives back `(grid, start, goal)`, where `grid` is the list of lines. In `maze.py`, write:

    1. `neighbours(grid, tile)`: the tiles up, down, left and right of `tile`, in that order, that are inside the maze and not walls.
    2. `shortest_path(grid, start, goal)`: the list of tiles from `start` to `goal` in the fewest steps, found by breadth-first search; `[start]` if they're the same tile; `None` if there's no way through. If two ways tie, either will do.
    3. `explore(grid, start)`: every tile a depth-first walk reaches from `start`, in the order it first reaches them. From each tile, try its neighbours in order; go to the first one not reached yet and carry on from there; when a tile has nowhere new, go back the way you came and try the next.
    4. `unreachable(grid, start)`: every open tile (`.`, `S` or `G`) that can't be reached from `start`, row by row, left to right.
    5. `draw_path(grid, path)`: the maze as a list of lines, with `*` on every tile of the path except the `S` and the `G`; the maze as it is if `path` is `None`.

    The main block solves the maze, draws the way, and reports how far depth first got and what's cut off.
  example: |
    Start to goal: 19 steps
    S.....#.......#.....
    *####.#.......#.###.
    *#....#..###....#...
    *#.####..#G..####.#.
    *#.......#*#......#.
    *######..#*#.####.#.
    ***********.....#.#.
    .####.#######.#.#...
    ......#.#...#.#...#.
    Depth first reaches 111 tiles
    Cut off: (8, 7), (8, 9), (8, 10), (8, 11)
ship:
  dialogue:
    - yahya: "Nineteen steps, start to goal. Caitlin checked every one. She's racing it again tomorrow."
    - yahya: "Four squares in the bottom corner nobody can reach. I'll have a door in by Friday."
    - paul: "One maze, three questions. Breadth first for the nearest, depth first for everywhere."
  shelf: { object: track-map, label: "Yahya's maze, solved" }
  cards: [graphs, bfs, dfs]
stretch:
  - id: every-step
    title: "How far is everywhere"
    prompt: |
      Write `steps_from(grid, start)`, a dictionary of every tile you can reach and how many steps away it is. It's Paul's walk round the city, on tiles. Then draw the maze with each open tile's distance, last digit only, and find the tile furthest from the start.
  - id: watch-it
    title: "Watch it spread"
    prompt: |
      Call `show_grid` inside `shortest_path` every time a tile comes off the queue: values of 1 for every tile reached so far, `crab=tile` to mark where the search is, and `walls` for the walls. Press Run and play it. Then do the same in `explore`. One spreads like a ripple; the other runs down a corridor.
  - id: every-route
    title: "Every way through"
    prompt: |
      Write `all_paths(grid, start, goal)`, which gives back every way from `start` to `goal` that never stands on a tile twice. Depth first works: step onto a tile, carry on from there, and when you come back, step off it again so another path can use it. How many ways are there through a 4 by 4 open field, corner to corner?
