datasets: []
client: paul
building: observatory
estimated_minutes: 600
summary: "The Act VI capstone, an end-to-end machine learning project. Good fishing or not, from what's known at dawn: three years of the fleet's log, features a skipper would recognise, a model chosen by cross-validation, one honest look at the last year, and a write-up of what worked and what didn't."
concepts_introduced: [baselines, feature-engineering]
concepts_reviewed: [scikit-learn, pipelines, cross-validation, data-leakage, train-test-split, logistic-regression, ensembles, classification-metrics, feature-scaling, overfitting, pandas-basics, selecting-filtering, missing-data, modules, imports, dictionaries, functions, main-guard, f-strings]
ask:
  dialogue:
    - paul.neutral.wave: "A fishing co-op on the coast wrote to me. Good fishing or not, from the weather and the tide."
    - paul.thinking: "Who's going to use it? Six boats, and the café by the water that cooks whatever they land."
    - caitlin.pleased: "That café does the best chips on the coast. Get this right."
    - paul.neutral.point: "Three years of the fleet's log. Two to learn from, one locked away. You know how this goes now."
    - paul.proud: "This one's yours, start to finish. Then write down what worked, and what didn't."
  spec: |
    The fleet's log is in `fishing.csv`: every day from 2023 to 2025, with what was known at dawn and how many boxes each boat landed. A good day is eight boxes a boat or more.

    1. In `features.py`, turn the log into what a dawn forecast can use: the wind as an arrow, the high water as hours from dawn, the pressure's change since yesterday, and whether each day was good. Nothing that's only known later.
    2. In `forecast.py`, lock 2025 away, choose between three models by cross-validation on 2023 and 2024, then test the chosen one on 2025, once, beside the skipper's rule and always saying no.
    3. Write it up: what worked, what didn't, and what the forecast can't know.
  example: |
    Training days: 730, test days: 365
    logistic   0.860
    forest     0.842
    boosting   0.853
    Chosen: logistic
    On 2025: 0.852
    Skipper's rule: 0.723
    Always saying no: 0.575
    When it says good, it's right: 0.81
    Good days it caught: 0.85
ship:
  dialogue:
    - paul.pleased: "The co-op wrote back. It said good on Thursday, the boats came in full, and the café sold out by two."
    - caitlin.laughing.cheer: "Sold out by two. That's the review that counts."
    - yahya.thinking: "Eighty-five in a hundred, on a year it never saw. The skipper's rule gets seventy-two."
    - aaesha.neutral: "And the write-up says how we know. That's the part I'd check first."
    - paul.proud.thumbs: "A model, a test it hadn't seen, and a page a stranger could check. That's the job done properly."
  shelf: { object: catch-board, label: "Paul's fishing forecast, tested on a year it never saw" }
  cards: [baselines, feature-engineering]
stretch:
  - id: boats-out
    title: "The column that comes later"
    prompt: |
      Add `boats_out` to `FEATURES` and cross-validate again. Watch the score jump. Then put it back out, and add a paragraph to the write-up saying why it jumped and why it can't stay.
  - id: raw-columns
    title: "What the features were worth"
    prompt: |
      Cross-validate the logistic regression on the raw columns instead: `wind_speed`, `wind_dir`, `pressure`, `sea_temp`, `swell`, `tide_range`, `cloud` and `rain`. How much did your three rewritten features add? Put the number in the write-up.
  - id: tuned
    title: "Tune the forest"
    prompt: |
      Grid search the forest's `min_samples_leaf` and the boosting's `learning_rate`, on 2023 and 2024 only. Does either beat logistic regression in cross-validation? Open 2025 for the winner only, and say in the write-up how many things you tried.
