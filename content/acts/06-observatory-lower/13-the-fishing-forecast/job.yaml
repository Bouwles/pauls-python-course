id: the-fishing-forecast
title: "Fishing Forecast"
project_name: "Fishing Forecast"
portfolio_readme: |
  # Fishing Forecast

  An end-to-end machine learning project: will tomorrow be a good day's fishing, from what is known at dawn? It turns three years of a fishing fleet's daily log into features a skipper would recognise (the wind as an arrow, high water as hours from dawn, the change in pressure since yesterday), with nothing that is only known later. It chooses between logistic regression, a random forest and gradient boosting by cross-validation on the first two years, tests the chosen model once on the third, beside the skipper's own rule of thumb and always saying no, and ends with a written account of what worked and what didn't.

  Written by {name} for Paul, at Paul's Python Course. Finished {date}.

  ## Run it

  ```
  pip install numpy pandas scikit-learn
  python forecast.py
  ```

  ```
  Training days: 730, test days: 365
  logistic   0.860
  forest     0.842
  boosting   0.853
  Chosen: logistic
  On 2025: 0.852
  Skipper's rule: 0.723
  Always saying no: 0.575
  When it says good, it's right: 0.81
  Good days it caught: 0.85
  ```

  `features.py` builds the features from the raw log; `forecast.py` chooses, fits and tests the model. The write-up and test plan are in the project's notes.

  ## What it shows

  - Feature engineering from raw records, and the discipline of using only what is known at the time of the forecast
  - Model choice by cross-validation with pipelines, and a final test on a later year, the way a forecast is really used
  - Baselines that matter: a rule an expert already uses, and always giving the commoner answer
  - Precision and recall, and a written account of the model's limits

  ## Data

  `fishing.csv` is invented for the project: every day of 2023 to 2025 for a small fishing fleet, with the dawn weather, tide and swell and the boxes each boat landed. A real dataset of this kind would come from a fleet's own records.
