id: forests-and-boosting
title: "Loan Approval Tree"
project_name: "Loan Approval Tree"
portfolio_readme: |
  # Loan Approval Tree

  Decides whether to approve a loan application from seven answers on the form, using 1,000 real past applicants to a German bank. It grows a decision tree from scratch, with Gini impurity and the depth chosen on a validation set, and prints it as the questions a loan officer could follow. Then it grows a random forest of such trees, from scratch, and tries gradient boosting from scikit-learn. All of them are tested once, on applicants none of them saw, by accuracy and by the bank's own sums: approving a loan that isn't repaid costs five times as much as turning down one that would have been.

  Written by {name} for Riya, at Paul's Python Course. Finished {date}.

  ## Run it

  ```
  pip install numpy scikit-learn
  python loans.py
  ```

  ```
  Chosen depth: 3
  checking <= 1.5?
    yes: duration_months <= 22.5?
      yes: history <= 1.5?
        yes: decline
        no: approve
  ...
                           accuracy   cost
  Approving everyone          0.645  1.775
  One tree, depth 3           0.745  1.075
  A forest of 50 trees        0.740  1.200
  Boosting, 100 rounds        0.750  1.130
  The forest, 5 in 6 sure     0.655  0.665
  ```

  ## What it shows

  - A decision tree grown by recursion: Gini impurity, the best question over every column and threshold, stopping rules, and the tree printed as questions
  - Choosing a tree's depth on validation data, and what a tree with no limit does
  - A random forest from scratch: bootstrap samples, a few columns per question, and a vote
  - Gradient boosting with scikit-learn, compared fairly on the same test applicants
  - Judging a model by what its mistakes cost, and a threshold chosen for that cost

  ## Data

  `loans.csv` is the Statlog German Credit data (Hofmann, 1994) from the UCI Machine Learning Repository, licensed CC BY 4.0. The coded answers are turned into numbers: `checking` is 0 overdrawn, 1 under 200 DM, 2 200 DM or more, 3 no checking account; `history` runs from 0 (no credits taken, or all repaid) to 4 (critical account); `savings` from 0 (under 100 DM) to 3 (1,000 DM or more), with 4 for none or unknown; `employment` from 0 (unemployed) to 4 (seven years or more).
downloadable: true
datasets:
  - name: "Statlog (German Credit Data)"
    source: "https://archive.ics.uci.edu/dataset/144/statlog+german+credit+data"
    licence: "CC BY 4.0"
    file: "loans.csv"
    notes: "From german.data (1,000 applicants). Kept seven of the twenty attributes and decoded their codes into ordered numbers: checking (A11 to A14 as 0 to 3), duration_months, history (A30 to A34 as 0 to 4), amount (in Deutsche Marks), savings (A61 to A65 as 0 to 4), employment (A71 to A75 as 0 to 4) and age. repaid is 1 for a good credit risk and 0 for a bad one. Numbered from 1 in the original order. The cost of 5 for a bad loan approved and 1 for a good one declined is the dataset's own cost matrix."
client: riya
building: observatory
estimated_minutes: 150
summary: "Approve or decline a loan from seven answers on the form, for 1,000 real applicants: a decision tree grown from scratch and read as questions, then a random forest from scratch and gradient boosting, judged by what their mistakes cost."
concepts_introduced: [decision-trees, ensembles]
concepts_reviewed: [overfitting, train-test-split, classification-metrics, scikit-learn, random-module, numpy-arrays, vectorisation, recursion, dictionaries, nested-data, imports, functions, return-values, default-arguments, multiple-returns, main-guard, docstrings, f-strings]
ask:
  dialogue:
    - riya: "A lender should be able to explain a no. Not a score. Questions, written down."
    - riya: "A German bank's thousand applicants, public since the nineties. Seven answers each, and whether they repaid."
    - riya: "I've started growing one already. How deep can it go?"
    - paul: "As deep as the questions stay true. Then stop."
  spec: |
    `loans.csv` holds 1,000 real past applicants: their checking account (0 overdrawn, 1 under 200 DM, 2 200 DM or more, 3 none), the loan's length in months, their credit history (0 to 4, worse as it rises), the amount, their savings (0 to 4) and years in work (0 to 4), their age, and whether they repaid.

    In `loans.py`:

    1. Grow a decision tree from scratch with Gini impurity. Lock a fifth of the applicants away for testing, choose the depth on validation applicants, print the chosen tree as questions, and test it once against approving everyone.
    2. Grow a random forest from scratch: each tree on a bootstrap sample, each question looking at three columns chosen at random. Approve when half the trees say so.
    3. Fit gradient boosting with scikit-learn.
    4. Compare them all on the test applicants by accuracy and by the bank's cost: 5 for a bad loan approved, 1 for a good one declined. Then the forest again, approving only when five trees in six agree.
  example: |
    depth  training  validation
        1     0.718       0.700
        2     0.747       0.685
        3     0.778       0.735
        4     0.793       0.735
        5     0.808       0.715
        6     0.838       0.675
        8     0.888       0.680
    Chosen depth: 3
    checking <= 1.5?
      yes: duration_months <= 22.5?
        yes: history <= 1.5?
          yes: decline
          no: approve
        no: savings <= 0.5?
          yes: decline
          no: approve
      no: amount <= 10924.5?
        yes: employment <= 2.5?
          yes: approve
          no: approve
        no: amount <= 12714.5?
          yes: decline
          no: approve
                             accuracy   cost
    Approving everyone          0.645  1.775
    One tree, depth 3           0.745  1.075
    A forest of 50 trees        0.740  1.200
    Boosting, 100 rounds        0.750  1.130
    The forest, 5 in 6 sure     0.655  0.665
ship:
  dialogue:
    - riya: "Three questions deep, and a rule you could print on the form. Overdrawn, long loan, no savings: decline."
    - riya: "The forest and the booster barely beat it on accuracy. On cost, a careful forest halves the bill."
    - riya: "My first one had a hundred and seventy-seven leaves. Some of them were for one applicant each."
    - paul: "Three questions you can trust beat a hundred you can't."
  shelf: { object: question-board, label: "Riya's loan questions, three deep" }
  cards: [decision-trees, ensembles]
stretch:
  - id: entropy
    title: "Entropy instead"
    prompt: |
      Write `entropy(y)`, the sum of `-p * log2(p)` over each label's share `p`, and grow the tree with it in place of Gini. Does it ask the same three questions?
  - id: cheapest-threshold
    title: "The cheapest threshold"
    prompt: |
      Try forest shares of 0.5, 0.6, 0.7, 0.8 and 0.9 as the approval threshold, and print the cost of each on the validation applicants, not the test ones. Choose the cheapest, then report its cost on the test applicants once.
  - id: who-gets-turned-down
    title: "Who gets turned down"
    prompt: |
      The original data also records each applicant's sex and age. With the forest made sure, compare the share of good applicants declined under 25 and over 25. Is the rule fairer to one group than the other? The Model Evaluation Clinic comes back to this.
