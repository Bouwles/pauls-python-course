summary: "Before a model gives away anyone's place at Neil's stargazing nights, a clinic: the column that knows the answer, preprocessing kept inside the folds, four models compared by cross-validation and a grid search, one look in the bottom drawer, and who the model is wrong about."
concepts_introduced: [pipelines, cross-validation, grid-search, data-leakage, model-bias]
concepts_reviewed: [scikit-learn, train-test-split, feature-scaling, logistic-regression, knn, decision-trees, ensembles, classification-metrics, overfitting, numpy-arrays, inheritance, super, sets, dictionaries, dict-set-comprehensions, functions, main-guard, docstrings, f-strings]
ask:
  dialogue:
    - neil.pleased.wave: "Stargazing nights on the roof terrace. Twelve telescope slots, always booked, always somebody who doesn't come."
    - neil.worried: "The space station goes over, and someone on the waiting list misses it. Yahya's built a model."
    - yahya.proud: "Ninety-eight per cent. Beat that."
    - paul.thinking.point: "First we see what it's using, which model deserves the job, and who it's wrong about. Before anyone loses a place."
  spec: |
    Two seasons of stargazing bookings are in `bookings.csv`. This season's are locked in the bottom drawer, `drawer.csv`. Each booking says how many days ahead it was made, the size of the party, the cloud forecast on the day, whether it was a first visit, whether the visitor lives outside the city, whether they signed the visitors' book on the night, and whether they came.

    In `clinic.py`, examine the model before it gives anyone's slot away:

    1. Find any column that knows the answer by scoring each one alone, and drop it.
    2. On what's left, find the best number of neighbours for k-NN by grid search, then cross-validate logistic regression, k-NN, a decision tree and a random forest, with the scaling inside a pipeline wherever there is scaling. Choose the best.
    3. Fit it on every booking, open the drawer once, and score it beside always guessing the commonest answer.
    4. Report the accuracy for city visitors and those from outside separately, with the share of those who came who would have lost their slot.
  example: |
    Each column alone:
    days_ahead   0.68
    party        0.60
    cloud        0.67
    first_visit  0.60
    signed_book  0.98
    Dropped: signed_book
    Best number of neighbours: 5
    logistic     0.736
    neighbours   0.764
    tree         0.750
    forest       0.778
    Chosen: forest
    Bottom drawer accuracy: 0.77
    Always guessing the commonest: 0.71
    city     accuracy 0.85, slot given away 0.09
    outside  accuracy 0.35, slot given away 0.64
ship:
  dialogue:
    - neil.surprised: "Visitors from outside the city book a month ahead, for the train. Locals who book that far ahead forget."
    - neil.worried: "It only learnt the locals. It would have given away two in three of the others' places. The ones who came."
    - paul.neutral: "It can't know about the train. Nobody told it."
    - neil.pleased.thumbs: "Then nobody's slot goes on its say-so. I'm adding a question about travel to the booking form."
  shelf: { object: visitors-book, label: "Neil's stargazing clinic" }
  cards: [pipelines, cross-validation, grid-search, data-leakage, model-bias]
stretch:
  - id: fold-spread
    title: "Ahead by more than the wobble?"
    prompt: |
      Print each model's five fold scores as well as the mean, and their standard deviation. Is the forest ahead of k-NN by more than the folds disagree with each other? Try `cv=10` too.
  - id: island-feature
    title: "Where someone lives"
    prompt: |
      Add the outside column to the model's columns and run the clinic again. Does the gap between the groups close? Is it fair to decide someone's slot by where they live? Write down, in three sentences, what you'd tell Neil.
  - id: leaky-drawer
    title: "Brilliant on the drawer"
    prompt: |
      Leave `signed_book` in and score the drawer. Why does the leaky model still look brilliant there, and why does that tell you nothing about next week's bookings?
