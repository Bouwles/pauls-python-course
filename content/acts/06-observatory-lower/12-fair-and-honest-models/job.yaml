id: fair-and-honest-models
title: "Model Evaluation Clinic"
project_name: "Model Evaluation Clinic"
portfolio_readme: |
  # Model Evaluation Clinic

  Examines a model before it is trusted with a decision that matters: here, which booked visitors to Neil's stargazing nights on the Clocktower's roof will turn up, so that empty telescope slots can go to the waiting list. The clinic finds the column that leaks the answer and drops it, keeps the scaling inside every fold with scikit-learn pipelines, compares four models fairly by cross-validation with a grid search for one of them, tests the chosen model once on a season it never saw, and then asks who it is wrong about.

  Written by {name} for Neil, at Paul's Python Course. Finished {date}.

  ## Run it

  ```
  pip install numpy scikit-learn
  python clinic.py
  ```

  ```
  Each column alone:
  days_ahead   0.68
  party        0.60
  cloud        0.67
  first_visit  0.60
  signed_book  0.98
  Dropped: signed_book
  Best number of neighbours: 5
  logistic     0.736
  neighbours   0.764
  tree         0.750
  forest       0.778
  Chosen: forest
  Bottom drawer accuracy: 0.77
  Always guessing the commonest: 0.71
  city     accuracy 0.85, slot given away 0.09
  outside  accuracy 0.35, slot given away 0.64
  ```

  ## What it shows

  - Finding data leakage: a column that is only known after the event scores almost perfectly on its own
  - Pipelines, so preprocessing is refitted inside every cross-validation fold
  - Cross-validation and grid search to compare and tune models without touching the test data
  - One honest test against a baseline, then a fairness audit: accuracy and the costly mistake, group by group

  ## Data

  The bookings are invented, deliberately: a planted leak (`signed_book`, filled in on the night) and a group the model can't see the reason for (visitors from outside the city, who book far ahead because of the train) need data where the truth is known. `saturdays.csv` and `dials.csv`, used by Paul's example and the fix-it step, are invented too.
