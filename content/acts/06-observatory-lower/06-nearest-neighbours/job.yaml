id: nearest-neighbours
title: "Iris and Penguins Classifier"
project_name: "Iris and Penguins Classifier"
portfolio_readme: |
  # Iris and Penguins Classifier

  Names the species of a penguin or an iris from its measurements, with k nearest neighbours written from scratch in NumPy. It finds the animals or flowers most like the new one and lets them vote: the way exemplar theory in psychology says people name things, by the remembered examples most like them. The number of neighbours, k, is chosen honestly: a fifth of the data locked away for testing, a validation pile to choose k on, and the test pile opened once. The same code runs on both datasets.

  Written by {name} for Aaesha, at Paul's Python Course. Finished {date}.

  ## Run it

  ```
  pip install numpy
  python classifier.py
  ```

  ```
  penguins.csv: 342 rows, flipper_length, body_mass, 3 species
   k  training  validation
   1     0.966       0.721
   3     0.879       0.779
   5     0.854       0.838
   7     0.830       0.838
   9     0.796       0.868
  11     0.796       0.853
  15     0.796       0.853
  21     0.791       0.809
  Chosen k: 9
  Test accuracy: 0.81
  New: Gentoo, like 8 of the 9 nearest
  ```

  Change `DATASET` to `"iris.csv"` and `MEASUREMENTS` to the four iris columns to classify irises instead. With all four penguin measurements, bills included, it gets nearly every test penguin right.

  ## What it shows

  - A classifier that learns no weights: distances to every known example, the k nearest, and a vote
  - Euclidean and Manhattan distance on whole arrays, and why every measurement must be scaled first
  - Choosing k on a validation set, why k = 1 looks perfect on training data, and one honest test
  - Code written once and run on two datasets

  ## Data

  `penguins.csv`: the Palmer Archipelago penguins (Gorman, Williams and Fraser, 2014, Palmer Station LTER), from the palmerpenguins package by Horst, Hill and Gorman, released under CC0. The two penguins with no measurements are left out. `iris.csv`: Fisher's irises (1936) from the UCI Machine Learning Repository, licensed CC BY 4.0.
downloadable: true
datasets:
  - name: "Palmer Archipelago penguins (palmerpenguins)"
    source: "https://allisonhorst.github.io/palmerpenguins/"
    licence: "CC0 1.0 (public domain)"
    file: "penguins.csv"
    notes: "From inst/extdata/penguins.csv in the palmerpenguins repository (344 penguins). Dropped the 2 with no measurements; kept and renamed bill_length_mm, bill_depth_mm, flipper_length_mm and body_mass_g as bill_length, bill_depth, flipper_length (whole mm) and body_mass (whole g), and species; numbered from 1 in the original order."
  - name: "Iris"
    source: "https://archive.ics.uci.edu/dataset/53/iris"
    licence: "CC BY 4.0"
    file: "iris.csv"
    notes: "From bezdekIris.data, the corrected copy UCI supplies (150 flowers). Added column names and a flower number, and dropped the Iris- prefix from the species."
client: aaesha
building: observatory
estimated_minutes: 75
summary: "Name a penguin's species from its measurements, and an iris's with the same code, the way people are thought to name things: by the remembered examples most like it. k nearest neighbours from scratch, with k chosen on validation and tested once."
concepts_introduced: [knn]
concepts_reviewed: [feature-scaling, train-test-split, overfitting, classification-metrics, numpy-arrays, vectorisation, broadcasting, vectors, imports, csv-module, functions, default-arguments, multiple-returns, main-guard, docstrings, f-strings]
ask:
  dialogue:
    - aaesha.neutral.wave: "How do you name a bird you've never seen? One theory: you remember the ones most like it, and ask them."
    - aaesha.thinking.point: "In code, that's k nearest neighbours. We'll try it on three kinds of penguin, and Fisher's irises."
    - riya.pleased: "Done it. One nearest penguin. Ninety-seven per cent on the penguins it learnt from."
    - aaesha.unimpressed: "Every penguin it learnt from is its own nearest penguin."
    - riya.worried: "So it was remembering, not naming. That's why it felt suspicious."
  spec: |
    `penguins.csv` holds 342 real penguins of three species from Palmer Station in Antarctica, Adelie, Chinstrap and Gentoo, with bill length and depth, flipper length and body mass. `iris.csv` holds Fisher's 150 irises of three species, with four measurements each.

    In `classifier.py`, name the species with k nearest neighbours, from scratch:

    1. Load the `MEASUREMENTS` columns of `DATASET`. Lock a fifth of the rows away for testing, and split the rest into training and validation.
    2. Scale every measurement with the training rows' ruler.
    3. For each k, score the vote of the k nearest training rows, on the training rows and on the validation rows. Choose the k that does best on validation.
    4. Open the test rows once. Then name the species of `NEW`.

    It starts with the penguins, by flipper length and body mass. The same code must work on the irises.
  example: |
    penguins.csv: 342 rows, flipper_length, body_mass, 3 species
     k  training  validation
     1     0.966       0.721
     3     0.879       0.779
     5     0.854       0.838
     7     0.830       0.838
     9     0.796       0.868
    11     0.796       0.853
    15     0.796       0.853
    21     0.791       0.809
    Chosen k: 9
    Test accuracy: 0.81
    New: Gentoo, like 8 of the 9 nearest
ship:
  dialogue:
    - aaesha.pleased: "Gentoo, like eight of the nine nearest. One memory is a rumour. Nine is a fair sample."
    - aaesha.proud.point: "And the irises, with not a line changed. Nine in ten of the ones it never saw."
    - riya.laughing: "Mine was right about nearly every penguin it had already seen. That isn't naming. That's remembering."
    - paul.pleased.thumbs: "Now you've said it out loud, you'll remember that too."
  shelf: { object: pin-map, label: "Aaesha's penguin and iris classifier" }
  cards: [knn]
stretch:
  - id: bills-back
    title: "Put the bills back"
    prompt: |
      Set `MEASUREMENTS` to all four penguin columns, bills included, and run it again. What happens to the validation column, and to the k it chooses? Why does k matter so much less when the species sit far apart?
  - id: manhattan
    title: "Walking the streets"
    prompt: |
      Run the validation table again with `metric="manhattan"`. Does it choose a different k? Does it do better on the test penguins, and would it be fair to switch now that you've looked?
  - id: closer-counts-more
    title: "Nearer neighbours count more"
    prompt: |
      Give each neighbour a vote worth `1 / (distance + 0.01)` instead of 1, so the nearest animals count most. Write `weighted_vote(labels, distances)` and compare its validation curve with the plain vote's. What happens at k = 21 now?
