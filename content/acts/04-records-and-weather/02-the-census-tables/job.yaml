id: the-census-tables
title: "The Census Tables"
client: ashby
building: records-office
estimated_minutes: 70
summary: "Ninety years of Saltmarsh census in one pandas table, and the council's questions answered in a line each."
concepts_introduced: [pandas-basics, selecting-filtering]
concepts_reviewed: [numpy-arrays, vectorisation, csv-module, functions, return-values, comparisons, boolean-operators, main-guard, docstrings, sorted-vs-sort]
ask:
  dialogue:
    - ashby: "The census. Penhallow typed up one in three, from 1921 to 2011."
    - ashby: "Not every household. A tenth of them, and anyone she found interesting."
    - ashby: "The council asks the same things every time. How many on the Hill. Who fished."
    - moss: "A table with names on its columns. That's what pandas is for."
  spec: |
    `census.csv` has one row per person: `year`, `parish`, `household`, `name`, `relation`, `age` and `occupation`. The years are 1921, 1951, 1981 and 2011.

    Write five functions. Each takes the whole census as a DataFrame, and leaves it as it was.

    - `census_year(census, year)`: every row from that year, as a DataFrame.
    - `parish_count(census, year, parish)`: how many people lived in that parish that year.
    - `trade(census, year, occupation)`: a DataFrame of the `name`, `parish` and `age` of everyone in that occupation that year, oldest first.
    - `oldest(census, year)`: the name of the oldest person that year.
    - `parish_sizes(census, year)`: a Series of how many people lived in each parish that year, largest first.

    The report at the bottom of the file is written for you.
  example: |
    Census of 1951: 98 people
    By parish: Harbour 35, High Street 31, Hill 18, Marsh 14
    On the Hill: 18
    Fishermen: 6
    Oldest of all: Walter Rook
ship:
  dialogue:
    - ashby: "Thirty-five at the harbour in 1951. Eighteen in 2011. I knew that. I'd just never counted."
    - ashby: "Oldest in 2011: Moss, aged 121."
    - moss: "The enumerator rounded up. I was 120."
    - ashby: "Hollis, baker, in every census since 1921. Bea will want a copy."
  shelf: { object: census-ledger, label: "The Saltmarsh census, in one table" }
  cards: [pandas-basics, selecting-filtering]
stretch:
  - id: share-under
    title: "How young was the town"
    prompt: |
      Write `share_under(census, year, age)`. It returns the share of that year's people who were younger than `age`, as a number between 0 and 1. `share_under(census, 1921, 16)` is about 0.41.

      `True` counts as 1 and `False` as 0, so the `mean()` of a column of `True` and `False` is the share that are `True`.
    tests: tests/stretch-share-under.py
    solution: solutions/stretch-share-under.py
  - id: still-here
    title: "Still here"
    prompt: |
      Who is in the 1981 census and the 2011 one too? `column.isin(other_column)` gives `True` for each value that also appears in the other. Print their names. There are three, and one of them won't be a surprise.
