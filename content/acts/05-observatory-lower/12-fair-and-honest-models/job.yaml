id: fair-and-honest-models
title: "Fair and Honest Models"
client: wendt
building: observatory
estimated_minutes: 60
summary: "Before a model gives away anyone's place at the open nights, an audit: the column that knows the answer, preprocessing kept inside the folds, one look in the bottom drawer, and who the model is wrong about."
concepts_introduced: [data-leakage, model-bias]
concepts_reviewed: [cross-validation, pipelines, train-test-split, scikit-learn, feature-scaling, logistic-regression, classification-metrics, overfitting, numpy-arrays, sets, dictionaries, functions, main-guard, docstrings, f-strings]
ask:
  dialogue:
    - wendt: "Open nights. Twelve telescope slots, always booked, and always somebody who doesn't come."
    - wendt: "I'd like a model to say whose slot to offer the waiting list. Pip has built one."
    - pip: "Ninety-eight per cent. I'd like that on a certificate."
    - moss: "First we see what it's using, and who it's wrong about. Before anyone loses a seat."
  spec: |
    Two seasons of open-night bookings are in `bookings.csv`. This season's are locked in the bottom drawer, `drawer.csv`. Each booking says how many days ahead it was made, the size of the party, the cloud forecast on the day, whether it was a first visit, whether the visitor lives on the island across the water, whether they signed the visitors' book on the night, and whether they came.

    In `audit.py`, audit a model before it gives anyone's slot away:

    1. Find any column that knows the answer by scoring each one alone, and drop it.
    2. Cross-validate an honest model on what's left, with the scaling inside a pipeline.
    3. Open the drawer once, and score the model on this season's bookings.
    4. Report the accuracy for island and town visitors separately, with the share of those who came who would have lost their slot.
  example: |
    Each column alone:
    days_ahead   0.68
    party        0.60
    cloud        0.67
    first_visit  0.60
    signed_book  0.98
    Dropped: signed_book
    Cross-validated accuracy: 0.74
    Bottom drawer accuracy: 0.79
    island   accuracy 0.48, slot given away 0.57
    town     accuracy 0.84, slot given away 0.02
ship:
  dialogue:
    - wendt: "Islanders book a month ahead, for the ferry. Townsfolk who book that far ahead forget. It only learned the town."
    - wendt: "So it would have given away more than half the islanders' places. The ones who came."
    - moss: "It can't know about the ferry. Nobody told it."
    - wendt: "Then nobody's slot goes on its say-so. I'm putting the ferry times on the booking form."
  shelf: { object: visitors-book, label: "Wendt's open-night audit" }
  cards: [data-leakage, model-bias]
story_note: the-kettle
stretch:
  - id: island-feature
    title: "Where someone lives"
    prompt: |
      Add the island column to the model's columns and audit again. Does the gap between the groups close? Is it fair to decide someone's slot by where they live? Write down, in three sentences, what you'd tell Professor Wendt.
  - id: leaky-drawer
    title: "Brilliant on the drawer"
    prompt: |
      Leave `signed_book` in and score the drawer. Why does the leaky model still look brilliant there, and why does that tell you nothing about next week's bookings?
