id: drawing-the-best-line
title: "Drawing the Best Line"
client: wendt
building: observatory
estimated_minutes: 90
summary: "Penhallow's focus readings, and the best straight line through them, found twice: by formula and on foot."
concepts_introduced: [linear-regression, mean-squared-error, gradient-descent]
concepts_reviewed: [numpy-arrays, vectorisation, broadcasting, derivatives, numerical-gradients, functions, return-values, multiple-returns, main-guard, docstrings, for-loops, lists, f-strings]
ask:
  dialogue:
    - wendt: "The telescope drifts out of focus as the night cools. The tube shrinks. Brass does that."
    - wendt: "Penhallow wrote down the sharp focus against the temperature. Thirty nights, and then she stopped."
    - wendt: "I want a line through them. No, not a line. The best line."
    - moss: "Best by what measure?"
    - wendt: "That is exactly the question. Come upstairs."
  spec: |
    Penhallow's readings are in `focus.csv`: the night, the temperature in degrees, and the focus in millimetres that gave a sharp image.

    In `line.py`, fit the line `focus = w * temperature + b` two ways:

    1. By formula: the `w` and `b` with the smallest mean squared error.
    2. By gradient descent: start at `w = 0`, `b = 0` and walk downhill on the mean squared error.

    Both should find the same line. Then give the focus setting for tonight's temperature.
  example: |
    By formula: focus = -0.1211 * temperature + 42.318
    By descent: focus = -0.1211 * temperature + 42.318
    Mean squared error: 0.0026
    At 4.0 degrees, set the focus to 41.83 mm.
ship:
  dialogue:
    - wendt: "Four degrees tonight. I set it to 41.83 before I looked, and it was sharp."
    - wendt: "Two lines that are the same line. Penhallow would have liked that. I think."
    - moss: "Measured twice, then. Once by formula, once on foot."
  shelf: { object: focus-knob, label: "Wendt's focus line" }
  cards: [linear-regression, mean-squared-error, gradient-descent]
story_note: the-machine-never-asks
stretch:
  - id: walk-one-setting
    title: "Watch the slope alone"
    prompt: |
      Fix `b` at the formula's value and walk `w` on its own, from 0, calling `show_hill(w, loss, curve=loss_at)` once a step, where `loss_at(w)` is the mean squared error with that `w` and the fixed `b`. Find the largest rate that still walks down, then one that overshoots.
  - id: loss-curve
    title: "Draw the losses"
    prompt: |
      Plot the `losses` from `gradient_descent` with matplotlib, step along the bottom and loss up the side. Try rates of 0.005, 0.01 and 0.015 on one chart. Then try 0.02, on a chart of its own.
