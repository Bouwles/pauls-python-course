id: grouping-stars
title: "Grouping Stars"
client: wendt
building: observatory
estimated_minutes: 70
summary: "Three hundred stars on one of Penhallow's plates, sorted into clusters by k-means written from scratch, with k chosen at the elbow and checked against scikit-learn."
concepts_introduced: [k-means]
concepts_reviewed: [scikit-learn, numpy-arrays, broadcasting, vectorisation, random-module, lambda, while-loops, list-comprehensions, zip, dictionaries, functions, multiple-returns, main-guard, docstrings, f-strings]
ask:
  dialogue:
    - wendt: "Penhallow photographed this patch of sky every clear night for a year. Three hundred stars on one plate."
    - wendt: "They clump. Clusters, born together, drifting together. How many, and which star is in which?"
    - moss: "Nobody's marked which is which?"
    - wendt: "Nobody knows. That's rather the point."
  spec: |
    Penhallow's plate is in `plate.csv`: 300 stars, each as x and y in millimetres from the plate's corner. Nobody has labelled them.

    In `stars.py`, sort the stars into groups with k-means, written from scratch:

    1. Start from k different stars, picked at random with a seeded generator.
    2. Assign every star to its nearest centre, move every centre to the middle of its stars, and repeat until no star changes group.
    3. Run it from several starts and keep the tightest result.
    4. Do that for every k from 1 to 8, choose k at the elbow, and check your answer against scikit-learn's `KMeans`.
  example: |
    k   inertia
    1    315185
    2    149668
    3     65315
    4     17008
    ...
    Chosen k: 4
    Stars in each group: 95, 80, 70, 55
    scikit-learn agrees: True
ship:
  dialogue:
    - wendt: "Four. I counted them by eye last winter and got five. The fifth was a thumbprint."
    - wendt: "The biggest has ninety-five stars. I'm naming it after Nell. She'll pretend not to be pleased."
    - moss: "It found the groups. It never said what they were. That part's still yours."
  shelf: { object: star-plate, label: "Penhallow's plate, sorted into four clusters" }
  cards: [k-means]
story_note: the-fourth-pile
stretch:
  - id: careful-starts
    title: "Starts that spread out"
    prompt: |
      Pick the first centre at random, then each next one with a chance in proportion to its squared distance from the nearest centre picked so far: `rng.choice(len(points), p=chances)`, where `chances` adds up to 1. This is called k-means++. How many tries does it need to find the best inertia for k = 4, against plain random starts?
  - id: squashed-plate
    title: "A squashed plate"
    prompt: |
      Measure y in tenths of a millimetre instead: multiply every y by 10. Does k-means still find the same four clusters? Work out why not, and mend it with something from Many Features.
