id: nearest-neighbours
title: "Nearest Neighbours"
client: wendt
building: observatory
estimated_minutes: 60
summary: "Tonight's sky, forecast from the nights in Penhallow's notebook most like it: k nearest neighbours, from scratch."
concepts_introduced: [knn]
concepts_reviewed: [feature-scaling, train-test-split, overfitting, classification-metrics, numpy-arrays, vectorisation, broadcasting, vectors, imports, csv-module, functions, default-arguments, multiple-returns, main-guard, docstrings, f-strings]
ask:
  dialogue:
    - wendt: "Penhallow had a trick. Find the nights most like tonight, and see what the sky did then."
    - wendt: "Clear, cloud or fog. Fog matters most. I can't see through it, and neither can the boats."
    - pip: "Done it. I use the one nearest night. It got every night in the notebook right."
    - moss: "Every night in the notebook is its own nearest night."
    - pip: "Oh."
  spec: |
    Penhallow's notebook is in `evenings.csv`: 240 evenings of humidity (%), the spread between the air temperature and the dew point (degrees), wind (knots) and pressure (hPa), each with what the sky did by midnight: `clear`, `cloud` or `fog`.

    In `nights.py`, forecast tonight's sky from the nights most like it, with k nearest neighbours, from scratch:

    1. Lock a fifth of the evenings away for testing, and split the rest into training and validation.
    2. Scale every reading with the training evenings' ruler.
    3. For each k, score the vote of the k nearest training nights, on the training evenings and on the validation evenings. Choose the k that does best on validation.
    4. Open the test evenings once. Then forecast tonight.
  example: |2
     k  training  validation
     1     1.000       0.792
     3     0.889       0.771
    ...
    21     0.833       0.833
    Chosen k: 9
    Test accuracy: 0.77
    Tonight: fog, like 6 of the 9 nearest nights
ship:
  dialogue:
    - wendt: "Fog, it said, like six of the nine nearest nights. By ten I couldn't see the sea wall."
    - wendt: "Nine neighbours, not one. One is a rumour. Nine is a consensus. Well, a small committee."
    - pip: "Mine was right about every night it had already seen. That isn't forecasting. That's remembering."
    - moss: "Now you've said it out loud, you'll remember that too."
  shelf: { object: pin-map, label: "Wendt's book of nights like tonight" }
  cards: [knn]
stretch:
  - id: manhattan
    title: "Walking the streets"
    prompt: |
      Run the validation table again with `metric="manhattan"`. Does it choose a different k? Does it do better on the test evenings, and would it be fair to switch now that you've looked?
  - id: closer-counts-more
    title: "Nearer neighbours count more"
    prompt: |
      Give each neighbour a vote worth `1 / (distance + 0.01)` instead of 1, so the nearest nights count most. Write `weighted_vote(labels, distances)` and compare its validation curve with the plain vote's. What happens at k = 21 now?
