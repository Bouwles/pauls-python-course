id: forests-and-boosting
title: "Forests and Boosting"
client: wendt
building: observatory
estimated_minutes: 70
summary: "Tonight's seeing, forecast by a committee: a random forest of deep trees, then gradient boosting with small ones, against one tree alone."
concepts_introduced: [ensembles]
concepts_reviewed: [decision-trees, overfitting, train-test-split, mean-squared-error, random-module, numpy-arrays, vectorisation, dictionaries, imports, functions, multiple-returns, main-guard, docstrings, f-strings]
ask:
  dialogue:
    - wendt: "Seeing: how far the air smears a star. Under one arcsecond is a gift. Over two, I go to bed."
    - wendt: "Penhallow logged it for 240 nights. In the margin she wrote: ask the whole forest."
    - pip: "I've boosted mine already. Rate one, deep trees. Training error: nought. Actually nought."
    - moss: "You said nought about Tuesday, too."
  spec: |
    Penhallow's seeing log is in `seeing.csv`: 240 nights of wind (knots), how much warmer the mirror was than the air (degrees), humidity (%) and the jet stream overhead (knots), each with the seeing in arcseconds. Smaller is sharper.

    Moss's regression tree is in `tree.py`: the question tree from the last job, with numbers in its leaves. In `forest.py`, build two ensembles from scratch with it, and test them against one deep tree:

    1. A random forest: many deep trees, each grown on a bootstrap sample of the nights and allowed two random readings per question, their answers averaged.
    2. Gradient boosting: start from the mean, then add small trees one at a time, each fitted to what the trees so far still get wrong, a tenth of it at a time.
  example: |
    Test error, in arcseconds squared:
    Guessing the mean      0.611
    One deep tree          0.191
    A forest of 50 trees   0.113
    Boosting, 100 rounds   0.082
ship:
  dialogue:
    - wendt: "Fifty trees that each overfit, and together they don't. I thought she meant a walk."
    - wendt: "Boosting wins, on nights it never saw. The forest can be the second opinion. Every observatory needs one."
    - pip: "Mine got nought on training and 0.207 on test. Worse than one tree, with extra steps."
    - moss: "A little at a time. That's the whole of boosting, and most of carpentry."
  shelf: { object: pinecone, label: "Wendt's seeing forecast, by committee" }
  cards: [ensembles]
stretch:
  - id: pips-settings
    title: "Pip's boosting"
    prompt: |
      Boost with Pip's settings, a rate of 1.0 and trees of depth 4, and print the training and test error after 10, 100 and 300 rounds. Then do the same at a rate of 0.1 and depth 2. Which one stops getting better on the test nights, and when?
  - id: how-many-trees
    title: "How many trees is enough?"
    prompt: |
      Plot the forest's test error against the number of trees, from 1 to 100, with matplotlib, and the boosting test error against the number of rounds on a second chart. Which one gets worse if you keep going?
