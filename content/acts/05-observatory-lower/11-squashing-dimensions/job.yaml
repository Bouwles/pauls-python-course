id: squashing-dimensions
title: "Squashing Dimensions"
client: wendt
building: observatory
estimated_minutes: 80
summary: "Twelve filter readings for each of two hundred stars, squashed to the two that matter by principal component analysis written from scratch, and checked against numpy's SVD."
concepts_introduced: [pca, eigenvectors]
concepts_reviewed: [matrices, vectors, numpy-arrays, broadcasting, vectorisation, k-means, matplotlib, functions, multiple-returns, main-guard, docstrings, f-strings]
ask:
  dialogue:
    - wendt: "Penhallow measured every star through twelve coloured filters. Twelve numbers a star."
    - wendt: "I can draw two numbers. Three, at a push, with a pencil in each hand. Not twelve."
    - moss: "Then find the two that matter."
    - wendt: "Without throwing the rest away. That's the trick."
  spec: |
    Penhallow's filter book is in `filters.csv`: 200 stars, each with its brightness through twelve filters, from blue (400 nm) to red (730 nm), as magnitudes.

    In `filters.py`, write principal component analysis from scratch:

    1. Centre the readings and work out their covariance matrix.
    2. Find its eigenvectors, the principal components, biggest variance first, and how much of the spread each explains.
    3. Squash every star onto the first two components, then rebuild all twelve readings from those two and measure what was lost.
    4. Check your variances against numpy's singular value decomposition.
  example: |
    component  explained  total
        1        0.854    0.854
        2        0.145    0.999
        3        0.001    0.999
        4        0.000    0.999
    Components for 99%: 2
    Squashed: (200, 12) to (200, 2)
    Rebuilt from 2, mean squared error: 0.0021
    The SVD agrees: True
ship:
  dialogue:
    - wendt: "The first component is brightness: all twelve filters at once. The second is colour, blue against red."
    - wendt: "Two hundred stars on one sheet of paper, and they lie in three bands. Blue, yellow, red. I'd no idea."
    - moss: "Twelve readings, two that matter, and you can say what they are. That's a fair trade."
  shelf: { object: filter-wheel, label: "Penhallow's filter book, two numbers a star" }
  cards: [pca, eigenvectors]
story_note: its-own-two
stretch:
  - id: three-bands
    title: "Three bands"
    prompt: |
      Plot the 200 stars on their first two components with matplotlib. Then sort the two numbers into groups with your k-means from Grouping Stars, colour the dots by group, and print how many stars are in each band.
  - id: by-svd
    title: "The components by SVD"
    prompt: |
      `np.linalg.svd(centred)` returns three things; the rows of the third are the principal components, biggest first. Check they match yours, allowing for each one pointing either way.
