id: university-readiness
title: "University Readiness"
client: moss
building: lighthouse
estimated_minutes: 150
timed_minutes: 150
summary: "A timed paper of six first-year problems from Acts I to III, then practice at explaining your own work out loud."
concepts_introduced: [binary-search-answer]
concepts_reviewed: [lists, append-pop, enumerate, dictionaries, dict-get, none, membership-speed, big-o, sort-key, sort-stability, sorted-vs-sort, tuples, binary-search, edge-cases, test-first, assert, stacks, recursion, base-cases, call-stack]
ask:
  dialogue:
    - moss: "Universities ask two things of you. So do interviews. The same two, as it happens."
    - moss: "Solve something you've never seen, against a clock. Then explain something you built, clearly."
    - pip: "I'll do the questions in order. Quickest way through."
    - moss: "Read them all first. Then we'll talk about quickest."
  spec: |
    Two parts, and a clock in the top bar that counts your time against 150 minutes. Nothing happens when it runs out.

    **The paper.** Six questions from the harbour front to the scrapyard, at the level of a first-year exam. Each is one function in its own file, checked by hidden tests: empty input, one item, duplicates, and inputs big enough that a slow answer runs out of time.

    1. `first_error(text)`: the first bracket that doesn't match.
    2. `winner(ballots)`: the most votes, with a fair tie-break.
    3. `round_order(parcels)`: Mira's post round, sorted three ways at once.
    4. `count_pairs(prices, target)`: a slow function, made fast.
    5. `bank_sizes(chart)`: the sandbanks on Captain Ferro's chart.
    6. `smallest_limit(crates, days)`: the lightest load limit that gets Nell's crates across in time.

    **The interview.** Three questions about work you've shipped, each with Moss's own answer to set beside yours. Then a practice interview, out loud, against Moss's list.
  example: |
    >>> first_error("[lamp(on]")
    8
    >>> winner(["Gull", "Tern", "Gull"])
    'Gull'
    >>> smallest_limit([4, 8, 3, 5, 6], 3)
    11
ship:
  dialogue:
    - moss: "Six answers that hold, and you can say what you built and why. That's what they're checking for."
    - pip: "I read them all first, in the end. Did the fourth one first. Don't tell anyone."
    - moss: "Nobody asks what order you did them in. Only whether they're right."
  shelf: { object: exam-paper, label: "Moss's practice paper, sat and explained" }
  cards: [binary-search-answer]
stretch:
  - id: arrangements
    title: "Every arrangement"
    prompt: |
      A seventh question, the kind that turns up on the back page. Write `arrangements(word)`: every different ordering of its letters, alphabetical, each once. `arrangements("tea")` has six; `arrangements("sees")` has six as well, not twenty-four. Do it recursively, without `itertools`: put each different letter at the front in turn, then arrange what's left.
  - id: a-week-later
    title: "The same paper, a week later"
    prompt: |
      In a week, open an empty file and do question 5 again, with fifteen minutes on your own clock. The second attempt shows the difference between what you learned and what you only recognised.
