id: the-tiny-engine
title: "Tiny Autograd Engine"
project_name: "Tiny Autograd Engine"
portfolio_readme: |
  # Tiny Autograd Engine

  A small automatic differentiation engine in plain Python, in the style of micrograd. Every `Value` remembers the values it was made from and how, so one call to `backward()` works out the gradient of a result with respect to everything that went into it. That is one answer to the credit assignment problem, which every learning brain has too: when the answer is wrong, how much is each part to blame? A sigmoid neuron built on the engine then learns from a log of 24 nights, with no backward pass written by hand.

  Written by {name} for Aaesha, at Paul's Python Course. Finished {date}.

  ## Run it

  ```
  python neuron.py
  ```

  ```
  Loss: 0.2500 at the start, 0.0476 at the end
  Agrees with 24 of 24 nights
  Tonight: 0.90, go ahead
  ```

  `engine.py` is the engine on its own: `+`, `*`, `**`, `exp` and `relu`, each with the rule that passes blame back to its parents, and `backward()`, which puts the graph in order and walks it from the answer back. `drawing.py` draws the graph with every gradient on it, but only in the browser workshop it was written in.

  ## What it shows

  - Reverse-mode automatic differentiation: a computation graph built as the numbers are worked out, then a topological sort and the chain rule applied backwards
  - Operator overloading with dunder methods, closures that remember how to pass gradients back, and why gradients are added rather than overwritten
  - Gradients checked against numerical ones, and a neuron trained by gradient descent on top of the engine

  ## Data

  `nights.csv` is invented for the project: 24 nights of cloud, humidity and moon, each scaled from 0 to 1, and whether the stargazing night on the roof went ahead.
downloadable: true
datasets: []
client: aaesha
building: observatory
estimated_minutes: 120
summary: "A micrograd-style autograd engine: numbers that remember how they were made, so one backward() shares out the blame for a mistake, the puzzle every learning brain has to solve. Drawn as a graph, then a neuron that trains on it."
concepts_introduced: [autograd]
concepts_reviewed: [backpropagation, numerical-gradient-checking, chain-rule, classes, init, self, dunder-methods, closures, functions-as-values, sets, recursion, activation-functions, gradient-descent, mean-squared-error, perceptron]
ask:
  dialogue:
    - aaesha.neutral.wave: "When a network gets an answer wrong, which of its numbers is to blame? Brains have the same puzzle."
    - aaesha.thinking: "Nobody knows yet how a brain shares out the blame. A network can do it mechanically."
    - neil.laughing: "Right now somebody rewrites backward by hand every time. Usually me. Usually wrong."
    - neil.neutral.point: "So picture a shoebox of index cards. One number on each, and on the back, the cards it was made from."
    - aaesha.pleased: "Every number with its receipt. I approve of receipts."
  spec: |
    In `engine.py`, finish `Value`: one number that remembers how it was made. `+` is already written, as the pattern for the rest.

    1. `Value(data)` keeps the number in `.data`, its gradient in `.grad` (starting at 0), the values it was made from in `.parents` (a tuple, empty for a number you typed in) and the operation's name in `.op`.
    2. `a * b`, `a ** 2` (the power is a plain number), `a.exp()` and `a.relu()` each make a new `Value` that records its parents and a `_backward` function: how blame arriving at the new value passes back to each parent. Blame is added to a parent's `.grad`, never written over it. Plain numbers mixed in, as in `2 * a`, work too.
    3. `backward()`: put every value this one was made from in order, each after its parents; set this value's `.grad` to 1; then go through the order backwards, calling each value's `_backward`.

    Then, in `neuron.py`, a neuron built on the engine:

    4. `Neuron(n_inputs)` keeps a list of `Value` weights in `.weights`, one per input, and a `Value` in `.bias`, all starting at 0. `parameters()` gives back the weights, then the bias. Calling the neuron on a night's readings gives the sigmoid of the weighted sum, as a `Value`.
    5. `train(neuron, nights, labels, rate, steps)`: each step, set every gradient to 0, work out the mean squared error over every night, call `backward()`, and move each weight against its gradient. It returns the loss at each step.
    6. Run as a program, it learns the stargazing log and gives tonight's chance.
  example: |
    Loss: 0.2500 at the start, 0.0476 at the end
    Agrees with 24 of 24 nights
    Tonight: 0.90, go ahead
ship:
  dialogue:
    - neil.proud: "Twenty-four nights out of twenty-four, and nobody wrote a backward pass. The cards did."
    - aaesha.pleased.point: "Every number got its fair share of the blame. That's the part brains still keep to themselves."
    - yahya.unimpressed: "Mine was faster."
    - aaesha.laughing: "Yours was wrong faster."
    - yahya.pleased.thumbs: "Fair. The set's back in."
  shelf: { object: shoebox, label: "Aaesha and Neil's shoebox engine" }
  cards: [autograd]
stretch:
  - id: tanh
    title: "One more card"
    prompt: |
      Add `a.tanh()` to `Value`, with its own `_backward`. The slope of tanh at a value is `1 - tanh ** 2`, and `out.data` already holds the tanh. Check it against a measurement at three points, one of them negative. Then build `tanh` again from `exp` alone, `(e ** 2x - 1) / (e ** 2x + 1)`, and check both give the same gradient.
  - id: little-brain
    title: "A network from cards"
    prompt: |
      Build a `Layer` (a list of neurons, each seeing every input) and a two-layer network from it, with ReLU in the hidden layer. Train it on the stairs light from Neural Network from Scratch. Start the weights at small random numbers rather than 0, and work out why the neuron could start at 0 and the network can't.
