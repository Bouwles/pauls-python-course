id: sequences
title: "Tide Predictor"
project_name: "Tide Predictor"
portfolio_readme: |
  # Tide Predictor

  Forecasts a tidal river an hour ahead, and then six hours ahead, with a recurrent neural network run by hand in NumPy. It reads the river gauge one hour at a time, keeps a memory of the hours before in its hidden state, and is scored against the simplest forecast there is: the same as last hour. Then one step of an LSTM, the gated memory that keeps long sequences from fading, named, like much of this, after the way minds remember.

  Written by {name} for Aaesha, at Paul's Python Course. Finished {date}.

  ## Run it

  ```
  pip install numpy
  python rnn.py
  ```

  ```
  One hour ahead, over 287 hours:
    the network is out by 5.8 cm on average
    "same as last hour" is out by 46.7 cm
  Next six hours: 4.01 4.27 4.16 3.72 2.99 2.16
  ```

  `lstm.py` holds the LSTM step; `rnn_weights.json` the trained weights.

  ## What it shows

  - A recurrent step, a hidden state carried from one reading to the next, and a whole sequence run with no peeking ahead
  - Forecasting further ahead by feeding the model its own guesses, and why the error grows
  - An honest baseline for a time series
  - The forget, input and output gates of an LSTM

  ## Data

  `tides.csv` is invented for the project: twelve days of hourly readings from a tidal river's gauge, in metres.
downloadable: true
datasets: []
client: aaesha
building: observatory
estimated_minutes: 120
summary: "A tide forecast from a network with a memory: it reads the river gauge an hour at a time, remembers the hours before, guesses the next, and beats the same-as-last-hour forecast. Then a gate on its memory."
concepts_introduced: [rnns, lstm-gates]
concepts_reviewed: [neural-networks, activation-functions, backpropagation, chain-rule, numpy-arrays, matrices, json-module, mean-squared-error, for-loops, functions, multiple-returns]
ask:
  dialogue:
    - aaesha.neutral.wave: "The river path floods at high tide, and half the class walks it. Requirement: an hour's warning."
    - neil.pleased: "I trained a network that reads one hour at a time and remembers. The weights are in the file."
    - paul.thinking: "Remembers what?"
    - aaesha.pleased: "The hours before. Some of them. How many is what I want to find out."
  spec: |
    In `rnn.py`, run Neil's recurrent network over the river gauge. `load_tides` and `load_weights` are written; readings go in scaled, as `(height - MEAN) / SCALE`, and guesses come out the same way.

    1. `step(x, h, params)`: one hour. The new hidden state is `tanh(x * Wx + h @ Wh + b)`, and the guess at the next reading is `h @ Wy + by`, as a plain float. Returns `(h, guess)`.
    2. `run(xs, params)`: every reading in order, starting from a hidden state of zeros. Returns the hidden states, one row per reading, and the guesses, one per reading, as arrays.
    3. `forecast(xs, params, hours)`: run through every reading, then carry on alone, feeding each guess back in as the next reading. Returns `hours` guesses as an array, the first being the guess after the last reading.
    4. Run as a program, it reports how far out the network is an hour ahead, against "same as last hour", and forecasts the next six hours in metres.
    5. In `lstm.py`, `lstm_step(x, h, c, params)`: one hour of an LSTM, with a forget gate on its memory.
  example: |
    One hour ahead, over 287 hours:
      the network is out by 5.8 cm on average
      "same as last hour" is out by 46.7 cm
    Next six hours: 4.01 4.27 4.16 3.72 2.99 2.16
ship:
  dialogue:
    - aaesha.pleased: "Out by six centimetres an hour ahead. Same as last hour was out by forty-seven."
    - neil.thinking: "Six hours ahead it drifts. By then it's reading its own guesses."
    - caitlin.pleased.thumbs: "One hour is all the path needs. I'll take the one hour."
    - paul.proud: "A short memory, well kept. That'll do for a tide."
  shelf: { object: tide-drum, label: "Aaesha's tide network, remembering" }
  cards: [rnns, lstm-gates]
stretch:
  - id: draw-the-roll
    title: "The roll and the guesses"
    prompt: |
      Plot the last two days of the roll with matplotlib, and the network's one-hour guesses over it in another colour. Then add the six-hour forecast past the end, as a dashed line. Where does the network do worst: at high water, at low water, or in between?
  - id: train-it
    title: "Train it yourself"
    prompt: |
      Write `backward(xs, params)`: backpropagation through time for the tide network, with the mean squared error of each guess against the next reading. Go forward keeping every hidden state, then walk back from the last hour, carrying the blame for `h` from each hour to the one before through `Wh` and the slope of tanh. Check it against a numerical gradient on twelve hours, then train from random weights. Does it get to under six centimetres?
  - id: take-it-home
    title: "An LSTM at home"
    prompt: |
      On your own computer, with PyTorch from PyTorch Fundamentals: train `torch.nn.LSTM(input_size=1, hidden_size=8)` with a `torch.nn.Linear(8, 1)` on top to guess the next reading of the roll. Hold back the last two days, and compare it with Neil's network on those.
