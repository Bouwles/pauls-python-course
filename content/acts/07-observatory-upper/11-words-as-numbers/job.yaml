id: words-as-numbers
title: "Text Generator"
project_name: "Text Generator"
portfolio_readme: |
  # Text Generator

  A character-level language model that writes shipping forecasts. It turns text into numbers with a vocabulary, counts which character follows which, scores itself by perplexity on forecasts it never saw, and writes new ones a character at a time. Then the same model is learnt by gradient descent instead of counting, through an embedding for every character.

  Written by {name} for Caitlin, at Paul's Python Course. Finished {date}.

  ## Run it

  ```
  pip install numpy
  python words.py
  python learn.py
  ```

  ```
  Vocabulary: 39 characters
  Perplexity on forecasts it never saw: 7.05
  Guessing evenly would be 39
  -we rngor. fy d. od. 4 5.
  thes. qsherr. gout ooubesinoord.kk. am d. or windwes. eveck3nars.
  6 hesaiomo mon sherly omorigherough-weshea9-3 goorably norstester. e. orsththor.
  ```

  ## What it shows

  - Tokenisation: a vocabulary, encoding text as ids and decoding it back
  - A bigram language model from counts, with smoothing, and perplexity as an honest score
  - Sampling text from a model with a seeded random generator
  - The same model as a tiny neural network: embeddings, softmax and cross-entropy, learnt by gradient descent

  ## Data

  `forecasts.txt` and `held_back.txt` are invented: shipping forecasts for the made-up sea areas in a sailing game, written in the style of the BBC's.
downloadable: true
datasets: []
client: caitlin
building: observatory
estimated_minutes: 100
summary: "A character-level text generator that writes shipping forecasts: a vocabulary, a model that counts which character follows which, and the same model learnt by gradient descent through embeddings."
concepts_introduced: [tokenisation, embeddings, language-models]
concepts_reviewed: [cross-entropy, neural-networks, backpropagation, gradient-descent, probability, sets, dictionaries, string-methods, files, numpy-arrays, matrices, random-module]
ask:
  dialogue:
    - caitlin.pleased.wave: "My sailing game has a radio. It reads the shipping forecast for the game's sea areas."
    - caitlin.neutral.point: "I wrote thirty forecasts, and kept five back. I want the game to make up its own."
    - neil.thinking: "Then it learns from yours. Thirty is a small library, but it's enough to learn some spelling."
    - yahya.proud: "It'll be writing the forecast by Friday."
    - paul.unimpressed: "It'll be writing something by Friday."
  spec: |
    In `words.py`, turn the forecasts into numbers and build a model that guesses each next character by counting.

    1. `build_vocab(text)`: every character in the text once, sorted.
    2. `encode(text, vocab)`: a list of ids, each character's place in `vocab`; `decode(ids, vocab)` turns them back into text.
    3. `count_pairs(ids, size)`: a `size` by `size` array, where `counts[a, b]` is how often id `b` comes straight after id `a`.
    4. `probabilities(counts, smoothing=0.1)`: add `smoothing` to every count, then divide each row by its total.
    5. `average_nll(probs, ids)`: the average of minus the log of the chance of each real next character. `perplexity(probs, ids)` is e to that.
    6. `sample(probs, start, length, rng)`: `length` ids, each drawn with `rng.choice(len(probs), p=probs[current])` from the row of the id before, starting after `start`.
    7. Run as a program, it scores the held-back forecasts and makes up three of its own.
    8. In `learn.py`, the same model learnt by gradient descent, with an embedding for every character.
  example: |
    Vocabulary: 39 characters
    Perplexity on forecasts it never saw: 7.05
    Guessing evenly would be 39
    -we rngor. fy d. od. 4 5.
    thes. qsherr. gout ooubesinoord.kk. am d. or windwes. eveck3nars.
    6 hesaiomo mon sherly omorigherough-weshea9-3 goorably norstester. e. orsththor.
ship:
  dialogue:
    - caitlin.pleased.cheer: "Perplexity 7.05 on forecasts it never saw. Guessing evenly would be 39."
    - yahya.laughing: "It forecast 'gout ooubesinoord'. I'd still sail in that."
    - neil.thinking: "It knows which letter follows which. One letter back. That's everything it knows."
    - paul.neutral.point: "Then it needs to look further back."
  shelf: { object: type-case, label: "Caitlin's forecasts, as numbers" }
  cards: [tokenisation, embeddings, language-models]
stretch:
  - id: two-back
    title: "Two letters back"
    prompt: |
      Count triples instead of pairs: `counts[a, b, c]`, a `size` by `size` by `size` array, so each guess depends on two characters back. Compare its perplexity on the held-back forecasts with the bigram's, for smoothing of 0.01, 0.1 and 1. Thirty forecasts is not much; what happens to all those triples it has never seen?
  - id: words-not-letters
    title: "Words, not letters"
    prompt: |
      Tokenise the forecasts into words with `text.split()` and build the same counting model over words. Make up a forecast. Then try to score `held_back.txt`: what happens at "river", a word the thirty forecasts never use? Real tokenisers split rare words into common pieces for exactly this reason.
  - id: temperature
    title: "Bolder or more careful"
    prompt: |
      Before sampling, raise each row of `probs` to the power `1 / temperature` and divide by the row's new total. Make up forecasts at temperature 0.5, 1 and 2. Which reads most like a forecast, and why does a low temperature keep saying the same things?
