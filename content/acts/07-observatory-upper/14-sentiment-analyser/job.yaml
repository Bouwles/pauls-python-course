summary: "Yahya wants the story in the words, not just the star rating: what reviewers really think. For or against: 3,000 labelled sentences from film, product and restaurant reviews (Sentiment Labelled Sentences, UCI, CC BY 4.0). Tokenise them, learn word embeddings, and read each sentence with an LSTM, with a NumPy forward pass in the browser and training in PyTorch at home."
