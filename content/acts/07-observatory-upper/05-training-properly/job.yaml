    - neil: "From zeros, forty. Sixteen hidden neurons, every one saying the same thing."
    - caitlin: "Sixteen neurons agreeing. That's a strong result, surely."
    - aaesha: "It's one neuron, sixteen times."
  shelf: { object: pendulum, label: "Yahya's optimiser race, run fairly" }
