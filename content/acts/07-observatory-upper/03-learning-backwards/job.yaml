datasets: []
client: aaesha
building: observatory
estimated_minutes: 180
summary: "A two-layer network in NumPy that learns how Paul makes three calls every evening: one neuron and its limits, the forward pass, backpropagation on paper and in code, every gradient checked by measurement, then trained and tested on evenings it never saw."
concepts_introduced: [perceptron, neural-networks, activation-functions, backpropagation, numerical-gradient-checking]
concepts_reviewed: [chain-rule, numerical-gradients, gradient-descent, mean-squared-error, logistic-regression, train-test-split, feature-scaling, numpy-arrays, vectors, matrices, broadcasting, dictionaries, mutability, functions, multiple-returns, zip, enumerate, for-loops]
ask:
  dialogue:
    - aaesha.pleased.wave: "Welcome to the Engine Room. Paul has logged the tower's lights, beacon and shutters every evening for years."
    - aaesha.thinking.think: "Can a network learn how he decides? Not why. Just how."
    - neil.pleased: "I trained a small one on his log once. Four readings in, three answers out. I kept the weights, not the code."
    - aaesha.proud: "I've already written a gradient checker."
  spec: |
    Paul's log, `evenings.csv`, has 800 evenings. Each is four readings from 0 to 1, visibility, wind, rain and dark, and three answers: whether the clock-face lights came on, the beacon flashed and the storm shutters closed. Neil's network has a hidden layer of five neurons and an output layer of three, with its weights in a dict under `"W1"`, `"b1"`, `"W2"` and `"b2"`.

    1. In `network.py`: `relu`, `sigmoid`, and `forward(X, params)`, which returns the answers for every row of `X` and a dict of the values on the way. Then `decisions`, which names the answers above 0.5. Run as a program, it puts four evenings through Neil's weights.
    2. In `learn.py`: `backward`, which works out how the mean squared error changes with every weight and bias, with no loops; `check_gradients`, which compares each one with a measured slope; and `train`, which walks downhill.
    3. Run as a program, `learn.py` checks every gradient, trains a network from random weights on 600 evenings, tests it on the other 200, and answers for tonight.
  example: |
    Gradients: W1 ok, b1 ok, W2 ok, b2 ok
    Loss: 0.2952 at the start, 0.0051 at the end
    All three right on 195 of 200 evenings it never saw
    Tonight: lights, beacon, shutters
ship:
  dialogue:
    - aaesha.pleased: "Four gradients, four oks. Then it learnt Paul's log from random numbers."
    - neil.surprised: "A hundred and ninety-five evenings out of two hundred it had never seen. All three calls right."
    - paul.laughing: "It switches things the way I do. It doesn't know why. Fair. Some evenings, neither do I."
    - aaesha.proud.thumbs: "It copies how you decide, not why. A model of a mind, not a mind. And every number checked."
  shelf: { object: chalkboard, label: "Aaesha's network, backwards and checked" }
  cards: [perceptron, neural-networks, activation-functions, backpropagation, numerical-gradient-checking]
stretch:
  - id: watch-it-learn
    title: "Watch it learn"
    prompt: |
      Plot the list of losses from `train` with matplotlib, with a log scale on the loss (`plt.yscale("log")`). Then try `rate=0.5` and `rate=20.0` from the same starting weights. One crawls; what does the other do?
  - id: her-weights-or-yours
    title: "Neil's weights, or yours"
    prompt: |
      Train a 4-5-3 network, the same shape as Neil's, from random weights on all 800 evenings. Put the four evenings from `network.py` through both. Do they give the same answers? Now compare the weights themselves. Why can two networks agree on every evening and share almost no numbers?
  - id: probe-the-fog
    title: "Walk into the fog"
    prompt: |
      Hold wind at 0.3, rain at 0.4 and dark at 0, and slide visibility from 1 down to 0 in steps of 0.05 through Neil's weights. Plot the three answers against visibility with matplotlib. Where does the beacon come on? Is it a sudden switch or a slope, and which part of the network decides?
