id: learning-backwards
title: "Neural Network from Scratch"
project_name: "Neural Network from Scratch"
portfolio_readme: |
  # Neural Network from Scratch

  A two-layer neural network written in NumPy alone: the forward pass, backpropagation, a gradient checker, and gradient descent. It learns three yes-or-no decisions from four readings, checks every gradient it works out against one measured by nudging the weights, then trains from random numbers and is tested on evenings it never saw. It learns which of the Clocktower's lights, beacon and storm shutters to switch on, from a log of what Paul did by hand: a small model of how one person decides.

  Written by {name} for Aaesha, at Paul's Python Course. Finished {date}.

  ## Run it

  ```
  pip install numpy
  python learn.py
  ```

  ```
  Gradients: W1 ok, b1 ok, W2 ok, b2 ok
  Loss: 0.2952 at the start, 0.0051 at the end
  All three right on 195 of 200 evenings it never saw
  Tonight: lights, beacon, shutters
  ```

  `python network.py` runs the forward pass alone, with a set of weights already learnt.

  ## What it shows

  - Why one neuron can only draw one straight line, and how a hidden layer with an activation function gets past that
  - A forward pass on whole batches with matrix multiplication: no loop over the examples
  - Backpropagation worked out by hand with the chain rule, then written for whole arrays
  - Gradient checking: every gradient compared with a numerical one before any training is trusted
  - Training by gradient descent, and an honest test on data held back from training

  ## Data

  `evenings.csv` is invented for the project: 800 evenings of visibility, wind, rain and darkness, each scaled from 0 to 1, with whether the clock-face lights, the beacon and the storm shutters were used.
