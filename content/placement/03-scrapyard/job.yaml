  spec: |
    Three Make tasks from the Puzzle Room. There are no hints: each task has its brief, two visible checks and a good many hidden ones. Some checks hand your functions big piles that count every look, so the right algorithm matters as much as the right answer.

    Pass all three and Act IV is placed: its projects are marked as placed, and its ideas join your review deck.
